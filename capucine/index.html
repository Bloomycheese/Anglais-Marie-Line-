": "L'équipe de Maya n'a jamais perdu de match à domicile cette saison."}, {"q": "I've ___ come back from a discovery flight, and it was incredible!", "a": "just", "opts": ["just", "yet", "ever", "since"], "fr": "Je viens de rentrer d'un vol de découverte, et c'était incroyable !"}, {"q": "How many times ___ you watched that dance video?", "a": "have", "opts": ["have", "did", "are", "has"], "fr": "Combien de fois tu as regardé cette vidéo de danse ?"}]}, {"id": "l3-perfect-or-past", "title": "Present perfect ou prétérit ? (et for, since)", "expl": ["Le prétérit (past simple) parle d'un moment terminé et précis : yesterday, last week, last summer, two days ago. Le present perfect, lui, relie le passé au présent, sans date précise.", "Si tu dis quand, prends le prétérit : I flew last summer. Si tu ne le dis pas, ou si la situation continue aujourd'hui, prends le present perfect : I've flown twice.", "Pour une durée qui continue aujourd'hui : for + une durée (for three years), since + un point de départ (since September). En français, tu dis « depuis » dans les deux cas !"], "examples": [{"en": "Maya has played volleyball since she was eight.", "fr": "Maya joue au volley depuis qu'elle a huit ans."}, {"en": "We went to the airshow last Sunday, and it was amazing.", "fr": "On est allés au meeting aérien dimanche dernier, et c'était génial."}, {"en": "Liv has taught dance for more than five years.", "fr": "Liv enseigne la danse depuis plus de cinq ans."}], "items": [{"q": "We ___ the semi-final last Saturday.", "a": "won", "opts": ["won", "have won", "win", "has won"], "fr": "On a gagné la demi-finale samedi dernier."}, {"q": "They've known each other ___ two years.", "a": "for", "opts": ["for", "since", "during", "ago"], "fr": "Elles se connaissent depuis deux ans."}, {"q": "Sam has been a pilot ___ he was twenty-two.", "a": "since", "opts": ["since", "for", "from", "ago"], "fr": "Sam est pilote depuis qu'il a vingt-deux ans."}, {"q": "___ you ever visited an air traffic control tower?", "a": "Have", "opts": ["Have", "Did", "Do", "Are"], "fr": "Tu as déjà visité une tour de contrôle ?"}, {"q": "Two days ago, we ___ our new choreography for the first time.", "a": "performed", "opts": ["performed", "have performed", "perform", "are performing"], "fr": "Il y a deux jours, on a présenté notre nouvelle chorégraphie pour la première fois."}, {"q": "She ___ in this dance school since September.", "a": "has danced", "opts": ["has danced", "danced", "dances", "is dancing"], "fr": "Elle danse dans cette école de danse depuis septembre."}, {"q": "I ___ that film yesterday, and I loved it!", "a": "saw", "opts": ["saw", "have seen", "see", "seen"], "fr": "J'ai vu ce film hier, et je l'ai adoré !"}, {"q": "We've been on the same team ___ last year.", "a": "since", "opts": ["since", "for", "ago", "during"], "fr": "On est dans la même équipe depuis l'année dernière."}]}, {"id": "l3-first-conditional", "title": "Le first conditional : si..., alors...", "expl": ["Le first conditional sert à parler d'une situation possible dans le futur et de sa conséquence : If it rains, we'll train inside. La structure : if + présent, puis will + verbe.", "Le piège pour les francophones : jamais de will juste après if ! On dit If you practise, you'll improve, et pas If you will practise. Tu peux aussi inverser l'ordre : We'll win if we stay focused.", "Unless veut dire « si ... ne ... pas » ou « à moins que » : We won't fly unless the weather is good."], "examples": [{"en": "If we serve well, we'll win this set.", "fr": "Si on sert bien, on gagnera ce set."}, {"en": "If the wind is too strong, we won't fly today.", "fr": "Si le vent est trop fort, on ne volera pas aujourd'hui."}, {"en": "You'll feel better if you warm up properly.", "fr": "Tu te sentiras mieux si tu t'échauffes bien."}], "items": [{"q": "If it ___ tomorrow, the discovery flight will be cancelled.", "a": "rains", "opts": ["rains", "will rain", "rain", "rained"], "fr": "S'il pleut demain, le vol de découverte sera annulé."}, {"q": "If you practise every day, you ___ the choreography by Friday.", "a": "will know", "opts": ["will know", "know", "knew", "knowing"], "fr": "Si tu t'entraînes tous les jours, tu connaîtras la chorégraphie d'ici vendredi."}, {"q": "We'll lose the match if we ___ talk to each other.", "a": "don't", "opts": ["don't", "won't", "doesn't", "aren't"], "fr": "On perdra le match si on ne se parle pas."}, {"q": "If Maya ___ to France next summer, we'll go to an airshow together.", "a": "comes", "opts": ["comes", "will come", "come", "came"], "fr": "Si Maya vient en France l'été prochain, on ira ensemble à un meeting aérien."}, {"q": "You won't hear the tower ___ you put your headset on.", "a": "unless", "opts": ["unless", "if", "when", "so"], "fr": "Tu n'entendras pas la tour si tu ne mets pas ton casque."}, {"q": "If the audience ___ loudly, we'll come back for a second bow.", "a": "claps", "opts": ["claps", "will clap", "clap", "clapped"], "fr": "Si le public applaudit fort, on reviendra saluer une deuxième fois."}, {"q": "If you don't finish your slides tonight, we ___ have time to practise.", "a": "won't", "opts": ["won't", "don't", "didn't", "wouldn't"], "fr": "Si tu ne finis pas tes diapos ce soir, on n'aura pas le temps de répéter."}, {"q": "What will you do if you ___ into the summer workshop?", "a": "get", "opts": ["get", "will get", "got", "getting"], "fr": "Qu'est-ce que tu feras si tu es acceptée au stage d'été ?"}]}, {"id": "l3-modals", "title": "Obligation et conseil : must, have to, should", "expl": ["Pour une obligation, tu utilises must (souvent une règle, ou ce que toi tu juges nécessaire) ou have to (une obligation qui vient de l'extérieur) : Pilots have to pass exams. I must call Maya tonight.", "Attention, au négatif, le sens change ! Mustn't veut dire « interdit » : You mustn't cross the runway. Don't have to veut dire « pas obligé » : You don't have to wear a costume today.", "Pour donner un conseil, prends should ou shouldn't : You should drink some water. You shouldn't stay up late before a match."], "examples": [{"en": "You have to wear a headset in the cockpit.", "fr": "Tu dois porter un casque dans le cockpit."}, {"en": "You mustn't walk near the propeller.", "fr": "Tu ne dois surtout pas passer près de l'hélice."}, {"en": "You should get some sleep before the competition.", "fr": "Tu devrais bien dormir avant la compétition."}], "items": [{"q": "You ___ cross a runway without permission from the tower.", "a": "mustn't", "opts": ["mustn't", "don't have to", "doesn't have to", "must"], "fr": "Tu ne dois jamais traverser une piste sans l'autorisation de la tour."}, {"q": "Tomorrow is Sunday, so we ___ get up early for school.", "a": "don't have to", "opts": ["don't have to", "mustn't", "have to", "must"], "fr": "Demain, c'est dimanche, donc on n'est pas obligés de se lever tôt pour l'école."}, {"q": "You seem tired. You ___ go to bed earlier tonight.", "a": "should", "opts": ["should", "shouldn't", "mustn't", "don't have to"], "fr": "Tu as l'air fatiguée. Tu devrais te coucher plus tôt ce soir."}, {"q": "All pilots ___ speak English with air traffic control on international flights.", "a": "have to", "opts": ["have to", "has to", "should to", "must to"], "fr": "Tous les pilotes doivent parler anglais avec le contrôle aérien sur les vols internationaux."}, {"q": "You ___ forget your water bottle, it's going to be hot in the gym.", "a": "shouldn't", "opts": ["shouldn't", "should", "don't have to", "haven't to"], "fr": "Tu ne devrais pas oublier ta gourde, il va faire chaud dans le gymnase."}, {"q": "She ___ wear her costume for the dress rehearsal, it's the rule.", "a": "has to", "opts": ["has to", "have to", "should to", "doesn't have to"], "fr": "Elle doit porter son costume pour la générale, c'est la règle."}, {"q": "If your ankle still hurts tomorrow, you ___ see a doctor.", "a": "should", "opts": ["should", "shouldn't", "mustn't", "don't have to"], "fr": "Si ta cheville te fait encore mal demain, tu devrais voir un médecin."}, {"q": "You ___ share your address with people you meet online.", "a": "mustn't", "opts": ["mustn't", "must", "don't have to", "should"], "fr": "Tu ne dois jamais donner ton adresse à des gens que tu rencontres en ligne."}]}, {"id": "l3-phrasal-verbs", "title": "Les phrasal verbs", "expl": ["Un phrasal verb, c'est un verbe suivi d'une petite particule (up, out, off, on...). Ensemble, ils prennent souvent un sens nouveau : give veut dire « donner », mais give up veut dire « abandonner ». Les anglophones en utilisent tout le temps à l'oral !", "Astuce : apprends-les dans une phrase, jamais seuls. Avec un nom, tu peux dire turn up the music ou turn the music up. Mais avec un pronom, il se place au milieu : turn it up."], "examples": [{"en": "Never give up, even when you lose a set.", "fr": "N'abandonne jamais, même quand tu perds un set."}, {"en": "I'm really looking forward to the show!", "fr": "J'ai trop hâte d'être au spectacle !"}, {"en": "Can you turn it up? I love this song!", "fr": "Tu peux monter le son ? J'adore cette chanson !"}], "items": [{"q": "Don't give ___, we can still win this set!", "a": "up", "opts": ["up", "out", "off", "on"], "fr": "N'abandonne pas, on peut encore gagner ce set !"}, {"q": "I've just found ___ that the show is sold out!", "a": "out", "opts": ["out", "up", "in", "off"], "fr": "Je viens d'apprendre que le spectacle affiche complet !"}, {"q": "We need to warm ___ before we start the rehearsal.", "a": "up", "opts": ["up", "on", "out", "down"], "fr": "On doit s'échauffer avant de commencer la répétition."}, {"q": "The flight was put ___ until tomorrow because of the fog.", "a": "off", "opts": ["off", "out", "up", "in"], "fr": "Le vol a été repoussé à demain à cause du brouillard."}, {"q": "Maya came up ___ a great idea for our video call.", "a": "with", "opts": ["with", "to", "for", "at"], "fr": "Maya a eu une super idée pour notre appel vidéo."}, {"q": "We're running ___ of time, so let's finish the slides quickly.", "a": "out", "opts": ["out", "off", "away", "over"], "fr": "On manque de temps, alors finissons vite les diapos."}, {"q": "I'm looking forward ___ the aviation club open day.", "a": "to", "opts": ["to", "for", "at", "on"], "fr": "J'ai hâte d'être à la journée portes ouvertes de l'aéroclub."}, {"q": "This song is amazing, can you turn ___ up?", "a": "it", "opts": ["it", "its", "them", "her"], "fr": "Cette chanson est géniale, tu peux monter le son ?"}]}, {"id": "l3-opinions-linking", "title": "Donner ton avis et le justifier", "expl": ["Pour donner ton avis, commence par I think, In my opinion ou Personally. Ensuite, justifie toujours avec because (parce que) : I think this song is great because the beat is so catchy.", "Pour nuancer, utilise but ou although (même si, bien que) : Although we lost, we played well. Pour une conséquence, prends so (donc) : I was tired, so I went to bed early.", "Pour opposer deux phrases, tu peux commencer la deuxième par However, (cependant) : The show was long. However, it was never boring."], "examples": [{"en": "In my opinion, dance is a sport because it's really physical.", "fr": "À mon avis, la danse est un sport, parce que c'est très physique."}, {"en": "Although the concert was far away, it was worth it.", "fr": "Même si le concert était loin, ça valait le coup."}, {"en": "It was foggy, so the flight was delayed.", "fr": "Il y avait du brouillard, donc le vol a été retardé."}], "items": [{"q": "I love flying ___ you can see everything from above.", "a": "because", "opts": ["because", "although", "so", "however"], "fr": "J'adore voler parce qu'on voit tout d'en haut."}, {"q": "We lost the match, ___ we're still proud of our team.", "a": "but", "opts": ["but", "because", "so", "unless"], "fr": "On a perdu le match, mais on est quand même fières de notre équipe."}, {"q": "___ she was nervous, she danced beautifully.", "a": "Although", "opts": ["Although", "Because", "So", "However"], "fr": "Même si elle était stressée, elle a magnifiquement dansé."}, {"q": "The tickets sold out in minutes, ___ we watched the concert online.", "a": "so", "opts": ["so", "because", "although", "unless"], "fr": "Les billets sont partis en quelques minutes, donc on a regardé le concert en ligne."}, {"q": "___, I think this song is a bit too slow for our routine.", "a": "Personally", "opts": ["Personally", "Because", "Although", "So"], "fr": "Personnellement, je trouve cette chanson un peu trop lente pour notre chorégraphie."}, {"q": "The simulator is great. ___, nothing beats a real flight.", "a": "However", "opts": ["However", "Because", "So", "Although"], "fr": "Le simulateur, c'est génial. Cependant, rien ne vaut un vrai vol."}, {"q": "In my ___, the second half of the show was the best part.", "a": "opinion", "opts": ["opinion", "idea", "think", "advice"], "fr": "À mon avis, la deuxième partie du spectacle était la meilleure."}, {"q": "I studied hard for the test, ___ I got a really good mark.", "a": "so", "opts": ["so", "because", "although", "however"], "fr": "J'ai beaucoup révisé pour le contrôle, donc j'ai eu une très bonne note."}]}]}, "4": {"themes": [{"id": "l4-debate", "title": "Débattre avec respect", "sub": "Nuancer, contredire poliment, convaincre", "icon": "bubble", "p": [{"en": "I see your point, but I'm not entirely convinced that social media is all bad.", "fr": "Je comprends ton point de vue, mais je ne suis pas totalement convaincue que les réseaux sociaux soient entièrement mauvais.", "alts": ["I get your point, but I'm not fully convinced that social media is all bad."]}, {"en": "To be fair, apps can help us stay in touch with friends who live abroad.", "fr": "Il faut reconnaître que les applis peuvent nous aider à garder le contact avec des amis qui vivent à l'étranger.", "alts": ["In fairness, apps can help us keep in touch with friends who live abroad."]}, {"en": "Would you agree that scrolling late at night makes it harder to fall asleep?", "fr": "Tu serais d'accord pour dire que scroller tard le soir rend l'endormissement plus difficile ?", "alts": ["Don't you think scrolling late at night makes it harder to fall asleep?"]}, {"en": "That's a fair point, although I'd argue that it depends on how you use it.", "fr": "C'est un argument valable, même si je dirais que tout dépend de la façon dont on l'utilise.", "alts": ["Fair point, though I'd say it depends on how you use it."]}, {"en": "If schools gave us more time for sport, I think our grades would actually improve.", "fr": "Si les écoles nous laissaient plus de temps pour le sport, je pense que nos notes s'amélioreraient vraiment.", "alts": []}, {"en": "Sorry to interrupt, but could I just add something here?", "fr": "Pardon de vous interrompre, mais est-ce que je pourrais ajouter quelque chose ?", "alts": ["Sorry to cut in, but may I add something?"]}, {"en": "Flying does have an environmental impact, so we should think carefully about how often we travel by plane.", "fr": "L'avion a bel et bien un impact sur l'environnement, donc on devrait bien réfléchir à la fréquence de nos voyages en avion.", "alts": []}, {"en": "On the other hand, the aviation industry is investing in cleaner fuels and more efficient engines.", "fr": "D'un autre côté, le secteur aérien investit dans des carburants plus propres et des moteurs plus efficaces.", "alts": []}, {"en": "I'm afraid I have to disagree, and here's why.", "fr": "Je suis désolée, mais je ne suis pas d'accord, et voici pourquoi.", "alts": ["I respectfully disagree, and here's why."]}, {"en": "Let's agree to disagree on this one, shall we?", "fr": "Acceptons de ne pas être d'accord sur ce point, tu veux bien ?", "alts": []}, {"en": "What evidence do you have to back that up?", "fr": "Sur quelles preuves tu t'appuies pour dire ça ?", "alts": ["What evidence supports that?"]}, {"en": "All things considered, I believe a healthy balance between school, sport and screens is the best solution.", "fr": "Tout bien considéré, je pense qu'un bon équilibre entre les cours, le sport et les écrans est la meilleure solution.", "alts": []}]}, {"id": "l4-presentation", "title": "Faire un exposé", "sub": "Structurer, captiver, répondre aux questions", "icon": "school", "p": [{"en": "Good morning, everyone. Today I'm going to talk about how airplanes actually stay in the air.", "fr": "Bonjour à tous. Aujourd'hui, je vais vous parler de la façon dont les avions tiennent vraiment en l'air.", "alts": ["Good morning, everyone. Today I'd like to explain how planes actually stay in the air."]}, {"en": "My presentation is divided into three parts: the history, the science and the future.", "fr": "Mon exposé est divisé en trois parties : l'histoire, la science et l'avenir.", "alts": []}, {"en": "Let me start with a question: have you ever wondered why wings are curved?", "fr": "Je vais commencer par une question : vous êtes-vous déjà demandé pourquoi les ailes sont incurvées ?", "alts": []}, {"en": "As you can see on this slide, the air moves faster over the top of the wing.", "fr": "Comme vous pouvez le voir sur cette diapo, l'air circule plus vite au-dessus de l'aile.", "alts": []}, {"en": "This brings me to my second point, which is probably the most surprising.", "fr": "Cela m'amène à mon deuxième point, qui est sans doute le plus surprenant.", "alts": ["This leads me to my second point, which is probably the most surprising."]}, {"en": "To put it simply, the shape of the wing creates lower pressure above it.", "fr": "Pour faire simple, la forme de l'aile crée une pression plus faible au-dessus d'elle.", "alts": ["Simply put, the shape of the wing creates lower pressure above it."]}, {"en": "I'd like to draw your attention to this graph, which was made by our group.", "fr": "J'aimerais attirer votre attention sur ce graphique, qui a été réalisé par notre groupe.", "alts": []}, {"en": "Sorry, I've lost my train of thought. Let me just check my notes.", "fr": "Pardon, j'ai perdu le fil. Je vérifie juste mes notes.", "alts": []}, {"en": "To sum up, lift, weight, thrust and drag all work together during a flight.", "fr": "Pour résumer, la portance, le poids, la poussée et la traînée agissent ensemble pendant un vol.", "alts": ["In short, lift, weight, thrust and drag all act together during a flight."]}, {"en": "Thank you for listening. I'd be happy to answer any questions.", "fr": "Merci de votre attention. Je serai ravie de répondre à vos questions.", "alts": ["Thanks for listening. I'm happy to take any questions."]}, {"en": "That's a great question. I'm not completely sure, but I'll look into it and get back to you.", "fr": "C'est une excellente question. Je n'en suis pas complètement sûre, mais je vais me renseigner et je vous redirai.", "alts": []}, {"en": "If I'd had more time, I would have shown you a short video of a takeoff.", "fr": "Si j'avais eu plus de temps, je vous aurais montré une courte vidéo d'un décollage.", "alts": ["If I had had more time, I would have shown you a short video of a takeoff."]}]}, {"id": "l4-interview", "title": "L'entretien de sélection", "sub": "Camp d'aviation d'été ou programme d'échange", "icon": "star", "p": [{"en": "Thank you for inviting me to this interview. I'm really excited about the summer aviation camp.", "fr": "Merci de m'avoir invitée à cet entretien. Le camp d'aviation d'été m'enthousiasme vraiment.", "alts": []}, {"en": "I've been passionate about flying for as long as I can remember.", "fr": "Je suis passionnée par l'aviation depuis aussi longtemps que je m'en souvienne.", "alts": ["I've loved flying for as long as I can remember."]}, {"en": "One of my strengths is that I stay calm under pressure, which I learned from playing volleyball.", "fr": "L'une de mes qualités, c'est que je reste calme sous la pression, ce que j'ai appris grâce au volley.", "alts": []}, {"en": "If I'm honest, my weakness is that I sometimes take on too much at once.", "fr": "Pour être honnête, mon point faible, c'est que je me charge parfois de trop de choses à la fois.", "alts": ["To be honest, my weakness is that I sometimes take on too many things at once."]}, {"en": "I'm working on it by planning my week more carefully.", "fr": "J'y travaille en organisant ma semaine plus soigneusement.", "alts": []}, {"en": "I'd love to take part in the exchange program because I want to improve my English and discover a new culture.", "fr": "J'adorerais participer au programme d'échange parce que je veux améliorer mon anglais et découvrir une nouvelle culture.", "alts": ["I'd love to join the exchange program because I want to improve my English and discover a new culture."]}, {"en": "I was told that the camp includes simulator sessions and a visit to a control tower.", "fr": "On m'a dit que le camp comprend des séances de simulateur et la visite d'une tour de contrôle.", "alts": []}, {"en": "Could you tell me a bit more about what a typical day at the camp looks like?", "fr": "Pourriez-vous m'en dire un peu plus sur le déroulement d'une journée type au camp ?", "alts": ["Could you tell me more about a typical day at the camp?"]}, {"en": "In my dance group, I'm often the one who helps the younger students learn the choreography.", "fr": "Dans mon groupe de danse, c'est souvent moi qui aide les plus jeunes à apprendre la chorégraphie.", "alts": []}, {"en": "I believe I would be a good fit because I'm curious, reliable and a real team player.", "fr": "Je pense que j'aurais tout à fait ma place parce que je suis curieuse, fiable et que j'ai vraiment l'esprit d'équipe.", "alts": []}, {"en": "Is there anything else you'd like to know about me?", "fr": "Y a-t-il autre chose que vous aimeriez savoir sur moi ?", "alts": []}, {"en": "My parents are going to help me fill in the application form, and we'll send it by Friday.", "fr": "Mes parents vont m'aider à remplir le dossier de candidature, et on l'enverra d'ici vendredi.", "alts": ["My parents will help me fill out the application form, and we'll send it by Friday."]}]}, {"id": "l4-match-analysis", "title": "Analyser un match", "sub": "Commenter, expliquer, tirer des leçons", "icon": "ball", "p": [{"en": "We were two sets down, but nobody gave up and we turned the match around.", "fr": "On était menées deux sets à zéro, mais personne n'a abandonné et on a renversé le match.", "alts": []}, {"en": "Their block read our attacks perfectly in the first set.", "fr": "Leur contre lisait parfaitement nos attaques dans le premier set.", "alts": []}, {"en": "If our serve had been more consistent, we would have won in straight sets.", "fr": "Si notre service avait été plus régulier, on aurait gagné sans perdre un seul set.", "alts": ["If we had served more consistently, we would have won in straight sets."]}, {"en": "The turning point came when our setter switched to faster sets on the outside.", "fr": "Le tournant du match, c'est quand notre passeuse a joué des ballons plus rapides à l'aile.", "alts": []}, {"en": "Our coach called a timeout to calm us down after we gave away five points in a row.", "fr": "Notre coach a pris un temps mort pour nous calmer après qu'on a donné cinq points d'affilée.", "alts": []}, {"en": "Honestly, our libero's digs kept us in the game.", "fr": "Franchement, les défenses de notre libéro nous ont maintenues dans le match.", "alts": []}, {"en": "It was a nail-biting fifth set that ended seventeen to fifteen.", "fr": "Le cinquième set a été haletant et s'est terminé à dix-sept à quinze.", "alts": []}, {"en": "We need to work on our communication, because two players went for the same ball several times.", "fr": "On doit travailler notre communication, parce que deux joueuses sont allées chercher le même ballon plusieurs fois.", "alts": []}, {"en": "Even though we lost, I'm proud of the way we fought until the very last point.", "fr": "Même si on a perdu, je suis fière de la façon dont on s'est battues jusqu'au tout dernier point.", "alts": ["We lost, but I'm proud of how we fought until the very last point."]}, {"en": "The referee's decision was debatable, but arguing wouldn't have changed anything.", "fr": "La décision de l'arbitre était discutable, mais contester n'aurait rien changé.", "alts": []}, {"en": "Next time, we should vary our serves and aim for the gaps in their reception.", "fr": "La prochaine fois, on devrait varier nos services et viser les trous dans leur réception.", "alts": []}, {"en": "I was nervous before the match, but once the first rally started, I felt completely focused.", "fr": "J'étais nerveuse avant le match, mais dès le premier échange, je me suis sentie complètement concentrée.", "alts": []}]}, {"id": "l4-performance", "title": "Décrire un spectacle", "sub": "Danse, émotions et mise en scène", "icon": "heart", "p": [{"en": "The opening piece was breathtaking: the dancers moved as if they were floating.", "fr": "Le premier tableau était à couper le souffle : les danseurs bougeaient comme s'ils flottaient.", "alts": []}, {"en": "What struck me most was how the lighting changed with the mood of the music.", "fr": "Ce qui m'a le plus frappée, c'est la façon dont les lumières changeaient selon l'ambiance de la musique.", "alts": []}, {"en": "The choreography was inspired by the movement of birds, which I found really original.", "fr": "La chorégraphie s'inspirait du mouvement des oiseaux, ce que j'ai trouvé vraiment original.", "alts": []}, {"en": "There was a moment of complete silence that gave me goosebumps.", "fr": "Il y a eu un moment de silence total qui m'a donné la chair de poule.", "alts": []}, {"en": "The duet in the second act was so well synchronized that it looked effortless.", "fr": "Le duo du deuxième acte était tellement bien synchronisé qu'il semblait se faire sans effort.", "alts": ["The duet in the second act was so perfectly in sync that it looked effortless."]}, {"en": "Our show was performed in front of more than three hundred people, and I barely felt nervous.", "fr": "Notre spectacle a été joué devant plus de trois cents personnes, et j'ai à peine eu le trac.", "alts": []}, {"en": "I nearly missed my cue, but I managed to stay calm and catch up with the others.", "fr": "J'ai failli rater mon entrée, mais j'ai réussi à rester calme et à rattraper les autres.", "alts": []}, {"en": "The costumes were simple, which kept the focus on the dancing itself.", "fr": "Les costumes étaient simples, ce qui laissait toute la place à la danse elle-même.", "alts": []}, {"en": "If I could change one thing, I would make the ending a little less abrupt.", "fr": "Si je pouvais changer une chose, je rendrais la fin un peu moins brusque.", "alts": []}, {"en": "The audience gave us a standing ovation, and I honestly couldn't stop smiling.", "fr": "Le public nous a fait une ovation debout, et franchement, je n'arrêtais pas de sourire.", "alts": []}, {"en": "Contemporary dance isn't always easy to understand, but it makes you feel things.", "fr": "La danse contemporaine n'est pas toujours facile à comprendre, mais elle te fait ressentir des choses.", "alts": []}, {"en": "Our teacher told us that she had never seen us dance with so much energy.", "fr": "Notre prof nous a dit qu'elle ne nous avait jamais vues danser avec autant d'énergie.", "alts": []}]}, {"id": "l4-cockpit", "title": "Anglais aéronautique", "sub": "Météo, check-lists et imprévus gérés avec calme", "icon": "plane", "p": [{"en": "Before every flight, the pilots check the weather at the departure and destination airports.", "fr": "Avant chaque vol, les pilotes vérifient la météo aux aéroports de départ et de destination.", "alts": []}, {"en": "There's a strong crosswind on the runway today, so the landing will need extra care.", "fr": "Il y a un fort vent de travers sur la piste aujourd'hui, donc l'atterrissage demandera une attention particulière.", "alts": []}, {"en": "Thunderstorms were forecast along our route, so we planned a detour around them.", "fr": "Des orages étaient prévus sur notre trajet, donc on a prévu un détour pour les contourner.", "alts": []}, {"en": "Let's run through the before takeoff checklist one item at a time.", "fr": "Passons la check-list avant décollage, un point à la fois.", "alts": ["Let's go through the before takeoff checklist item by item."]}, {"en": "Flaps set, fuel checked, controls free and correct: we're ready for departure.", "fr": "Volets réglés, carburant vérifié, commandes libres et dans le bon sens : on est prêts pour le départ.", "alts": []}, {"en": "If the runway were blocked, we would hold and wait for instructions from the tower.", "fr": "Si la piste était bloquée, on resterait en attente des instructions de la tour.", "alts": []}, {"en": "Pilots are trained to aviate first, then navigate, and only then communicate.", "fr": "Les pilotes apprennent à piloter d'abord, puis à naviguer, et ensuite seulement à communiquer.", "alts": []}, {"en": "The approach wasn't stable, so the captain calmly decided to go around.", "fr": "L'approche n'était pas stabilisée, alors le commandant de bord a calmement décidé de remettre les gaz.", "alts": ["The approach was unstable, so the captain calmly decided to go around."]}, {"en": "In a real emergency, the crew would declare Mayday and follow their procedures step by step.", "fr": "En cas de véritable urgence, l'équipage déclarerait Mayday et suivrait ses procédures étape par étape.", "alts": []}, {"en": "Tower, please say again the wind. Your transmission was broken.", "fr": "Tour, pouvez-vous répéter le vent, s'il vous plaît ? Votre message était haché.", "alts": []}, {"en": "Because of icing conditions above five thousand feet, we were asked to stay lower.", "fr": "À cause des conditions givrantes au-dessus de cinq mille pieds, on nous a demandé de rester plus bas.", "alts": []}, {"en": "Every instruction must be read back to the controller to make sure it was understood correctly.", "fr": "Chaque instruction doit être collationnée auprès du contrôleur pour s'assurer qu'elle a été bien comprise.", "alts": []}]}, {"id": "l4-music-critic", "title": "Critique musicale", "sub": "Analyser un morceau, un album, un concert", "icon": "music", "p": [{"en": "The production on this album is much more experimental than on the previous one.", "fr": "La production de cet album est beaucoup plus expérimentale que celle du précédent.", "alts": []}, {"en": "The track starts quietly with just a piano, then builds up to a huge chorus.", "fr": "Le morceau commence doucement avec juste un piano, puis monte en puissance jusqu'à un refrain énorme.", "alts": []}, {"en": "The singer's voice sounds raw and vulnerable, which makes the song feel really personal.", "fr": "La voix de la chanteuse paraît brute et fragile, ce qui rend la chanson vraiment personnelle.", "alts": []}, {"en": "I love how the bass line drives the whole song forward.", "fr": "J'adore la façon dont la ligne de basse fait avancer toute la chanson.", "alts": []}, {"en": "In my opinion, the second half of the album is weaker because the songs sound too similar.", "fr": "À mon avis, la deuxième moitié de l'album est plus faible parce que les chansons se ressemblent trop.", "alts": []}, {"en": "It's catchy, but I'm not sure it will still be on my playlist in a year.", "fr": "C'est accrocheur, mais je ne suis pas sûre que ce sera encore dans ma playlist dans un an.", "alts": []}, {"en": "In my view, Dua Lipa's dance tracks are perfect for warming up before a choreography class.", "fr": "Pour moi, les morceaux dansants de Dua Lipa sont parfaits pour s'échauffer avant un cours de chorégraphie.", "alts": []}, {"en": "The concert was even better than I'd expected, especially the acoustic part in the middle.", "fr": "Le concert était encore mieux que ce que j'avais imaginé, surtout la partie acoustique au milieu.", "alts": []}, {"en": "Some critics say the lyrics are the strongest part, but for me it's the melody.", "fr": "Certains critiques disent que les paroles sont le point fort, mais pour moi, c'est la mélodie.", "alts": []}, {"en": "If this song had come out in summer, it would have been a massive hit.", "fr": "Si cette chanson était sortie en été, elle aurait été un énorme tube.", "alts": ["If this song had been released in summer, it would have been a huge hit."]}, {"en": "The tempo changes keep you on your toes, which is great for contemporary dance.", "fr": "Les changements de tempo te tiennent en éveil, ce qui est génial pour la danse contemporaine.", "alts": []}, {"en": "I'd give it four stars out of five: bold, emotional, but a little too long.", "fr": "Je lui donnerais quatre étoiles sur cinq : audacieux, émouvant, mais un peu trop long.", "alts": []}]}, {"id": "l4-what-if", "title": "Et si... ?", "sub": "Imaginer, regretter, se projeter", "icon": "sun", "p": [{"en": "If I could live anywhere for a year, I'd choose somewhere with mountains and a good volleyball club.", "fr": "Si je pouvais vivre n'importe où pendant un an, je choisirais un endroit avec des montagnes et un bon club de volley.", "alts": []}, {"en": "If I hadn't joined the aviation club, I would never have discovered how much I love flying.", "fr": "Si je ne m'étais pas inscrite au club d'aviation, je n'aurais jamais découvert à quel point j'adore voler.", "alts": []}, {"en": "I wish I had more free time during the week, but school keeps me really busy.", "fr": "J'aimerais avoir plus de temps libre pendant la semaine, mais les cours m'occupent beaucoup.", "alts": []}, {"en": "If my exchange partner came to stay with us, I'd show her all my favourite places.", "fr": "Si ma correspondante venait chez nous, je lui montrerais tous mes endroits préférés.", "alts": ["If my exchange partner came to stay with us, I would show her all my favorite places."]}, {"en": "Looking back, I should have told my friend how I felt instead of staying silent.", "fr": "Avec le recul, j'aurais dû dire à mon amie ce que je ressentais au lieu de me taire.", "alts": []}, {"en": "If only I had brought my charger, my phone wouldn't have died halfway through the t arrière, on est arrivés avec vingt minutes d'avance."}, {"vis": "⛈️", "en": "a thunderstorm", "fr": "un orage", "ex": "Pilots always fly around thunderstorms, never through them.", "exfr": "Les pilotes contournent toujours les orages, ils ne les traversent jamais."}, {"vis": "🌫️", "en": "low visibility", "fr": "une faible visibilité", "ex": "The flight was delayed because of low visibility caused by fog.", "exfr": "Le vol a été retardé à cause d'une faible visibilité due au brouillard."}, {"vis": "🧊", "en": "icing", "fr": "le givrage", "ex": "Icing on the wings can be dangerous, so planes are de-iced before takeoff in winter.", "exfr": "Le givre sur les ailes peut être dangereux, donc les avions sont dégivrés avant le décollage en hiver."}, {"vis": "🎢", "en": "turbulence", "fr": "les turbulences", "ex": "Please keep your seatbelt fastened in case we hit some turbulence.", "exfr": "Merci de garder votre ceinture attachée au cas où on traverserait des turbulences."}, {"vis": "☁️", "en": "the cloud base", "fr": "la base des nuages", "ex": "The cloud base was too low for our discovery flight, so we used the simulator instead.", "exfr": "La base des nuages était trop basse pour notre vol découverte, alors on a utilisé le simulateur à la place."}, {"vis": "🌪️", "en": "a gust", "fr": "une rafale", "ex": "Gusts of up to thirty knots were reported at the airport.", "exfr": "Des rafales allant jusqu'à trente nœuds ont été signalées à l'aéroport."}, {"vis": "🌤️", "en": "the forecast", "fr": "les prévisions météo", "ex": "The forecast looks good for Saturday, so the flight is still on.", "exfr": "Les prévisions sont bonnes pour samedi, donc le vol est maintenu."}, {"vis": "☀️", "en": "to clear up", "fr": "se dégager", "ex": "The fog should clear up by midday.", "exfr": "Le brouillard devrait se dégager d'ici midi."}, {"vis": "🚫", "en": "to be grounded", "fr": "être cloué au sol", "ex": "All the small planes were grounded because of the storm.", "exfr": "Tous les petits avions ont été cloués au sol à cause de la tempête."}]}, {"id": "l4-cockpit-procedures", "title": "Procédures et imprévus en vol", "w": [{"vis": "📋", "en": "a checklist", "fr": "une check-list", "ex": "Even experienced captains follow the checklist every single time.", "exfr": "Même les commandants expérimentés suivent la check-list à chaque fois."}, {"vis": "🗣️", "en": "to read back", "fr": "collationner (répéter une instruction)", "ex": "Always read back your clearance so the controller can check it.", "exfr": "Collationne toujours ton autorisation pour que le contrôleur puisse la vérifier."}, {"vis": "🛫", "en": "a go-around", "fr": "une remise des gaz", "ex": "A go-around is a normal manoeuvre, not a sign that something went wrong.", "exfr": "Une remise des gaz est une manœuvre normale, pas le signe que quelque chose s'est mal passé."}, {"vis": "🆘", "en": "Mayday", "fr": "Mayday (message de détresse)", "ex": "Mayday is used for distress, when there is serious and immediate danger.", "exfr": "Mayday s'utilise en cas de détresse, quand il y a un danger grave et immédiat."}, {"vis": "⚠️", "en": "Pan-pan", "fr": "Pan-pan (message d'urgence)", "ex": "Pan-pan signals an urgent situation that isn't immediately dangerous.", "exfr": "Pan-pan signale une situation urgente qui n'est pas immédiatement dangereuse."}, {"vis": "🔀", "en": "to divert", "fr": "se dérouter", "ex": "The flight had to divert to another airport because a passenger felt unwell.", "exfr": "Le vol a dû se dérouter vers un autre aéroport parce qu'un passager ne se sentait pas bien."}, {"vis": "⛽", "en": "a fuel reserve", "fr": "une réserve de carburant", "ex": "Pilots always carry a fuel reserve in case they need to hold or divert.", "exfr": "Les pilotes emportent toujours une réserve de carburant au cas où ils devraient attendre ou se dérouter."}, {"vis": "✋", "en": "to hold short", "fr": "s'arrêter avant (la piste)", "ex": "Hold short of the runway until the tower gives you permission to enter.", "exfr": "Arrête-toi avant la piste jusqu'à ce que la tour t'autorise à y entrer."}, {"vis": "✅", "en": "cleared for takeoff", "fr": "autorisé au décollage", "ex": "You can only start your takeoff roll once you've been cleared for takeoff.", "exfr": "Tu ne peux commencer ta course au décollage qu'une fois autorisée au décollage."}, {"vis": "👩‍✈️", "en": "the first officer", "fr": "le copilote, l'officier pilote de ligne", "ex": "The first officer flew the plane while the captain handled the radio.", "exfr": "Le copilote pilotait l'avion pendant que le commandant gérait la radio."}, {"vis": "🧘", "en": "to keep a cool head", "fr": "garder la tête froide", "ex": "Good pilots keep a cool head when something unexpected happens.", "exfr": "Les bons pilotes gardent la tête froide quand un imprévu survient."}, {"vis": "🔧", "en": "a malfunction", "fr": "une panne, un dysfonctionnement", "ex": "The crew spotted a minor malfunction and dealt with it calmly.", "exfr": "L'équipage a repéré un petit dysfonctionnement et l'a géré calmement."}]}, {"id": "l4-sport-talk", "title": "Sport : analyse et expressions", "w": [{"vis": "🔄", "en": "to turn the match around", "fr": "renverser le match", "ex": "We turned the match around after an inspiring talk from our captain.", "exfr": "On a renversé le match après un discours motivant de notre capitaine."}, {"vis": "↪️", "en": "a turning point", "fr": "un tournant", "ex": "Her ace in the third set was the turning point of the match.", "exfr": "Son ace dans le troisième set a été le tournant du match."}, {"vis": "💥", "en": "an ace", "fr": "un ace (service gagnant direct)", "ex": "She served three aces in a row, and the crowd went wild.", "exfr": "Elle a enchaîné trois aces d'affilée, et le public est devenu fou."}, {"vis": "🧱", "en": "a block", "fr": "un contre", "ex": "Her block was so solid that their attacker changed tactics.", "exfr": "Son contre était si solide que leur attaquante a changé de tactique."}, {"vis": "🤲", "en": "a dig", "fr": "une défen ofessionals.", "exfr": "Presque tous les artistes ont le trac, même les professionnels."}, {"vis": "🔔", "en": "a cue", "fr": "un signal, une entrée", "ex": "Listen for the change in the music: that's your cue to come on stage.", "exfr": "Guette le changement dans la musique : c'est ton signal pour entrer en scène."}, {"vis": "🩰", "en": "to rehearse", "fr": "répéter", "ex": "We rehearsed the final section until it felt completely natural.", "exfr": "On a répété la dernière partie jusqu'à ce qu'elle paraisse complètement naturelle."}, {"vis": "👏", "en": "a standing ovation", "fr": "une ovation debout", "ex": "The show ended with a standing ovation that seemed to last forever.", "exfr": "Le spectacle s'est terminé par une ovation debout qui semblait ne jamais finir."}, {"vis": "💡", "en": "the spotlight", "fr": "le projecteur, les feux de la rampe", "ex": "She stepped into the spotlight and started her solo.", "exfr": "Elle s'est avancée dans la lumière du projecteur et a commencé son solo."}, {"vis": "🌊", "en": "fluid", "fr": "fluide", "ex": "Her movements were so fluid that she seemed to flow like water.", "exfr": "Ses mouvements étaient si fluides qu'elle semblait couler comme de l'eau."}, {"vis": "👯", "en": "in sync", "fr": "synchronisé, parfaitement ensemble", "ex": "The whole group was perfectly in sync during the final chorus.", "exfr": "Tout le groupe était parfaitement synchronisé pendant le dernier refrain."}, {"vis": "🤸", "en": "to pull off", "fr": "réussir (quelque chose de difficile)", "ex": "Nobody thought we could pull off such a difficult lift, but we did.", "exfr": "Personne ne pensait qu'on réussirait un porté aussi difficile, et pourtant si."}, {"vis": "🎟️", "en": "a sell-out", "fr": "un spectacle à guichets fermés", "ex": "Our end-of-year show was a sell-out for the first time.", "exfr": "Notre spectacle de fin d'année a affiché complet pour la première fois."}, {"vis": "🍀", "en": "break a leg!", "fr": "bonne chance ! (formule traditionnelle du spect , mon amie a dit qu'elle m'appellerait le lendemain, alors mardi, je n'arrêtais pas de regarder mon téléphone."}]}, {"id": "l4-passive", "title": "La voix passive", "expl": ["La voix passive met l'accent sur l'action ou sur ce qui la subit, pas sur la personne qui agit. Elle se forme avec be (conjugué au bon temps) + participe passé : The match was won. The tickets have been sold.", "Pour préciser qui fait l'action, ajoute by : The show was choreographed by our teacher. On l'utilise beaucoup en sciences, dans les actualités et en aviation : Passengers are requested to remain seated.", "Astuce : pour traduire « on » en anglais, la passive est souvent la meilleure solution. « On m'a dit » se dit I was told."], "examples": [{"en": "The flight was delayed because of fog.", "fr": "Le vol a été retardé à cause du brouillard."}, {"en": "The new choreography is being rehearsed every Wednesday.", "fr": "La nouvelle chorégraphie est répétée tous les mercredis."}, {"en": "I was told that the camp is open to beginners.", "fr": "On m'a dit que le camp est ouvert aux débutants."}], "items": [{"q": "The final ___ by our team in five sets.", "a": "was won", "opts": ["was won", "won", "has winning", "was win"], "fr": "La finale a été gagnée par notre équipe en cinq sets."}, {"q": "All passengers ___ to fasten their seatbelts.", "a": "are requested", "opts": ["are requested", "request", "are requesting", "requesting"], "fr": "Tous les passagers sont priés d'attacher leur ceinture."}, {"q": "The concert tickets ___ in less than an hour.", "a": "were sold", "opts": ["were sold", "was sold", "are selling", "were sell"], "fr": "Les billets du concert ont été vendus en moins d'une heure."}, {"q": "The runway ___ at the moment, so we have to wait.", "a": "is being cleaned", "opts": ["is being cleaned", "is cleaning", "has cleaned", "cleans"], "fr": "La piste est en cours de nettoyage, donc on doit attendre."}, {"q": "This song ___ millions of times since it came out.", "a": "has been streamed", "opts": ["has been streamed", "has streamed", "was streaming", "is stream"], "fr": "Cette chanson a été écoutée des millions de fois depuis sa sortie."}, {"q": "I ___ that the exchange program starts in July.", "a": "was told", "opts": ["was told", "told", "was telling", "am tell"], "fr": "On m'a dit que le programme d'échange commence en juillet."}, {"q": "The planes ___ every morning before the first flight.", "a": "are checked", "opts": ["are checked", "check", "are checking", "checking"], "fr": "Les avions sont vérifiés chaque matin avant le premier vol."}, {"q": "Our end-of-year show will ___ in the school theatre.", "a": "be performed", "opts": ["be performed", "perform", "performed", "being performed"], "fr": "Notre spectacle de fin d'année sera présenté dans le théâtre du lycée."}]}, {"id": "l4-wish", "title": "I wish et If only : souhaits et regrets", "expl": ["Pour regretter une situation présente, utilise I wish ou If only + prétérit : I wish I had more time (j'aimerais avoir plus de temps). Avec be, on préfère were : I wish I were on holiday.", "Pour regretter quelque chose du passé, utilise I wish + past perfect : I wish I had trained harder (je regrette de ne pas m'être entraînée davantage). If only, c'est la version plus forte, plus dramatique.", "Pour exprimer ton agacement face à ce que fait quelqu'un d'autre, utilise I wish + would : I wish people would stop talking during the show."], "examples": [{"en": "I wish I could speak English as fluently as an airline pilot.", "fr": "J'aimerais parler anglais aussi couramment qu'une pilote de ligne."}, {"en": "If only we had practised our serves more before the tournament!", "fr": "Si seulement on avait davantage travaillé nos services avant le tournoi !"}, {"en": "I wish people would stop filming the whole concert on their phones.", "fr": "J'aimerais que les gens arrêtent de filmer tout le concert avec leur téléphone."}], "items": [{"q": "I wish I ___ more free time during the week.", "a": "had", "opts": ["had", "have", "would have", "will have"], "fr": "J'aimerais avoir plus de temps libre pendant la semaine."}, {"q": "If only I ___ my water bottle! I'm so thirsty after that rally.", "a": "had brought", "opts": ["had brought", "brought", "would bring", "bring"], "fr": "Si seulement j'avais pris ma gourde ! J'ai tellement soif après cet échange."}, {"q": "I wish I ___ fly a real plane right now.", "a": "could", "opts": ["could", "can", "will", "would can"], "fr": "J'aimerais pouvoir piloter un vrai avion tout de suite."}, {"q": "She wishes she ___ to the audition last year.", "a": "had gone", "opts": ["had gone", "went", "would go", "goes"], "fr": "Elle regrette de ne pas être allée à l'audition l'année dernière."}, {"q": "I wish it ___ raining so we could play outside.", "a": "would stop", "opts": ["would stop", "stops", "will stop", "has stopped"], "fr": "J'aimerais qu'il arrête de pleuvoir pour qu'on puisse jouer dehors."}, {"q": "If only I ___ so nervous before every match!", "a": "weren't", "opts": ["weren't", "am not", "won't be", "haven't been"], "fr": "Si seulement je n'étais pas aussi stressée avant chaque match !"}, {"q": "I wish I ___ goodbye to my friend before I left. I feel bad now.", "a": "had said", "opts": ["had said", "say", "would say", "have said"], "fr": "J'aurais aimé dire au revoir à mon amie avant de partir. Je m'en veux maintenant."}, {"q": "I wish you ___ me when I'm in the middle of my presentation!", "a": "wouldn't interrupt", "opts": ["wouldn't interrupt", "don't interrupt", "won't interrupt", "hadn't interrupt"], "fr": "J'aimerais que tu ne m'interrompes pas quand je suis en plein exposé !"}]}, {"id": "l4-contrast", "title": "Exprimer le contraste : although, despite, however, whereas", "expl": ["Although et even though sont suivis d'une proposition complète (sujet + verbe) : Although it was raining, we flew. Even though insiste un peu plus.", "Despite et in spite of sont suivis d'un nom ou d'un verbe en -ing : Despite the rain, we flew. Despite feeling nervous, she danced brilliantly. Attention, on ne dit jamais despite of !", "However (cependant) et nevertheless (néanmoins) ouvrent une nouvelle phrase, suivis d'une virgule. Whereas compare deux idées dans la même phrase : I love volleyball, whereas my friend prefers tennis."], "examples": [{"en": "Although we lost, we played our best match of the season.", "fr": "Même si on a perdu, on a joué notre meilleur match de la saison."}, {"en": "Despite the strong wind, the landing was perfectly smooth.", "fr": "Malgré le vent fort, l'atterrissage s'est fait tout en douceur."}, {"en": "Flying is fast. However, it has a bigger carbon footprint than the train.", "fr": "L'avion est rapide. Cependant, son empreinte carbone est plus importante que celle du train."}], "items": [{"q": "___ the rain, the outdoor concert went ahead.", "a": "Despite", "opts": ["Despite", "Although", "However", "Despite of"], "fr": "Malgré la pluie, le concert en plein air a été maintenu."}, {"q": "___ she was exhausted, she finished the whole rehearsal.", "a": "Although", "opts": ["Although", "Despite", "In spite of", "However"], "fr": "Même si elle était épuisée, elle a terminé toute la répétition."}, {"q": "Social media helps us stay in touch. ___, it can be very distracting.", "a": "However", "opts": ["However", "Although", "Despite", "Whereas"], "fr": "Les réseaux sociaux nous aident à garder le contact. Cependant, ils peuvent être très distrayants."}, {"q": "I prefer contemporary dance, ___ my friend loves hip-hop.", "a": "whereas", "opts": ["whereas", "despite", "however", "in spite"], "fr": "Je préfère la danse contemporaine, alors que mon amie adore le hip-hop."}, {"q": "In spite of ___ nervous, she gave a brilliant presentation.", "a": "feeling", "opts": ["feeling", "she felt", "feel", "felt"], "fr": "Malgré son stress, elle a fait un exposé brillant."}, {"q": "We kept fighting ___ we were losing by six points.", "a": "even though", "opts": ["even though", "despite", "however", "in spite of"], "fr": "On a continué à se battre même si on perdait de six points."}, {"q": "Trains are slower than planes. ___, they produce far less carbon dioxide per passenger.", "a": "Nevertheless", "opts": ["Nevertheless", "Although", "Despite", "Whereas"], "fr": "Les trains sont plus lents que les avions. Néanmoins, ils produisent beaucoup moins de dioxyde de carbone par passager."}, {"q": "Despite ___ well, we didn't qualify for the final.", "a": "playing", "opts": ["playing", "we played", "play", "of playing"], "fr": "Bien qu'on ait bien joué, on ne s'est pas qualifiées pour la finale."}]}]}};
const SCENES=[{"id": "s1-first-call", "level": 1, "title": "Le premier appel", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "C'est l'appel vidéo de bienvenue du programme d'été. Tu rencontres enfin Maya, ta correspondante. Liv, la prof de danse, et Sam, l'instructeur du club d'aviation, sont là aussi.", "start": "n1", "nodes": {"n1": {"say": [["liv", "Hello, everyone! Welcome! I'm Liv. I'm a dance teacher.", "Bonjour à tous ! Bienvenue ! Je suis Liv. Je suis prof de danse."], ["sam", "G'day! I'm Sam. I'm a pilot.", "Salut ! Moi, c'est Sam. Je suis pilote."], ["maya", "Hi! I'm Maya! Oh, you're Capucine! Hi, hi, hi!", "Salut ! Moi, c'est Maya ! Oh, c'est toi, Capucine ! Coucou !"]], "ask": {"prompt": "Salue tout le monde et présente-toi.", "options": [{"en": "Hi, everyone! I'm Capucine.", "fr": "Salut tout le monde ! Je suis Capucine.", "ok": true, "next": "n2", "react": ["maya", "Hi, Capucine! Nice to meet you!", "Salut, Capucine ! Enchantée !"]}, {"en": "Hello! My name is Capucine. Nice to meet you!", "fr": "Bonjour ! Je m'appelle Capucine. Enchantée !", "ok": true, "next": "n2", "react": ["liv", "Lovely to meet you too, Capucine!", "Ravie de te rencontrer aussi, Capucine !"]}, {"en": "Goodbye! See you tomorrow!", "fr": "Au revoir ! À demain !", "ok": false, "tip": "L'appel commence à peine ! Dis bonjour et donne ton prénom."}]}}, "n2": {"say": [["maya", "I'm fifteen. I live in Vermont, in the United States.", "J'ai quinze ans. J'habite dans le Vermont, aux États-Unis."], ["maya", "How old are you, Capucine?", "Tu as quel âge, Capucine ?"]], "ask": {"prompt": "Dis ton âge à Maya.", "options": [{"en": "I'm fifteen too!", "fr": "J'ai quinze ans aussi !", "ok": true, "next": "n3", "react": ["maya", "No way! Same age! Awesome!", "Pas possible ! Le même âge ! Génial !"]}, {"en": "I'm fifteen, just like you!", "fr": "J'ai quinze ans, comme toi !", "ok": true, "next": "n3", "react": ["maya", "Cool! We're twins! Well, almost.", "Trop bien ! On est jumelles ! Enfin, presque."]}, {"en": "I'm fine, thank you.", "fr": "Je vais bien, merci.", "ok": false, "tip": "Maya te demande ton âge, pas comment tu vas. Commence par « I'm... » suivi d'un nombre."}]}}, "n3": {"say": [["sam", "So, Capucine, what do you like?", "Alors, Capucine, qu'est-ce que tu aimes ?"], ["maya", "Yes, tell us! I love volleyball!", "Oui, dis-nous ! Moi, j'adore le volley !"]], "ask": {"prompt": "Dis ce que tu aimes.", "options": [{"en": "I love volleyball too!", "fr": "Moi aussi, j'adore le volley !", "ok": true, "next": "n4v", "react": ["maya", "Yes! Volleyball buddies!", "Ouais ! Copines de volley !"]}, {"en": "I like dance and planes.", "fr": "J'aime la danse et les avions.", "ok": true, "next": "n4p", "react": ["sam", "Planes? Great! I fly planes every week.", "Les avions ? Super ! Je pilote des avions toutes les semaines."]}, {"en": "I have got a red bag.", "fr": "J'ai un sac rouge.", "ok": false, "tip": "Sam te demande ce que tu aimes. Utilise « I like » ou « I love »."}]}}, "n4v": {"say": [["maya", "I play every day after school. I'm an outside hitter!", "Je joue tous les jours après les cours. Je suis attaquante !"], ["liv", "And do you like dance, Capucine?", "Et tu aimes la danse, Capucine ?"]], "ask": {"prompt": "Réponds à Liv.", "options": [{"en": "Yes, I love modern dance!", "fr": "Oui, j'adore la danse moderne !", "ok": true, "next": "n5", "react": ["liv", "Brilliant! Come to my class!", "Génial ! Viens à mon cours !"]}, {"en": "Yes! Dance is so fun!", "fr": "Oui ! La danse, c'est trop bien !", "ok": true, "next": "n5", "react": ["liv", "Wonderful! You're in the right place!", "Merveilleux ! Tu es au bon endroit !"]}, {"en": "No, I'm not hungry.", "fr": "Non, je n'ai pas faim.", "ok": false, "tip": "Liv te parle de danse, pas de nourriture ! Réponds avec « Yes, I love... »."}]}}, "n4p": {"say": [["sam", "Do you like big planes or small planes?", "Tu aimes les gros avions ou les petits avions ?"], ["maya", "I like big planes. With movies on the screen!", "Moi, j'aime les gros avions. Avec des films sur l'écran !"]], "ask": {"prompt": "Réponds à Sam.", "options": [{"en": "I like small planes. They're fun!", "fr": "J'aime les petits avions. Ils sont amusants !", "ok": true, "next": "n5", "react": ["sam", "Me too! Small planes are the best.", "Moi aussi ! Les petits avions, c'est le top."]}, {"en": "I like big planes. They're amazing!", "fr": "J'aime les gros avions. Ils sont incroyables !", "ok": true, "next": "n5", "react": ["sam", "Good answer! I fly big planes at work.", "Bonne réponse ! Je pilote de gros avions au travail."]}, {"en": "It's half past three.", "fr": "Il est trois heures et demie.", "ok": false, "tip": "Sam ne te demande pas l'heure ! Dis s'il tu préfères les gros ou les petits avions avec « I like... »."}]}}, "n5": {"say": [["liv", "Okay, the call is nearly over.", "Bon, l'appel est presque terminé."], ["maya", "Capucine, let's call again on Saturday!", "Capucine, on se rappelle samedi !"]], "ask": {"prompt": "Réponds à Maya.", "options": [{"en": "Yes, great idea! See you on Saturday!", "fr": "Oui, super idée ! À samedi !", "ok": true, "next": "n6", "react": ["maya", "Yay! I'm so happy!", "Youpi ! Je suis trop contente !"]}, {"en": "Sure! Bye, Maya!", "fr": "D'accord ! Salut, Maya !", "ok": true, "next": "n6", "react": ["maya", "Bye! This is so cool!", "Salut ! C'est trop cool !"]}, {"en": "Good morning, Maya!", "fr": "Bonjour, Maya !", "ok": false, "tip": "L'appel se termine : on ne dit pas « Good morning » pour se quitter. Dis « See you » ou « Bye »."}]}}, "n6": {"say": [["sam", "Bye, everyone! Happy flying!", "Salut tout le monde ! Bons vols !"], ["liv", "Bye! See you soon!", "Au revoir ! À bientôt !"]], "end": true}}, "quiz": [{"q": "Quel est le métier de Sam ?", "opts": ["Pilote", "Prof de danse", "Joueur de volley"], "a": 0}, {"q": "Où habite Maya ?", "opts": ["En Australie", "Dans le Vermont", "À Londres"], "a": 1}, {"q": "Quand Maya veut-elle se rappeler ?", "opts": ["Ce soir", "Lundi", "Samedi"], "a": 2}]}, {"id": "s1-dance-class", "level": 1, "title": "Mon premier cours de danse", "setting": "studio", "cast": ["liv", "maya"], "intro": "Premier cours de danse moderne à l'atelier de Liv ! Maya est dans le même cours que toi.", "start": "n1", "nodes": {"n1": {"say": [["liv", "Good morning, dancers! Welcome to my class!", "Bonjour, les danseurs ! Bienvenue dans mon cours !"], ["maya", "Capucine! Over here! Next to me!", "Capucine ! Par ici ! À côté de moi !"]], "ask": {"prompt": "Dis bonjour à Liv et à Maya.", "options": [{"en": "Good morning, Liv! Hi, Maya!", "fr": "Bonjour, Liv ! Salut, Maya !", "ok": true, "next": "n2", "react": ["liv", "Good morning, Capucine! Lovely to see you.", "Bonjour, Capucine ! Contente de te voir."]}, {"en": "Hello! I'm so happy to be here!", "fr": "Bonjour ! Je suis trop contente d'être là !", "ok": true, "next": "n2", "react": ["maya", "Me too! This is so exciting!", "Moi aussi ! C'est trop excitant !"]}, {"en": "Good night, Liv!", "fr": "Bonne nuit, Liv !", "ok": false, "tip": "« Good night » veut dire « bonne nuit ». Le matin, on dit « Good morning »."}]}}, "n2": {"say": [["liv", "First, we warm up. Have you got some water?", "D'abord, on s'échauffe. Tu as de l'eau ?"]], "ask": {"prompt": "Réponds à Liv.", "options": [{"en": "Yes, I've got a bottle of water.", "fr": "Oui, j'ai une bouteille d'eau.", "ok": true, "next": "n3", "react": ["liv", "Perfect! Water is very important.", "Parfait ! L'eau, c'est très important."]}, {"en": "Oh no! I haven't got any water.", "fr": "Oh non ! Je n'ai pas d'eau.", "ok": true, "next": "n3", "react": ["maya", "Here, I've got two bottles! Take one.", "Tiens, j'ai deux bouteilles ! Prends-en une."]}, {"en": "Yes, I've got a dog.", "fr": "Oui, j'ai un chien.", "ok": false, "tip": "Liv parle de ta bouteille d'eau, pas de tes animaux ! Réponds avec « I've got a bottle of water »."}]}}, "n3": {"say": [["liv", "Okay! Arms up. Now step to the right. And to the left!", "C'est parti ! Les bras en l'air. Maintenant, un pas à droite. Et à gauche !"], ["maya", "Oops! That's my left! Sorry!", "Oups ! Ça, c'est ma gauche ! Pardon !"], ["liv", "Ha ha! No problem, Maya.", "Ha ha ! Pas de problème, Maya."]], "next": "n4"}, "n4": {"say": [["liv", "Capucine, how do you feel?", "Capucine, comment tu te sens ?"]], "ask": {"prompt": "Dis à Liv comment tu te sens.", "options": [{"en": "I feel great! This is fun!", "fr": "Je me sens super bien ! C'est amusant !", "ok": true, "next": "n5", "react": ["liv", "Fantastic! That's the spirit!", "Fantastique ! C'est comme ça qu'on fait !"]}, {"en": "I'm a bit tired, but I'm happy!", "fr": "Je suis un peu fatiguée, mais je suis contente !", "ok": true, "next": "n5t", "react": ["liv", "That's normal! Have a sip of water.", "C'est normal ! Bois une gorgée d'eau."]}, {"en": "It's on the table.", "fr": "C'est sur la table.", "ok": false, "tip": "Liv te demande comment tu te sens. Commence par « I feel... » ou « I'm... »."}]}}, "n5": {"say": [["liv", "Now, let's count. Five, six, seven, eight!", "Maintenant, on compte. Cinq, six, sept, huit !"], ["maya", "Wait! What's the move?", "Attends ! C'est quoi, le mouvement ?"], ["liv", "Jump, turn and arms up!", "Saut, tour et bras en l'air !"]], "next": "n6"}, "n5t": {"say": [["liv", "Take a short break, then join us.", "Fais une petite pause, puis reviens avec nous."], ["maya", "Capucine, look! It's a jump and a turn. Easy!", "Capucine, regarde ! C'est un saut et un tour. Facile !"]], "next": "n6"}, "n6": {"say": [["liv", "Capucine, what's your favourite move?", "Capucine, c'est quoi, ton mouvement préféré ?"]], "ask": {"prompt": "Dis à Liv ce que tu préfères.", "options": [{"en": "I like turns. Turns are fun!", "fr": "J'aime les tours. C'est amusant !", "ok": true, "next": "n7", "react": ["liv", "Lovely turn! Very elegant!", "Joli tour ! Très élégant !"]}, {"en": "I love jumps! Look!", "fr": "J'adore les sauts ! Regarde !", "ok": true, "next": "n7", "react": ["maya", "Wow! You jump so high!", "Waouh ! Tu sautes trop haut !"]}, {"en": "My favourite move is pizza.", "fr": "Mon mouvement préféré, c'est la pizza.", "ok": false, "tip": "Un mouvement de danse, ce n'est pas un plat ! Parle d'un saut (« jump ») ou d'un tour (« turn »)."}]}}, "n7": {"say": [["liv", "Brilliant work, everyone! The class is over.", "Super travail, tout le monde ! Le cours est terminé."], ["maya", "That was so much fun! Same time tomorrow?", "C'était trop bien ! Même heure demain ?"]], "ask": {"prompt": "Réponds à Maya.", "options": [{"en": "Yes! See you tomorrow!", "fr": "Oui ! À demain !", "ok": true, "next": "n8", "react": ["maya", "Yay! Dance buddies!", "Youpi ! Copines de danse !"]}, {"en": "Of course! I love this class!", "fr": "Bien sûr ! J'adore ce cours !", "ok": true, "next": "n8", "react": ["liv", "Aww, thank you, Capucine!", "Oh, merci, Capucine !"]}, {"en": "Nice to meet you!", "fr": "Enchantée !", "ok": false, "tip": "Vous vous connaissez déjà ! Pour dire « à demain », utilise « See you tomorrow »."}]}}, "n8": {"say": [["liv", "Goodbye, dancers! Stretch and drink some water!", "Au revoir, les danseurs ! Étirez-vous et buvez de l'eau !"]], "end": true}}, "quiz": [{"q": "Que fait-on au début du cours ?", "opts": ["On s'échauffe", "On fait un spectacle", "On mange"], "a": 0}, {"q": "Quelle erreur fait Maya ?", "opts": ["Elle arrive en retard", "Elle confond la gauche et la droite", "Elle oublie son eau"], "a": 1}, {"q": "Jusqu'à quel nombre Liv compte-t-elle ?", "opts": ["Cinq", "Dix", "Huit"], "a": 2}]}, {"id": "s1-open-day", "level": 1, "title": "Portes ouvertes au club d'aviation", "setting": "airfield", "cast": ["sam", "maya"], "intro": "C'est la journée portes ouvertes du club d'aviation. Sam, pilote et instructeur, montre un petit avion à Maya et à toi.", "start": "n1", "nodes": {"n1": {"say": [["sam", "G'day, you two! Welcome to the aviation club!", "Salut, vous deux ! Bienvenue au club d'aviation !"], ["maya", "Hi, Sam! Look, Capucine! A real plane!", "Salut, Sam ! Regarde, Capucine ! Un vrai avion !"]], "ask": {"prompt": "Salue Sam.", "options": [{"en": "Hello, Sam! Nice to meet you!", "fr": "Bonjour, Sam ! Enchantée !", "ok": true, "next": "n2", "react": ["sam", "Nice to meet you too, Capucine!", "Enchanté aussi, Capucine !"]}, {"en": "Hi! Wow, this is so cool!", "fr": "Salut ! Waouh, c'est trop cool !", "ok": true, "next": "n2", "react": ["sam", "It is very cool. I agree!", "C'est vraiment cool. Je suis d'accord !"]}, {"en": "Goodbye, Sam!", "fr": "Au revoir, Sam !", "ok": false, "tip": "Tu viens d'arriver : dis « Hello » plutôt que « Goodbye » !"}]}}, "n2": {"say": [["sam", "This is a small plane. It's got four seats.", "Voici un petit avion. Il a quatre places."], ["maya", "It's white and blue. So cute!", "Il est blanc et bleu. Trop mignon !"], ["sam", "Capucine, what's this? Here, at the front.", "Capucine, c'est quoi, ça ? Ici, à l'avant."]], "ask": {"prompt": "Réponds à Sam : qu'y a-t-il à l'avant de l'avion ?", "options": [{"en": "It's the propeller!", "fr": "C'est l'hélice !", "ok": true, "next": "n3", "react": ["sam", "Spot on! The propeller turns very fast.", "Exactement ! L'hélice tourne très vite."]}, {"en": "I think it's the propeller.", "fr": "Je crois que c'est l'hélice.", "ok": true, "next": "n3", "react": ["sam", "Yes, it is! Great job, Capucine.", "Oui, c'est ça ! Bravo, Capucine."]}, {"en": "It's the tail.", "fr": "C'est la queue.", "ok": false, "tip": "La queue (« tail ») est à l'arrière. À l'avant, c'est l'hélice : « propeller »."}]}}, "n3": {"say": [["maya", "And these are the wings! Easy!", "Et ça, ce sont les ailes ! Facile !"], ["sam", "Right! And the tail is at the back.", "Exact ! Et la queue est à l'arrière."]], "next": "n4"}, "n4": {"say": [["sam", "Do you want to sit in the cockpit?", "Tu veux t'asseoir dans le cockpit ?"]], "ask": {"prompt": "Réponds à Sam.", "options": [{"en": "Yes, please! Thank you!", "fr": "Oui, s'il te plaît ! Merci !", "ok": true, "next": "n5", "react": ["sam", "No worries! Climb in. Careful!", "Pas de souci ! Monte. Attention !"]}, {"en": "Yes! Maya, take a photo, please!", "fr": "Oui ! Maya, prends une photo, s'il te plaît !", "ok": true, "next": "n5", "react": ["maya", "Okay! Smile, Capucine!", "D'accord ! Souris, Capucine !"]}, {"en": "No, I don't like chocolate.", "fr": "Non, je n'aime pas le chocolat.", "ok": false, "tip": "Sam te propose de t'asseoir dans le cockpit, pas de manger ! Réponds « Yes, please! »."}]}}, "n5": {"say": [["sam", "This is the yoke. Pilots fly the plane with it.", "Ça, c'est le manche. Les pilotes dirigent l'avion avec."], ["maya", "Wow, so many buttons!", "Waouh, il y a plein de boutons !"], ["sam", "So, Capucine, do you want to be a pilot?", "Alors, Capucine, tu veux être pilote ?"]], "ask": {"prompt": "Dis à Sam ce que tu veux faire plus tard.", "options": [{"en": "Yes! I want to be a pilot!", "fr": "Oui ! Je veux être pilote !", "ok": true, "next": "n6p", "react": ["sam", "Excellent! The sky is waiting for you.", "Excellent ! Le ciel t'attend."]}, {"en": "Maybe! I love planes very much.", "fr": "Peut-être ! J'adore les avions.", "ok": true, "next": "n6p", "react": ["sam", "Good! Lots of pilots start like that.", "Très bien ! Beaucoup de pilotes commencent comme ça."]}, {"en": "I don't know. I like dance too!", "fr": "Je ne sais pas. J'aime aussi la danse !", "ok": true, "next": "n6d", "react": ["maya", "Dance and planes! You can do both!", "La danse et les avions ! Tu peux faire les deux !"]}, {"en": "Yes, I'm a pilot. I'm forty.", "fr": "Oui, je suis pilote. J'ai quarante ans.", "ok": false, "tip": "Tu n'es pas encore pilote ! Pour parler de ton projet, dis « I want to be a pilot »."}]}}, "n6p": {"say": [["sam", "Here's a tip. Pilots speak English on the radio.", "Petite astuce : les pilotes parlent anglais à la radio."], ["maya", "Good news! You speak English, Capucine!", "Bonne nouvelle ! Tu parles anglais, Capucine !"]], "next": "n7"}, "n6d": {"say": [["sam", "That's true. Pilots can dance too!", "C'est vrai. Les pilotes peuvent danser aussi !"], ["maya", "Captain Capucine, the dancing pilot!", "Commandante Capucine, la pilote qui danse !"]], "next": "n7"}, "n7": {"say": [["sam", "Pilots have got a special alphabet. A is Alpha. B is Bravo. C is Charlie.", "Les pilotes ont un alphabet spécial. A, c'est Alpha. B, c'est Bravo. C, c'est Charlie."], ["maya", "And M is Mike! Capucine, what's your letter?", "Et M, c'est Mike ! Capucine, c'est quoi, ta lettre ?"]], "ask": {"prompt": "Dis ta lettre dans l'alphabet des pilotes.", "options": [{"en": "C is Charlie! I'm Charlie!", "fr": "C, c'est Charlie ! Je suis Charlie !", "ok": true, "next": "n8", "react": ["sam", "Spot on, Charlie! Ha ha!", "Exactement, Charlie ! Ha ha !"]}, {"en": "My letter is C. C for Charlie!", "fr": "Ma lettre, c'est C. C comme Charlie !", "ok": true, "next": "n8", "react": ["maya", "And I'm Mike! Charlie and Mike!", "Et moi, je suis Mike ! Charlie et Mike !"]}, {"en": "My letter is C. C for Cat!", "fr": "Ma lettre, c'est C. C comme Chat !", "ok": false, "tip": "Bonne idée, mais dans l'alphabet des pilotes, C se dit « Charlie »."}]}}, "n8": {"say": [["sam", "Great day, you two! See you at the next open day!", "Super journée, vous deux ! À la prochaine journée portes ouvertes !"], ["maya", "Thank you, Sam! Bye!", "Merci, Sam ! Salut !"]], "end": true}}, "quiz": [{"q": "Combien de places a le petit avion ?", "opts": ["Deux", "Quatre", "Six"], "a": 1}, {"q": "Qu'est-ce qu'il y a à l'avant de l'avion ?", "opts": ["La queue", "Les ailes", "L'hélice"], "a": 2}, {"q": "Dans l'alphabet des pilotes, B se dit...", "opts": ["Bravo", "Bingo", "Bob"], "a": 0}]}, {"id": "s1-music-call", "level": 1, "title": "Quelle musique tu aimes ?", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "Appel vidéo en groupe avec Maya, Liv et Sam. Aujourd'hui, le sujet, c'est la musique !", "start": "n1", "nodes": {"n1": {"say": [["maya", "Hi, everyone! Today's question: what music do you like?", "Salut tout le monde ! La question du jour : quelle musique vous aimez ?"], ["liv", "Ooh, I love this question!", "Oh, j'adore cette question !"], ["sam", "Me too. Capucine, you first!", "Moi aussi. Capucine, à toi d'abord !"]], "ask": {"prompt": "Dis quelle musique tu aimes.", "options": [{"en": "I love pop music!", "fr": "J'adore la pop !", "ok": true, "next": "n2", "react": ["maya", "Yes! Pop is the best!", "Oui ! La pop, c'est le top !"]}, {"en": "I like Taylor Swift and Dua Lipa.", "fr": "J'aime Taylor Swift et Dua Lipa.", "ok": true, "next": "n2", "react": ["liv", "Ooh, great taste, Capucine!", "Oh, tu as bon goût, Capucine !"]}, {"en": "I like pasta with cheese.", "fr": "J'aime les pâtes au fromage.", "ok": false, "tip": "On parle de musique, pas de cuisine ! Dis « I like pop music » ou cite un artiste."}]}}, "n2": {"say": [["maya", "I love K-pop! BTS is my favorite band!", "Moi, j'adore la K-pop ! BTS, c'est mon groupe préféré !"], ["liv", "I love Dua Lipa. Her songs are perfect for dance class.", "Moi, j'adore Dua Lipa. Ses chansons sont parfaites pour le cours de danse."]], "next": "n3"}, "n3": {"say": [["sam", "I like old rock music. And Coldplay!", "Moi, j'aime le vieux rock. Et Coldplay !"], ["maya", "Sam! That's so old school! Ha ha!", "Sam ! C'est trop vieille école ! Ha ha !"], ["sam", "Hey! Coldplay is cool! Right, Capucine?", "Hé ! Coldplay, c'est cool ! Hein, Capucine ?"]], "ask": {"prompt": "Dis ce que tu penses de Coldplay.", "options": [{"en": "I like Coldplay too!", "fr": "Moi aussi, j'aime Coldplay !", "ok": true, "next": "n4", "react": ["sam", "See, Maya? Capucine agrees with me!", "Tu vois, Maya ? Capucine est d'accord avec moi !"]}, {"en": "Coldplay is okay. I prefer pop.", "fr": "Coldplay, ça va. Je préfère la pop.", "ok": true, "next": "n4", "react": ["maya", "Ha! Pop wins!", "Ha ! La pop gagne !"]}, {"en": "Coldplay is a volleyball player.", "fr": "Coldplay est un joueur de volley.", "ok": false, "tip": "Coldplay, c'est un groupe de musique ! Dis si tu aimes : « I like Coldplay » ou « I don't like Coldplay »."}]}}, "n4": {"say": [["liv", "Capucine, when do you listen to music?", "Capucine, quand est-ce que tu écoutes de la musique ?"]], "ask": {"prompt": "Réponds à Liv.", "options": [{"en": "I listen to music in the morning.", "fr": "J'écoute de la musique le matin.", "ok": true, "next": "n5", "react": ["liv", "Lovely! Music is a great alarm clock!", "Super ! La musique, c'est un excellent réveil !"]}, {"en": "I listen to music when I do my homework.", "fr": "J'écoute de la musique quand je fais mes devoirs.", "ok": true, "next": "n5", "react": ["maya", "Me too! Homework is better with music.", "Moi aussi ! Les devoirs, c'est mieux en musique."]}, {"en": "Yes, I do.", "fr": "Oui.", "ok": false, "tip": "Liv te demande quand (« when »). Réponds avec un moment : « in the morning », « every day »..."}]}}, "n5": {"say": [["liv", "I play the piano. Just a little!", "Moi, je joue du piano. Juste un peu !"], ["maya", "Do you play an instrument, Capucine?", "Tu joues d'un instrument, Capucine ?"]], "ask": {"prompt": "Réponds à Maya.", "options": [{"en": "No, I don't. But I love singing!", "fr": "Non. Mais j'adore chanter !", "ok": true, "next": "n6", "react": ["liv", "Singing is brilliant! Your voice is an instrument too!", "Chanter, c'est génial ! Ta voix aussi, c'est un instrument !"]}, {"en": "No, but I dance to music!", "fr": "Non, mais je danse sur la musique !", "ok": true, "next": "n6", "react": ["maya", "Dancing counts! Totally!", "Danser, ça compte ! Carrément !"]}, {"en": "Yes, I play volleyball.", "fr": "Oui, je joue au volley.", "ok": false, "tip": "« Play » marche aussi pour le sport, mais Maya parle d'un instrument de musique. Réponds sur la musique !"}]}}, "n6": {"say": [["sam", "Let's make a group playlist!", "Faisons une playlist de groupe !"], ["maya", "Yes! One artist each!", "Oui ! Un artiste chacun !"], ["liv", "Capucine, pick an artist for the playlist!", "Capucine, choisis un artiste pour la playlist !"]], "ask": {"prompt": "Choisis un artiste pour la playlist.", "options": [{"en": "Olivia Rodrigo, please!", "fr": "Olivia Rodrigo, s'il vous plaît !", "ok": true, "next": "n7", "react": ["maya", "Oh my gosh, yes! Great choice!", "Oh là là, oui ! Super choix !"]}, {"en": "Sabrina Carpenter! I love her music.", "fr": "Sabrina Carpenter ! J'adore sa musique.", "ok": true, "next": "n7", "react": ["liv", "Ooh, perfect for a dance class!", "Oh, parfait pour un cours de danse !"]}, {"en": "Twelve o'clock, please!", "fr": "Midi, s'il vous plaît !", "ok": false, "tip": "Il faut choisir un artiste, pas une heure ! Donne le nom d'un chanteur ou d'une chanteuse."}]}}, "n7": {"say": [["sam", "Great playlist, everyone!", "Super playlist, tout le monde !"], ["maya", "Okay, music time! Bye, everyone!", "Allez, place à la musique ! Salut tout le monde !"], ["liv", "Bye! Keep dancing!", "Salut ! Continuez à danser !"]], "end": true}}, "quiz": [{"q": "Quelle musique Maya adore-t-elle ?", "opts": ["La K-pop", "Le jazz", "Le rock"], "a": 0}, {"q": "Quel groupe Sam aime-t-il ?", "opts": ["BTS", "Coldplay", "Aucun"], "a": 1}, {"q": "De quel instrument Liv joue-t-elle ?", "opts": ["De la guitare", "De la batterie", "Du piano"], "a": 2}]}, {"id": "s2-tournament", "level": 2, "title": "La finale de volley", "setting": "gym", "cast": ["maya", "liv"], "intro": "Tu es venue voir le tournoi de volley de Maya. Liv est dans les gradins avec les élèves de son atelier : elles vont danser pendant la pause.", "start": "n1", "nodes": {"n1": {"say": [["maya", "Capucine! You came! We're playing the final in ten minutes!", "Capucine ! Tu es venue ! On joue la finale dans dix minutes !"], ["liv", "And my dancers are performing during the break. It's a big day!", "Et mes danseuses passent pendant la pause. C'est un grand jour !"]], "ask": {"prompt": "Encourage Maya avant la finale.", "options": [{"en": "Good luck, Maya! You're going to be amazing!", "fr": "Bonne chance, Maya ! Tu ", "Respire un grand coup. Tu es plus forte que l'année dernière !"], "react": ["maya", "That's true! We trained so hard this year.", "C'est vrai ! On s'est tellement entraînées cette année !"], "next": "n3"}}}, "n3": {"say": [["maya", "Okay, I'm going! Wish me luck!", "Bon, j'y vais ! Souhaite-moi bonne chance !"], ["liv", "Look, the match is starting! Maya's team is wearing blue.", "Regarde, le match commence ! L'équipe de Maya est en bleu."]], "next": "n4"}, "n4": {"say": [["liv", "Oh no! The other team won the first set, twenty-five to twenty.", "Oh non ! L'autre équipe a gagné le premier set, vingt-cinq à vingt."], ["liv", "Capucine, how can we help them?", "Capucine, comment on peut les aider ?"]], "ask": {"prompt": "Propose une idée à Liv pour aider l'équipe.", "options": [{"en": "We can shout louder! Let's go, blue team!", "fr": "On peut crier plus fort ! Allez, les bleues !", "ok": true, "next": "n5", "react": ["liv", "Brilliant! Let's go, blue team!", "Génial ! Allez, les bleues !"]}, {"en": "Let's clap and sing! The team needs energy.", "fr": "Tapons dans nos mains et chantons ! L'équipe a besoin d'énergie.", "ok": true, "next": "n5", "react": ["liv", "Lovely idea! Everyone, clap with us!", "Super idée ! Tout le monde, tapez dans vos mains avec nous !"]}, {"en": "Let's go home. They're going to lose.", "fr": "Rentrons. Elles vont perdre.", "ok": false, "tip": "Ne baisse pas les bras ! Les supporters encouragent leur équipe jusqu'au bout."}]}}, "n5": {"say": [["liv", "Wow! Did you see that spike? Maya scored again!", "Waouh ! Tu as vu ce smash ? Maya a encore marqué !"], ["liv", "They won the second set! It's one set each!", "Elles ont gagné le deuxième set ! Un set partout !"]], "ask": {"prompt": "Commente l'action avec Liv.", "options": [{"en": "Yes! Her spike was faster than a plane!", "fr": "Oui ! Son smash était plus rapide qu'un avion !", "ok": true, "next": "n6", "react": ["liv", "Ha ha! Maybe not faster than a plane, but very fast!", "Ha ha ! Peut-être pas plus rapide qu'un avion, mais très rapide !"]}, {"en": "That was incredible! She's the best player on the court!", "fr": "C'était incroyable ! C'est la meilleure joueuse du terrain !", "ok": true, "next": "n6", "react": ["liv", "I agree! She's jumping higher than everyone!", "Je suis d'accord ! Elle saute plus haut que tout le monde !"]}, {"en": "Yes, I saw it on the bus yesterday.", "fr": "Oui, je l'ai vu dans le bus hier.", "ok": false, "tip": "Ça vient de se passer, là, maintenant ! Réagis à l'action avec enthousiasme."}], "open": {"model": ["What a spike! Maya is on fire today!", "Quel smash ! Maya est en feu aujourd'hui !"], "react": ["liv", "She really is! What a player!", "Carrément ! Quelle joueuse !"], "next": "n6"}}}, "n6": {"say": [["liv", "It's the break! My students are dancing now. Look at them!", "C'est la pause ! Mes élèves dansent maintenant. Regarde-les !"], ["liv", "Third set now. It's the last one, to fifteen points.", "Troisième set maintenant. C'est le dernier, en quinze points."], ["liv", "Fourteen to thirteen... Maya is serving... Yes! They won!", "Quatorze à treize... Maya est au service... Oui ! Elles ont gagné !"]], "next": "n7"}, "n7": {"say": [["maya", "Capucine! We won! Did you see my last serve?", "Capucine ! On a gagné ! Tu as vu mon dernier service ?"]], "ask": {"prompt": "Félicite Maya.", "options": [{"en": "Congratulations! Your last serve was perfect!", "fr": "Félicitations ! Ton dernier service était parfait !", "ok": true, "next": "n8", "react": ["maya", "Thank you! My hands were shaking!", "Merci ! Mes mains tremblaient !"]}, {"en": "Well done, champion! I was screaming the whole time!", "fr": "Bravo, championne ! J'ai crié pendant tout le match !", "ok": true, "next": "n8", "react": ["maya", "I heard you! You were the loudest fan!", "Je t'ai entendue ! Tu étais la supportrice la plus bruyante !"]}, {"en": "It's okay. Maybe next year.", "fr": "Ce n'est pas grave. Peut-être l'année prochaine.", "ok": false, "tip": "Elle
