function playLines(lines,done){
  let i=0;
  const step=()=>{
    if(route!=='scene'||!P)return;
    if(i>=lines.length){P.typingWho=null;drawTranscript();done();return}
    const [who,en,frt]=lines[i++];
    P.log.push({who,en,fr:frt,i:P.log.length});P.lastLine={who,en};P.typingWho=null;drawTranscript();scrollEnd();
    let moved=false;const go2=()=>{if(moved)return;moved=true;clearTimeout(guard);setTimeout(step,500)};
    const guard=setTimeout(()=>{stopTalk(who);go2()},4000+en.length*140);
    avSay(who,en,go2);
  };
  step();
}
function playNode(){
  const n=P.sc.nodes[P.nodeId];P.phase='playing';P.wrong=new Set();P.tip='';P.msg='';P.heard='';P.tries=0;P.showOpts=P.sc.level<=2;drawPanel();
  playLines(n.say,()=>{
    if(n.ask){P.phase='ask';P.asks++;drawPanel();scrollEnd()}
    else if(n.end){P.phase='end';drawPanel();scrollEnd()}
    else{P.nodeId=n.next;playNode()}
  });
}
function sceneAnswer(text,spoken){
  const n=P.sc.nodes[P.nodeId];const a=n.ask;text=(text||'').trim();if(!text)return;
  P.heard=text;P.tip='';P.msg='';
  let bi=-1,bs=0;a.options.forEach((o,i)=>{if(P.wrong.has(i))return;const s=similarity(text,o.en);if(s>bs){bs=s;bi=i}});
  const wc=toks(text).length;
  if(bi>=0&&bs>=.55){chooseOpt(bi,text);return}
  if(a.open&&wc>=(P.sc.level<=2?2:3)){openAnswer(text);return}
  P.tries++;P.showOpts=true;P.msg=P.tries>1?'Choisis une des idées ci-dessous, puis dites-la à voix haute.':'Je n\'ai pas bien compris ta réponse. Essaie encore, ou regarde les idées de réponse.';
  chime(false);drawPanel();scrollEnd();
}
function chooseOpt(i,said){
  const n=P.sc.nodes[P.nodeId];const o=n.ask.options[i];
  if(!o.ok){P.wrong.add(i);P.tip=o.tip||'';P.tries++;chime(false);drawPanel();scrollEnd();return}
  chime(true);if(P.tries===0)P.first++;
  P.log.push({who:'me',en:said||o.en,fr:said?'':o.fr});P.phase='playing';drawTranscript();drawPanel();
  const go2=()=>playLines([o.react],()=>{P.nodeId=o.next;playNode()});
  if(!said)speak(o.en,{onend:()=>setTimeout(go2,350)});else setTimeout(go2,400);
}
function openAnswer(said){
  const n=P.sc.nodes[P.nodeId];const op=n.ask.open;chime(true);if(P.tries===0)P.first++;
  P.log.push({who:'me',en:said,fr:''});P.phase='playing';drawTranscript();drawPanel();
  setTimeout(()=>playLines([op.react],()=>{P.log.push({who:'model',en:op.model[0],fr:op.model[1]});drawTranscript();P.nodeId=op.next;setTimeout(playNode,600)}),400);
}
function finishScene(){
  const sc=P.sc;const pct=Math.round(((P.first/Math.max(1,P.asks))*0.6+(P.quiz.ok/sc.quiz.length)*0.4)*100);
  P.xp=15+P.first*3+P.quiz.ok*4;addXP(P.xp);
  const prev=S.scenes[sc.id];S.scenes[sc.id]={score:Math.max(pct,prev?prev.score:0),date:Date.now(),n:(prev?prev.n:0)+1};save();
  P.phase='result';drawPanel();scrollEnd();
}

/* =========================================================
   Progrès
   ========================================================= */
function renderProgress(){
  const words=ALL.filter(i=>i.kind==='w'&&strength(i)>=3).length,phr=ALL.filter(i=>i.kind==='p'&&strength(i)>=3).length,gr=ALL.filter(i=>i.kind==='g'&&strength(i)>=3).length;
  const sc=Object.keys(S.scenes).length;
  const weeks=[];const now=new Date();const start=new Date(now);start.setDate(now.getDate()-now.getDay()-7*11);
  for(let w=0;w<12;w++){const col=[];for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);const k=dt.toLocaleDateString('en-CA');const x=S.days[k]||0;col.push(`<i class="${x>=S.settings.goal?'l3':x>=20?'l2':x>0?'l1':''}" title="${k} : ${x} points"></i>`)}weeks.push(`<div class="wk">${col.join('')}</div>`)}
  $('#view').innerHTML=`<h2>Mes progrès</h2>
  <div class="statgrid" style="margin:14px 0"><div class="stat"><b>${S.xp}</b><span>points au total</span></div><div class="stat"><b>${S.streak}</b><span>jours d'affilée (record : ${S.best||S.streak})</span></div><div class="stat"><b>${words}</b><span>mots maîtrisés</span></div><div class="stat"><b>${phr}</b><span>phrases maîtrisées</span></div><div class="stat"><b>${gr}</b><span>exercices de grammaire</span></div><div class="stat"><b>${sc}</b><span>conversations réussies</span></div></div>
  <h3>Mes certificats</h3>
  <div class="badges">${LEVELS.map(l=>`<div class="badge-c ${S.cert[l.n]?'got':''}">${svg('award').replace('<svg','<svg style="width:34px;height:34px;stroke:currentColor"')}<b>Niveau ${l.n} · ${l.cefr}</b><span class="hint">${S.cert[l.n]?new Date(S.cert[l.n]).toLocaleDateString('fr-FR'):`${Math.round(lvMastery(l.n)*100)}% maîtrisé`}</span></div>`).join('')}</div>
  <h3>Mes 12 dernières semaines</h3>
  <div class="heat" aria-label="Jours de pratique">${weeks.join('')}</div>
  <p class="hint" style="margin-top:8px">Chaque case est un jour. Plus elle est verte, plus tu as pratiqué. Vert foncé : objectif du jour atteint.</p>
  <h3>Sauvegarder ma progression</h3>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <p style="margin:0">Ta progression est gardée automatiquement sur cet appareil. Par précaution, tu peux en faire une copie, par exemple avant de changer de téléphone.</p>
    <div class="row"><button class="btn small" data-export>${svg('download')}Télécharger une copie</button><button class="btn small ghost" data-showcode>Afficher le code de sauvegarde</button><label class="btn small ghost" style="cursor:pointer">Restaurer une copie<input type="file" id="importfile" accept=".json,application/json" hidden></label></div>
    <div id="codezone"></div>
  </div>`;
}

/* =========================================================
   Réglages
   ========================================================= */
function renderSettings(){
  const has='speechSynthesis' in window;const st=micState();
  $('#view').innerHTML=`<div class="narrow"><h2>Réglages</h2>
  ${installBanner()}
  <section class="set"><span class="t">Mon niveau actuel</span><div class="seg">${LEVELS.map(l=>`<button data-setlevel2="${l.n}" aria-pressed="${S.level===l.n}">Niveau ${l.n} · ${l.cefr}</button>`).join('')}</div><p class="hint">La séance du jour et les conversations recommandées suivent ce niveau.</p></section>
  <section class="set"><span class="t">Micro</span>
    <p style="margin:0" class="${st==='ok'?'':'vstate basic'}">${fr(MIC_MSG[st])}</p>
    ${SRClass?`<div class="row"><button class="mic" data-mictest style="width:64px;height:64px;margin:0" aria-label="Tester le micro">${svg('mic')}</button><span class="hint">Touche et dites : « Hello, my name is Capucine ».</span></div><div class="heard" id="live" hidden></div>`:''}
    <p class="hint">L'écoute de la voix utilise Internet (Wi-Fi). Tout le reste de l'application fonctionne sans connexion.</p>
  </section>
  <section class="set"><label class="t" for="voice">Voix des leçons</label>
    ${!has?'<p>Cet appareil ne permet pas la lecture à voix haute.</p>':VOICES.length?`<select id="voice">${VOICES.map(x=>`<option value="${esc(x.v.name)}" ${VOICE&&x.v.name===VOICE.name?'selected':''}>${esc(x.v.name)} (${esc(x.v.lang)})</option>`).join('')}</select>
    <div class="row">${['maya','liv','sam'].map(id=>`<button class="say" data-say="${esc('Hello Capucine, this is '+AV[id].name+'.')}" data-who="${id}">${svg('speaker')}${AV[id].name} · ${esc(AV[id].voice?AV[id].voice.lang:AV[id].lang)}</button>`).join('')}<button class="say slow" data-say="Hello Capucine. How are you today?" data-slow="1">Test lent</button></div>`:'<p class="hint">Recherche des voix…</p>'}
    <details><summary>Rendre les voix plus naturelles sur Android</summary><ol>
      <li>Ouvre <b>Paramètres</b>, puis <b>Accessibilité</b> (sur Samsung : <b>Gestion globale</b>).</li>
      <li>Touche <b>Synthèse vocale</b> (ou « Sortie de la synthèse vocale »).</li>
      <li>Dans <b>Moteur préféré</b>, choisis <b>Services de reconnaissance et de synthèse vocale de Google</b> (pas le moteur Samsung).</li>
      <li>Touche la roue dentée à côté, puis <b>Installer les données vocales</b>.</li>
      <li>Télécharge <b>Anglais (États-Unis)</b>, <b>Anglais (Royaume-Uni)</b> et <b>Anglais (Australie)</b> : ce sont les accents de Maya, Liv et Sam.</li>
      <li>Pour chaque langue, choisis la voix que tu préfères. Reviens ici et teste.</li></ol></details>
  </section>
  <section class="set"><label class="t" for="rate">Vitesse des voix</label><input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="${S.settings.rate}"><div class="row" style="justify-content:space-between"><span class="hint">Plus lent</span><span class="hint">Plus rapide</span></div><p class="hint">Au niveau 1 les voix parlent plus lentement, au niveau 4 à vitesse normale.</p></section>
  <section class="set"><span class="t">Traductions dans les conversations</span><div class="seg">${[['auto','Automatique'],['show','Toujours'],['tap','Sur demande'],['off','Jamais']].map(([v,l])=>`<button data-trans="${v}" aria-pressed="${S.settings.trans===v}">${l}</button>`).join('')}</div><p class="hint">Automatique : affichées aux niveaux 1 et 2, sur demande aux niveaux 3 et 4.</p></section>
  <section class="set"><span class="t">Objectif quotidien</span><div class="seg">${[[30,'Tranquille · 30'],[50,'Régulier · 50'],[80,'Sérieux · 80'],[120,'Intensif · 120']].map(([v,l])=>`<button data-goal="${v}" aria-pressed="${S.settings.goal===v}">${l}</button>`).join('')}</div></section>
  <section class="set"><span class="t">Taille du texte</span><div class="seg">${[[1,'Normale'],[1.12,'Grande'],[1.25,'Très grande']].map(([v,l])=>`<button data-size="${v}" aria-pressed="${S.settings.size==v}">${l}</button>`).join('')}</div>
    <label class="switch" for="sfx"><span>Petits sons de réussite</span><input type="checkbox" id="sfx" ${S.settings.sfx?'checked':''}></label></section>
  <section class="set"><span class="t">Recommencer à zéro</span><p class="hint">Efface toute la progression sur cet appareil.</p><div class="row" id="resetzone"><button class="btn ghost small" data-reset>Effacer ma progression</button></div></section>
  <p class="legal">Appli familiale faite pour Capucine. Fonctionne sans compte ni abonnement. Personnages et voix : synthèse vocale de l'appareil, portraits dessinés. Images : emojis. Polices : Atkinson Hyperlegible (Braille Institute) et Young Serif (Bastien Sozeau), licence SIL Open Font License. Version 3.</p></div>`;
}
function applySize(){document.documentElement.style.setProperty('--scale',S.settings.size)}

/* =========================================================
   Sauvegarde : export / import
   ========================================================= */
function exportData(){
  const data=JSON.stringify({app:'capAnglais',v:1,date:new Date().toISOString(),S});
  try{const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anglais-capucine-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copie enregistrée dans « Téléchargements ».')}
  catch(e){showCode()}
}
function showCode(){const z=$('#codezone');if(!z)return;const code=btoa(unescape(encodeURIComponent(JSON.stringify({app:'capAnglais',v:1,S}))));
  z.innerHTML=`<p class="hint">Code de sauvegarde (copie-le dans un e-mail ou une note) :</p><textarea class="code" id="codeout" readonly>${code}</textarea><p class="hint">Pour restaurer, colle un code ici puis touche « Restaurer ce code » :</p><textarea class="code" id="codein"></textarea><button class="btn small" data-restorecode>Restaurer ce code</button>`}
function restore(obj){
  if(!obj||obj.app!=='capAnglais'||!obj.S){toast('Cette copie n\'est pas reconnue.');return}
  S={...JSON.parse(JSON.stringify(DEF)),...obj.S,settings:{...DEF.settings,...(obj.S.settings||{})}};save();applySize();renderStats();toast('Progression restaurée.');go('home');
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-unhide]');if(!b)return;const d=b.dataset;
  if(AC&&AC.state==='suspended')AC.resume();
  if(d.unhide!==undefined&&route==='scene'){const l=P.log[+d.unhide];if(l){l.unhide=true;drawTranscript()}return}
  if(d.say!==undefined){if(route==='scene'&&P&&P.phase==='playing'){toast('Attends la fin de la phrase, puis réécoute.');return}if(d.who&&d.anim)avSay(d.who,d.say,null,!!d.slow);else speak(d.say,{slow:!!d.slow,who:d.who});return}
  if(d.go){go(d.go);return}
  if(d.back){const [r,a]=d.back.split(':');go(r,a);return}
  if(d.setlevel){S.level=+d.setlevel;S.onboarded=true;save();renderStats();go('home');return}
  if(d.setlevel2){S.level=+d.setlevel2;save();renderStats();renderSettings();return}
  if(d.viewlevel){viewLv=+d.viewlevel;go('learn');return}
  if(d.theme){go('theme',d.theme);return}
  if(d.vset){go('vset',d.vset);return}
  if(d.gram){go('gram',d.gram);return}
  if(d.start){startLesson(d.start);return}
  if(d.listen){startListen(d.listen);return}
  if(d.install!==undefined){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}return}
  if(route==='listenmode'){
    if(d.stoplisten!==undefined){H.playing=false;go('vset',H.v.id);return}
    if(d.ltoggle!==undefined){H.playing=!H.playing;if(H.playing)stepListen();else{hush();renderListen()}return}
    if(d.lnext!==undefined||d.lprev!==undefined){H.i=(H.i+(d.lnext!==undefined?1:H.list.length-1))%H.list.length;hush();if(H.playing)stepListen();else{renderListen();speak(H.list[H.i].en)}return}
  }
  if(route==='lesson'){
    const q=L.q[L.i];
    if(d.quit!==undefined){const [r,a]=L.back.split(':');go(r,a);return}
    if(d.opt!==undefined&&!L.checked){L.sel=+d.opt;if(d.speakopt)speak(d.speakopt);renderLesson();return}
    if(d.build!==undefined&&!L.checked){const ti=+d.build;if(!L.built.includes(ti)){L.built.push(ti);speak(q.tiles[ti]);renderLesson()}return}
    if(d.unbuild!==undefined&&!L.checked){L.built.splice(+d.unbuild,1);renderLesson();return}
    if(d.check!==undefined){check();return}
    if(d.skip!==undefined){const a=$('#ans');L.typed=a?a.value:'';grade(false);return}
    if(d.mic!==undefined){listen(onSpoken,{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
    if(d.reveal!==undefined){q.stage=1;speak(q.it.en);renderLesson();return}
    if(d.self!==undefined){grade(d.self==='1');return}
    if(d.pl!==undefined){pairTap('l',+d.pl);return}
    if(d.pr!==undefined){pairTap('r',+d.pr);return}
    if(d.pairsdone!==undefined){L.tot++;if(q.miss<=1)L.ok++;q.set.forEach(x=>rate(x,q.miss<=1));next();return}
    if(d.next!==undefined){next();return}
  }
  if(d.scene){startScene(d.scene);return}
  if(route==='scene'){
    if(d.leavescene!==undefined){go('talk');return}
    if(d.scenego!==undefined){playNode();return}
    if(d.hidetext!==undefined){P.hideText=!P.hideText;b.setAttribute('aria-pressed',P.hideText);b.innerHTML=svg('eye')+(P.hideText?'Afficher le texte':'Écouter sans lire');P.log.forEach(l=>l.unhide=false);drawTranscript();return}
    if(d.revealTr!==undefined){const l=P.log[+d.revealTr];if(l){l.revealed=true;drawTranscript()}return}
    if(d.replay!==undefined){if(P.phase==='playing')return;if(P.lastLine)avSay(P.lastLine.who,P.lastLine.en,null,d.replay==='slow');return}
    if(d.smic!==undefined){listen(alts=>{const n=P.sc.nodes[P.nodeId];let bestA=alts[0];let bs=-1;alts.forEach(a=>n.ask.options.forEach(o=>{const s=similarity(a,o.en);if(s>bs){bs=s;bestA=a}}));sceneAnswer(bestA,true)},{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
    if(d.stype!==undefined){P.typing=true;drawPanel();setTimeout(()=>$('#sans')&&$('#sans').focus(),50);return}
    if(d.ssend!==undefined){sceneAnswer($('#sans').value,false);return}
    if(d.showopts!==undefined){P.showOpts=true;drawPanel();return}
    if(d.sopt!==undefined){chooseOpt(+d.sopt,null);return}
    if(d.quizgo!==undefined){P.phase='quiz';P.quiz={i:0,ok:0,ans:null};drawPanel();scrollEnd();return}
    if(d.quiz!==undefined){const q=P.sc.quiz[P.quiz.i];P.quiz.ans=+d.quiz;if(+d.quiz===q.a){P.quiz.ok++;chime(true)}else chime(false);drawPanel();return}
    if(d.quiznext!==undefined){P.quiz.i++;P.quiz.ans=null;if(P.quiz.i>=P.sc.quiz.length)finishScene();else drawPanel();return}
  }
  if(d.mictest!==undefined){listen(alts=>{const l=$('#live');l.hidden=false;l.textContent='J\'ai entendu : « '+alts[0]+' »';toast('Le micro fonctionne !')},{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
  if(d.trans){S.settings.trans=d.trans;save();renderSettings();return}
  if(d.goal){S.settings.goal=+d.goal;save();renderSettings();return}
  if(d.size){S.settings.size=+d.size;save();applySize();renderSettings();return}
  if(d.export!==undefined){exportData();return}
  if(d.showcode!==undefined){showCode();return}
  if(d.restorecode!==undefined){try{restore(JSON.parse(decodeURIComponent(escape(atob($('#codein').value.trim())))))}catch(err){toast('Ce code n\'est pas valide.')}return}
  if(d.reset!==undefined){$('#resetzone').innerHTML=`<span>Vraiment tout effacer ?</span><button class="btn small red" data-resetyes>Oui, effacer</button><button class="btn ghost small" data-resetno>Non</button>`;return}
  if(d.resetyes!==undefined){S=JSON.parse(JSON.stringify(DEF));S.onboarded=true;save();renderStats();toast('Progression effacée.');go('home');return}
  if(d.resetno!==undefined){renderSettings();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='voice'){S.settings.voice=t.value;const f=VOICES.find(x=>x.v.name===t.value);if(f)VOICE=f.v;save();speak('Hello Capucine! Nice to meet you.')}
  if(t.id==='rate'){S.settings.rate=+t.value;save();speak('This is my speaking speed.')}
  if(t.id==='sfx'){S.settings.sfx=t.checked;save();if(t.checked)chime(true)}
  if(t.id==='importfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{restore(JSON.parse(r.result))}catch(err){toast('Ce fichier n\'est pas une copie valide.')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'&&route==='lesson'&&!L.checked){e.preventDefault();check()}
  else if(e.target.id==='sans'){e.preventDefault();sceneAnswer(e.target.value,false)}
});

$('#logo').innerHTML=LOGO_SVG;
applySize();renderStats();
route=S.onboarded?'home':'onboard';render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).then(r=>r.update()).catch(()=>{}))}
</script>
</body></html>
