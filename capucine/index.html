her would be going too far.", "fr": "Je pense qu'on devrait prendre moins l'avion, mais interdire complètement les vols, ce serait aller trop loin.", "ok": true, "next": "n2", "react": ["liv", "A middle ground already! You'd make a brilliant diplomat, Capucine.", "Déjà un compromis ! Tu ferais une excellente diplomate, Capucine."]}, {"en": "Planes are bad. End of story.", "fr": "Les avions, c'est mal. Point final.", "ok": false, "tip": "Dans un débat de niveau B2, on nuance son avis ! Essaie « It's a tricky one » ou « On the one hand... on the other hand... »."}], "open": {"model": ["On the one hand, flying brings people together, but on the other hand, it pollutes a lot.", "D'un côté, l'avion rapproche les gens, mais de l'autre, il pollue beaucoup."], "react": ["maya", "Ooh, on the one hand, on the other hand. Very professional. I'm stealing that.", "Oh, d'un côté, de l'autre. Très pro. Je te le pique."], "next": "n2"}}}, "n2": {"say": [["maya", "So here's my problem. Every winter, my family flies to Florida to see my grandparents.", "Alors voilà mon problème. Chaque hiver, ma famille prend l'avion pour aller voir mes grands-parents en Floride."], ["maya", "If flights were limited, I'd hardly ever see them. That doesn't seem fair to me.", "Si les vols étaient limités, je ne les verrais presque plus jamais. Ça ne me paraît pas juste."], ["liv", "That's a fair point, Maya. Capucine, what would you say to her?", "C'est un argument valable, Maya. Capucine, qu'est-ce que tu lui répondrais ?"]], "ask": {"prompt": "Réponds à Maya avec un argument nuancé (second conditionnel : if + prétérit, would + verbe).", "options": [{"en": "I see your point. But if there were more fast trains, people wouldn't need to fly so often.", "fr": "Je comprends ton point de vue. Mais s'il y avait plus de trains rapides, les gens n'auraient pas besoin de prendre l'avion aussi souvent.", "ok": true, "next": "n3", "react": ["sam", "Spot on. Some countries already limit short flights when there's a fast train alternative.", "Tout à fait. Certains pays limitent déjà les vols courts quand il existe un train rapide."]}, {"en": "True, but maybe the rules would only apply to short flights, not to visiting family far away.", "fr": "C'est vrai, mais les règles pourraient ne concerner que les vols courts, pas les visites à la famille qui habite loin.", "ok": true, "next": "n3", "react": ["maya", "Hmm, okay. I could live with that. Florida is way too far by train!", "Hmm, d'accord. Ça, je pourrais l'accepter. La Floride, c'est beaucoup trop loin en train !"]}, {"en": "If I am a plane, I would fly to the moon.", "fr": "Si je suis un avion, je volerais jusqu'à la lune.", "ok": false, "tip": "Attention : au second conditionnel, on dit « If I were..., I would... ». Et reste dans le sujet du débat !"}], "open": {"model": ["I understand, but if everyone flew a little less, it would make a real difference.", "Je comprends, mais si tout le monde prenait un peu moins l'avion, ça ferait une vraie différence."], "react": ["maya", "Okay, that's a solid argument. I hate it, but it's solid.", "Bon, c'est un argument solide. Ça m'énerve, mais il est solide."], "next": "n3"}}}, "n3": {"say": [["liv", "Can I play devil's advocate? I fly abroad to teach workshops. It's literally my job.", "Je peux me faire l'avocate du diable ? Je prends l'avion pour donner des ateliers à l'étranger. C'est littéralement mon métier."], ["sam", "And mine, obviously. Although, to be fair, aviation is changing.", "Et le mien, évidemment. Cela dit, pour être honnête, l'aviation est en train de changer."], ["sam", "Newer planes burn much less fuel than older ones, and airlines are testing more sustainable fuels.", "Les avions récents consomment beaucoup moins de carburant que les anciens, et les compagnies testent des carburants plus durables."], ["maya", "Capucine, do you think that's enough, or is it just a convenient excuse?", "Capucine, tu penses que ça suffit, ou que c'est juste une excuse bien pratique ?"]], "ask": {"prompt": "Donne ton avis sur ce que dit Sam, poliment mais honnêtement.", "options": [{"en": "It's definitely a step in the right direction, but I'm not convinced it's enough on its own.", "fr": "C'est clairement un pas dans la bonne direction, mais je ne suis pas convaincue que ça suffise à lui seul.", "ok": true, "next": "n4", "react": ["sam", "Fair enough. Even inside the industry, plenty of people would agree with you.", "C'est juste. Même dans le secteur, beaucoup de gens seraient d'accord avec toi."]}, {"en": "To be honest, I'd need more information before making up my mind.", "fr": "Pour être honnête, il me faudrait plus d'informations avant de me faire une opinion.", "ok": true, "next": "n4", "react": ["liv", "Very wise. Most people make up their minds far too quickly.", "Très sage. La plupart des gens se font un avis beaucoup trop vite."]}, {"en": "You're lying, Sam. Pilots always lie.", "fr": "Tu mens, Sam. Les pilotes mentent toujours.", "ok": false, "tip": "On peut ne pas être d'accord sans être impolie ! Essaie « I see what you mean, but... » ou « I'm not sure that's enough »."}], "open": {"model": ["I see what you mean, but technology alone probably won't solve the whole problem.", "Je vois ce que tu veux dire, mais la technologie à elle seule ne réglera sans doute pas tout le problème."], "react": ["sam", "I can't really argue with that. You'd be a tough opponent in a debate!", "Difficile de te contredire. Tu serais une adversaire redoutable dans un débat !"], "next": "n4"}}}, "n4": {"say": [["maya", "Okay, what about rules? Some people suggest a limit, like a few flights per person each year.", "Bon, et les règles ? Certains proposent une limite, genre quelques vols par personne et par an."], ["liv", "Hmm, I'm on the fence. How on earth would you check it?", "Hmm, je suis partagée. Comment diable on contrôlerait ça ?"], ["sam", "Capucine, imagine you were in charge. What would you do?", "Capucine, imagine que c'est toi qui décides. Qu'est-ce que tu ferais ?"]], "ask": {"prompt": "Imagine que tu décides : propose une solution (If I were in charge, I would...).", "options": [{"en": "If I were in charge, I'd make train tickets much cheaper, so that people would choose them instead.", "fr": "Si c'était moi qui décidais, je rendrais les billets de train beaucoup moins chers, pour que les gens les choisissent à la place.", "ok": true, "next": "n5", "react": ["maya", "Cheaper trains? You'd win the election in a heartbeat!", "Des trains moins chers ? Tu gagnerais l'élection en un clin d'œil !"]}, {"en": "I'd encourage people to take fewer but longer trips, instead of lots of short ones.", "fr": "J'encouragerais les gens à faire moins de voyages mais plus longs, plutôt que plein de petits.", "ok": true, "next": "n5", "react": ["liv", "Ooh, I like that. Fewer trips, but more meaningful ones.", "Oh, j'aime bien. Moins de voyages, mais des voyages qui ont plus de sens."]}, {"en": "If I were in charge, I'd close every airport tomorrow morning.", "fr": "Si c'était moi qui décidais, je fermerais tous les aéroports demain matin.", "ok": false, "tip": "C'est un avis très extrême, et Sam serait au chômage ! Dans un débat poli, propose une solution plus nuancée et réaliste."}], "open": {"model": ["If I were in charge, I'd invest in greener planes and better trains at the same time.", "Si c'était moi qui décidais, j'investirais à la fois dans des avions plus propres et dans de meilleurs trains."], "react": ["sam", "The best of both worlds. You'd get my vote, Capucine.", "Le meilleur des deux mondes. Tu aurais ma voix, Capucine."], "next": "n5"}}}, "n5": {"say": [["liv", "I have to admit, I've changed my mind a bit. I could take the train to more of my workshops in Europe.", "Je dois l'avouer, j'ai un peu changé d'avis. Je pourrais prendre le train pour plus de mes ateliers en Europe."], ["sam", "I'll admit something too. If I'd known twenty years ago what I know now, I'd have pushed for greener planes much sooner.", "Moi aussi, j'avoue quelque chose. Si j'avais su il y a vingt ans ce que je sais aujourd'hui, j'aurais milité bien plus tôt pour des avions plus propres."], ["maya", "Wow, people actually changing their minds in a debate. That never happens online!", "Waouh, des gens qui changent vraiment d'avis pendant un débat. Ça n'arrive jamais sur internet !"]], "next": "n6"}, "n6": {"say": [["maya", "Okay, Capucine, I need a strong conclusion for my debate. Can you help me sum it all up?", "Bon, Capucine, il me faut une conclusion percutante pour mon débat. Tu peux m'aider à tout résumer ?"]], "ask": {"prompt": "Aide Maya à résumer le débat en une conclusion nuancée.", "options": [{"en": "All in all, flying isn't the enemy, but we should all think twice before booking a flight.", "fr": "Tout compte fait, l'avion n'est pas l'ennemi, mais on devrait tous réfléchir à deux fois avant de réserver un vol.", "ok": true, "next": "n7", "react": ["maya", "Think twice before booking. That's my closing line, done!", "Réfléchir à deux fois avant de réserver. C'est ma phrase de fin, c'est réglé !"]}, {"en": "To sum up, there's no easy answer, but cleaner planes and better trains could both help.", "fr": "Pour résumer, il n'y a pas de réponse simple, mais des avions plus propres et de meilleurs trains pourraient aider tous les deux.", "ok": true, "next": "n7", "react": ["liv", "Balanced, clear and convincing. Top marks, Capucine!", "Équilibré, clair et convaincant. Vingt sur vingt, Capucine !"]}, {"en": "In conclusion, I like pizza.", "fr": "En conclusion, j'aime la pizza.", "ok": false, "tip": "Une conclusion résume les idées du débat ! Utilise « To sum up » ou « All in all » et reprends les arguments."}], "open": {"model": ["All things considered, we don't need to stop flying, but we do need to fly smarter.", "Tout bien considéré, on n'a pas besoin d'arrêter l'avion, mais on doit le prendre plus intelligemment."], "react": ["sam", "Fly smarter. I might borrow that for my next talk at the club!", "Voler plus intelligemment. Je vais peut-être te l'emprunter pour ma prochaine intervention au club !"], "next": "n7"}}}, "n7": {"say": [["maya", "You guys are the best. My teacher is going to be blown away.", "Vous êtes les meilleurs. Ma prof va être bluffée."], ["sam", "Good luck, Maya. And remember, a good debater listens as much as she talks.", "Bonne chance, Maya. Et souviens-toi : une bonne débatteuse écoute autant qu'elle parle."], ["liv", "Let us know how it goes! Fingers crossed!", "Tiens-nous au courant ! On croise les doigts !"]], "end": true}}, "quiz": [{"q": "Pourquoi Maya hésite-t-elle à limiter les vols ?", "opts": ["Elle a peur des trains", "Sa famille prend l'avion chaque hiver pour voir ses grands-parents en Floride", "Elle veut devenir pilote"], "a": 1}, {"q": "Selon Sam, qu'est-ce qui change dans l'aviation ?", "opts": ["Les avions récents consomment beaucoup moins de carburant", "Les avions volent deux fois plus vite", "Les billets deviennent gratuits"], "a": 0}, {"q": "Qu'est-ce que Liv envisage de faire ?", "opts": ["Arrêter de donner des ateliers", "Acheter un petit avion", "Prendre plus souvent le train pour ses ateliers en Europe"], "a": 2}]}, {"id": "s4-scholarship-interview", "level": 4, "title": "L'entretien pour la bourse", "setting": "airfield", "cast": ["sam", "maya"], "intro": "Le club d'aviation offre une bourse pour un stage d'été d'aviation. Avant les vrais entretiens, Sam fait passer des entretiens d'entraînement dans la salle du club. Maya, qui postule aussi, attend son tour juste à côté... et elle stresse beaucoup !", "start": "n1", "nodes": {"n1": {"say": [["maya", "Capucine, I'm freaking out. What if he asks me something I don't know?", "Capucine, je panique. Et s'il me pose une question dont je ne connais pas la réponse ?"], ["sam", "Nobody's going to bite, Maya. It's only a practice run.", "Personne ne va te manger, Maya. C'est juste un entraînement."], ["sam", "Right, Capucine, take a seat. Shall we begin? First, tell me a little about yourself.", "Bon, Capucine, assieds-toi. On commence ? D'abord, parle-moi un peu de toi."]], "ask": {"prompt": "Présente-toi de façon professionnelle mais naturelle.", "options": [{"en": "Of course. I'm Capucine, I'm passionate about aviation, and I also play volleyball and dance.", "fr": "Bien sûr. Je m'appelle Capucine, je suis passionnée d'aviation, et je fais aussi du volley et de la danse.", "ok": true, "next": "n2", "react": ["sam", "Nice and clear. You mentioned your hobbies without rambling on. Well done.", "Clair et net. Tu as parlé de tes loisirs sans t'éterniser. Bravo."]}, {"en": "Sure. I've been fascinated by planes for years, and my discovery flight confirmed it.", "fr": "Bien sûr. Les avions me fascinent depuis des années, et mon vol de découverte l'a confirmé.", "ok": true, "next": "n2", "react": ["sam", "Ah, you've linked it to a real experience. Interview panels love that.", "Ah, tu l'as relié à une vraie expérience. Les jurys adorent ça."]}, {"en": "Hi! So, um, I don't know. What do you want to know?", "fr": "Salut ! Alors, euh, je sais pas. Tu veux savoir quoi ?", "ok": false, "tip": "Dans un entretien, il faut se présenter avec assurance ! Prépare deux ou trois phrases sur toi et tes passions."}], "open": {"model": ["I'm Capucine. I've loved aviation for as long as I can remember, and I'm keen to learn more.", "Je m'appelle Capucine. Aussi loin que je me souvienne, j'ai toujours adoré l'aviation, et j'ai très envie d'en apprendre plus."], "react": ["sam", "Excellent opening. Confident, but not over the top.", "Excellente entrée en matière. Sûre de toi, sans en faire trop."], "next": "n2"}}}, "n2": {"say": [["sam", "Next question. Why do you want to join this summer aviation camp in particular?", "Question suivante. Pourquoi veux-tu participer à ce stage d'été en particulier ?"], ["maya", "Ooh, that's a hard one. I'd have said it was because of the free snacks.", "Oh, elle est dure, celle-là. Moi, j'aurais dit que c'était pour les goûters gratuits."], ["sam", "Maya, you're not helping. Go on, Capucine.", "Maya, tu n'aides pas. Vas-y, Capucine."]], "ask": {"prompt": "Explique pourquoi tu veux participer à ce stage.", "options": [{"en": "Because I'd love to find out whether a career as a pilot is really the right fit for me.", "fr": "Parce que j'aimerais découvrir si une carrière de pilote est vraiment faite pour moi.", "ok": true, "next": "n3", "react": ["sam", "Mature answer. It shows you're thinking about the long term.", "Réponse mature. Ça montre que tu penses à long terme."]}, {"en": "I want to improve my aviation English and learn from experienced pilots like you.", "fr": "Je veux améliorer mon anglais aéronautique et apprendre auprès de pilotes expérimentés comme toi.", "ok": true, "next": "n3", "react": ["sam", "Flattery will get you everywhere! Just kidding, it's a strong reason.", "La flatterie, ça marche toujours ! Je plaisante, c'est une très bonne raison."]}, {"en": "My parents told me to apply, so here I am.", "fr": "Mes parents m'ont dit de postuler, alors me voilà.", "ok": false, "tip": "Même si c'est vrai, montre ta propre motivation ! Explique ce que ce stage t'apporterait, à toi."}], "open": {"model": ["I've been dreaming about this for years, and I think this camp would be the perfect first step.", "J'en rêve depuis des années, et je pense que ce stage serait la première étape idéale."], "react": ["sam", "You sound genuinely motivated, and that's exactly what the panel will be looking for.", "Tu as l'air sincèrement motivée, et c'est exactement ce que le jury recherchera."], "next": "n3"}}}, "n3": {"say": [["sam", "Now a teamwork question. Tell me about a time you worked with others to solve a problem.", "Maintenant, une question sur le travail d'équipe. Raconte-moi une fois où tu as travaillé avec d'autres pour résoudre un problème."], ["maya", "Say volleyball! Say volleyball!", "Dis le volley ! Dis le volley !"], ["sam", "Maya!", "Maya !"]], "ask": {"prompt": "Raconte une expérience de travail en équipe (tu peux utiliser le discours rapporté : our coach told us that...).", "options": [{"en": "In volleyball, our coach told us we had to communicate more, so we started calling every single ball.", "fr": "Au volley, notre coach nous a dit qu'on devait communiquer davantage, alors on a commencé à annoncer chaque ballon.", "ok": true, "next": "n4", "react": ["sam", "Great example. Clear situation, clear action, clear result.", "Excellent exemple. Situation claire, action claire, résultat clair."]}, {"en": "At the dance workshop, Maya and I created a choreography together, even though we disagreed at first.", "fr": "À l'atelier de danse, Maya et moi avons créé une chorégraphie ensemble, même si on n'était pas d'accord au début.", "ok": true, "next": "n4", "react": ["maya", "True story! And she was right about the opening, by the way.", "C'est vrai ! Et elle avait raison pour le début, d'ailleurs."]}, {"en": "I prefer working alone. Other people are annoying.", "fr": "Je préfère travailler seule. Les autres sont pénibles.", "ok": false, "tip": "Pas idéal pour un stage où l'on travaille en équipe ! Raconte plutôt un moment où tu as bien collaboré avec d'autres."}], "open": {"model": ["Once, for a school project, I suggested that we split the tasks, and it worked really well.", "Une fois, pour un projet d'école, j'ai proposé qu'on se répartisse les tâches, et ça a très bien marché."], "react": ["sam", "Nice. You took the initiative without being bossy. That's leadership.", "Bien. Tu as pris l'initiative sans être autoritaire. Ça, c'est du leadership."], "next": "n4"}}}, "n4": {"say": [["sam", "Here's a tricky one. What would you do if you realised you'd made a mistake during a flight?", "En voici une piège. Que ferais-tu si tu te rendais compte que tu as fait une erreur pendant un vol ?"], ["maya", "Oh no. Panic? Is panic an option?", "Oh non. Paniquer ? Paniquer, c'est une option ?"], ["sam", "Panic is definitely not an option. Capucine?", "Paniquer n'est absolument pas une option. Capucine ?"]], "ask": {"prompt": "Réponds à la question piège de Sam (I would...).", "options": [{"en": "I'd stay calm, tell my instructor straight away and follow the checklist.", "fr": "Je resterais calme, je préviendrais tout de suite mon instructeur et je suivrais la check-list.", "ok": true, "next": "n5", "react": ["sam", "Textbook answer. In aviation, being open about mistakes keeps everyone safe.", "Réponse parfaite. En aviation, parler de ses erreurs, c'est ce qui protège tout le monde."]}, {"en": "I'd admit it immediately. If you hid a mistake, things could get much worse.", "fr": "Je l'avouerais immédiatement. Si on cachait une erreur, les choses pourraient bien empirer.", "ok": true, "next": "n5", "react": ["sam", "Exactly right. Pilots are trained to speak up, not to cover up.", "Exactement. Les pilotes sont formés pour en parler, pas pour cacher."]}, {"en": "I'd keep quiet and hope nobody noticed.", "fr": "Je ne dirais rien en espérant que personne ne le remarque.", "ok": false, "tip": "En aviation, cacher une erreur, c'est dangereux ! Il faut toujours en parler à son instructeur."}], "open": {"model": ["I would tell my instructor immediately, because safety always comes first.", "Je le dirais immédiatement à mon instructeur, parce que la sécurité passe toujours en premier."], "react": ["sam", "Safety first, every time. You'd fit right in at the camp.", "La sécurité d'abord, toujours. Tu serais parfaitement à ta place au stage."], "next": "n5"}}}, "n5": {"say": [["sam", "Last question. Where do you see yourself in ten years' time?", "Dernière question. Où te vois-tu dans dix ans ?"], ["maya", "In the cockpit, obviously. With me as her favourite passenger.", "Dans le cockpit, évidemment. Avec moi comme passagère préférée."]], "ask": {"prompt": "Parle de ton avenir avec nuance (ideally..., I hope..., if everything goes to plan...).", "options": [{"en": "Ideally, I'd be training to become an airline pilot, or maybe already flying.", "fr": "Idéalement, je serais en formation pour devenir pilote de ligne, ou peut-être déjà en train de voler.", "ok": true, "next": "n6", "react": ["sam", "Ambitious but realistic. I'll be expecting a postcard from the cockpit.", "Ambitieux mais réaliste. J'attendrai une carte postale depuis le cockpit."]}, {"en": "I hope I'll be working in aviation, whether as a pilot or as an air traffic controller.", "fr": "J'espère que je travaillerai dans l'aviation, que ce soit comme pilote ou comme contrôleuse aérienne.", "ok": true, "next": "n6", "react": ["sam", "Keeping your options open. Very sensible, and air traffic control is a fantastic job.", "Tu gardes plusieurs portes ouvertes. Très raisonnable, et contrôleur aérien, c'est un métier formidable."]}, {"en": "In ten years, I was a pilot.", "fr": "Dans dix ans, j'étais pilote.", "ok": false, "tip": "Attention au temps ! Pour parler du futur, utilise « I'd like to be... » ou « I hope I'll be... »."}], "open": {"model": ["If everything goes to plan, I'll have my pilot's licence and I'll be flying all over the world.", "Si tout se passe comme prévu, j'aurai ma licence de pilote et je volerai partout dans le monde."], "react": ["maya", "And I'll be in the front row of the cabin, eating all the snacks!", "Et moi, je serai au premier rang de la cabine, à manger tous les goûters !"], "next": "n6"}}}, "n6": {"say": [["sam", "And that's a wrap! Overall, that was a really solid interview, Capucine.", "Et c'est terminé ! Dans l'ensemble, c'était un entretien vraiment solide, Capucine."], ["sam", "One tip, though: slow down a little when you're nervous. You rushed your first answer slightly.", "Un conseil, quand même : ralentis un peu quand tu es nerveuse. Tu as un peu précipité ta première réponse."], ["maya", "So did she pass? Did she pass? Tell us!", "Alors, elle a réussi ? Elle a réussi ? Dis-nous !"]], "ask": {"prompt": "Remercie Sam et réagis à son conseil.", "options": [{"en": "Thank you so much! I'll definitely work on speaking more slowly.", "fr": "Merci beaucoup ! Je vais vraiment travailler à parler plus lentement.", "ok": true, "next": "n7", "react": ["sam", "That's all it takes. Practise with a friend, and you'll be absolutely fine.", "C'est tout ce qu'il faut. Entraîne-toi avec une amie, et tout ira très bien."]}, {"en": "Thanks, Sam. Your feedback really helps. I feel much more confident now.", "fr": "Merci, Sam. Tes retours m'aident vraiment. Je me sens beaucoup plus sûre de moi maintenant.", "ok": true, "next": "n7", "react": ["sam", "That's the whole point of a practice run. Glad it helped.", "C'est tout l'intérêt d'un entraînement. Content que ça t'ait aidée."]}, {"en": "Whatever. I already know everything.", "fr": "Peu importe. Je sais déjà tout.", "ok": false, "tip": "Un peu arrogant ! Remercie Sam pour ses conseils, même si tu te sens prête."}], "open": {"model": ["Thanks for the advice! If I'd known you'd ask about mistakes, I'd have prepared that answer more.", "Merci pour le conseil ! Si j'avais su que tu parlerais des erreurs, j'aurais mieux préparé cette réponse."], "react": ["sam", "Ha! Well, now you know. That's what practice is for.", "Ha ! Eh bien, maintenant tu sais. C'est à ça que sert l'entraînement."], "next": "n7"}}}, "n7": {"say": [["sam", "Right, Maya, your turn. Good afternoon. Tell me a little about yourself.", "Bon, Maya, à toi. Bonjour. Parle-moi un peu de toi."], ["maya", "Hi! I'm Maya, I love volleyball, and I'm... very hungry. Sorry! Can we start again?", "Salut ! Je m'appelle Maya, j'adore le volley, et j'ai... très faim. Pardon ! On peut recommencer ?"], ["sam", "Ha ha! Take two. Off you go.", "Ha ha ! Deuxième prise. Vas-y."]], "end": true}}, "quiz": [{"q": "De quoi Maya plaisante-t-elle quand Sam demande pourquoi participer au stage ?", "opts": ["Des goûters gratuits", "Des uniformes", "Du simulateur"], "a": 0}, {"q": "Que dit Sam à propos de la panique ?", "opts": ["C'est normal en vol", "Ce n'est absolument pas une option", "C'est utile pendant les entretiens"], "a": 1}, {"q": "Quel conseil Sam te donne-t-il à la fin de ton entretien ?", "opts": ["Parler plus fort", "Sourire davantage", "Ralentir un peu quand tu es nerveuse"], "a": 2}]}, {"id": "s4-concert-review", "level": 4, "title": "Le concert d'hier soir", "setting": "cafe", "cast": ["liv", "maya"], "intro": "Hier soir, pendant l'atelier d'été, les parents de Maya vous ont emmenées à un concert pop en plein air. Ce matin, à la pause, vous racontez tout à Liv à la cafétéria de l'atelier, au milieu des autres élèves.", "start": "n1", "nodes": {"n1": {"say": [["liv", "Morning, you two! You look shattered. Late night?", "Bonjour, vous deux ! Vous avez l'air épuisées. Couchées tard ?"], ["maya", "The best late night ever! Mom and Dad took us to that outdoor concert.", "La meilleure soirée de ma vie ! Papa et maman nous ont emmenées au concert en plein air."], ["maya", "Capucine, tell Liv what it was like. I've lost my voice from screaming.", "Capucine, raconte à Liv comment c'était. Moi, j'ai perdu ma voix à force de crier."]], "ask": {"prompt": "Raconte à Liv comment était le concert.", "options": [{"en": "It was absolutely incredible. The atmosphere was electric from the very first song.", "fr": "C'était absolument incroyable. L'ambiance était électrique dès la première chanson.", "ok": true, "next": "n2", "react": ["liv", "Electric! Oh, I'm so jealous. There's nothing quite like a live gig.", "Électrique ! Oh, je suis trop jalouse. Rien ne vaut un vrai concert."]}, {"en": "Honestly, it blew my mind. I'd never been to such a big concert before.", "fr": "Franchement, ça m'a époustouflée. Je n'étais jamais allée à un concert aussi grand.", "ok": true, "next": "n2", "react": ["maya", "And by the end, she was doing all the crowd moves like a pro. Seriously!", "Et à la fin, elle faisait tous les gestes du public comme une pro. Sérieux !"]}, {"en": "It was so boring, so we danced and screamed all night.", "fr": "C'était tellement ennuyeux, alors on a dansé et crié toute la nuit.", "ok": false, "tip": "Ta phrase se contredit : si c'était ennuyeux, pourquoi danser toute la nuit ? Choisis une description cohérente."}], "open": {"model": ["It was one of the best nights of my life. The whole crowd was singing along the entire time.", "C'était l'une des meilleures soirées de ma vie. Tout le public chantait du début à la fin."], "react": ["liv", "Oh, I can just picture it. Goosebumps!", "Oh, je vois très bien la scène. J'en ai la chair de poule !"], "next": "n2"}}}, "n2": {"say": [["liv", "So here's my question. Was it better than listening to the album at home?", "Alors, ma question. C'était mieux que d'écouter l'album à la maison ?"], ["maya", "Way better! Although, to be fair, the singer's voice sounded quite different live.", "Bien mieux ! Même si, pour être honnête, la voix du chanteur était assez différente en live."], ["liv", "Interesting. Capucine, did you notice that too?", "Intéressant. Capucine, tu l'as remarqué aussi ?"]], "ask": {"prompt": "Compare la musique live et la version studio, avec nuance.", "options": [{"en": "Yes, it was rawer live, but I actually preferred it. It felt more genuine.", "fr": "Oui, c'était plus brut en live, mais en fait, j'ai préféré. Ça faisait plus authentique.", "ok": true, "next": "n3", "react": ["liv", "Rawer but more genuine. That's exactly why some people prefer live albums.", "Plus brut mais plus authentique. C'est exactement pour ça que certains préfèrent les albums live."]}, {"en": "A little. The studio version is more polished, but the live one had far more energy.", "fr": "Un peu. La version studio est plus soignée, mais celle en live avait bien plus d'énergie.", "ok": true, "next": "n3", "react": ["liv", "Polished versus energetic. That's the eternal debate, isn't it?", "Soigné contre énergique. C'est l'éternel débat, non ?"]}, {"en": "No, because I was asleep during the whole concert.", "fr": "Non, parce que j'ai dormi pendant tout le concert.", "ok": false, "tip": "Ça ne colle pas avec la soirée incroyable que tu viens de décrire ! Compare plutôt le son en live et la version studio."}], "open": {"model": ["In the studio, everything sounds perfect, whereas live, you can really feel the emotion.", "En studio, tout sonne parfaitement, alors qu'en live, on ressent vraiment l'émotion."], "react": ["liv", "Beautifully put. And whereas is a lovely word to use, by the way.", "Joliment dit. Et « whereas », c'est un très joli mot à utiliser, au passage."], "next": "n3"}}}, "n3": {"say": [["liv", "You know, in the studio, singers can record the same part twenty times and keep the best take.", "Tu sais, en studio, les chanteurs peuvent enregistrer le même passage vingt fois et garder la meilleure prise."], ["maya", "Wait, seriously? So the album is kind of a highlight reel?", "Attends, sérieux ? Donc l'album, c'est un peu un best-of ?"], ["liv", "Pretty much! That's why live shows are the real test.", "En gros, oui ! C'est pour ça que la scène, c'est le vrai test."], ["maya", "Capucine, if you were a singer, would you rather record in a studio or perform live?", "Capucine, si tu étais chanteuse, tu préférerais enregistrer en studio ou chanter en live ?"]], "ask": {"prompt": "Réponds à Maya avec « I'd rather... because... ».", "options": [{"en": "I'd rather perform live. If I made a mistake, the crowd's energy would carry me through.", "fr": "Je préférerais chanter en live. Si je faisais une erreur, l'énergie du public me porterait.", "ok": true, "next": "n4", "react": ["maya", "Brave! I'd be terrified of forgetting everything.", "Courageuse ! Moi, j'aurais une peur bleue de tout oublier."]}, {"en": "Probably the studio. I'd be far too nervous in front of thousands of people!", "fr": "Sans doute le studio. Je serais beaucoup trop stressée devant des milliers de personnes !", "ok": true, "next": "n4", "react": ["liv", "Totally understandable. Even very famous performers get stage fright, you know.", "Tout à fait compréhensible. Même les artistes très célèbres ont le trac, tu sais."]}, {"en": "I'd rather to be a plane.", "fr": "Je préférerais être un avion.", "ok": false, "tip": "Deux problèmes : après « I'd rather », pas de « to », et un avion ne chante pas ! Réponds sérieusement à la question."}], "open": {"model": ["I'd rather perform live, because sharing the moment with an audience must be amazing.", "Je préférerais chanter en live, parce que partager ce moment avec un public doit être génial."], "react": ["liv", "Spoken like a true performer. The stage is calling you!", "Voilà une vraie artiste qui parle. La scène t'appelle !"], "next": "n4"}}}, "n4": {"say": [["maya", "Oh, and the dancers! Liv, there were six dancers on stage, and they were unbelievable.", "Oh, et les danseurs ! Liv, il y avait six danseurs sur scène, et ils étaient incroyables."], ["liv", "Ooh, tell me more! What style was it? Capucine, you've got a good eye for this.", "Oh, raconte ! C'était quel style ? Capucine, toi, tu as l'œil pour ça."]], "ask": {"prompt": "Décris les danseurs et leur style à Liv.", "options": [{"en": "It was mostly contemporary, with a few hip hop moves. They were perfectly in sync.", "fr": "C'était surtout du contemporain, avec quelques mouvements de hip-hop. Ils étaient parfaitement synchronisés.", "ok": true, "next": "n5", "react": ["liv", "Contemporary with a hint of hip hop. My favourite combination, to be honest.", "Du contemporain avec une touche de hip-hop. Ma combinaison préférée, pour être honnête."]}, {"en": "They used the whole stage, and the lighting made every movement look dramatic.", "fr": "Ils occupaient toute la scène, et les lumières rendaient chaque mouvement spectaculaire.", "ok": true, "next": "n5", "react": ["liv", "Lighting makes a huge difference. Choreographers work very closely with lighting designers.", "Les lumières changent tout. Les chorégraphes travaillent main dans la main avec les éclairagistes."]}, {"en": "They had very nice shoes.", "fr": "Ils avaient de très jolies chaussures.", "ok": false, "tip": "Liv te demande le style de danse, pas les chaussures ! Parle des mouvements, du style, de l'énergie."}], "open": {"model": ["They were so energetic, and the choreography matched every change in the music.", "Ils avaient une énergie folle, et la chorégraphie suivait chaque changement de la musique."], "react": ["liv", "That's the mark of a great choreographer: you can actually see the music.", "C'est la marque d'un grand chorégraphe : on voit littéralement la musique."], "next": "n5"}}}, "n5": {"say": [["liv", "Right, I've got an idea. What if we used all this energy in today's class?", "Bon, j'ai une idée. Et si on utilisait toute cette énergie dans le cours d'aujourd'hui ?"], ["maya", "Like recreating the concert? Yes, please!", "Genre, recréer le concert ? Oh oui, s'il te plaît !"], ["liv", "Well, not copying their routine, but taking inspiration from the feeling. Capucine, what feeling should we capture?", "Enfin, pas copier leur chorégraphie, mais s'inspirer de l'émotion. Capucine, quelle émotion on devrait capter ?"]], "ask": {"prompt": "Propose à Liv une émotion à faire passer dans la danse.", "options": [{"en": "Pure joy! That moment when the whole crowd was jumping together.", "fr": "La joie pure ! Ce moment où tout le public sautait en même temps.", "ok": true, "next": "n6", "react": ["liv", "Pure joy. Oh, that's going to be a fun class!", "La joie pure. Oh, ce cours va être génial !"]}, {"en": "I'd say freedom, because everyone was dancing without worrying about anyone else.", "fr": "Je dirais la liberté, parce que tout le monde dansait sans se soucier des autres.", "ok": true, "next": "n6", "react": ["liv", "Freedom. Gorgeous. That's the spirit of modern dance in a single word.", "La liberté. Magnifique. C'est l'esprit de la danse moderne en un seul mot."]}, {"en": "Let's capture a fish.", "fr": "Attrapons un poisson.", "ok": false, "tip": "Ha ha ! Liv parle d'une émotion à capter (la joie, la liberté...), pas d'attraper un poisson !"}], "open": {"model": ["Let's capture the excitement just before the band came on stage.", "Captons l'excitation juste avant que le groupe monte sur scène."], "react": ["maya", "Ooh, the build-up! That was my favourite part!", "Oh, la montée en tension ! C'était mon moment préféré !"], "next": "n6"}}}, "n6": {"say": [["maya", "Liv, have you ever been to a show that changed your life?", "Liv, tu es déjà allée à un spectacle qui a changé ta vie ?"], ["liv", "Actually, yes. When I was your age, I saw a contemporary dance company perform in Manchester.", "En fait, oui. Quand j'avais votre âge, j'ai vu une compagnie de danse contemporaine à Manchester."], ["liv", "If I hadn't gone that night, I might never have become a dancer.", "Si je n'y étais pas allée ce soir-là, je ne serais peut-être jamais devenue danseuse."], ["maya", "Whoa, that's like a movie! Capucine, do you think last night might change your life too?", "Waouh, on dirait un film ! Capucine, tu crois que la soirée d'hier pourrait changer ta vie aussi ?"]], "ask": {"prompt": "Réponds à Maya, avec humour ou avec sincérité.", "options": [{"en": "Who knows? It's definitely made me want to perform on a big stage one day.", "fr": "Qui sait ? En tout cas, ça m'a vraiment donné envie de me produire sur une grande scène un jour.", "ok": true, "next": "n7", "react": ["liv", "Then we'd better get you ready for the end-of-workshop show!", "Alors il faut te préparer pour le spectacle de fin d'atelier !"]}, {"en": "Maybe! At the very least, it's changed my playlist forever.", "fr": "Peut-être ! Au minimum, ça a changé ma playlist pour toujours.", "ok": true, "next": "n7", "react": ["maya", "Ha! Same. I've listened to the album four times since breakfast.", "Ha ! Pareil. J'ai écouté l'album quatre fois depuis le petit-déjeuner."]}, {"en": "Yes, last night I have changed my life tomorrow.", "fr": "Oui, hier soir j'ai changé ma vie demain.", "ok": false, "tip": "Les temps sont tout mélangés ! Essaie « It might change my life » ou « It's made me want to... »."}], "open": {"model": ["I think so. It reminded me how powerful music can be when you share it with other people.", "Je crois, oui. Ça m'a rappelé à quel point la musique est forte quand on la partage avec d'autres."], "react": ["liv", "That gave me shivers. You've got the soul of a poet, Capucine.", "Ça m'a donné des frissons. Tu as une âme de poète, Capucine."], "next": "n7"}}}, "n7": {"say": [["liv", "Right, break's over! Into the studio, both of you.", "Bon, la pause est finie ! Au studio, toutes les deux."], ["maya", "Can we put the album on while we warm up? Please?", "On peut mettre l'album pendant l'échauffement ? S'il te plaît ?"], ["liv", "Go on, then. But if you scream like last night, the neighbours will complain!", "Allez, d'accord. Mais si vous criez comme hier soir, les voisins vont se plaindre !"]], "end": true}}, "quiz": [{"q": "Qui a emmené Maya et toi au concert ?", "opts": ["Liv", "Les parents de Maya", "Sam"], "a": 1}, {"q": "Selon Liv, que peuvent faire les chanteurs en studio ?", "opts": ["Enregistrer le même passage plusieurs fois et garder la meilleure prise", "Chanter sans micro", "Danser pendant l'enregistrement"], "a": 0}, {"q": "Combien de danseurs y avait-il sur scène ?", "opts": ["Quatre", "Dix", "Six"], "a": 2}]}, {"id": "s4-birthday-surprise", "level": 4, "title": "Une surprise pour Maya", "setting": "videocall", "cast": ["liv", "sam"], "intro": "La mère de Maya a demandé à tout le groupe de l'aider à préparer une surprise pour les seize ans de Maya. Elle organise la fête chez elle, avec la famille et l'équipe de volley. Appel vidéo de groupe avec Liv et Sam pour trouver des idées !", "start": "n1", "nodes": {"n1": {"say": [["liv", "Hello, Capucine! Thanks for joining. Sam's here too, all the way from a hotel in Singapore.", "Coucou, Capucine ! Merci d'être là. Sam est avec nous aussi, depuis un hôtel à Singapour."], ["sam", "Just landed, actually. So, Maya's mum has asked us all to help with the surprise. Where do we start?", "Je viens d'atterrir, en fait. Bon, la mère de Maya nous a demandé à tous de l'aider pour la surprise. Par où on commence ?"], ["liv", "Capucine, you know Maya best. What does she love more than anything?", "Capucine, c'est toi qui connais Maya le mieux. Qu'est-ce qu'elle aime plus que tout ?"]], "ask": {"prompt": "Dis à Liv et Sam ce que Maya adore, avec des détails.", "options": [{"en": "Volleyball, K-pop and her dog, though not necessarily in that order!", "fr": "Le volley, la K-pop et son chien, mais pas forcément dans cet ordre !", "ok": true, "next": "n2", "react": ["sam", "Ha! A ball, a playlist and a dog. Sounds like a great party already.", "Ha ! Un ballon, une playlist et un chien. Ça ressemble déjà à une super fête."]}, {"en": "She's crazy about K-pop, and she'd do anything for her volleyball team.", "fr": "Elle est folle de K-pop, et elle ferait n'importe quoi pour son équipe de volley.", "ok": true, "next": "n2", "react": ["liv", "So music and her teammates have to be part of it. Noted!", "Donc la musique et ses coéquipières doivent en faire partie. C'est noté !"]}, {"en": "She hates parties, so let's cancel everything.", "fr": "Elle déteste les fêtes, alors annulons tout.", "ok": false, "tip": "Ce n'est pas très constructif, et c'est faux : Maya adore faire la fête ! Parle plutôt de ce qu'elle aime."}], "open": {"model": ["She's obsessed with K-pop, she lives for volleyball, and she loves making people laugh.", "Elle est obsédée par la K-pop, elle ne vit que pour le volley, et elle adore faire rire les gens."], "react": ["liv", "Brilliant. That gives us loads to work with.", "Génial. Ça nous donne plein de matière."], "next": "n2"}}}, "n2": {"say": [["liv", "Right, let's brainstorm. No idea is too silly at this stage.", "Bon, on fait un brainstorming. À ce stade, aucune idée n'est trop bête."], ["sam", "I'll kick things off. What if we made a video full of birthday messages from everyone she knows?", "Je me lance. Et si on faisait une vidéo pleine de messages d'anniversaire de tous les gens qu'elle connaît ?"], ["liv", "Ooh, I like it. Capucine, what do you reckon? Would that work?", "Oh, j'aime bien. Capucine, tu en penses quoi ? Ça marcherait ?"]], "ask": {"prompt": "Réagis à l'idée de Sam et ajoute quelque chose.", "options": [{"en": "That's a brilliant idea! We could also ask her teammates to record something funny.", "fr": "C'est une idée géniale ! On pourrait aussi demander à ses coéquipières d'enregistrer un truc drôle.", "ok": true, "next": "n3", "react": ["sam", "Great addition. The more people involved, the bigger the surprise.", "Excellent ajout. Plus il y a de monde, plus la surprise est grande."]}, {"en": "I love it, but it might be even better if we added a short dance at the end.", "fr": "J'adore, mais ce serait encore mieux si on ajoutait une petite danse à la fin.", "ok": true, "next": "n3", "react": ["liv", "Now you're speaking my language! A dance finale, yes!", "Là, tu parles ma langue ! Un final dansé, oui !"]}, {"en": "Videos are for babies.", "fr": "Les vidéos, c'est pour les bébés.", "ok": false, "tip": "Un peu dur ! Dans un brainstorming, on reste positif : dis ce qui te plaît dans l'idée et ajoute une suggestion."}], "open": {"model": ["That would be lovely! If everyone recorded something different, it would be really fun to watch.", "Ce serait adorable ! Si chacun enregistrait quelque chose de différent, ce serait trop drôle à regarder."], "react": ["sam", "Exactly. Variety is the spice of life, as they say.", "Exactement. La variété, c'est le sel de la vie, comme on dit."], "next": "n3"}}}, "n3": {"say": [["liv", "Okay, the dance. I could teach a simple routine online to her teammates.", "Bon, la danse. Je pourrais apprendre une chorégraphie simple en ligne à ses coéquipières."], ["liv", "It'll have to be easy enough for volleyball players. No offence to volleyball players!", "Il faudra qu'elle soit assez facile pour des volleyeuses. Sans vouloir vexer les volleyeuses !"], ["sam", "And I'll do my bit too. How about a birthday announcement, as if I were the captain on her flight?", "Et moi aussi, je vais apporter ma pierre. Que diriez-vous d'une annonce d'anniversaire, comme si j'étais le commandant de bord de son vol ?"], ["liv", "Oh, that's hilarious. Capucine, how should Sam's announcement start?", "Oh, c'est hilarant. Capucine, comment devrait commencer l'annonce de Sam ?"]], "ask": {"prompt": "Aide Sam à écrire le début de son annonce de commandant de bord.", "options": [{"en": "Good afternoon, ladies and gentlemen, this is your captain speaking, with a very special announcement.", "fr": "Bonjour, mesdames et messieurs, ici votre commandant de bord, avec une annonce très spéciale.", "ok": true, "next": "n4", "react": ["sam", "Ha! Perfect. I've said that line thousands of times, but never for a birthday.", "Ha ! Parfait. J'ai dit cette phrase des milliers de fois, mais jamais pour un anniversaire."]}, {"en": "Attention, passengers! We are now cruising at sixteen years old and still climbing!", "fr": "Votre attention, chers passagers ! Nous sommes en croisière à seize ans et nous continuons de monter !", "ok": true, "next": "n4", "react": ["liv", "Cruising at sixteen! Oh, I love that, it's so clever.", "En croisière à seize ans ! Oh, j'adore, c'est trop malin."]}, {"en": "Hello, I'm Sam, I'm forty-one and I like sandwiches.", "fr": "Bonjour, je suis Sam, j'ai quarante et un ans et j'aime les sandwichs.", "ok": false, "tip": "Ce n'est pas une annonce de commandant de bord ! Pense aux phrases qu'on entend dans l'avion : « This is your captain speaking... »."}], "open": {"model": ["Ladies and gentlemen, this is your captain speaking. Please fasten your seatbelts for Maya's birthday!", "Mesdames et messieurs, ici votre commandant de bord. Veuillez attacher vos ceintures pour l'anniversaire de Maya !"], "react": ["sam", "Fasten your seatbelts. Oh, she's going to love this.", "Attachez v const NUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','20':'twenty','30':'thirty','50':'fifty','100':'one hundred'};
const CONTR={"i'm":"i am","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not","couldn't":"could not","shouldn't":"should not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","it's":"it is","that's":"that is","what's":"what is","there's":"there is","here's":"here is","who's":"who is","let's":"let us","i'll":"i will","you'll":"you will","we'll":"we will","they'll":"they will","she'll":"she will","he'll":"he will","i'd":"i would","you'd":"you would","we'd":"we would","i've":"i have","you've":"you have","we've":"we have","they've":"they have","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","ok":"okay","mr":"mister","mrs":"missus"};
function toks(s){
  return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:"()«»…]/g,' ').split(/\s+/).filter(Boolean)
    .flatMap(w=>(CONTR[w]||NUMW[w]||w).split(' ')).map(w=>w.replace(/'s$/,'').replace(/'/g,''));
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkTyped(ans,accepted){
  const a=toks(ans).join(' ');if(!a)return {ok:false};
  let bestD=1e9,bestT='';
  accepted.forEach(t=>{const b=toks(t).join(' ');const d=lev(a,b);if(d<bestD){bestD=d;bestT=t}});
  const L=toks(bestT).join(' ').length;
  if(bestD===0)return {ok:true,exact:true};
  if(bestD<=Math.max(1,Math.floor(L/14)))return {ok:true,typo:true,target:bestT};
  return {ok:false,target:accepted[0]};
}
function similarity(said,target){
  const a=toks(said),b=toks(target);if(!b.length||!a.length)return 0;
  const bag={};a.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;
  b.forEach(w=>{if(bag[w]){hit++;bag[w]--}else if(w.length>3&&Object.keys(bag).some(x=>bag[x]>0&&lev(x,w)<=1)){hit+=.8}});
  return hit/Math.max(b.length,a.length*0.85);
}
const best=(alts,target)=>alts.reduce((m,a)=>{const s=similarity(a,target);return s>m.s?{s,a}:m},{s:0,a:alts[0]||''});

    const pickV=cands.find(x=>langOf(x.v)===want&&gre.test(x.v.name))||cands.find(x=>langOf(x.v)===want)||cands.find(x=>gre.test(x.v.name))||cands[0]||VOICES[0];
    p.voice=pickV.v;used.add(pickV.v.name);

function slowChunks(text){
  const out=[];text.split(/(?<=[,.;:!?])\s+/).forEach(cl=>{const w=cl.split(/\s+/).filter(Boolean);const n=w.length<=4?1:w.length<=8?2:3;for(let i=0;i<w.length;i+=n)out.push(w.slice(i,i+n).join(' '))});
  return out.length?out:[text];
}
function levelRate(){const n=(route==='scene'&&P)?P.sc.level:S.level;return [0,.82,.9,.96,1][n]||.9}
/* speak(text,{slow,who,onstart,onend}) : robuste sur Android (attente après cancel, découpage lent, chien de garde) */
function speak(text,o={}){
  const tok=++speakToken;
  if(!('speechSynthesis' in window)){toast('Cet appareil ne peut pas lire le texte à voix haute.');setTimeout(()=>o.onend&&o.onend(),600);return}
  try{speechSynthesis.cancel()}catch(e){}
  const parts=o.slow?slowChunks(text):[text];const prof=o.who?AV[o.who]:null;let i=0;
  const step=()=>{
    if(tok!==speakToken)return;
    if(i>=parts.length){o.onend&&o.onend();return}
    const t=parts[i++];let done=false,wd;
    const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(tok!==speakToken)return;setTimeout(step,o.slow?380:20)};
    try{
      const u=new SpeechSynthesisUtterance(t);
      const v=prof?prof.voice:VOICE;if(v){u.voice=v;u.lang=v.lang}else u.lang=prof?prof.lang:'en-US';
      const base=(Number(S.settings.rate)||1)*(prof?prof.rate:1)*levelRate();
      u.rate=Math.max(.5,Math.min(1.4,o.slow?base*.82:base));u.pitch=prof?(prof.pitchUse||prof.pitch):1;
      u.onstart=()=>{o.onstart&&o.onstart(t)};u.onend=fin;u.onerror=fin;
      wd=setTimeout(fin,2600+t.length*120/u.rate);
      try{speechSynthesis.resume()}catch(e){}
      speechSynthesis.speak(u);
    }catch(e){wd=setTimeout(fin,600)}
  };
  setTimeout(step,120);
}
function hush(){speakToken++;try{speechSynthesis.cancel()}catch(e){}stopAllTalk()}

   Microphone (reconnaissance vocale) avec diagnostic
   ========================================================= */
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
const isSamsungBrowser=/SamsungBrowser/i.test(navigator.userAgent);
let micDenied=false,micBusy=false,recog=null;
function micState(){
  if(!SRClass)return isSamsungBrowser?'samsung':'unsupported';
  if(/^(file|content):/.test(location.protocol))return 'file';
  if(window.isSecureContext===false)return 'insecure';
  if(micDenied)return 'denied';
  return 'ok';
}
const MIC_MSG={
 samsung:'Le navigateur Samsung Internet ne sait pas écouter la voix. Ouvre l\'application avec Google Chrome pour utiliser le micro.',
 unsupported:'Ce navigateur ne sait pas écouter la voix. Utilise Google Chrome.',
 file:'L\'application est ouverte comme un simple fichier : le micro ne peut pas fonctionner ainsi. Ouvre-la depuis son adresse Internet (https://…) puis installe-la.',
 insecure:'Le micro ne fonctionne que sur une adresse sécurisée (https://).',
 denied:'Le micro est bloqué. Dans Chrome, touche le cadenas à côté de l\'adresse, puis Autorisations, puis Micro : Autoriser.',
 ok:'Le micro est prêt.'
};
const micOK=()=>micState()==='ok';
/* listen(onFinal, {onInterim}) : affiche le texte en direct, s'arrête seul après un silence */
function listen(onFinal,opt={}){
  const st=micState();if(st!=='ok'){toast(MIC_MSG[st],6000);return}
  if(micBusy){try{recog.stop()}catch(e){}return}
  hush();
  setTimeout(()=>{
    try{
      recog=new SRClass();recog.lang='en-US';recog.interimResults=true;recog.continuous=false;recog.maxAlternatives=5;
      let finals=[],interim='',gotFinal=false,errored=false;
      recog.onresult=e=>{
        interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
          if(r.isFinal){gotFinal=true;const alts=[];for(let j=0;j<r.length;j++)alts.push(r[j].transcript.trim());finals.push(alts)}
          else interim+=r[0].transcript}
        const live=finals.map(a=>a[0]).join(' ')+' '+interim;opt.onInterim&&opt.onInterim(live.trim());
      };
      recog.onerror=e=>{errored=true;
        if(e.error==='not-allowed'||e.error==='service-not-allowed'){micDenied=true;toast(MIC_MSG.denied,7000)}
        else if(e.error==='no-speech')toast('Je n\'ai rien entendu. Touche le micro, attends le signal, puis parle.');
        else if(e.error==='network')toast('L\'écoute de la voix a besoin d\'Internet. Vérifie le Wi-Fi.');
        else if(e.error==='audio-capture')toast('Le micro de l\'appareil n\'est pas disponible. Ferme les autres applications qui l\'utilisent.');
      };
      recog.onend=()=>{
        micBusy=false;document.querySelectorAll('.mic').forEach(m=>m.classList.remove('on'));opt.onEnd&&opt.onEnd();
        let alts=[];
        if(finals.length){const first=finals.map(a=>a[0]).join(' ');alts=[first];if(finals.length===1)alts=finals[0]}
        else if(interim.trim())alts=[interim.trim()];
        if(alts.length)onFinal(alts);else if(!errored)toast('Je n\'ai rien entendu. Réessaie en parlant un peu plus fort.');
      };
      recog.start();micBusy=true;document.querySelectorAll('.mic').forEach(m=>m.classList.add('on'));opt.onStart&&opt.onStart();
    }catch(e){micBusy=false;toast('Le micro n\'a pas pu démarrer. Réessaie dans un instant.')}
  },250);
}

/* =========================================================
   Moteur de leçons
   ========================================================= */
const TYPES={
 p:{1:['en2fr','fr2en','listen','build','speak'],2:['fr2en','listen','listenfr','build','type','dictation','speak'],3:['listenfr','build','type','dictation','speak','type'],4:['listenfr','type','dictation','speak','build','type']},
 w:{1:['pic2word','listen2pic','word2pic','sayword'],2:['pic2word','listen2pic','typeword','sayword','word2pic'],3:['typeword','listen2pic','sayword','wordfr'],4:['typeword','wordfr','sayword','listen2pic']},
 g:{1:['fill'],2:['fill'],3:['fill','filltype'],4:['fill','filltype']}
};
const words=s=>s.replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean);
const weakFirst=list=>shuffle(list).sort((a,b)=>(seen(a)?strength(a):-1)-(seen(b)?strength(b):-1));
function exFor(it,n,exam){
  let t=shuffle(TYPES[it.kind][it.lv]);
  if(it.kind==='p'&&words(it.en).length>11)t=t.filter(x=>x!=='build');
  if(exam)t=t.filter(x=>!['speak','sayword'].includes(x));
  t=[...new Set(t)];
  return t.slice(0,n).map(x=>mkQ(x,it));
}
const intro=it=>({type:it.kind==='w'?'wintro':'intro',it});
function startLesson(spec){
  let q=[],label='',back='home';
  const [kind,id]=spec.split(':');
  if(kind==='daily'){
    label='Séance du jour';const n=S.level;
    const due=dueList().slice(0,6);
    const newP=weakFirst(byLv(n).filter(i=>i.kind==='p'&&!seen(i))).slice(0,2);
    const newW=weakFirst(byLv(n).filter(i=>i.kind==='w'&&!seen(i))).slice(0,3);
    const g=weakFirst(byLv(n).filter(i=>i.kind==='g')).slice(0,2);
    let pool=[...due,...newP,...newW];if(pool.length<5)pool=pool.concat(weakFirst(byLv(n).filter(i=>i.kind!=='g')).slice(0,6-pool.length));
    q=[...[...newP,...newW].map(intro),...shuffle([...pool.flatMap(i=>exFor(i,!seen(i)||strength(i)<2?2:1)),...g.flatMap(i=>exFor(i,1))])];
    const ws=newW.length>=3?newW:pool.filter(i=>i.kind==='w');if(ws.length>=3)q.push(mkPairs(ws.slice(0,4)));
  }else if(kind==='t'){const t=DB.themes.find(x=>x.id===id);label=t.title;back='theme:'+id;
    const ch=weakFirst(pItems(t)).slice(0,5);q=[...ch.filter(i=>!seen(i)).map(intro),...shuffle(ch.flatMap(i=>exFor(i,2)))];}
  else if(kind==='v'){const v=DB.vocab.find(x=>x.id===id);label=v.title;back='vset:'+id;
    const ch=weakFirst(wItems(v)).slice(0,5);q=[...ch.filter(i=>!seen(i)).map(intro),...shuffle(ch.flatMap(i=>exFor(i,2))),mkPairs(ch.slice(0,4))];}
  else if(kind==='g2'){const v=DB.vocab.find(x=>x.id===id);label='Jeu des paires · '+v.title;back='vset:'+id;
    const a=shuffle(wItems(v));q=[mkPairs(a.slice(0,4)),mkPairs(a.slice(4,8)),mkPairs(a.slice(8,12).length>=3?a.slice(8,12):a.slice(0,4))];}
  else if(kind==='gr'){const g=DB.grammar.find(x=>x.id===id);label=g.title;back='gram:'+id;q=gItems(g).map(i=>mkQ(pick(TYPES.g[i.lv]),i));}
  else if(kind==='review'){label='Révision';back='review';
    let pool=dueList();if(pool.length<6)pool=pool.concat(ALL.filter(i=>seen(i)&&!pool.includes(i)).sort((a,b)=>strength(a)-strength(b)));
    if(pool.length<4)pool=pool.concat(weakFirst(byLv(S.level)).slice(0,6));
    pool=pool.slice(0,10);q=shuffle(pool.flatMap(i=>exFor(i,1)));const ws=pool.filter(i=>i.kind==='w');if(ws.length>=3)q.push(mkPairs(ws.slice(0,4)));}
  else if(kind==='exam'){const n=+id;label='Examen du niveau '+n;back='learn';
    const l=byLv(n);const ps=shuffle(l.filter(i=>i.kind==='p')).slice(0,8),ws=shuffle(l.filter(i=>i.kind==='w')).slice(0,7),gs=shuffle(l.filter(i=>i.kind==='g')).slice(0,5);
    q=shuffle([...ps,...ws,...gs].flatMap(i=>exFor(i,1,true)));}
  L={spec,label,back,q,i:0,ok:0,tot:0,sel:null,checked:false,res:null,built:[],exam:kind==='exam',lv:kind==='exam'?+id:null,typed:''};
  go('lesson');
}
function mkQ(type,it){
  const others=shuffle(srcItems(it).filter(x=>x.k!==it.k&&x.en!==it.en));
  const q={type,it};
  const nOpt=type==='listen'?3:4;
  if(['en2fr','fr2en','listen','listenfr','pic2word','listen2pic','word2pic','wordfr'].includes(type))q.opts=shuffle([it,...others.slice(0,nOpt-1)]).map(x=>({x,ok:x.k===it.k}));
  if(type==='fill')q.opts=shuffle(it.opts).map(t=>({t,ok:t===it.a}));
  if(type==='build'){const own=words(it.en).map(w=>w.toLowerCase());const nd=[0,2,3,4,4][it.lv];const extra=shuffle([...new Set(words(others.map(o=>o.en).join(' ')))].filter(w=>!own.includes(w.toLowerCase()))).slice(0,nd);q.tiles=shuffle([...words(it.en),...extra])}
  if(type==='speak'||type==='sayword'){q.stage=0;q.tries=0;q.heard=''}
  return q;
}
function mkPairs(list){const set=list.slice(0,4);return {type:'pairs',it:set[0],set,left:shuffle(set),right:shuffle(set),done:new Set(),selL:null,selR:null,miss:0,flash:null}}

   case 'sayword':body=`<p class="qtitle">Dis ce mot en anglais</p><div class="prompt center">${vis(it,'xl')}${q.stage?`<div class="big">${esc(it.en)}</div>`:`<div class="frtxt">${fr(it.fr)}</div>`}${q.stage||q.tries>1?`<div class="row" style="justify-content:center">${sayBtns(it.en)}</div>`:''}</div>${!q.stage&&!L.checked?micBlock():''}`;break;
   case 'fill':body=`<p class="qtitle">Complète la phrase</p><div class="prompt"><div class="big">${gapped(it)}</div><div class="frtxt">${fr(it.fr)}</div></div>${opts('t')}`;break;
   case 'filltype':body=`<p class="qtitle">Écris le mot qui manque</p><div class="prompt"><div class="big">${gapped(it)}</div><div class="frtxt">${fr(it.fr)}</div></div>${input('Le mot qui manque')}`;break;
   case 'pairs':body=`<p class="qtitle">Relie chaque image à son mot</p><div class="pairs">
     <div class="col">${q.left.map((x,n)=>`<button class="opt ${q.done.has(x.k)?'done':''} ${q.flash&&q.flash.l===n?'wrong':''}" data-pl="${n}" aria-pressed="${q.selL===n}" ${q.done.has(x.k)?'disabled':''}>${vis(x,'md')}</button>`).join('')}</div>
     <div class="col">${q.right.map((x,n)=>`<button class="opt ${q.done.has(x.k)?'done':''} ${q.flash&&q.flash.r===n?'wrong':''}" data-pr="${n}" aria-pressed="${q.selR===n}" ${q.done.has(x.k)?'disabled':''}><b>${esc(x.en)}</b></button>`).join('')}</div></div>`;break;
  }
  $('#view').innerHTML=`<div class="narrow"><div class="lhead"><button class="quit" data-quit>Quitter</button><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${L.exam?`<span class="hint" style="font-variant-numeric:tabular-nums">${Math.min(L.i+1,L.q.length)}/${L.q.length}</span>`:''}</div>${body}</div>${foot(q)}`;
  if(!L.checked&&!q.played&&['intro','wintro','listen','listenfr','listen2pic','dictation'].includes(q.type)){q.played=true;setTimeout(()=>speak(it.en),250)}
  const a=$('#ans');if(a&&!L.checked)setTimeout(()=>a.focus(),50);
}
function foot(q){
  let inner;const typed=['type','dictation','typeword','filltype'].includes(q.type);
  if(q.type==='intro'||q.type==='wintro')inner=`<button class="btn block" data-next>Continuer</button>`;
  else if(q.type==='pairs')inner=q.done.size===q.set.length?`<button class="btn block" data-pairsdone>Toutes les paires sont trouvées ! Continuer</button>`:`<p class="hint center">${q.done.size} / ${q.set.length} paires · touche une image, puis son mot</p>`;
  else if((q.type==='speak'||q.type==='sayword')&&!L.checked)inner=q.stage?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" data-self="0">À revoir</button><button class="btn" data-self="1">Je l'ai bien dit</button></div>`:`<button class="btn block ghost" data-reveal>${micOK()?'Je ne peux pas parler maintenant : voir la réponse':'Voir la réponse'}</button>`;
  else if(!L.checked){const can=typed?true:q.type==='build'?L.built.length>0:L.sel!==null;inner=`<div class="row" style="flex-wrap:nowrap">${typed?`<button class="btn ghost" data-skip>Je ne sais pas</button>`:''}<button class="btn block" data-check ${can?'':'disabled'} style="flex:1">Vérifier</button></div>`}
  else{const good=L.res;const it=q.it;const sentence=it.kind==='g'?it.en:it.en;
    inner=`<div class="fb">${it.vis?vis(it,'md'):'<span></span>'}<div><strong>${good?(L.typo?'Juste ! Attention à l\'orthographe.':pick(['Très bien !','Parfait !','Bravo !','Excellent !'])):'Pas tout à fait.'}</strong>${!good&&L.typed?`<span>Ta réponse : ${esc(L.typed)}</span>`:''}<span class="en">${esc(sentence)}</span><span class="frtxt">${fr(it.fr)}</span><div class="row"><button class="say" data-say="${esc(sentence)}">${svg('speaker')}Écouter</button><button class="say slow" data-say="${esc(sentence)}" data-slow="1">Lentement</button></div></div></div><button class="btn block" data-next>Continuer</button>`;
    return `<div class="lfoot ${good?'good':'bad'}"><div class="wrap narrow">${inner}</div></div>`}
  return `<div class="lfoot"><div class="wrap narrow">${inner}</div></div>`;
}
function grade(good,typo){
  const q=L.q[L.i];L.checked=true;L.res=good;L.typo=!!typo;
  if(!q.retry){L.tot++;if(good)L.ok++}
  if(q.it.kind)rate(q.it,good);
  if(!good&&!q.retry&&!L.exam)L.q.push({...mkQ(q.type,q.it),retry:true});
  chime(good);if(!L.exam||true)setTimeout(()=>speak(q.it.en),good?380:650);
  renderLesson();
}
function check(){
  const q=L.q[L.i];const it=q.it;
  if(['type','dictation','typeword','filltype'].includes(q.type)){
    const a=$('#ans');L.typed=a?a.value:'';
    const acc=q.type==='filltype'?[it.a]:q.type==='dictation'||q.type==='typeword'?[it.en]:[it.en,...(it.alts||[])];
    if(q.type==='typeword'&&/^to /.test(it.en))acc.push(it.en.slice(3));
    const r=checkTyped(L.typed,acc);grade(r.ok,r.typo);return;
  }
  if(q.type==='build')return grade(toks(L.built.map(i=>q.tiles[i]).join(' ')).join(' ')===toks(it.en).join(' '));
  grade(q.opts[L.sel].ok);
}
function next(){
  const q=L.q[L.i];if(q.type==='intro'||q.type==='wintro')touchNew(q.it);
  L.i++;L.sel=null;L.checked=false;L.res=null;L.built=[];L.typed='';L.typo=false;hush();
  if(L.i>=L.q.length)finishLesson();else{renderLesson();window.scrollTo({top:0})}
}
function finishLesson(){
  L.xp=10+L.ok*2;
  if(L.exam){const sc=L.ok;S.exams[L.lv]=Math.max(S.exams[L.lv]||0,sc);L.passed=sc>=16;
    if(L.passed){const first=!S.cert[L.lv];S.cert[L.lv]=Date.now();L.xp+=50;if(first&&S.level===L.lv&&L.lv<4){S.level=L.lv+1;L.levelUp=true}}save()}
  addXP(L.xp);go('lessonDone');
}
function onSpoken(alts){
  const q=L.q[L.i];const b=best(alts,q.it.en);q.heard=b.a;q.tries++;
  const th=[0,.62,.7,.76,.8][q.it.lv]||.7;
  const pass=q.type==='sayword'?(b.s>=.99||alts.some(a=>(' '+toks(a).join(' ')+' ').includes(' '+toks(q.it.en).join(' ')+' '))):b.s>=th;
  if(pass)grade(true);
  else{chime(false);if(q.tries>=2)speak(q.it.en,{slow:true});renderLesson();toast(q.tries>=2?'Écoute le modèle et réessaie.':'Presque ! Réessaie.')}
}
function pairTap(side,n){
  const q=L.q[L.i];q.flash=null;
  if(side==='l')q.selL=n;else{q.selR=n;speak(q.right[n].en)}
  if(q.selL!==null&&q.selR!==null){const a=q.left[q.selL],b=q.right[q.selR];
    if(a.k===b.k){q.done.add(a.k);chime(true);if(side==='l')speak(a.en)}else{q.miss++;chime(false);q.flash={l:q.selL,r:q.selR}}
    q.selL=null;q.selR=null}
  renderLesson();
}
function renderDone(){
  const pct=L.tot?Math.round(L.ok/L.tot*100):100;
  let title='Bravo Capucine !',msg=pct===100?'Un sans-faute, bravo !':pct>=70?'Très beau travail.':'Chaque essai te fait progresser.';
  if(L.exam){title=L.passed?'Certificat obtenu !':'Encore un petit effort';msg=L.passed?`Tu as réussi l'examen du niveau ${L.lv} avec ${L.ok}/20.${L.levelUp?` Tu passes au niveau ${L.lv+1} !`:''}`:`Tu as obtenu ${L.ok}/20. Il en faut 16. Révise un peu, puis réessaie : tu y es presque.`}
