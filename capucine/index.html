 a gagné ! « Maybe next year » sert à consoler après une défaite. Félicite-la plutôt."}], "open": {"model": ["Congratulations, Maya! You played so well today!", "Félicitations, Maya ! Tu as super bien joué aujourd'hui !"], "react": ["maya", "Aww, thanks! I'm so happy you were here!", "Oh, merci ! Je suis trop contente que tu sois venue !"], "next": "n8"}}}, "n8": {"say": [["liv", "Well done, Maya! And my dancers were brilliant too!", "Bravo, Maya ! Et mes danseuses ont été géniales aussi !"], ["maya", "Let's celebrate with the team! Hot chocolate for everyone?", "On fête ça avec l'équipe ! Chocolat chaud pour tout le monde ?"]], "ask": {"prompt": "Réponds à l'invitation de Maya.", "options": [{"en": "Yes, please! That's a great idea!", "fr": "Oui, avec plaisir ! C'est une super idée !", "ok": true, "next": "n9", "react": ["maya", "Awesome! Let's go!", "Génial ! On y va !"]}, {"en": "Of course! But first, a photo with the champions!", "fr": "Bien sûr ! Mais d'abord, une photo avec les championnes !", "ok": true, "next": "n9", "react": ["maya", "Ha ha! Okay, team photo! Everyone, smile!", "Ha ha ! D'accord, photo d'équipe ! Tout le monde sourit !"]}, {"en": "No, thanks. I'm going to watch the final now.", "fr": "Non, merci. Je vais regarder la finale maintenant.", "ok": false, "tip": "La finale est déjà terminée ! Accepte l'invitation de Maya pour fêter la victoire."}]}}, "n9": {"say": [["liv", "What a day! Congratulations, champions!", "Quelle journée ! Félicitations, les championnes !"], ["maya", "Best day ever! Come on, Capucine!", "Meilleure journée de ma vie ! Viens, Capucine !"]], "end": true}}, "quiz": [{"q": "Que s'est-il passé en finale l'année dernière ?", "opts": ["L'équipe de Maya a perdu", "L'équipe de Maya a gagné", "Le match a été annulé"], "a": 0}, {"q": "Quel est le score du premier set ?", "opts": ["Vingt-cinq à vingt-deux", "Vingt-cinq à vingt", "Quinze à treize"], "a": 1}, {"q": "Que font les élèves de Liv pendant la pause ?", "opts": ["Elles chantent", "Elles jouent au volley", "Elles dansent"], "a": 2}]}, {"id": "s2-exchange-plan", "level": 2, "title": "On prépare l'échange", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "Appel vidéo en groupe pour préparer ton séjour d'échange chez Maya, à Burlington. Liv et Sam sont là aussi, avec plein de conseils !", "start": "n1", "nodes": {"n1": {"say": [["maya", "Capucine! Guess what? My mom said yes! You're coming to Burlington in October!", "Capucine ! Devine quoi ? Ma mère a dit oui ! Tu viens à Burlington en octobre !"], ["liv", "Oh, how exciting! Congratulations, you two!", "Oh, comme c'est excitant ! Félicitations, toutes les deux !"]], "ask": {"prompt": "Réagis à la bonne nouvelle.", "options": [{"en": "No way! I'm so excited!", "fr": "Pas possible ! Je suis trop impatiente !", "ok": true, "next": "n2", "react": ["maya", "Me too! I can't stop smiling!", "Moi aussi ! Je n'arrête pas de sourire !"]}, {"en": "That's amazing! I'm going to visit America!", "fr": "C'est génial ! Je vais visiter l'Amérique !", "ok": true, "next": "n2", "react": ["sam", "Good on you, Capucine! What an adventure!", "Bravo, Capucine ! Quelle aventure !"]}, {"en": "Oh no. That's really sad.", "fr": "Oh non. C'est vraiment triste.", "ok": false, "tip": "C'est une super nouvelle ! Montre ta joie avec « That's amazing! » ou « I'm so excited! »."}], "open": {"model": ["Really? That's the best news ever!", "C'est vrai ? C'est la meilleure nouvelle du monde !"], "react": ["maya", "I know, right? It's going to be epic!", "Trop bien, hein ? Ça va être génial !"], "next": "n2"}}}, "n2": {"say": [["maya", "So, what are we going to do? I've got a list!", "Alors, qu'est-ce qu'on va faire ? J'ai une liste !"], ["maya", "What do you want to do in Burlington, Capucine?", "Qu'est-ce que tu veux faire à Burlington, Capucine ?"]], "ask": {"prompt": "Dis à Maya ce que tu as envie de faire là-bas.", "options": [{"en": "I'm going to play volleyball with your team!", "fr": "Je vais jouer au volley avec ton équipe !", "ok": true, "next": "n3v", "react": ["maya", "Yes! Bring your knee pads!", "Oui ! Apporte tes genouillères !"]}, {"en": "I want to see a real American high school!", "fr": "Je veux voir un vrai lycée américain !", "ok": true, "next": "n3s", "react": ["maya", "Easy! You can come to my classes. Some are kind of boring. Ha ha!", "Facile ! Tu peux venir à mes cours. Certains sont un peu ennuyeux. Ha ha !"]}, {"en": "I'm going to stay in my room all day.", "fr": "Je vais rester dans ma chambre toute la journée.", "ok": false, "tip": "Maya veut organiser des activités avec toi ! Propose quelque chose d'amusant à faire ensemble."}], "open": {"model": ["I'd love to go to your school and watch a volleyball match!", "J'adorerais aller dans ton lycée et voir un match de volley !"], "react": ["maya", "Done! You're going to love our gym!", "C'est noté ! Tu vas adorer notre gymnase !"], "next": "n3v"}}}, "n3v": {"say": [["maya", "We practice every Tuesday and Thursday. Coach says you can play with us!", "On s'entraîne tous les mardis et jeudis. La coach dit que tu peux jouer avec nous !"]], "next": "n4"}, "n3s": {"say": [["maya", "And after school, we can walk by the lake. Lake Champlain is so pretty in October!", "Et après les cours, on peut se balader au bord du lac. Le lac Champlain est trop beau en octobre !"]], "next": "n4"}, "n4": {"say": [["liv", "Capucine, don't forget your dance shoes! You two can do my online class from Maya's house.", "Capucine, n'oublie pas tes chaussons de danse ! Vous pourrez suivre mon cours en ligne chez Maya, toutes les deux."], ["maya", "A dance class in my living room! My dog is going to be so confused!", "Un cours de danse dans mon salon ! Mon chien va être complètement perdu !"]], "ask": {"prompt": "Réponds à Liv.", "options": [{"en": "Great idea! I'm going to pack my dance shoes.", "fr": "Super idée ! Je vais mettre mes chaussons dans ma valise.", "ok": true, "next": "n5", "react": ["liv", "Perfect! And comfy clothes too!", "Parfait ! Et des vêtements confortables aussi !"]}, {"en": "Yes! Maya, can your dog dance too?", "fr": "Oui ! Maya, ton chien sait danser aussi ?", "ok": true, "next": "n5", "react": ["maya", "Ha ha! He can only spin in circles!", "Ha ha ! Il sait seulement tourner en rond !"]}, {"en": "No, thanks. I hate dancing.", "fr": "Non, merci. Je déteste danser.", "ok": false, "tip": "Toi qui adores danser ? Ce n'est pas très gentil pour Liv. Accepte son idée avec enthousiasme !"}]}}, "n5": {"say": [["sam", "And you're flying there, of course! Is it your first long flight?", "Et tu y vas en avion, bien sûr ! C'est ton premier long vol ?"]], "ask": {"prompt": "Réponds à Sam.", "options": [{"en": "Yes, it is! I'm a bit nervous.", "fr": "Oui ! Je stresse un peu.", "ok": true, "next": "n6n", "react": ["sam", "That's normal. Flying is very safe, and the crew is there to help.", "C'est normal. L'avion est très sûr, et l'équipage est là pour t'aider."]}, {"en": "No, but it's my first flight to America!", "fr": "Non, mais c'est mon premier vol pour l'Amérique !", "ok": true, "next": "n6e", "react": ["sam", "Then you're going to love it. Ask for a window seat!", "Alors tu vas adorer. Demande une place côté hublot !"]}, {"en": "Yes, I'm going to drive the plane.", "fr": "Oui, je vais conduire l'avion.", "ok": false, "tip": "On ne « drive » pas un avion, on le « fly » ! Et ici, Sam te demande si c'est ton premier long vol."}], "open": {"model": ["Yes, it is! Can you give me some advice?", "Oui ! Tu peux me donner des conseils ?"], "react": ["sam", "Of course! That's my job, after all.", "Bien sûr ! C'est mon métier, après tout."], "next": "n6e"}}}, "n6n": {"say": [["sam", "Tip number one: drink lots of water. The air in the cabin is very dry.", "Premier conseil : bois beaucoup d'eau. L'air dans la cabine est très sec."], ["maya", "And bring a good playlist!", "Et prends une bonne playlist !"]], "next": "n7"}, "n6e": {"say": [["sam", "At the airport, keep your passport and boarding pass in your bag.", "À l'aéroport, garde ton passeport et ta carte d'embarquement dans ton sac."], ["maya", "And bring snacks! Lots of snacks!", "Et prends des trucs à grignoter ! Plein !"]], "next": "n7"}, "n7": {"say": [["maya", "Oh, one more thing! My teammates want to say hi. Can I give them your phone number?", "Ah, encore un truc ! Mes coéquipières veulent te dire bonjour. Je peux leur donner ton numéro ?"]], "ask": {"prompt": "Réponds à Maya prudemment.", "options": [{"en": "Let me ask my parents first, okay?", "fr": "Je demande d'abord à mes parents, d'accord ?", "ok": true, "next": "n8", "react": ["liv", "Very sensible, Capucine. That's always the right answer.", "Très raisonnable, Capucine. C'est toujours la bonne réponse."]}, {"en": "Maybe later. They can say hi on our next group call!", "fr": "Peut-être plus tard. Elles peuvent dire bonjour pendant notre prochain appel de groupe !", "ok": true, "next": "n8", "react": ["maya", "Good idea! A team video call! Ha ha!", "Bonne idée ! Un appel vidéo avec toute l'équipe ! Ha ha !"]}, {"en": "Sure! Post it online for everyone!", "fr": "Bien sûr ! Publie-le en ligne pour tout le monde !", "ok": false, "tip": "Attention : on ne partage jamais ses coordonnées avec tout le monde. Demande d'abord à un parent."}]}}, "n8": {"say": [["maya", "Okay, I have to go to practice. October is going to be epic!", "Bon, je dois aller à l'entraînement. Octobre va être génial !"], ["sam", "Safe travels, Capucine!", "Bon voyage, Capucine !"], ["liv", "Bye, lovelies! Keep dancing!", "Salut, mes chéries ! Continuez à danser !"]], "end": true}}, "quiz": [{"q": "Quand Capucine va-t-elle à Burlington ?", "opts": ["En juillet", "En octobre", "En décembre"], "a": 1}, {"q": "Que propose Liv ?", "opts": ["De suivre son cours en ligne chez Maya", "D'aller à un concert à Londres", "De jouer un match de volley"], "a": 0}, {"q": "Que veulent les coéquipières de Maya ?", "opts": ["Apprendre à danser", "Venir en France", "Le numéro de téléphone de Capucine"], "a": 2}]}, {"id": "s2-simulator", "level": 2, "title": "Aux commandes du simulateur", "setting": "cockpit", "cast": ["sam", "maya"], "intro": "Séance de simulateur de vol au club d'aviation ! Sam est l'instructeur, et Maya est assise juste derrière toi.", "start": "n1", "nodes": {"n1": {"say": [["sam", "Welcome to the simulator, Capucine! Today you're the captain.", "Bienvenue dans le simulateur, Capucine ! Aujourd'hui, c'est toi la commandante de bord."], ["maya", "And I'm the passenger! Please don't crash, Captain!", "Et moi, je suis la passagère ! Ne nous crashe pas, s'il te plaît, commandante !"]], "ask": {"prompt": "Réponds à Maya avec humour.", "options": [{"en": "Don't worry, Maya. I'm going to be very careful!", "fr": "Ne t'inquiète pas, Maya. Je vais faire très attention !", "ok": true, "next": "n2", "react": ["maya", "Okay, I trust you. I think.", "D'accord, je te fais confiance. Enfin, je crois."]}, {"en": "Fasten your seatbelt, please! We're leaving soon!", "fr": "Attachez votre ceinture, s'il vous plaît ! Nous partons bientôt !", "ok": true, "next": "n2", "react": ["sam", "Ha ha! She already sounds like a real captain!", "Ha ha ! Elle parle déjà comme une vraie commandante !"]}, {"en": "Sorry, I'm sleeping now.", "fr": "Désolée, je dors maintenant.", "ok": false, "tip": "Une commandante de bord ne dort pas avant le décollage ! Rassure Maya ou fais une petite annonce."}], "open": {"model": ["Welcome on board! Relax and enjoy the flight!", "Bienvenue à bord ! Détendez-vous et profitez du vol !"], "react": ["maya", "Ooh, very professional! Thank you, Captain!", "Oh, très professionnel ! Merci, commandante !"], "next": "n2"}}}, "n2": {"say": [["sam", "First, the checklist. Pilots always use a checklist before every flight.", "D'abord, la check-list. Les pilotes utilisent toujours une check-list avant chaque vol."], ["sam", "Can you check the fuel? Look at the gauge on the left.", "Tu peux vérifier le carburant ? Regarde la jauge à gauche."]], "ask": {"prompt": "Dis à Sam combien il y a de carburant.", "options": [{"en": "The fuel tanks are full!", "fr": "Les réservoirs sont pleins !", "ok": true, "next": "n3", "react": ["sam", "Good. Full tanks, happy pilot.", "Bien. Réservoirs pleins, pilote content."]}, {"en": "It's full! Fuel checked.", "fr": "C'est plein ! Carburant vérifié.", "ok": true, "next": "n3", "react": ["sam", "Spot on, Captain. Next item.", "Parfait, commandante. Point suivant."]}, {"en": "The fuel is blue and very pretty.", "fr": "Le carburant est bleu et très joli.", "ok": false, "tip": "Sam veut savoir si le réservoir est plein (« full ») ou vide (« empty »). Sois précise, comme une vraie pilote !"}]}}, "n3": {"say": [["sam", "Now we're going to call the tower. Our call sign is Charlie Alpha Papa.", "Maintenant, on va appeler la tour de contrôle. Notre indicatif, c'est Charlie Alpha Papa."], ["maya", "Charlie, Alpha, Papa. C, A, P! Like Capucine!", "Charlie, Alpha, Papa. C, A, P ! Comme Capucine !"], ["sam", "Ha ha, exactly! Tell the tower that we're ready for departure on runway two seven.", "Ha ha, exactement ! Dis à la tour qu'on est prêts au départ sur la piste deux sept."]], "ask": {"prompt": "Appelle la tour de contrôle.", "options": [{"en": "Tower, Charlie Alpha Papa, ready for departure, runway two seven.", "fr": "Tour, Charlie Alpha Papa, prêt au départ, piste deux sept.", "ok": true, "next": "n4", "react": ["sam", "Perfect radio call! Tower says: Charlie Alpha Papa, runway two seven, cleared for takeoff.", "Appel radio parfait ! La tour répond : Charlie Alpha Papa, piste deux sept, autorisé au décollage."]}, {"en": "Tower, this is Charlie Alpha Papa. We're ready for departure.", "fr": "Tour, ici Charlie Alpha Papa. Nous sommes prêts au départ.", "ok": true, "next": "n4", "react": ["sam", "Not bad at all! Tower says: Charlie Alpha Papa, cleared for takeoff.", "Pas mal du tout ! La tour répond : Charlie Alpha Papa, autorisé au décollage."]}, {"en": "Hello, Tower! How are you today?", "fr": "Bonjour, la tour ! Comment ça va aujourd'hui ?", "ok": false, "tip": "À la radio, on est court et précis ! Donne l'indicatif de l'avion et dis « ready for departure »."}]}}, "n4": {"say": [["sam", "Full power now. Push the throttle forward, slowly.", "Plein gaz maintenant. Pousse la manette des gaz vers l'avant, doucement."], ["maya", "We're going faster and faster!", "On va de plus en plus vite !"], ["sam", "Sixty knots. Rotate! Pull back gently.", "Soixante nœuds. Rotation ! Tire doucement vers toi."]], "next": "n5"}, "n5": {"say": [["maya", "We're flying! Capucine, you did it!", "On vole ! Capucine, tu as réussi !"], ["sam", "Well done! How do you feel, Captain?", "Bravo ! Comment tu te sens, commandante ?"]], "ask": {"prompt": "Dis à Sam ce que tu ressens.", "options": [{"en": "I feel amazing! It's better than a roller coaster!", "fr": "Je me sens super bien ! C'est mieux qu'un grand huit !", "ok": true, "next": "n6", "react": ["maya", "Way better! And there's no line!", "Carrément mieux ! Et il n'y a pas de file d'attente !"]}, {"en": "I was nervous at first, but now I'm so happy!", "fr": "J'étais stressée au début, mais maintenant je suis trop contente !", "ok": true, "next": "n6", "react": ["sam", "That's normal. Every pilot was nervous the first time.", "C'est normal. Tous les pilotes ont stressé la première fois."]}, {"en": "Yesterday I felt hungry.", "fr": "Hier, j'avais faim.", "ok": false, "tip": "Sam te demande comment tu te sens maintenant, pendant le vol. Utilise le présent : « I feel... »."}], "open": {"model": ["This is incredible! I want to fly every day!", "C'est incroyable ! Je veux voler tous les jours !"], "react": ["sam", "Careful! Once you start flying, you can't stop! Ha ha!", "Attention ! Quand on commence à voler, on ne peut plus s'arrêter ! Ha ha !"], "next": "n6"}}}, "n6": {"say": [["sam", "Look outside. We're at four thousand feet.", "Regarde dehors. On est à quatre mille pieds."], ["maya", "The mountains look so small from up here!", "Les montagnes ont l'air si petites d'ici !"], ["sam", "That mountain is three thousand feet high. Capucine, which is higher?", "Cette montagne fait trois mille pieds. Capucine, qu'est-ce qui est le plus haut ?"]], "ask": {"prompt": "Compare l'altitude de l'avion et celle de la montagne.", "options": [{"en": "The plane is higher than the mountain!", "fr": "L'avion est plus haut que la montagne !", "ok": true, "next": "n7", "react": ["sam", "Correct! And that's very important for pilots. Ha ha!", "Exact ! Et ça, c'est très important pour les pilotes. Ha ha !"]}, {"en": "We're higher. The mountain is lower than the plane.", "fr": "On est plus haut. La montagne est plus basse que l'avion.", "ok": true, "next": "n7", "react": ["sam", "Exactly! One thousand feet higher. Nice and safe.", "Exactement ! Mille pieds plus haut. Tranquille et en sécurité."]}, {"en": "The mountain is more higher than the plane.", "fr": "La montagne est plus haute que l'avion.", "ok": false, "tip": "Deux erreurs : on dit « higher », jamais « more higher ». Et c'est l'avion qui est plus haut que la montagne !"}]}}, "n7": {"say": [["sam", "Okay, time to land. The runway is in front of us. Reduce power, gently.", "Bon, c'est l'heure d'atterrir. La piste est devant nous. Réduis les gaz, doucement."], ["maya", "I'm closing my eyes! Tell me when we're on the ground!", "Je ferme les yeux ! Dis-moi quand on est au sol !"]], "ask": {"prompt": "Rassure Maya pendant l'atterrissage.", "options": [{"en": "Don't worry, Maya! We're landing now!", "fr": "Ne t'inquiète pas, Maya ! On atterrit maintenant !", "ok": true, "next": "n8", "react": ["maya", "Okay... okay... Are we down yet?", "D'accord... d'accord... On est en bas ?"]}, {"en": "Open your eyes! The runway is right there!", "fr": "Ouvre les yeux ! La piste est juste là !", "ok": true, "next": "n8", "react": ["maya", "Whoa! It's so close!", "Waouh ! Elle est trop près !"]}, {"en": "Maya, can you take the controls? I'm tired.", "fr": "Maya, tu peux prendre les commandes ? Je suis fatiguée.", "ok": false, "tip": "Pendant l'atterrissage, la commandante garde les commandes ! Rassure plutôt Maya."}]}}, "n8": {"say": [["sam", "And... touchdown! Perfect landing, Captain Capucine!", "Et... toucher des roues ! Atterrissage parfait, commandante Capucine !"], ["maya", "Woohoo! You were amazing! Okay, my turn now!", "Ouais ! Tu étais géniale ! Bon, à mon tour maintenant !"], ["sam", "Ha ha! Sure, Maya. Let's start with the checklist.", "Ha ha ! D'accord, Maya. On commence par la check-list."]], "end": true}}, "quiz": [{"q": "Que vérifie Capucine en premier ?", "opts": ["Le carburant", "La radio", "Les freins"], "a": 0}, {"q": "Sur quelle piste décollent-elles ?", "opts": ["La piste un deux", "La piste deux sept", "La piste neuf"], "a": 1}, {"q": "À quelle altitude vole l'avion ?", "opts": ["Trois mille pieds", "Mille pieds", "Quatre mille pieds"], "a": 2}]}, {"id": "s2-dance-show", "level": 2, "title": "Le grand spectacle", "setting": "studio", "cast": ["liv", "maya"], "intro": "Dernier jour de l'atelier de Liv : le spectacle de fin de stage commence dans une heure ! Tu te prépares en coulisses avec Maya et tout le groupe.", "start": "n1", "nodes": {"n1": {"say": [["liv", "Right, dancers! The show starts in one hour!", "Bon, les danseurs ! Le spectacle commence dans une heure !"], ["maya", "Capucine, I'm so nervous! My legs are shaking!", "Capucine, je stresse trop ! Mes jambes tremblent !"]], "ask": {"prompt": "Rassure Maya.", "options": [{"en": "Don't worry! We practised a lot. We're ready!", "fr": "Ne t'inquiète pas ! On a beaucoup répété. On est prêtes !", "ok": true, "next": "n2", "react": ["maya", "You're right. We practiced every single day!", "Tu as raison. On a répété tous les jours !"]}, {"en": "Me too! But it's going to be fun, I promise.", "fr": "Moi aussi ! Mais ça va être génial, promis.", "ok": true, "next": "n2", "react": ["liv", "That's the spirit! Nervous and excited is a good mix.", "C'est ça, l'esprit ! Stressée et excitée, c'est un bon mélange."]}, {"en": "Your legs are shaking? Maybe you're going to fall.", "fr": "Tes jambes tremblent ? Tu vas peut-être tomber.", "ok": false, "tip": "Ce n'est pas très rassurant ! Dis plutôt quelque chose de positif à Maya."}], "open": {"model": ["It's okay to be nervous. You're going to be great!", "C'est normal de stresser. Tu vas être géniale !"], "react": ["maya", "Thanks, Capucine. You're the best!", "Merci, Capucine. Tu es la meilleure !"], "next": "n2"}}}, "n2": {"say": [["liv", "A quick warm-up first. Capucine, can you lead it today?", "D'abord, un petit échauffement. Capucine, tu peux le diriger aujourd'hui ?"]], "ask": {"prompt": "Réponds à Liv et lance l'échauffement.", "options": [{"en": "Sure! Everyone, roll your shoulders. Now your neck, slowly.", "fr": "Bien sûr ! Tout le monde, faites rouler vos épaules. Maintenant le cou, doucement.", "ok": true, "next": "n3", "react": ["liv", "Lovely! You sound like a real teacher!", "Super ! On dirait une vraie prof !"]}, {"en": "Yes! Let's start with some jumps. Ready? Five, six, seven, eight!", "fr": "Oui ! On commence par des sauts. Prêts ? Cinq, six, sept, huit !", "ok": true, "next": "n3", "react": ["maya", "Ooh, jumps! Now my legs aren't shaking!", "Oh, des sauts ! Mes jambes ne tremblent plus !"]}, {"en": "No, I'm going to watch TV.", "fr": "Non, je vais regarder la télé.", "ok": false, "tip": "Liv te fait confiance ! Accepte et propose un exercice d'échauffement."}], "open": {"model": ["Of course! Everyone, stretch your arms up high!", "Bien sûr ! Tout le monde, tendez les bras bien haut !"], "react": ["liv", "Brilliant, Capucine! Arms up, everyone!", "Génial, Capucine ! Les bras en l'air, tout le monde !"], "next": "n3"}}}, "n3": {"say": [["maya", "Oh no! Where are my shoes? I can't find my dance shoes!", "Oh non ! Où sont mes chaussons ? Je ne trouve pas mes chaussons de danse !"], ["liv", "Don't panic! Capucine, did you see them?", "Pas de panique ! Capucine, tu les as vus ?"]], "ask": {"prompt": "Aide Maya à trouver ses chaussons.", "options": [{"en": "Yes! They're under the chair, next to your bag.", "fr": "Oui ! Ils sont sous la chaise, à côté de ton sac.", "ok": true, "next": "n4", "react": ["maya", "Phew! Thank you! You saved my life!", "Ouf ! Merci ! Tu m'as sauvé la vie !"]}, {"en": "I saw them this morning. Look in your bag!", "fr": "Je les ai vus ce matin. Regarde dans ton sac !", "ok": true, "next": "n4", "react": ["maya", "Oh! They were in my bag the whole time! Oops!", "Oh ! Ils étaient dans mon sac depuis le début ! Oups !"]}, {"en": "Yes, they were very delicious.", "fr": "Oui, ils étaient délicieux.", "ok": false, "tip": "Des chaussons de danse, ça ne se mange pas ! Dis à Maya où ils sont : « They're under the chair »."}]}}, "n4": {"say": [["liv", "Now, costumes! The black tops or the red tops? You two can choose.", "Maintenant, les costumes ! Les hauts noirs ou les hauts rouges ? Vous pouvez choisir, toutes les deux."], ["maya", "I prefer red. It's brighter and more fun!", "Moi, je préfère le rouge. C'est plus vif et plus fun !"]], "ask": {"prompt": "Donne ton avis sur les costumes.", "options": [{"en": "I prefer black. It's more elegant than red.", "fr": "Je préfère le noir. C'est plus élégant que le rouge.", "ok": true, "next": "n5", "react": ["liv", "Ooh, good point. Black looks very elegant on stage.", "Oh, bien vu. Le noir est très élégant sur scène."]}, {"en": "Red! It's brighter, so the audience can see us better.", "fr": "Le rouge ! C'est plus vif, donc le public nous voit mieux.", "ok": true, "next": "n5", "react": ["maya", "Yes! Team red!", "Oui ! Équipe rouge !"]}, {"en": "I prefer volleyball.", "fr": "Je préfère le volley.", "ok": false, "tip": "Liv te demande quelle couleur de costume tu préfères. Compare les deux : « more elegant », « brighter »..."}], "open": {"model": ["Let's wear red! It's the happiest colour!", "Prenons le rouge ! C'est la couleur la plus joyeuse !"], "react": ["liv", "Red it is, then! Lovely choice.", "Va pour le rouge ! Joli choix."], "next": "n5"}}}, "n5": {"say": [["liv", "Five minutes, everyone! This was the best workshop ever. I'm so proud of you.", "Cinq minutes, tout le monde ! C'était le meilleur atelier de tous les temps. Je suis tellement fière de vous."], ["maya", "Capucine, what was your favorite moment?", "Capucine, c'était quoi, ton moment préféré ?"]], "ask": {"prompt": "Raconte à Maya ton moment préféré de l'atelier.", "options": [{"en": "My favourite moment was the first class. I made a new friend!", "fr": "Mon moment préféré, c'était le premier cours. Je me suis fait une nouvelle amie !", "ok": true, "next": "n6", "react": ["maya", "Aww! That's me, right? It's me!", "Oh ! C'est moi, hein ? C'est moi !"]}, {"en": "I loved the day we danced in the park. It was so much fun!", "fr": "J'ai adoré le jour où on a dansé dans le parc. C'était trop bien !", "ok": true, "next": "n6", "react": ["liv", "Oh yes! And then it started raining!", "Oh oui ! Et après, il s'est mis à pleuvoir !"]}, {"en": "My favourite moment is going to be tomorrow.", "fr": "Mon moment préféré va être demain.", "ok": false, "tip": "Maya te demande un souvenir, donc au passé. Utilise le prétérit : « My favourite moment was... »."}]}}, "n6": {"say": [["liv", "Okay, places, everyone! Lights... music...", "Allez, en place, tout le monde ! Lumières... musique..."], ["maya", "Here we go! Break a leg, Capucine!", "C'est parti ! Bonne chance, Capucine (c'est comme ça qu'on le dit au théâtre) !"]], "next": "n7"}, "n7": {"say": [["liv", "Bravo! Bravo! That was absolutely wonderful!", "Bravo ! Bravo ! C'était absolument merveilleux !"], ["maya", "We did it! The audience loved it!", "On l'a fait ! Le public a adoré !"], ["liv", "Capucine, how did you feel on stage?", "Capucine, comment tu t'es sentie sur scène ?"]], "ask": {"prompt": "Dis à Liv comment tu t'es sentie sur scène.", "options": [{"en": "I was nervous at the start, but then I felt free!", "fr": "J'étais stressée au début, mais après je me suis sentie libre !", "ok": true, "next": "n8", "react": ["liv", "That's the magic of dance, Capucine.", "C'est la magie de la danse, Capucine."]}, {"en": "It was the best feeling ever! Can we do it again?", "fr": "C'était la meilleure sensation du monde ! On peut recommencer ?", "ok": true, "next": "n8", "react": ["maya", "Yes! Every day! Forever!", "Oui ! Tous les jours ! Pour toujours !"]}, {"en": "I feel on stage tomorrow.", "fr": "Je me sens sur scène demain.", "ok": false, "tip": "Liv te demande comment tu t'es sentie, donc au passé. Commence par « I felt... » ou « It was... »."}], "open": {"model": ["It was amazing! I felt like a real dancer!", "C'était incroyable ! Je me suis sentie comme une vraie danseuse !"], "react": ["liv", "You are a real dancer! Well done!", "Tu es une vraie danseuse ! Bravo !"], "next": "n8"}}}, "n8": {"say": [["liv", "Thank you, everyone. Now go and drink some water!", "Merci à tous. Maintenant, allez boire de l'eau !"], ["maya", "Group hug!", "Câlin de groupe !"]], "end": true}}, "quiz": [{"q": "Dans combien de temps commence le spectacle au début de la scène ?", "opts": ["Dans une heure", "Dans dix minutes", "Demain"], "a": 0}, {"q": "Qu'est-ce que Maya ne trouve pas ?", "opts": ["Son costume", "Ses chaussons de danse", "Sa bouteille d'eau"], "a": 1}, {"q": "Quelle couleur de costume Maya préfère-t-elle ?", "opts": ["Le noir", "Le blanc", "Le rouge"], "a": 2}]}, {"id": "s3-discovery-flight", "level": 3, "title": "Le débriefing du vol", "setting": "airfield", "cast": ["sam", "maya"], "intro": "Tu viens de faire ton vol de découverte dans un petit avion du club, avec Sam comme instructeur ! Maya a volé juste avant toi. Maintenant, vous débriefez ensemble dans la salle du club, comme de vrais pilotes.", "start": "n1", "nodes": {"n1": {"say": [["sam", "Welcome back to the ground, Capucine! You've just flown a plane for the first time. How do you feel?", "Bon retour sur la terre ferme, Capucine ! Tu viens de piloter un avion pour la première fois. Comment tu te sens ?"], ["maya", "She was smiling the whole time! I could see it from the window!", "Elle a souri tout le temps ! Je la voyais depuis la fenêtre !"]], "ask": {"prompt": "Dis à Sam ce que tu as ressenti pendant le vol.", "options": [{"en": "I feel amazing! It's one of the best things I've ever done.", "fr": "Je me sens super bien ! C'est l'une des meilleures choses que j'aie jamais faites.", "ok": true, "next": "n2", "react": ["sam", "That's exactly what I said after my first flight, many years ago.", "C'est exactement ce que j'ai dit après mon premier vol, il y a bien longtemps."]}, {"en": "I was a bit nervous at first, but then I really enjoyed it.", "fr": "J'étais un peu stressée au début, mais après, j'ai vraiment adoré.", "ok": true, "next": "n2", "react": ["sam", "That's completely normal. Feeling nervous at the start just means you care.", "C'est tout à fait normal. Être stressée au début, ça veut juste dire que ça compte pour toi."]}, {"en": "I've never been to a swimming pool.", "fr": "Je ne suis jamais allée à la piscine.", "ok": false, "tip": "Sam te demande ce que tu as ressenti en vol. Parle de tes émotions : excitée, stressée, fière..."}], "open": {"model": ["I've never felt anything like it! I was nervous, but it was incredible.", "Je n'ai jamais rien ressenti de pareil ! J'étais stressée, mais c'était incroyable."], "react": ["maya", "Same! My heart was beating so fast during the take-off!", "Pareil ! Mon cœur battait trop vite pendant le décollage !"], "next": "n2"}}}, "n2": {"say": [["sam", "Let's go through it step by step, like real pilots do after every flight.", "Reprenons tout étape par étape, comme le font les vrais pilotes après chaque vol."], ["sam", "What was your favourite part: the take-off, the turns or the view?", "Quel a été ton moment préféré : le décollage, les virages ou la vue ?"]], "ask": {"prompt": "Explique à Sam ton moment préféré et pourquoi.", "options": [{"en": "The take-off, because I could feel the plane lifting off the runway.", "fr": "Le décollage, parce que je sentais l'avion quitter la piste.", "ok": true, "next": "n3a", "react": ["sam", "Ah, the moment the wheels leave the ground. It never gets old.", "Ah, le moment où les roues quittent le sol. On ne s'en lasse jamais."]}, {"en": "The view! We could see the whole lake and all the tiny houses.", "fr": "La vue ! On voyait tout le lac et toutes les petites maisons.", "ok": true, "next": "n3b", "react": ["maya", "I took about a hundred photos of that lake. Sorry, not sorry!", "J'ai pris genre cent photos de ce lac. Désolée, pas désolée !"]}, {"en": "My favourite part is lunch, because I always have pasta on Mondays.", "fr": "Mon moment préféré, c'est le déjeuner, parce que je mange toujours des pâtes le lundi.", "ok": false, "tip": "On parle du vol ! Choisis un moment du vol et donne une raison avec « because »."}], "open": {"model": ["My favourite part was the turns, because the view changed so quickly.", "Mon moment préféré, c'était les virages, parce que la vue changeait super vite."], "react": ["sam", "Good answer, and you gave a reason. That's what I like to hear.", "Bonne réponse, et tu as donné une raison. C'est ce que j'aime entendre."], "next": "n3a"}}}, "n3a": {"say": [["sam", "When you pulled back on the control column, the elevator on the tail moved up.", "Quand tu as tiré sur le manche, la gouverne de profondeur, sur la queue, s'est levée."], ["sam", "That pushed the tail down and lifted the nose. That's how we climb.", "Ça a fait baisser la queue et monter le nez. C'est comme ça qu'on monte."], ["maya", "Wait, so the tail does all the hard work? Poor little tail!", "Attends, donc c'est la queue qui fait tout le travail ? Pauvre petite queue !"]], "next": "n4"}, "n3b": {"say": [["sam", "You had a great view because the weather was perfect. Visibility was more than ten kilometres today.", "Tu avais une super vue parce que la météo était parfaite. La visibilité dépassait dix kilomètres aujourd'hui."], ["maya", "Ten kilometres? I could only see Capucine's phone in front of my face!", "Dix kilomètres ? Moi, je ne voyais que le téléphone de Capucine devant ma figure !"], ["sam", "Ha! Anyway, let's talk about how the plane actually flew.", "Ha ! Bref, parlons de la façon dont l'avion a vraiment volé."]], "next": "n4"}, "n4": {"say": [["sam", "Over the fields, we had a few bumps. Did the turbulence bother you?", "Au-dessus des champs, on a eu quelques secousses. Les turbulences t'ont gênée ?"], ["maya", "It was like a roller coaster! I loved it, honestly.", "C'était comme des montagnes russes ! Franchement, j'ai adoré."]], "ask": {"prompt": "Raconte à Sam comment tu as vécu les turbulences.", "options": [{"en": "Not really. You told me it was normal, so I stayed calm.", "fr": "Pas vraiment. Tu m'avais dit que c'était normal, alors je suis restée calme.", "ok": true, "next": "n5", "react": ["sam", "Exactly. On sunny days, warm air rises from the fields. That's what shook us a bit.", "Exactement. Les jours de soleil, l'air chaud monte des champs. C'est ça qui nous a un peu secoués."]}, {"en": "A little, but I held the controls gently, like you said.", "fr": "Un peu, mais j'ai tenu les commandes en douceur, comme tu me l'avais dit.", "ok": true, "next": "n5", "react": ["sam", "And you did it very well. Gentle hands make smooth flights.", "Et tu l'as très bien fait. Des mains douces, ça donne des vols tranquilles."]}, {"en": "Yes, I've already bought a new bike.", "fr": "Oui, j'ai déjà acheté un nouveau vélo.", "ok": false, "tip": "Sam parle des secousses (« bumps ») pendant le vol. Dis-lui si ça t'a fait peur ou pas."}], "open": {"model": ["It surprised me at first, but after a few minutes I got used to it.", "Ça m'a surprise au début, mais après quelques minutes, je m'y suis habituée."], "react": ["sam", "That's a pilot's attitude. You adapt and you keep flying.", "Ça, c'est une attitude de pilote. On s'adapte et on continue de voler."], "next": "n5"}}}, "n5": {"say": [["sam", "Now, an important pilot skill: the phonetic alphabet. Every letter has its own word.", "Maintenant, une compétence importante pour un pilote : l'alphabet phonétique. Chaque lettre a son propre mot."], ["maya", "I tried earlier and I got stuck on the letter U. Is it Umbrella?", "J'ai essayé tout à l'heure et j'ai bloqué sur la lettre U. C'est Umbrella ?"], ["sam", "Not quite, Maya. It's Uniform. Capucine, can you spell your name for us?", "Pas tout à fait, Maya. C'est Uniform. Capucine, tu peux nous épeler ton prénom ?"]], "ask": {"prompt": "Épelle ton prénom avec l'alphabet phonétique de l'aviation.", "options": [{"en": "Charlie, Alpha, Papa, Uniform, Charlie, India, November, Echo.", "fr": "C, A, P, U, C, I, N, E.", "ok": true, "next": "n6", "react": ["sam", "Perfect! The control tower would understand you on the first try.", "Parfait ! La tour de contrôle te comprendrait du premier coup."]}, {"en": "I'll try! Charlie, Alpha, Papa, Uniform, Charlie, India, November, Echo. Have I got it right?", "fr": "Je vais essayer ! C, A, P, U, C, I, N, E. C'est bon ?", "ok": true, "next": "n6", "react": ["maya", "Show-off! Okay, that was seriously impressive.", "Frimeuse ! Bon, d'accord, c'était vraiment impressionnant."]}, {"en": "Cat, Apple, Paris, Umbrella, Cat, Ice cream, Nose, Egg.", "fr": "Chat, pomme, Paris, parapluie, chat, glace, nez, œuf.", "ok": false, "tip": "Ce sont des mots au hasard ! L'alphabet de l'aviation utilise des mots fixes : Charlie, Alpha, Papa, Uniform..."}], "open": {"model": ["Charlie, Alpha, Papa, Uniform, Charlie, India, November, Echo. That's me!", "C, A, P, U, C, I, N, E. C'est moi !"], "react": ["sam", "Lovely work. You've clearly been practising.", "Joli travail. On voit que tu t'es entraînée."], "next": "n6"}}}, "n6": {"say": [["maya", "Okay, Captain Sam, I have a question. Why do pilots use those words?", "Bon, commandant Sam, j'ai une question. Pourquoi les pilotes utilisent ces mots ?"], ["sam", "Good question! On the radio, letters like B and D, or M and N, can sound the same.", "Bonne question ! À la radio, des lettres comme B et D, ou M et N, peuvent se ressembler."], ["sam", "Capucine, can you think of two other letters that sound similar in English?", "Capucine, tu vois deux autres lettres qui se ressemblent en anglais ?"]], "ask": {"prompt": "Réponds à Sam : donne deux lettres faciles à confondre en anglais.", "options": [{"en": "B and P! On a bad radio, I don't think I could hear the difference.", "fr": "B et P ! Avec une mauvaise radio, je crois que je n'entendrais pas la différence.", "ok": true, "next": "n7", "react": ["sam", "Spot on. That's why we say Bravo and Papa instead.", "Tout à fait. C'est pour ça qu'on dit Bravo et Papa à la place."]}, {"en": "Maybe E and I? They're really confusing for French speakers!", "fr": "Peut-être E et I ? Pour les francophones, c'est hyper déroutant !", "ok": true, "next": "n7", "react": ["maya", "Oh, totally! And I mix them up when I try to speak French with you!", "Oh, carrément ! Et moi, je les mélange quand j'essaie de te parler en français !"]}, {"en": "I don't like letters. I prefer sending messages on my phone.", "fr": "Je n'aime pas les lettres. Je préfère envoyer des messages sur mon téléphone.", "ok": false, "tip": "Sam parle des lettres de l'alphabet, pas du courrier ! Donne deux lettres qui se ressemblent quand on les prononce."}], "open": {"model": ["M and N sound almost the same, especially on a noisy radio.", "M et N se ressemblent beaucoup, surtout avec une radio qui grésille."], "react": ["sam", "Exactly. Mike and November solve that problem.", "Exactement. Mike et November règlent le problème."], "next": "n7"}}}, "n7": {"say": [["sam", "Last part of the debrief. What do you think you should practise before your next flight?", "Dernière partie du débriefing. À ton avis, qu'est-ce que tu devrais travailler avant ton prochain vol ?"], ["maya", "Be honest, Capucine! I'm going to say landing, because I closed my eyes again.", "Sois honnête, Capucine ! Moi, je vais dire l'atterrissage, parce que j'ai encore fermé les yeux."]], "ask": {"prompt": "Dis à Sam ce que tu devrais travailler avant ton prochain vol.", "options": [{"en": "I should practise my radio calls, because I spoke much too fast.", "fr": "Je devrais m'entraîner aux messages radio, parce que j'ai parlé beaucoup trop vite.", "ok": true, "next": "n8", "react": ["sam", "Good self-assessment. Slow and clear beats fast and messy every time.", "Bonne auto-évaluation. Lent et clair, c'est toujours mieux que rapide et brouillon."]}, {"en": "I think I should work on my turns. I lost a bit of height.", "fr": "Je pense que je devrais travailler mes virages. J'ai perdu un peu d'altitude.", "ok": true, "next": "n8", "react": ["sam", "Well noticed. Next time, watch the horizon and pull back very slightly in the turn.", "Bien vu. La prochaine fois, regarde l'horizon et tire très légèrement sur le manche dans le virage."]}, {"en": "I should practise my piano every morning.", "fr": "Je devrais m'entraîner au piano tous les matins.", "ok": false, "tip": "Pense à ton vol : la radio, les virages, l'atterrissage... Choisis quelque chose qui concerne le pilotage."}], "open": {"model": ["I should learn the phonetic alphabet by heart and practise my radio calls.", "Je devrais apprendre l'alphabet phonétique par cœur et m'entraîner aux messages radio."], "react": ["sam", "A very sensible plan. I'll give you some radio exercises for next time.", "Un plan très raisonnable. Je te donnerai des exercices de radio pour la prochaine fois."], "next": "n8"}}}, "n8": {"say": [["sam", "Right, debrief done! Here's your discovery flight certificate, Capucine. Well done!", "Voilà, débriefing terminé ! Voici ton certificat de vol de découverte, Capucine. Bravo !"], ["maya", "Wait, I need a photo of you with it! Hold it up high!", "Attends, il me faut une photo de toi avec ! Lève-le bien haut !"], ["sam", "Big smile, Captain! See you both at the club next month.", "Grand sourire, commandante ! Rendez-vous au club le mois prochain, toutes les deux."]], "end": true}}, "quiz": [{"q": "Quel mot Maya a-t-elle proposé pour la lettre U ?", "opts": ["Umbrella", "Uniform", "Union"], "a": 0}, {"q": "Pourquoi les pilotes utilisent-ils l'alphabet phonétique ?", "opts": ["Pour que ce soit plus amusant", "Parce que certaines lettres se ressemblent à la radio", "Parce que la radio ne marche qu'en français"], "a": 1}, {"q": "Qu'est-ce que Sam te donne à la fin ?", "opts": ["Une photo de l'avion", "Un casque de pilote", "Un certificat de vol de découverte"], "a": 2}]}, {"id": "s3-tough-loss", "level": 3, "title": "Une défaite difficile", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "Hier, l'équipe de Maya a perdu la finale du championnat de l'État du Vermont. Ce soir, c'est l'appel vidéo de groupe habituel : Liv est déjà là, et Sam doit vous rejoindre un peu plus tard. Ton objectif : remonter le moral de Maya !", "start": "n1", "nodes": {"n1": {"say": [["liv", "Hello, you two! Maya, you look a bit down. Is everything all right?", "Coucou, vous deux ! Maya, tu as l'air un peu triste. Tout va bien ?"], ["maya", "Not really. We lost the state final yesterday. Three sets to two.", "Pas vraiment. On a perdu la finale du championnat hier. Trois sets à deux."], ["maya", "I've been in my room all day, listening to sad songs.", "Je suis restée dans ma chambre toute la journée à écouter des chansons tristes."]], "ask": {"prompt": "Réconforte Maya.", "options": [{"en": "Oh no, I'm so sorry, Maya. That must have been really hard.", "fr": "Oh non, je suis vraiment désolée, Maya. Ça a dû être super dur.", "ok": true, "next": "n2", "react": ["maya", "Thanks, Capucine. It really was. We were so close!", "Merci, Capucine. Ça l'a vraiment été. On y était presque !"]}, {"en": "Three sets to two? That means you fought right until the very end!", "fr": "Trois sets à deux ? Ça veut dire que vous vous êtes battues jusqu'au bout !", "ok": true, "next": "n2", "react": ["liv", "That's exactly what I was going to say. It was a real battle!", "C'est exactement ce que j'allais dire. C'était un vrai combat !"]}, {"en": "Great! Let's talk about my weekend now.", "fr": "Super ! Parlons de mon week-end, maintenant.", "ok": false, "tip": "Maya est triste : ce n'est pas le moment de changer de sujet. Montre-lui que tu comprends ce qu'elle ressent."}], "open": {"model": ["I'm really sorry, Maya. I know how much this final meant to you.", "Je suis vraiment désolée, Maya. Je sais à quel point cette finale comptait pour toi."], "react": ["maya", "It meant everything. But it helps to talk to you guys.", "Elle comptait énormément. Mais ça fait du bien de vous parler."], "next": "n2"}}}, "n2": {"say": [["liv", "Do you want to tell us what happened? Only if you feel like it.", "Tu veux nous raconter ce qui s'est passé ? Seulement si tu en as envie."], ["maya", "We won the first two sets easily. Then they changed their strategy and we panicked.", "On a gagné les deux premiers sets facilement. Puis elles ont changé de stratégie, et on a paniqué."], ["maya", "And I missed the very last serve. The whole gym went silent.", "Et j'ai raté le tout dernier service. Tout le gymnase est devenu silencieux."]], "ask": {"prompt": "Pose une question à Maya ou dis-lui quelque chose de gentil sur son match.", "options": [{"en": "Everyone misses a serve sometimes. Even professional players miss them!", "fr": "Tout le monde rate un service de temps en temps. Même les joueuses pros en ratent !", "ok": true, "next": "n3", "react": ["maya", "Ha, that's true. I've seen Olympic players miss serves on TV.", "Ha, c'est vrai. J'ai déjà vu des joueuses olympiques rater des services à la télé."]}, {"en": "How did your teammates react? Were they upset with you?", "fr": "Comment tes coéquipières ont réagi ? Elles t'en ont voulu ?", "ok": true, "next": "n3", "react": ["maya", "No, actually. They all hugged me. Our captain said we win and lose as a team.", "Non, en fait. Elles m'ont toutes fait un câlin. Notre capitaine a dit qu'on gagne et qu'on perd en équipe."]}, {"en": "You should train more. Your serve isn't very good.", "fr": "Tu devrais t'entraîner plus. Ton service n'est pas terrible.", "ok": false, "tip": "Même si tu le penses, ce n'est pas le bon moment pour critiquer ! Maya a besoin de soutien."}], "open": {"model": ["One serve didn't lose the whole match. You played brilliantly for two sets!", "Ce n'est pas un seul service qui a fait perdre le match. Vous avez été géniales pendant deux sets !"], "react": ["maya", "Hmm. When you put it like that, I feel a tiny bit better.", "Hmm. Vu comme ça, je me sens un tout petit peu mieux."], "next": "n3"}}}, "n3": {"say": [["sam", "G'day, everyone! Sorry I'm late, my flight was delayed. Why the long faces?", "Salut tout le monde ! Désolé pour le retard, mon vol a été retardé. Pourquoi ces têtes d'enterrement ?"], ["liv", "Maya's team lost the state final yesterday. We're cheering her up.", "L'équipe de Maya a perdu la finale du championnat hier. On lui remonte le moral."], ["sam", "Ah, mate, that's tough. Capucine, have you ever lost an important match?", "Ah, ma pauvre, c'est dur. Capucine, tu as déjà perdu un match important ?"]], "ask": {"prompt": "Réponds à Sam en utilisant le present perfect (I've lost..., I've never...).", "options": [{"en": "Yes, I've lost a few big matches. It hurts, but I always learn something.", "fr": "Oui, j'ai déjà perdu quelques gros matchs. Ça fait mal, mais j'apprends toujours quelque chose.", "ok": true, "next": "n4", "react": ["sam", "That's a champion's mindset, right there.", "Ça, c'est un état d'esprit de championne."]}, {"en": "Yes, I have. I was sad for days, but then I trained even harder.", "fr": "Oui, ça m'est arrivé. J'ai été triste pendant des jours, mais après, je me suis entraînée encore plus.", "ok": true, "next": "n4", "react": ["maya", "Okay, that's actually really inspiring. Thanks, Capucine.", "Bon, c'est vraiment inspirant, en fait. Merci, Capucine."]}, {"en": "No, I've never been to Australia.", "fr": "Non, je ne suis jamais allée en Australie.", "ok": false, "tip": "Sam te demande si tu as déjà perdu un match important, pas si tu es allée en Australie !"}], "open": {"model": ["Yes, I have. It was horrible at the time, but now I can laugh about it.", "Oui, ça m'est arrivé. C'était horrible sur le moment, mais maintenant, j'en rigole."], "react": ["sam", "That's the thing. Time changes how a loss feels.", "C'est bien ça. Avec le temps, une défaite ne fait plus le même effet."], "next": "n4"}}}, "n4": {"say": [["sam", "Let me tell you a story. I failed my first flight test when I was twenty.", "Je vais vous raconter une histoire. J'ai raté mon premier examen de vol quand j'avais vingt ans."], ["sam", "I was gutted. But I went back, practised harder and passed three weeks later.", "J'étais dégoûté. Mais j'y suis retourné, je me suis entraîné encore plus, et je l'ai eu trois semaines après."], ["liv", "And now you fly enormous planes all over the world! See, Maya?", "Et maintenant, tu pilotes des avions énormes partout dans le monde ! Tu vois, Maya ?"]], "next": "n5"}, "n5": {"say": [["maya", "Okay, okay. So what should I do now? I don't want to feel like this all week.", "Bon, d'accord. Alors, qu'est-ce que je devrais faire maintenant ? Je n'ai pas envie de me sentir comme ça toute la semaine."], ["liv", "Capucine, you play volleyball too. What would you advise her?", "Capucine, toi aussi tu joues au volley. Qu'est-ce que tu lui conseillerais ?"]], "ask": {"prompt": "Donne un conseil à Maya avec should, could ou don't have to.", "options": [{"en": "You should rest this weekend and do something fun with your friends.", "fr": "Tu devrais te reposer ce week-end et faire un truc sympa avec tes amis.", "ok": true, "next": "n6", "react": ["liv", "Brilliant advice. Rest is part of training too.", "Excellent conseil. Le repos fait partie de l'entraînement, aussi."]}, {"en": "You could watch the match video later, when you feel calmer, and learn from it.", "fr": "Tu pourrais regarder la vidéo du match plus tard, quand tu seras plus calme, et en tirer des leçons.", "ok": true, "next": "n6", "react": ["maya", "Coach always says that. I'll watch it next week, but definitely not today!", "Le coach dit toujours ça. Je la regarderai la semaine prochaine, mais sûrement pas aujourd'hui !"]}, {"en": "You must stop volleyball and start golf.", "fr": "Tu dois arrêter le volley et te mettre au golf.", "ok": false, "tip": "C'est un peu extrême ! Maya adore le volley. Propose plutôt un conseil réaliste pour qu'elle se sente mieux."}], "open": {"model": ["You don't have to be perfect. Take a break, then come back stronger.", "Tu n'as pas besoin d'être parfaite. Fais une pause, puis reviens plus forte."], "react": ["maya", "Take a break, then come back stronger. I'm writing that on a sticky note!", "Faire une pause, puis revenir plus forte. Je l'écris sur un post-it !"], "next": "n6"}}}, "n6": {"say": [["liv", "Can I suggest something? When I'm sad, I dance it out. Maya, put on your favourite song!", "Je peux proposer un truc ? Quand je suis triste, je danse pour évacuer. Maya, mets ta chanson préférée !"], ["maya", "Right now? On a video call? You're crazy, Liv!", "Là, maintenant ? En appel vidéo ? Tu es folle, Liv !"], ["liv", "A little bit, yes. Capucine, are you in?", "Un petit peu, oui. Capucine, tu es partante ?"]], "ask": {"prompt": "Réponds à la proposition de Liv.", "options": [{"en": "I'm in! Let's do it. Maya, choose something really upbeat!", "fr": "Je suis partante ! Allez, on y va. Maya, choisis un truc bien entraînant !", "ok": true, "next": "n7", "react": ["maya", "Fine! Something loud, with a massive beat. Here goes!", "D'accord ! Un truc fort, avec un rythme énorme. C'est parti !"]}, {"en": "Only if Sam dances too! Come on, Captain!", "fr": "Seulement si Sam danse aussi ! Allez, commandant !", "ok": true, "next": "n7", "react": ["sam", "Oh no. Fine, but I'm warning you, I dance like a penguin.", "Oh non. Bon, d'accord, mais je vous préviens, je danse comme un pingouin."]}, {"en": "I can't, I'm cooking dinner for twenty people right now.", "fr": "Je ne peux pas, je prépare le dîner pour vingt personnes, là.", "ok": false, "tip": "Une excuse un peu bizarre ! Liv propose de danser tous ensemble pour faire sourire Maya : accepte avec enthousiasme."}], "open": {"model": ["Yes! Let's turn up the music and dance it out together!", "Oui ! Montons le son et dansons tous ensemble pour oublier !"], "react": ["liv", "That's the spirit! Five, six, seven, eight!", "Voilà l'esprit ! Cinq, six, sept, huit !"], "next": "n7"}}}, "n7": {"say": [["maya", "Ha ha! Sam, what was that move? A propeller?", "Ha ha ! Sam, c'était quoi, ce mouvement ? Une hélice ?"], ["sam", "It's called the pilot shuffle. Very advanced.", "Ça s'appelle le pas du pilote. Très technique."], ["maya", "Okay, I'm actually laughing now. Capucine, if you come back in the spring, will you watch my next tournament?", "Bon, là, je rigole pour de vrai. Capucine, si tu reviens au printemps, tu viendras voir mon prochain tournoi ?"]], "ask": {"prompt": "Réponds à Maya avec if + présent et will + verbe.", "options": [{"en": "Of course! If I come in the spring, I'll be in the front row.", "fr": "Bien sûr ! Si je viens au printemps, je serai au premier rang.", "ok": true, "next": "n8", "react": ["maya", "Deal! And if you're in the front row, we'll definitely win.", "Marché conclu ! Et si tu es au premier rang, on gagnera, c'est sûr."]}, {"en": "If my parents agree, I'll definitely come and cheer for you!", "fr": "Si mes parents sont d'accord, je viendrai t'encourager, c'est sûr !", "ok": true, "next": "n8", "react": ["liv", "And if you two film it, I'll watch it from Manchester!", "Et si vous filmez, je le regarderai depuis Manchester !"]}, {"en": "If it rains tomorrow, I took my umbrella.", "fr": "S'il pleut demain, j'ai pris mon parapluie.", "ok": false, "tip": "Attention à la grammaire : après if + présent, on utilise will (« If it rains, I'll take my umbrella »). Et réponds à la question de Maya !"}], "open": {"model": ["If I can come back in the spring, I'll cheer louder than anyone!", "Si je peux revenir au printemps, j'encouragerai plus fort que tout le monde !"], "react": ["maya", "I'm holding you to that, Capucine!", "Je te prends au mot, Capucine !"], "next": "n8"}}}, "n8": {"say": [["liv", "Right, my lovelies, I've got a class to teach. Maya, be kind to yourself tonight.", "Bon, mes chéries, j'ai un cours à donner. Maya, sois gentille avec toi-même ce soir."], ["sam", "And remember: every great pilot has had a bumpy landing or two.", "Et souviens-toi : tous les grands pilotes ont raté un atterrissage ou deux."], ["maya", "Thanks, everyone. Best support team ever. Bye!", "Merci, tout le monde. Meilleure équipe de soutien du monde. Salut !"]], "end": true}}, "quiz": [{"q": "Quel était le score de la finale ?", "opts": ["Trois sets à deux", "Trois sets à zéro", "Deux sets à un"], "a": 0}, {"q": "Pourquoi Sam arrive-t-il en retard ?", "opts": ["Il avait un cours de danse", "Son vol a été retardé", "Il regardait un match"], "a": 1}, {"q": "Qu'est-il arrivé à Sam quand il avait vingt ans ?", "opts": ["Il a gagné un tournoi de volley", "Il a fait son premier vol", "Il a raté son premier examen de vol"], "a": 2}]}, {"id": "s3-choreography", "level": 3, "title": "Notre chorégraphie", "setting": "studio", "cast": ["liv", "maya"], "intro": "À l'atelier d'été de Liv, chaque duo doit créer sa propre chorégraphie sur une chanson de son choix. Tu fais équipe avec Maya, et Liv passe voir où vous en êtes.", "start": "n1", "nodes": {"n1": {"say": [["liv", "Right, my favourite duo! Have you two chosen your song yet?", "Alors, mon duo préféré ! Vous avez choisi votre chanson ?"], ["maya", "We've been arguing about it for twenty minutes. I want K-pop, obviously.", "Ça fait vingt minutes qu'on se dispute. Moi, je veux de la K-pop, évidemment."], ["maya", "Capucine, tell Liv what you'd like to dance to.", "Capucine, dis à Liv sur quoi tu aimerais danser."]], "ask": {"prompt": "Dis à Liv quel genre de musique tu aimerais et pourquoi.", "options": [{"en": "I'd love an upbeat pop song with a really strong beat, because it's easier to follow.", "fr": "J'aimerais une chanson pop entraînante avec un rythme bien marqué, parce que c'est plus facile à suivre.", "ok": true, "next": "n2", "react": ["liv", "Good thinking. A clear beat makes counting much easier.", "Bien vu. Un rythme net, ça facilite beaucoup le comptage."]}, {"en": "Maybe something slower, like a Billie Eilish song. Her music is so emotional.", "fr": "Peut-être un truc plus lent, comme une chanson de Billie Eilish. Sa musique est tellement émouvante.", "ok": true, "next": "n2s", "react": ["liv", "Ooh, lovely. Slow songs are harder, but they can be really powerful.", "Oh, joli. Les chansons lentes sont plus difficiles, mais elles peuvent être très fortes."]}, {"en": "I'd like a pizza with extra cheese, please.", "fr": "J'aimerais une pizza avec plein de fromage, s'il te plaît.", "ok": false, "tip": "Liv parle de la chanson pour la chorégraphie, pas de ton repas ! Dis quel genre de musique tu préfères."}], "open": {"model": ["I'd like a pop song with a big chorus, because the energy is amazing.", "J'aimerais une chanson pop avec un gros refrain, parce que l'énergie est géniale."], "react": ["maya", "Yes! Big chorus, big moves. I'm in!", "Oui ! Gros refrain, gros mouvements. Je suis partante !"], "next": "n2"}}}, "n2": {"say": [["liv", "Brilliant. Maya, would you be happy with a Dua Lipa track? It's pop, but very danceable.", "Génial. Maya, ça t'irait, un morceau de Dua Lipa ? C'est de la pop, mais très dansante."], ["maya", "Dua Lipa? Okay, I can live with that. Her songs are total bops.", "Dua Lipa ? Bon, ça me va. Ses chansons sont de vraies pépites."], ["liv", "Perfect. Let's listen to the intro first and count the beats.", "Parfait. On écoute d'abord l'intro et on compte les temps."]], "next": "n3"}, "n2s": {"say": [["maya", "Slow? But I've never danced to a slow song! What if I fall asleep?", "Lent ? Mais je n'ai jamais dansé sur une chanson lente ! Et si je m'endors ?"], ["liv", "Ha! You won't. Slow music is perfect for showing control and feelings.", "Ha ! Mais non. La musique lente, c'est parfait pour montrer la maîtrise et les émotions."], ["liv", "Right, let's listen to the beginning together and count the beats.", "Bon, écoutons le début ensemble et comptons les temps."]], "next": "n3"}, "n3": {"say": [["liv", "Listen. Can you hear the drums? Five, six, seven, eight... and the beat drops here!", "Écoutez. Vous entendez la batterie ? Cinq, six, sept, huit... et le rythme explose ici !"], ["liv", "Capucine, how does this part make you feel? It'll help us choose the moves.", "Capucine, qu'est-ce que ce passage te fait ressentir ? Ça va nous aider à choisir les mouvements."]], "ask": {"prompt": "Explique à Liv ce que la musique te fait ressentir.", "options": [{"en": "It makes me feel powerful, like I'm about to serve in a big match.", "fr": "Ça me donne une impression de force, comme quand je vais servir dans un grand match.", "ok": true, "next": "n4", "react": ["maya", "Ha! Volleyball choreography! We could add a spike move!", "Ha ! Une chorégraphie volley ! On pourrait ajouter un mouvement de smash !"]}, {"en": "It makes me feel light and free, like I'm flying above the clouds.", "fr": "Je me sens légère et libre, comme si je volais au-dessus des nuages.", "ok": true, "next": "n4", "react": ["liv", "Gorgeous image. We could use big arm movements, like wings.", "Superbe image. On pourrait faire de grands mouvements de bras, comme des ailes."]}, {"en": "It makes me hungry, because it's half past twelve.", "fr": "Ça me donne faim, parce qu'il est midi et demi.", "ok": false, "tip": "Liv te demande l'émotion que la musique t'inspire : la joie, la force, la liberté... Pas ton estomac !"}], "open": {"model": ["It makes me want to jump and move my whole body, because the rhythm is so strong.", "Ça me donne envie de sauter et de bouger tout mon corps, parce que le rythme est super fort."], "react": ["liv", "That's exactly the feeling we need to show the audience.", "C'est exactement le sentiment qu'il faut montrer au public."], "next": "n4"}}}, "n4": {"say": [["liv", "Okay, let's build the first eight counts. Who's got an idea for the opening?", "Bon, construisons les huit premiers temps. Qui a une idée pour le début ?"], ["maya", "What if we start back to back, then turn around really slowly?", "Et si on commençait dos à dos, et qu'on se retournait tout doucement ?"], ["liv", "Capucine, do you agree, or have you got a different idea?", "Capucine, tu es d'accord, ou tu as une autre idée ?"]], "ask": {"prompt": "Donne ton avis sur l'idée de Maya et propose quelque chose.", "options": [{"en": "I love it! And then we could jump at the same time on count eight.", "fr": "J'adore ! Et après, on pourrait sauter en même temps sur le huit.", "ok": true, "next": "n5", "react": ["liv", "Ooh, a jump on eight. Very dramatic. I approve!", "Oh, un saut sur le huit. Très spectaculaire. J'approuve !"]}, {"en": "Good idea, but I think we should start on the floor and stand up slowly.", "fr": "Bonne idée, mais je pense qu'on devrait commencer au sol et se lever lentement.", "ok": true, "next": "n5", "react": ["maya", "Ooh, that's even better! Like we're waking up!", "Oh, c'est encore mieux ! Comme si on se réveillait !"]}, {"en": "I don't agree, because I've never been to Paris.", "fr": "Je ne suis pas d'accord, parce que je ne suis jamais allée à Paris.", "ok": false, "tip": "Ton avis doit être lié à l'idée de Maya. Dis si tu es d'accord et propose un mouvement."}], "open": {"model": ["That's a great idea! If we turn on count four, it'll look really clean.", "Super idée ! Si on se retourne sur le quatre, ce sera vraiment net."], "react": ["liv", "Lovely, very precise. You've clearly got a choreographer's brain.", "Joli, très précis. Tu as vraiment un cerveau de chorégraphe."], "next": "n5"}}}, "n5": {"say": [["maya", "Okay, let's try. Turn, jump... oops! I've just landed on your foot, Capucine. Sorry!", "Bon, on essaie. On tourne, on saute... oups ! Je viens d'atterrir sur ton pied, Capucine. Pardon !"], ["liv", "That's why we always mark the moves slowly first. Capucine, are you all right?", "C'est pour ça qu'on fait toujours les mouvements lentement d'abord. Capucine, ça va ?"]], "ask": {"prompt": "Rassure Maya et Liv.", "options": [{"en": "Don't worry, I'm fine! It didn't really hurt.", "fr": "Ne t'inquiète pas, ça va ! Ça ne m'a pas vraiment fait mal.", "ok": true, "next": "n6", "react": ["maya", "Phew! Okay, I'll give you more space this time.", "Ouf ! Bon, je te laisse plus de place cette fois."]}, {"en": "I'm okay! But maybe we should practise without the music first.", "fr": "Ça va ! Mais on devrait peut-être s'entraîner sans la musique d'abord.", "ok": true, "next": "n6", "react": ["liv", "Very sensible. Slow it down, then speed it up. That's how professionals work.", "Très raisonnable. D'abord lentement, puis plus vite. C'est comme ça que travaillent les pros."]}, {"en": "I'm going to call the police!", "fr": "Je vais appeler la police !", "ok": false, "tip": "C'était un petit accident entre amies ! Rassure-les avec une phrase comme « Don't worry, I'm fine! »."}], "open": {"model": ["No worries, I'm fine! Let's try it again, a bit more slowly this time.", "Pas de souci, ça va ! On réessaie, un peu plus lentement cette fois."], "react": ["maya", "More slowly. Got it. My feet promise to behave.", "Plus lentement. Compris. Mes pieds promettent d'être sages."], "next": "n6"}}}, "n6": {"say": [["liv", "Much better! Now, the chorus. The music gets bigger here, so the moves should too.", "Beaucoup mieux ! Maintenant, le refrain. La musique devient plus forte ici, donc les mouvements aussi."], ["maya", "Can we add something from our hobbies? Like a volleyball block, or a plane?", "On peut ajouter un truc de nos passions ? Comme un contre au volley, ou un avion ?"], ["liv", "I love that. Capucine, what move could show something you love?", "J'adore. Capucine, quel mouvement pourrait montrer quelque chose que tu aimes ?"]], "ask": {"prompt": "Propose un mouvement inspiré de tes passions.", "options": [{"en": "We could stretch our arms out like wings and lean to the side, like a plane turning.", "fr": "On pourrait tendre les bras comme des ailes et se pencher sur le côté, comme un avion qui tourne.", "ok": true, "next": "n7", "react": ["liv", "A banking turn! Sam would be so proud. Let's try it.", "Un virage incliné ! Sam serait trop fier. Essayons."]}, {"en": "We could jump with our hands up, like a volleyball block!", "fr": "On pourrait sauter les mains en l'air, comme un contre au volley !", "ok": true, "next": "n7", "react": ["maya", "Yes! Block party! That's going in for sure.", "Oui ! La fête du contre ! Ça, on le garde, c'est sûr."]}, {"en": "We could sit down and check our phones.", "fr": "On pourrait s'asseoir et regarder nos téléphones.", "ok": false, "tip": "Le refrain doit être plein d'énergie ! Propose un mouvement inspiré du volley, de l'aviation ou de la danse."}], "open": {"model": ["We could do a spin and finish with our arms up, like a plane taking off.", "On pourrait faire une pirouette et finir les bras levés, comme un avion qui décolle."], "react": ["liv", "Fabulous! That's going to look amazing on stage.", "Fabuleux ! Ça va être magnifique sur scène."], "next": "n7"}}}, "n7": {"say": [["liv", "Right, let's run it from the top. Five, six, seven, eight!", "Allez, on reprend depuis le début. Cinq, six, sept, huit !"], ["maya", "That was so much fun! We actually look like real dancers!", "C'était trop bien ! On ressemble vraiment à de vraies danseuses !"], ["liv", "You are real dancers! Capucine, what have you learned today?", "Vous êtes de vraies danseuses ! Capucine, qu'est-ce que tu as appris aujourd'hui ?"]], "ask": {"prompt": "Dis à Liv ce que tu as appris aujourd'hui, avec le present perfect.", "options": [{"en": "I've learned how to count the music and build a routine step by step.", "fr": "J'ai appris à compter la musique et à construire une chorégraphie étape par étape.", "ok": true, "next": "n8", "react": ["liv", "Exactly what I hoped. You've got the method now.", "Exactement ce que j'espérais. Maintenant, tu as la méthode."]}, {"en": "I've learned that it's fine to make mistakes, as long as we keep trying.", "fr": "J'ai appris que ce n'est pas grave de se tromper, tant qu'on continue d'essayer.", "ok": true, "next": "n8", "react": ["maya", "And to keep your feet away from me! Sorry again!", "Et à garder tes pieds loin de moi ! Encore pardon !"]}, {"en": "I learned yesterday a new song in the car.", "fr": "J'ai appris hier une nouvelle chanson dans la voiture.", "ok": false, "tip": "Utilise le present perfect pour parler de ce que tu as appris aujourd'hui : « I've learned... ». Et parle de la danse !"}], "open": {"model": ["I've learned that a good choreography starts with really listening to the music.", "J'ai appris qu'une bonne chorégraphie commence par une vraie écoute de la musique."], "react": ["liv", "Beautifully put. That's the most important lesson of all.", "Joliment dit. C'est la leçon la plus importante de toutes."], "next": "n8"}}}, "n8": {"say": [["liv", "Brilliant work, both of you. Same time tomorrow, and we'll add the ending.", "Super travail, toutes les deux. Même heure demain, et on ajoutera la fin."], ["maya", "Can we finish with a pose? Like, a really dramatic one?", "On peut finir sur une pose ? Genre, une pose ultra dramatique ?"], ["liv", "Ha! I wouldn't expect anything less from you, Maya.", "Ha ! Je n'en attendais pas moins de toi, Maya."]], "end": true}}, "quiz": [{"q": "Quel genre de musique Maya voulait-elle au départ ?", "opts": ["Du rock", "De la K-pop", "Du jazz"], "a": 1}, {"q": "Qu'est-ce que Maya propose pour le début de la chorégraphie ?", "opts": ["Commencer dos à dos et se retourner lentement", "Commencer par un grand saut", "Commencer assises par terre"], "a": 0}, {"q": "Que se passe-t-il pendant le premier essai ?", "opts": ["Liv tombe", "La musique s'arrête", "Maya te marche sur le pied"], "a": 2}]}, {"id": "s3-dream-jobs", "level": 3, "title": "Les métiers de nos rêves", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "Appel vidéo en groupe ! Pour un projet d'école sur les métiers, Maya doit interroger des adultes sur leur parcours. Liv et Sam ont accepté de répondre, et tout le monde veut aussi connaître tes rêves à toi.", "start": "n1", "nodes": {"n1": {"say": [["maya", "Okay, everyone, thanks for joining! I'm taking notes for my careers project at school.", "Bon, merci à tous d'être là ! Je prends des notes pour mon projet d'école sur les métiers."], ["liv", "Ooh, an interview! I feel like a proper celebrity!", "Oh, une interview ! Je me sens comme une vraie star !"], ["maya", "Capucine, you can ask questions too. Who do you want to start with?", "Capucine, tu peux poser des questions aussi. Tu veux commencer par qui ?"]], "ask": {"prompt": "Pose une question à Liv ou à Sam sur son métier.", "options": [{"en": "Sam, how did you become a pilot? Was it difficult?", "fr": "Sam, comment tu es devenu pilote ? C'était difficile ?", "ok": true, "next": "n2a", "react": ["sam", "Great question. It was hard work, but worth every minute.", "Excellente question. Ça a demandé beaucoup de travail, mais ça en valait la peine."]}, {"en": "Liv, when did you decide to become a dance teacher?", "fr": "Liv, quand est-ce que tu as décidé de devenir prof de danse ?", "ok": true, "next": "n2b", "react": ["liv", "Ooh, good one. Let me tell you a little story.", "Oh, bonne question. Laisse-moi te raconter une petite histoire."]}, {"en": "Maya, where did you buy your notebook?", "fr": "Maya, où est-ce que tu as acheté ton carnet ?", "ok": false, "tip": "C'est une interview sur les métiers ! Pose une question à Liv ou à Sam sur leur travail."}], "open": {"model": ["Sam, what's the best thing about being an airline pilot?", "Sam, qu'est-ce qu'il y a de mieux dans le métier de pilote de ligne ?"], "react": ["sam", "Easy. The view from my office window. It changes every single day.", "Facile. La vue depuis la fenêtre de mon bureau. Elle change tous les jours."], "next": "n2a"}}}, "n2a": {"say": [["sam", "I had my first flying lesson at sixteen, at a little club just like ours.", "J'ai eu ma première leçon de pilotage à seize ans, dans un petit club comme le nôtre."], ["sam", "Then I got my licences, built up my flying hours, and joined an airline at twenty-six.", "Ensuite, j'ai passé mes licences, j'ai accumulé des heures de vol, et je suis entré dans une compagnie aérienne à vingt-six ans."], ["maya", "Wow. And Capucine has already flown a plane. She's way ahead of you, Sam!", "Waouh. Et Capucine a déjà piloté un avion. Elle a une sacrée avance sur toi, Sam !"]], "next": "n3"}, "n2b": {"say": [["liv", "I've danced since I was four, but I only decided to teach when I was eighteen.", "Je danse depuis l'âge de quatre ans, mais je n'ai décidé d'enseigner qu'à dix-huit ans."], ["liv", "I helped at a kids' class one summer, and I absolutely loved it.", "Un été, j'ai aidé dans un cours pour enfants, et j'ai complètement adoré."], ["maya", "Aww. So one summer changed your whole life!", "Oh, trop bien. Donc un seul été a changé toute ta vie !"]], "next": "n3"}, "n3": {"say": [["sam", "Right, Maya, enough about us. Let's hear from the next generation. Capucine?", "Bon, Maya, assez parlé de nous. Écoutons la nouvelle génération. Capucine ?"], ["liv", "Yes! What would you love to do when you're older?", "Oui ! Qu'est-ce que tu aimerais faire plus tard ?"]], "ask": {"prompt": "Parle de ton métier de rêve et explique pourquoi.", "options": [{"en": "I'd love to be an airline pilot, because I've always loved planes and travelling.", "fr": "J'aimerais être pilote de ligne, parce que j'ai toujours adoré les avions et les voyages.", "ok": true, "next": "n4p", "react": ["sam", "Music to my ears! We need more young pilots, especially young women.", "Ça me fait plaisir à entendre ! On a besoin de plus de jeunes pilotes, surtout de jeunes femmes."]}, {"en": "I'm not sure yet. Maybe something with dance or sport. I love moving!", "fr": "Je ne sais pas encore. Peut-être un truc avec la danse ou le sport. J'adore bouger !", "ok": true, "next": "n4d", "react": ["liv", "You don't have to decide now. Lots of people change paths, and that's fine.", "Tu n'as pas besoin de décider maintenant. Plein de gens changent de voie, et c'est très bien."]}, {"en": "I'd love to be a banana.", "fr": "J'aimerais être une banane.", "ok": false, "tip": "Ha ha ! Sois sérieuse (un peu) : parle d'un vrai métier et explique pourquoi il te plaît avec « because »."}], "open": {"model": ["I'd love to work in aviation, maybe as a pilot, because flying makes me so happy.", "J'aimerais travailler dans l'aviation, peut-être comme pilote, parce que voler me rend tellement heureuse."], "react": ["sam", "That's exactly how it started for me. Hold on to that feeling.", "C'est exactement comme ça que ça a commencé pour moi. Garde bien ce sentiment."], "next": "n4p"}}}, "n4p": {"say": [["sam", "If you want to be a pilot, you'll need maths, physics and, of course, excellent English.", "Si tu veux être pilote, il te faudra des maths, de la physique et, bien sûr, un excellent anglais."], ["maya", "See? That's why you talk to us. We're basically your training!", "Tu vois ? C'est pour ça que tu nous parles. On est carrément ta formation !"], ["sam", "Capucine, what do you think is the hardest part of becoming a pilot?", "Capucine, à ton avis, qu'est-ce qui est le plus dur pour devenir pilote ?"]], "ask": {"prompt": "Réponds à Sam : quelle est, selon toi, la partie la plus difficile ?", "options": [{"en": "I think the exams must be really hard, because there's so much to learn.", "fr": "Je pense que les examens doivent être très durs, parce qu'il y a tellement de choses à apprendre.", "ok": true, "next": "n5", "react": ["sam", "There's a lot, yes. But you learn it bit by bit, like a language.", "Il y en a beaucoup, oui. Mais on apprend petit à petit, comme une langue."]}, {"en": "Maybe being away from home a lot. You must miss your family sometimes.", "fr": "Peut-être d'être souvent loin de chez soi. Ta famille doit te manquer parfois.", "ok": true, "next": "n5", "react": ["sam", "Good point. I do, but video calls help a lot. Like this one!", "Bien vu. Elle me manque, oui, mais les appels vidéo aident beaucoup. Comme celui-ci !"]}, {"en": "The hardest part is choosing a nice uniform.", "fr": "Le plus dur, c'est de choisir un bel uniforme.", "ok": false, "tip": "Pense aux vraies difficultés : les examens, la formation, les horaires... Donne une raison sérieuse."}], "open": {"model": ["I think it must be hard to stay calm when something goes wrong in the air.", "Je pense que ça doit être dur de rester calme quand quelque chose ne va pas en vol."], "react": ["sam", "Spot on. That's why we train so much in simulators.", "Tout à fait. C'est pour ça qu'on s'entraîne autant sur simulateur."], "next": "n5"}}}, "n4d": {"say": [["liv", "Honestly, lots of dancers also teach, create choreographies or work in theatre. There are loads of options.", "Franchement, beaucoup de danseurs enseignent aussi, créent des chorégraphies ou travaillent au théâtre. Il y a plein de possibilités."], ["maya", "And some physios work with dancers and athletes! That's my dream job, actually.", "Et certains kinés travaillent avec des danseurs et des sportifs ! C'est mon métier de rêve, en fait."], ["liv", "Capucine, which job sounds the most interesting to you?", "Capucine, quel métier te paraît le plus intéressant ?"]], "ask": {"prompt": "Dis à Liv quel métier te tente le plus et pourquoi.", "options": [{"en": "Choreographer! I love creating moves and telling a story with music.", "fr": "Chorégraphe ! J'adore inventer des mouvements et raconter une histoire en musique.", "ok": true, "next": "n5", "react": ["liv", "A fellow choreographer! I had a feeling about you from day one.", "Une future collègue chorégraphe ! Je le sentais depuis le premier jour."]}, {"en": "Maybe a sports physio, like Maya. I like the idea of helping people get better.", "fr": "Peut-être kiné du sport, comme Maya. J'aime l'idée d'aider les gens à aller mieux.", "ok": true, "next": "n5", "react": ["maya", "Yes! We could work together one day. Team physio!", "Oui ! On pourrait travailler ensemble un jour. Team kiné !"]}, {"en": "The most interesting job is sleeping.", "fr": "Le métier le plus intéressant, c'est dormir.", "ok": false, "tip": "Choisis un des métiers dont parlent Liv et Maya (prof, chorégraphe, kiné...) et explique pourquoi il te plaît."}], "open": {"model": ["Choreographer sounds amazing, because you can mix music, dance and creativity.", "Chorégraphe, ça a l'air génial, parce qu'on peut mélanger musique, danse et créativité."], "react": ["liv", "Exactly! It's the best job in the world, in my humble opinion.", "Exactement ! C'est le plus beau métier du monde, à mon humble avis."], "next": "n5"}}}, "n5": {"say": [["maya", "Okay, last question for my project. What advice would you give to people our age?", "Bon, dernière question pour mon projet. Quel conseil vous donneriez à des jeunes de notre âge ?"], ["liv", "Mine is simple: try lots of different things. You never know what you'll love.", "Le mien est simple : essayez plein de choses différentes. On ne sait jamais ce qu'on va adorer."], ["sam", "And mine: don't be afraid of making mistakes. That's how you learn.", "Et le mien : n'ayez pas peur de vous tromper. C'est comme ça qu'on apprend."], ["maya", "Capucine, your turn! What advice would you give to younger kids?", "Capucine, à toi ! Quel conseil tu donnerais à des plus jeunes ?"]], "ask": {"prompt": "Donne un conseil à des plus jeunes, avec should ou don't have to.", "options": [{"en": "You should follow your passions, even if they seem a bit unusual.", "fr": "Vous devriez suivre vos passions, même si elles paraissent un peu bizarres.", "ok": true, "next": "n6", "react": ["liv", "Gorgeous advice. Unusual passions are often the best ones.", "Magnifique conseil. Les passions originales sont souvent les meilleures."]}, {"en": "You don't have to know your dream job now. Just enjoy learning!", "fr": "Vous n'avez pas besoin de connaître votre métier de rêve maintenant. Profitez d'apprendre !", "ok": true, "next": "n6", "react": ["sam", "Wise words. Much wiser than me at your age!", "Sages paroles. Bien plus sages que moi à ton âge !"]}, {"en": "You should never do your homework.", "fr": "Vous ne devriez jamais faire vos devoirs.", "ok": false, "tip": "Ce conseil ne va pas plaire aux profs ! Donne un vrai conseil utile, avec should ou don't have to."}], "open": {"model": ["You should work hard, but you should also have fun along the way.", "Vous devriez travailler dur, mais aussi vous amuser en chemin."], "react": ["maya", "Writing that down. Perfect ending for my project!", "Je le note. Fin parfaite pour mon projet !"], "next": "n6"}}}, "n6": {"say": [["maya", "Thank you so much, everyone! I'm going to get an A on this project, I can feel it.", "Merci beaucoup, tout le monde ! Je vais avoir une super note à ce projet, je le sens."], ["sam", "Good luck, Maya. And Capucine, the club organises airport visits. Ask your parents and sign up!", "Bonne chance, Maya. Et Capucine, le club organise des visites d'aéroport. Demande à tes parents et inscris-toi !"], ["liv", "And I'll save you both a place at next summer's workshop!", "Et je vous garde une place à toutes les deux pour l'atelier de l'été prochain !"]], "end": true}}, "quiz": [{"q": "Pourquoi Maya pose-t-elle des questions à tout le monde ?", "opts": ["Pour un projet d'école sur les métiers", "Pour un article de journal", "Pour une émission de radio"], "a": 0}, {"q": "Quel est le conseil de Sam ?", "opts": ["Voyager le plus possible", "Ne pas avoir peur de se tromper", "Faire du sport tous les jours"], "a": 1}, {"q": "Qu'est-ce que Liv propose à la fin ?", "opts": ["Un cours de pilotage", "Un billet de concert", "Une place à l'atelier de l'été prochain"], "a": 2}]}, {"id": "s4-climate-debate", "level": 4, "title": "Faut-il moins prendre l'avion ?", "setting": "videocall", "cast": ["maya", "liv", "sam"], "intro": "Appel vidéo en groupe. Maya prépare un débat pour l'école sur une question délicate : faut-il limiter les voyages en avion pour protéger le climat ? Chacun donne son avis, avec respect, nuance... et un peu d'humour.", "start": "n1", "nodes": {"n1": {"say": [["maya", "Okay, team, I need help. My debate topic is: should flying be limited to protect the climate?", "Bon, l'équipe, j'ai besoin d'aide. Mon sujet de débat, c'est : faut-il limiter l'avion pour protéger le climat ?"], ["liv", "Ooh, controversial! And we've got an airline pilot on the call. This should be interesting.", "Oh, sujet sensible ! Et on a un pilote de ligne dans l'appel. Ça promet d'être intéressant."], ["sam", "Don't worry, I'll try to be objective. Mostly.", "Pas d'inquiétude, je vais essayer d'être objectif. En gros."], ["maya", "Capucine, you start. What's your gut reaction?", "Capucine, tu commences. C'est quoi ta première réaction, à chaud ?"]], "ask": {"prompt": "Donne ta première réaction, de façon nuancée.", "options": [{"en": "It's a tricky one. I love planes, but I can't ignore their impact on the climate.", "fr": "C'est délicat. J'adore les avions, mais je ne peux pas ignorer leur impact sur le climat.", "ok": true, "next": "n2", "react": ["sam", "Honest answer. Plenty of pilots feel exactly the same, believe me.", "Réponse honnête. Beaucoup de pilotes ressentent exactement la même chose, crois-moi."]}, {"en": "I think we should fly less, but banning flights altoget
