  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", Roboto, "Segoe UI", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --paper:#18213A; --ink:#EAF0FA; --muted:#A6B2C9; --line:#2D3A57;
    --blue:#8BAEFF; --blue-ink:#0E1524; --blue-soft:#22325A;
    --red:#FF8197; --sun:#F2C14E; --sun-soft:#3A3220;
    --ok:#62CF95; --ok-soft:#173A2A; --bad:#FF8E85; --bad-soft:#40201E;
    --stamp-edge:#33415F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --paper:#18213A; --ink:#EAF0FA; --muted:#A6B2C9; --line:#2D3A57;
  --blue:#8BAEFF; --blue-ink:#0E1524; --blue-soft:#22325A;
  --red:#FF8197; --sun:#F2C14E; --sun-soft:#3A3220;
  --ok:#62CF95; --ok-soft:#173A2A; --bad:#FF8E85; --bad-soft:#40201E;
  --stamp-edge:#33415F; color-scheme:dark;
}
html{font-size:calc(clamp(17px, 0.9vw + 11px, 20px) * var(--scale));-webkit-text-size-adjust:100%}

*{box-sizing:border-box}

.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}

.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sun-soft);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.tabrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 2px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;min-width:0}

main{padding-block:20px 120px}

h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:28px 0 12px}
.lead{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--red)}
.en{font-weight:700;font-size:1.2rem;line-height:1.3}
.frtxt{color:var(--muted)}
.pron{color:var(--muted);font-style:italic;font-size:.92rem}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;background:var(--blue);color:var(--blue-ink);text-align:center}

.say{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:6px 14px;border-radius:999px;border:2px solid var(--blue);background:var(--paper);color:var(--blue);font-weight:700;font-size:.9rem;cursor:pointer}

.back{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:8px 0;min-height:46px;font-size:1rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.daily{display:flex;flex-direction:column;gap:14px;border:7px solid;border-image:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--paper) 10px 16px,var(--blue) 16px 26px,var(--paper) 26px 32px) 7;background:var(--paper);padding:20px}

.goal{display:flex;align-items:center;gap:16px}

.lvtab{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}

.cert{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}

.scenecard{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px}

.faces{display:flex;flex:none}

.scenecard .t{font-weight:700;font-size:1.05rem}

/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.stamp-t{font-weight:700;font-size:1.02rem;line-height:1.25}

/* lists */
.plist{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.wcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;min-height:180px;justify-content:center}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px}

@media (max-width:560px){.actions{grid-template-columns:1fr}}
.gexp p{margin:0 0 10px;max-width:65ch}
.gex{background:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* visuals */
.vis{display:inline-grid;place-items:center;line-height:1;flex:none}
.emo{font-family:var(--f-emoji);font-size:3rem}
.sw{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--c);border:2px solid var(--line)}

.txt{font-weight:700;font-size:1rem;letter-spacing:.06em;border:2px solid var(--line);border-top:10px solid var(--red);border-radius:8px;width:3.4rem;height:3.4rem;background:var(--paper)}
.vis.xl.emo{font-size:6.5rem}.vis.xl.sw{width:7rem;height:7rem}.vis.xl.num{font-size:6rem}.vis.xl.txt{width:7rem;height:7rem;font-size:1.8rem;border-top-width:18px}
.vis.md.emo{font-size:3.6rem}.vis.md.sw{width:3.8rem;height:3.8rem}.vis.md.num{font-size:3.2rem}

.lhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lhead .bar{height:14px}
.quit{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:6px 14px;font-weight:700;cursor:pointer}
.qtitle{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 14px}
.prompt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.prompt.center{align-items:center;text-align:center}
.prompt .big{font-size:1.45rem;font-weight:700;line-height:1.3}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--blue);color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);border-radius:14px;padding:14px 16px;min-height:62px;text-align:left;font-size:1.06rem;cursor:pointer;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picgrid .opt{display:grid;place-items:center;min-height:140px;text-align:center;padding:10px}
.bigspeak{width:120px;height:120px;border-radius:50%;border:0;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;cursor:pointer;margin:6px auto}
.bigspeak svg{width:56px;height:56px;stroke:currentColor}
.center{text-align:center}
.ans{width:100%;font-size:1.25rem;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:60px}
.ans.good{border-color:var(--ok);background:var(--ok-soft)} .ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;margin:4px auto}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,57,58,.55)}100%{box-shadow:0 0 0 24px rgba(194,57,58,0)}}
.heard{background:var(--bg);border-radius:12px;padding:10px 14px;min-height:46px}

.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);border-radius:12px;padding:10px 14px;font-size:1.08rem;font-weight:700;cursor:pointer;min-height:52px}

.fb{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-bottom:12px}

.donebox{background:var(--paper);border:1px solid var(--line);overflow:hidden;border-radius:6px}

/* listening loop */
.player{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

/* avatars & scenes */

.tile-av{position:relative;border-radius:18px;overflow:hidden;background:var(--set1);aspect-ratio:200/220;max-width:100%;box-shadow:0 0 0 2px var(--line);transition:box-shadow .2s}

.set-cockpit{--set1:linear-gradient(160deg,#5B6B86,#26324A)}
.set-school{--set1:linear-gradient(160deg,#E3EEE6,#A8C9B3)}
.set-cafe{--set1:linear-gradient(160deg,#E8D2BC,#A57B5B)}

.set-videocall{--set1:linear-gradient(160deg,#D9DEF0,#8F9BC4)}

.av .mv{display:none}

.transcript{display:flex;flex-direction:column;gap:12px}

.who{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);display:flex;align-items:center;gap:8px}

.msg .tools{display:flex;gap:8px;flex-wrap:wrap}
.msg .tools button{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:40px;padding:4px 12px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink)}
.askp{background:var(--paper);border:2px solid var(--blue);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.askp .ptitle{font-weight:700;font-size:1.05rem}
.askrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.askrow .mic{width:78px;height:78px;margin:0}
.askrow .mic svg{width:36px;height:36px}
.notice{background:var(--sun-soft);border-radius:14px;padding:14px 16px;font-size:.95rem}
.notice.okn{background:var(--ok-soft)} .notice.badn{background:var(--bad-soft)}
.typing{color:var(--muted);font-style:italic}

/* progress */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:400}
.stat span{color:var(--muted);font-size:.85rem}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:520px}
.heat .wk{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--line))}.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--line))}.heat i.l3{background:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.badges{grid-template-columns:repeat(2,1fr)}}
.badge-c{border-radius:16px;padding:14px;text-align:center;border:2px dashed var(--line);color:var(--muted)}
.badge-c.got{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.badge-c b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem}

/* settings */
.set{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.set .t{font-weight:700;font-size:1.05rem}
select{font:inherit;font-size:1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:52px}
input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.switch input{width:28px;height:28px;accent-color:var(--blue);flex:none}
details{background:var(--bg);border-radius:12px;padding:12px 14px}
details summary{font-weight:700;cursor:pointer;min-height:32px}
details ol{margin:8px 0 0;padding-left:22px}
details li{margin-bottom:4px}
textarea.code{width:100%;min-height:90px;font-family:monospace;font-size:.8rem;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.legal{font-size:.8rem;color:var(--muted);margin-top:24px}
.install{display:flex;align-items:center;gap:14px;background:var(--blue-soft);border-radius:18px;padding:14px 16px;margin-bottom:16px}
.install .logo{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}

/* onboarding */
.welcome{display:grid;gap:16px;max-width:900px;margin:0 auto}
.lvchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.lvchoice button{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.lvchoice button:active{border-color:var(--blue)}
.lvchoice b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.lvchoice .ex{font-style:italic;color:var(--muted);font-size:.9rem}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){.opt,.tile,.btn,.wcard,.stamp-in,.lvtab{transition:background .15s,border-color .15s,transform .1s}.btn:active,.opt:active,.tile:active,.wcard:active{transform:scale(.97)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none;outline:4px solid var(--red)}}
@media (max-width:520px){.tab{font-size:12px}.brand h1{font-size:1.15rem}}

exfr": "Cette vidéo de danse est incroyable !"}, {"vis": "🔋", "en": "the battery", "fr": "la batterie", "ex": "My battery is low.", "exfr": "Ma batterie est presque vide."}, {"vis": "🔌", "en": "a charger", "fr": "un chargeur", "ex": "Have you got a charger?", "exfr": "Tu as un chargeur ?"}, {"vis": "🔑", "en": "a password", "fr": "un mot de passe", "ex": "Never share your password.", "exfr": "Ne partage jamais ton mot de passe."}, {"vis": "📶", "en": "Wi-Fi", "fr": "le wifi", "ex": "The Wi-Fi is very slow here.", "exfr": "Le wifi est très lent ici."}, {"vis": "📞", "en": "a call", "fr": "un appel", "ex": "I've got a video call with Maya tonight.", "exfr": "J'ai un appel vidéo avec Maya ce soir."}, {"vis": "🔔", "en": "a notification", "fr": "une notification", "ex": "Turn off your notifications in class!", "exfr": "Désactive tes notifications en cours !"}, {"vis": "🎮", "en": "a game", "fr": "un jeu", "ex": "This game is really fun.", "exfr": "Ce jeu est vraiment marrant."}]}], "grammar": [{"id": "l1-to-be", "title": "Le verbe to be (être)", "expl": ["To be veut dire « être ». Au présent, il change selon le sujet : I am, you are, he is, she is, it is, we are, they are. Attention : you sert à la fois pour « tu » et pour « vous ».", "À l'oral, on contracte presque toujours : I'm, you're, she's, we're. Pour la négation, ajoute not : I'm not tired. Pour une question, inverse : Are you ready? Petit piège : pour ton âge, l'anglais utilise to be. Tu dis I'm fifteen, jamais I have fifteen."], "examples": [{"en": "I'm fifteen and I love volleyball.", "fr": "J'ai quinze ans et j'adore le volley."}, {"en": "Maya is my friend from Vermont.", "fr": "Maya est mon amie du Vermont."}, {"en": "We are ready for the show!", "fr": "On est prêtes pour le spectacle !"}], "items": [{"q": "I ___ a volleyball player.", "a": "am", "opts": ["am", "is", "are", "be"], "fr": "Je suis joueuse de volley."}, {"q": "Maya ___ fifteen years old.", "a": "is", "opts": ["is", "are", "am", "has"], "fr": "Maya "going", "to go"], "fr": "On va au gymnase après les cours."}, {"q": "Liv ___ a dance class on Mondays.", "a": "teaches", "opts": ["teaches", "teach", "teachs", "teaching"], "fr": "Liv donne un cours de danse le lundi."}, {"q": "The flight ___ at ten o'clock.", "a": "leaves", "opts": ["leaves", "leave", "leaving", "to leave"], "fr": "Le vol part à dix heures."}, {"q": "My friends ___ pop music.", "a": "love", "opts": ["love", "loves", "loving", "is love"], "fr": "Mes amis adorent la pop."}, {"q": "She ___ her homework after dinner.", "a": "does", "opts": ["does", "do", "dos", "doing"], "fr": "Elle fait ses devoirs après le dîner."}]}, {"id": "l1-likes", "title": "Dire ce que tu aimes : like, love, hate", "expl": ["Pour parler de tes goûts : I love (j'adore), I like (j'aime bien), I don't like (je n'aime pas), I hate (je déteste). Après ces verbes, mets un nom ou un verbe en -ing : I love dancing, I like pop music.", "Avec he et she, n'oublie pas le -s : Maya loves K-pop. Pour demander, utilise do : Do you like planes? Et réponds court, comme une vraie Anglaise : Yes, I do ou No, I don't."], "examples": [{"en": "I love dancing to pop music.", "fr": "J'adore danser sur de la pop."}, {"en": "Maya likes K-pop a lot.", "fr": "Maya aime beaucoup la K-pop."}, {"en": "Do you like flying? Yes, I do!", "fr": "Tu aimes prendre l'avion ? Oui, j'adore !"}], "items": [{"q": "I love ___ volleyball with my friends.", "a": "playing", "opts": ["playing", "play", "plays", "played"], "fr": "J'adore jouer au volley avec mes amies."}, {"q": "Maya ___ BTS and Billie Eilish.", "a": "likes", "opts": ["likes", "like", "liking", "is like"], "fr": "Maya aime BTS et Billie Eilish."}, {"q": "I ___ like cold weather.", "a": "don't", "opts": ["don't", "doesn't", "not", "am not"], "fr": "Je n'aime pas le froid."}, {"q": "___ you like dancing?", "a": "Do", "opts": ["Do", "Does", "Are", "Have"], "fr": "Tu aimes danser ?"}, {"q": "Sam loves ___ about planes.", "a": "talking", "opts": ["talking", "talk  "are", "is"], "fr": "Tu habites où ?"}, {"q": "What time ___ the match start?", "a": "does", "opts": ["does", "do", "is", "are"], "fr": "Le match commence à quelle heure ?"}, {"q": "My friends ___ like rap music.", "a": "don't", "opts": ["don't", "doesn't", "aren't", "not"], "fr": "Mes amis n'aiment pas le rap."}]}, {"id": "l1-time", "title": "L'heure et les jours : at, on, in", "expl": ["Pour dire l'heure : It's three o'clock (pile), It's quarter past three (et quart), It's half past three (et demie), It's quarter to four (moins le quart). Les anglophones comptent souvent les heures de un à douze, pas jusqu'à vingt-quatre.", "Les petits mots du temps : at pour une heure (at six o'clock), on pour un jour (on Monday), in pour un mois, une saison ou une année (in June, in summer). Et n'oublie pas : les jours et les mois prennent une majuscule !"], "examples": [{"en": "My dance class is on Thursday at five o'clock.", "fr": "Mon cours de danse est le jeudi à dix-sept heures."}, {"en": "The flight is at half past nine.", "fr": "Le vol est à neuf heures et demie."}, {"en": "We've got a big tournament in May.", "fr": "On a un grand tournoi en mai."}], "items": [{"q": "The match is ___ Saturday.", "a": "on", "opts": ["on", "at", "in", "to"], "fr": "Le match est samedi."}, {"q": "My flight is ___ eight o'clock.", "a": "at", "opts": ["at", "on", "in", "for"], "fr": "Mon vol est à huit heures."}, {"q": "The dance show is ___ June.", "a": "in", "opts": ["in", "on", "at", "the"], "fr": "Le spectacle de danse est en juin."}, {"q": "It's half ___ seven.", "a": "past", "opts": ["past", "to", "and", "after"], "fr": "Il est sept heures et demie."}, {"q": "We have training ___ Tuesday evening.", "a": "on", "opts": ["on", "in", "at", "by"], "fr": "On a entraînement mardi soir."}, {"q": "It's quarter ___ five. Hurry up!", "a": "to", "opts": ["to", "past", "for", "before"], "fr": "Il est cinq heures moins le quart. Dépêche-toi !"}, {"q": "It's very cold ___ winter.", "a": "in", "opts": inal."], "pron": "Aweur kôtch sèz wir go-ïng tou pléï inn ze faïneul"}, {"en": "Congratulations! You played really well today.", "fr": "Félicitations ! Tu as super bien joué aujourd'hui.", "alts": ["Well done! You played brilliantly today.", "Great job today, you played so well!"], "pron": "Keunngratchouléïcheunnz ! You pléïd rili wèl toudéï"}, {"en": "I hurt my ankle, so I watched from the bench.", "fr": "Je me suis fait mal à la cheville, alors j'ai regardé depuis le banc.", "alts": [], "pron": "Aï heurt maï ènkeul, sô aï wotcht fromm ze bèntch"}, {"en": "Did you see that spike? It was unstoppable!", "fr": "Tu as vu ce smash ? Il était imparable !", "alts": ["Did you see that spike? Nobody could stop it!"], "pron": "Did you sii zat spaïk ? It woz eunnstopeubeul"}, {"en": "Next time we're going to practise our blocks more.", "fr": "La prochaine fois, on va davantage travailler nos contres.", "alts": ["Next time we'll work on our blocks more."], "pron": "Nèxt taïm wir go-ïng tou praktiss aweur bloks mor"}]}, {"id": "l2-dance-class", "title": "Le cours de danse", "sub": "Suivre les consignes et parler des répétitions", "icon": "star", "p": [{"en": "Let's start with a gentle warm-up for ten minutes.", "fr": "On commence par un échauffement en douceur pendant dix minutes.", "alts": ["Let's begin with an easy warm-up for ten minutes."], "pron": "Lèts stârt wiz eu djènteul worm-eup for tènn minits"}, {"en": "Can you show me that step again, please?", "fr": "Vous pouvez me remontrer ce pas, s'il vous plaît ?", "alts": ["Could you show me that step one more time?"], "pron": "Kann you chô mi zat stèp eguènn, pliz"}, {"en": "I couldn't do the spin last week, but now I can!", "fr": "La semaine dernière, je n'arrivais pas à faire la pirouette, mais maintenant j'y arrive !", "alts": [], "pron": "Aï koudeunt dou ze spinn lâst wiik, beut naou aï kann"}, {"en": "We're learning a new routine for the end-of-year show.", "fr": "On apprend une nouvelle chorégraphie pour le spectacle d et de train au contrôleur."}, {"vis": "🥺", "en": "homesick", "fr": "qui a le mal du pays", "ex": "It's normal to feel homesick for the first few days.", "exfr": "C'est normal d'avoir le mal du pays les premiers jours."}, {"vis": "😵", "en": "jet lag", "fr": "la fatigue du décalage horaire", "ex": "Because of jet lag, I woke up at four in the morning.", "exfr": "À cause du décalage horaire, je me suis réveillée à quatre heures du matin."}, {"vis": "🚌", "en": "a guided tour", "fr": "une visite guidée", "ex": "The guided tour of the airport was the best part.", "exfr": "La visite guidée de l'aéroport était le meilleur moment."}, {"vis": "🕰️", "en": "the time difference", "fr": "le décalage horaire", "ex": "The time difference between France and Vermont is usually six hours.", "exfr": "Le décalage horaire entre la France et le Vermont est en général de six heures."}]}], "grammar": [{"id": "l2-past-simple", "title": "Le prétérit : raconter ce qui s'est passé", "expl": ["Pour raconter une action terminée dans le passé (hier, samedi dernier, il y a deux jours), tu utilises le prétérit. Avec les verbes réguliers, c'est facile : tu ajoutes -ed à la base verbale. Play devient played, dance devient danced, et c'est la même forme pour toutes les personnes.", "Attention aux verbes irréguliers : ils ont leur propre forme, à apprendre par cœur. Les plus utiles : go devient went, win devient won, see devient saw, fly devient flew, have devient had. Astuce : apprends-en cinq par jour en les disant à voix haute !"], "examples": [{"en": "Yesterday we practised our dance for the show.", "fr": "Hier, on a répété notre danse pour le spectacle."}, {"en": "Maya won her match and sent me a video.", "fr": "Maya a gagné son match et m'a envoyé une vidéo."}], "items": [{"q": "Last Saturday we ___ the regional final.", "a": "won", "opts": ["win", "won", "winned", "wins"], "fr": "Samedi dernier, on a gagné la finale régionale."}, {"q": "Yesterday I ___ for two hours with Liv's class.", "a": "danced", "opts": ["dance", "danced", "dancing", "dances"], "fr": "Hier, j'ai dansé pendant deux heures avec le cours de Liv."}, {"q": "We ___ to the airport at six in the morning.", "a": "went", "opts": ["go", "went", "gone", "goed"], "fr": "On est allés à l'aéroport à six heures du matin."}, {"q": "The plane ___ over the mountains before landing.", "a": "flew", "opts": ["flied", "flew", "flown", "fly"], "fr": "L'avion a survolé les montagnes avant d'atterrir."}, {"q": "I ___ Maya on a video call last night.", "a": "called", "opts": ["call", "called", "calling", "calls"], "fr": "Hier soir, j'ai appelé Maya en visio."}, {"q": "We ___ a great time at the concert.", "a": "had", "opts": ["have", "had", "haved", "has"], "fr": "On s'est super bien amusés au concert."}, {"q": "I ___ my favourite singer on stage for the first time!", "a": "saw", "opts": ["see", "saw", "seen", "seed"], "fr": "J'ai vu ma chanteuse préférée sur scène pour la première fois !"}, {"q": "The coach ___ us a new tactic before the match.", "a": "taught", "opts": ["teached", "taught", "teach", "tought"], "fr": "La coach nous a appris une nouvelle tactique avant le match."}]}, {"id": "l2-did-questions", "title": "Le prétérit : questions et négations avec did", "expl": ["Pour poser une question au prétérit, tu mets did devant le sujet, puis le verbe à la base verbale, sans -ed : Did you win? Pour la négation, tu utilises didn't suivi de la base verbale : I didn't win.", "Le piège : comme did porte déjà le passé, le verbe reste à la base. On dit Did you see the match? et jamais Did you saw. Pareil avec didn't : She didn't go, et pas She didn't went."], "examples": [{"en": "Did you watch the final last night?", "fr": "Tu as regardé la finale hier soir ?"}, {"en": "I didn't sleep well before the flight.", "fr": "Je n'ai pas bien dormi avant le vol."}, {"en": "Where did you buy your costume?", "fr": "Où est-ce que tu as acheté ton costume ?"}], "items": [{"q": "___ you enjoy the dance workshop?", "a": "Did", "opts": ["Do", "Did", "Were", "Was"], "fr": "Tu as aimé l'atelier de danse ?"}, {"q": "We didn't ___ the match, but we played well.", "a": "win", "opts": ["win", "won", "wins", "winning"], "fr": "On n'a pas gagné le match, mais on a bien joué."}, {"q": "Did you ___ the plane take off?", "a": "see", "opts": ["saw", "see", "seen", "seeing"], "fr": "Tu as vu l'avion décoller ?"}, {"q": "I ___ go to school yesterday because I was ill.", "a": "didn't", "opts": ["don't", "didn't", "wasn't", "haven't"], "fr": "Je ne suis pas allée au lycée hier parce que j'étais malade."}, {"q": "What time ___ the concert finish last night?", "a": "did", "opts": ["did", "was", "do", "has"], "fr": "Le concert a fini à quelle heure hier soir ?"}, {"q": "Maya didn't ___ her phone, so she couldn't call.", "a": "bring", "opts": ["brought", "bring", "brings", "bringing"], "fr": "Maya n'avait pas pris son téléphone, alors elle n'a pas pu appeler."}, {"q": "Where ___ you go last summer?", "a": "did", "opts": ["did", "were", "do", "are"], "fr": "Où est-ce que tu es allée l'été dernier ?"}, {"q": "The pilot ___ say anything about the delay yesterday.", "a": "didn't", "opts": ["didn't", "wasn't", "don't", "isn't"], "fr": "Hier, le pilote n'a rien dit à propos du retard."}]}, {"id": "l2-going-to", "title": "Parler de ses projets avec going to", "expl": ["Pour parler de tes projets, de ce que tu as déjà décidé, tu utilises be going to suivi de la base verbale : I'm going to visit Maya. Le verbe be change selon le sujet : I am, you are, she is, we are.", "Tu utilises aussi going to quand tu vois qu'une chose va arriver, avec un indice sous les yeux : Look at the clouds, it's going to rain! À l'oral, les anglophones disent souvent gonna, mais à l'écrit, garde going to."], "examples": [{"en": "I'm going to join an aviation club next year.", "fr": "Je vais m'inscrire dans un club d'aviation l'année prochaine."}, {"en": "Look, that plane is going to land!", "fr": "Regarde, cet avion va atterrir !"}], "items": [{"q": "We ___ going to practise our routine on Saturday.", "a": "are", "opts": ["is", "are", "am", "be"], "fr": "On va répéter notre chorégraphie samedi."}, {"q": "Maya ___ going to visit Paris next summer.", "a": "is", "opts": ["are", "is", "am", "be"], "fr": "Maya va visiter Paris l'été prochain."}, {"q": "I'm going to ___ for my English test tonight.", "a": "study", "opts": ["study", "studying", "studied", "studies"], "fr": "Ce soir, je vais réviser pour mon contrôle d'anglais."}, {"q": "Look at those dark clouds! It's going ___ rain.", "a": "to", "opts": ["to", "for", "at", "in"], "fr": "Regarde ces nuages noirs ! Il va pleuvoir."}, {"q": "___ you going to come to the tournament?", "a": "Are", "opts": ["Do", "Are", "Is", "Will"], "fr": "Tu vas venir au tournoi ?"}, {"q": "She ___ going to dance in the show, she hurt her ankle.", "a": "isn't", "opts": ["isn't", "doesn't", "aren't", "didn't"], "fr": "Elle ne va pas danser dans le spectacle, elle s'est fait mal à la cheville."}, {"q": "What ___ you going to do after the match?", "a": "are", "opts": ["are", "do", "is", "will"], "fr": "Qu'est-ce que tu vas faire après le match ?"}, {"q": "The plane is going to ___ in five minutes.", "a": "land", "opts": ["land", "landing", "landed", "lands"], "fr": "L'avion va atterrir dans cinq minutes."}]}, {"id": "l2-comparatives", "title": "Les comparatifs : plus... que", "expl": ["Pour comparer deux choses avec un adjectif court (une syllabe), tu ajoutes -er puis than : fast devient faster than. Si l'adjectif finit par -y, le y devient i : funny devient funnier. Avec un adjectif long, tu mets more devant : more interesting than.", "Retiens trois irréguliers très fréquents : good devient better, bad devient worse, far devient further. Et pour dire « aussi... que », utilise as... as : She's as fast as me."], "examples": [{"en": "A plane is faster than a train.", "fr": "Un avion est plus rapide qu'un train."}, {"en": "This routine is more difficult than the last one.", "fr": "Cette chorégraphie est plus difficile que la précédente."}, {"en": "Our team is better than last year.", "fr": "Notre équipe est meilleure que l'année dernière."}], "items": [{"q": "Volleyball is ___ than running, because you play with friends.", "a": "more fun", "opts": ["more fun", "funner", "most fun", "fun"], "fr": "Le volley, c'est plus sympa que la course, parce qu'on joue avec ses amis."}, {"q": "A jumbo jet is ___ than a small plane.", "a": "bigger", "opts": ["biger", "bigger", "more big", "biggest"], "fr": "Un gros porteur est plus grand qu'un petit avion."}, {"q": "My English is ___ than last year!", "a": "better", "opts": ["gooder", "better", "more good", "best"], "fr": "Mon anglais est meilleur que l'année dernière !"}, {"q": "This song is ___ than the one on the radio.", "a": "more beautiful", "opts": ["beautifuller", "more beautiful", "most beautiful", "beautiful"], "fr": "Cette chanson est plus belle que celle qui passe à la radio."}, {"q": "Today's rehearsal was ___ than yesterday's.", "a": "easier", "opts": ["easyer", "easier", "more easy", "easiest"], "fr": "La répétition d'aujourd'hui était plus facile que celle d'hier."}, {"q": "In winter, Vermont is ___ than France.", "a": "colder", "opts": ["colder", "more cold", "coldest", "cold"], "fr": "En hiver, il fait plus froid dans le Vermont qu'en France."}, {"q": "Our serve was ___ than theirs, so we lost.", "a": "worse", "opts": ["badder", "worse", "worst", "more bad"], "fr": "Notre service était moins bon que le leur, alors on a perdu."}, {"q": "I'm ___ nervous as Maya before a match.", "a": "as", "opts": ["as", "than", "so", "more"], "fr": "Je suis aussi stressée que Maya avant un match."}]}, {"id": "l2-superlatives", "title": "Les superlatifs : le plus...", "expl": ["Pour dire « le plus » avec un adjectif court, tu mets the devant et -est à la fin : the fastest. Avec un adjectif long, tu utilises the most : the most exciting. N'oublie jamais the !", "Les irréguliers suivent la même logique que les comparatifs : good devient the best, bad devient the worst. Après un superlatif, on dit souvent in ou on pour un groupe (the best player on the team) et ever pour une expérience : the best concert ever!"], "examples": [{"en": "That was the best concert ever!", "fr": "C'était le meilleur concert de ma vie !"}, {"en": "The cockpit is the most exciting part of the plane.", "fr": "Le cockpit est la partie la plus passionnante de l'avion."}, {"en": "Maya is the fastest player on her team.", "fr": "Maya est la joueuse la plus rapide de son équipe."}], "items": [{"q": "It was the ___ day of my life!", "a": "best", "opts": ["better", "best", "goodest", "most good"], "fr": "C'était le plus beau jour de ma vie !"}, {"q": "Takeoff is the ___ moment of the flight.", "a": "most exciting", "opts": ["excitingest", "most exciting", "more exciting", "exciting"], "fr": "Le décollage est le moment le plus palpitant du vol."}, {"q": "She's the ___ dancer in our class.", "a": "youngest", "opts": ["younger", "youngest", "most young", "young"], "fr": "C'est la plus jeune danseuse de notre cours."}, {"q": "That was the ___ match of the season, we lost every set.", "a": "worst", "opts": ["worse", "worst", "baddest", "most bad"], "fr": "C'était le pire match de la saison, on a perdu tous les sets."}, {"q": "Which is the ___ airport in the world?", "a": "busiest", "opts": ["busyest", "busiest", "most busy", "busier"], "fr": "Quel est l'aéroport le plus fréquenté du monde ?"}, {"q": "Liv is the ___ teacher I know.", "a": "funniest", "opts": ["funnyest", "funniest", "funnier", "most funny"], "fr": "Liv est la prof la plus drôle que je connaisse."}, {"q": "Saturday was the ___ day of the week, it was so sunny.", "a": "hottest", "opts": ["hotest", "hottest", "hotter", "most hot"], "fr": "Samedi était le jour le plus chaud de la semaine, il faisait super beau."}, {"q": "The window seat is the ___ comfortable place to sleep on a plane.", "a": "most", "opts": ["most", "more", "much", "very"], "fr": "La place côté hublot est la plus confortable pour dormir en avion."}]}, {"id": "l2-can-could", "title": "Can et could : capacité et demandes polies", "expl": ["Can sert à dire ce que tu sais ou peux faire maintenant : I can do a spin. Could est son passé : When I was ten, I couldn't swim. Après can et could, le verbe reste toujours à la base verbale, sans to et sans -s.", "Could sert aussi à demander quelque chose poliment ou à proposer une idée : Could you help me, please? We could go to the park. C'est plus doux que can, parfait avec un prof ou une famille d'accueil."], "examples": [{"en": "Sam can fly big planes and small planes.", "fr": "Sam sait piloter des gros avions et des petits avions."}, {"en": "I couldn't hear the coach because the crowd was so loud.", "fr": "Je n'entendais pas la coach parce que le public faisait trop de bruit."}, {"en": "Could you speak more slowly, please?", "fr": "Vous pourriez parler plus lentement, s'il vous plaît ?"}], "items": [{"q": "Maya ___ speak a little French now.", "a": "can", "opts": ["can", "cans", "could to", "is can"], "fr": "Maya sait parler un peu français maintenant."}, {"q": "Last year I ___ do a spin, but now I can.", "a": "couldn't", "opts": ["can't", "couldn't", "didn't can", "wasn't"], "fr": "L'année dernière, je n'arrivais pas à faire de pirouette, mais maintenant j'y arrive."}, {"q": "___ you pass me my water bottle, please?", "a": "Could", "opts": ["Could", "Do", "Are", "Did"], "fr": "Tu pourrais me passer ma gourde, s'il te plaît ?"}, {"q": "Pilots ___ talk to the control tower by radio.", "a": "can", "opts": ["can", "cans", "can to", "could to"], "fr": "Les pilotes peuvent parler à la tour de contrôle par radio."}, {"q": "My friend can ___ three songs on the guitar.", "a": "play", "opts": ["play", "to play", "plays", "playing"], "fr": "Mon amie sait jouer trois chansons à la guitare."}, {"q": "We ___ go to the beach if it's sunny tomorrow.", "a": "could", "opts": ["could", "did", "are", "have"], "fr": "On pourrait aller à la plage s'il fait beau demain."}, {"q": "I ___ see the stage because the man in front was very tall.", "a": "couldn't", "opts": ["couldn't", "can't", "mustn't", "wasn't"], "fr": "Je ne voyais pas la scène parce que l'homme devant moi était très grand."}, {"q": "___ I sit by the window, please?", "a": "Can", "opts": ["Can", "Do", "Am", "Have"], "fr": "Je peux m'asseoir côté hublot, s'il vous plaît ?"}]}]}, "3": {"themes": [{"id": "l3-experiences", "title": "Tes expériences", "sub": "Raconter ce que tu as déjà vécu (ou pas encore)", "icon": "smile", "p": [{"en": "Have you ever been on a plane by yourself?", "fr": "Tu as déjà pris l'avion toute seule ?", "alts": ["Have you ever flown on your own?"]}, {"en": "I've never been to Australia, but it's at the top of my travel list.", "fr": "Je ne suis jamais allée en Australie, mais c'est en haut de ma liste de voyages.", "alts": ["I have never been to Australia, but it's at the top of my travel list."]}, {"en": "I've already tried surfing once, and it was harder than it looks.", "fr": "J'ai déjà essayé le surf une fois, et c'était plus dur que ça en a l'air.", "alts": []}, {"en": "My best friend and I have known each other since primary school.", "fr": "Ma meilleure amie et moi, on se connaît depuis l'école primaire.", "alts": ["My best friend and I have been friends since primary school."]}, {"en": "We've just come back from an amazing school trip to London.", "fr": "On vient de rentrer d'un super voyage scolaire à Londres.", "alts": ["We just got back from an amazing school trip to London."]}, {"en": "Have you finished your homework yet, or do you need more time?", "fr": "Tu as déjà fini tes devoirs, ou tu as besoin de plus de temps ?", "alts": []}, {"en": "Honestly, that's the best concert I've ever been to!", "fr": "Franchement, c'est le meilleur concert de ma vie !", "alts": ["That's the best concert I've ever been to, honestly!"]}, {"en": "I've been learning English for five years, and I'm getting much better.", "fr": "J'apprends l'anglais depuis cinq ans, et je fais de gros progrès.", "alts": ["I've studied English for five years and I'm getting much better."]}, {"en": "Have you ever stayed with a host family on an exchange trip?", "fr": "Tu as déjà logé dans une famille d'accueil pendant un échange ?", "alts": []}, {"en": "I haven't seen that movie yet, so please don't tell me the ending!", "fr": "Je n'ai pas encore vu ce film, alors ne me raconte pas la fin, s'il te plaît !", "alts": ["I haven't watched that film yet, so no spoilers, please!"]}, {"en": "That was one of the scariest things I've ever done, but I loved it.", "fr": "C'est l'un des trucs les plus flippants que j'aie jamais faits, mais j'ai adoré.", "alts": []}, {"en": "How long have you been playing volleyball in a club?", "fr": "Ça fait combien de temps que tu joues au volley en club ?", "alts": ["How long have you played volleyball in a club?"]}]}, {"id": "l3-music-opinions", "title": "Ton avis sur la musique", "sub": "Donner ton avis sur les chansons et les spectacles, et le justifier", "icon": "music", "p": [{"en": "In my opinion, her new album is even better than the last one.", "fr": "À mon avis, son nouvel album est encore meilleur que le précédent.", "alts": ["I think her new album is even better than the last one."]}, {"en": "I really like this song because the beat makes me want to dance.", "fr": "J'aime vraiment cette chanson parce que le rythme me donne envie de danser.", "alts": []}, {"en": "To be honest, I'm not a big fan of that style of music.", "fr": "Pour être honnête, je ne suis pas trop fan de ce style de musique.", "alts": ["Honestly, that kind of music isn't really my thing."]}, {"en": "The show was amazing, but the sound was a bit too loud for me.", "fr": "Le spectacle était génial, mais le son était un peu trop fort pour moi.", "alts": []}, {"en": "What did you think of the concert? Did you enjoy it?", "fr": "Tu as pensé quoi du concert ? Ça t'a plu ?", "alts": ["How did you find the concert? Did you like it?"]}, {"en": "I've listened to that song so many times that I know it by heart.", "fr": "J'ai écouté cette chanson tellement de fois que je la connais par cœur.", "alts": []}, {"en": "Billie Eilish has such a unique voice that it gives me goosebumps.", "fr": "Billie Eilish a une voix tellement unique que ça me donne des frissons.", "alts": []}, {"en": "I agree with you, but I think the dancers were the best part.", "fr": "Je suis d'accord avec toi, mais pour moi, le mieux, c'était les danseurs.", "alts": []}, {"en": "I see what you mean, but I don't completely agree.", "fr": "Je vois ce que tu veux dire, mais je ne suis pas complètement d'accord.", "alts": ["I get your point, but I don't totally agree."]}, {"en": "With the lighting and the costumes, the whole show looked like a movie.", "fr": "Avec les lumières et les costumes, on aurait dit un film.", "alts": []}, {"en": "If you like pop with a bit of rock, you should listen to Olivia Rodrigo.", "fr": "Si tu aimes la pop avec un peu de rock, tu devrais écouter Olivia Rodrigo.", "alts": []}, {"en": "It's not really my thing, but I can see why people love it.", "fr": "Ce n'est pas trop mon truc, mais je comprends pourquoi les gens adorent.", "alts": []}]}, {"id": "l3-how-planes-fly", "title": "Comment vole un avion", "sub": "Les forces, les commandes et le cockpit", "icon": "plane", "p": [{"en": "Four forces act on a plane: lift, weight, thrust and drag.", "fr": "Quatre forces agissent sur un avion : la portance, le poids, la poussée et la traînée.", "alts": []}, {"en": "The wings create lift when air flows quickly over and under them.", "fr": "Les ailes créent de la portance quand l'air s'écoule vite au-dessus et en dessous.", "alts": ["Lift is created by the air moving over and under the wings."]}, {"en": "The engine and the propeller produce thrust, which moves the plane forward.", "fr": "Le moteur et l'hélice produisent la poussée, qui fait avancer l'avion.", "alts": []}, {"en": "When the pilot pulls back on the control column, the nose goes up.", "fr": "Quand le pilote tire le manche vers lui, le nez de l'avion se lève.", "alts": ["If you pull back on the yoke, the nose pitches up."]}, {"en": "The ailerons on the wings make the plane roll to the left or right.", "fr": "Les ailerons, sur les ailes, font s'incliner l'avion vers la gauche ou vers la droite.", "alts": []}, {"en": "The rudder pedals help you keep the plane straight on the runway.", "fr": "Les palonniers t'aident à garder l'avion bien droit sur la piste.", "alts": []}, {"en": "Before every flight, pilots go through a checklist to make sure everything works.", "fr": "Avant chaque vol, les pilotes passent en revue une check-list pour vérifier que tout fonctionne.", "alts": []}, {"en": "The altimeter shows how high we are, and the airspeed indicator shows our speed.", "fr": "L'altimètre indique notre altitude, et l'anémomètre indique notre vitesse.", "alts": []}, {"en": "We take off into the wind because it helps the plane get airborne sooner.", "fr": "On décolle face au vent parce que ça aide l'avion à quitter le sol plus vite.", "alts": []}, {"en": "The flaps give the wings extra lift, so we can fly more slowly for landing.", "fr": "Les volets donnent plus de portance aux ailes, ce qui permet de voler plus lentement pour l'atterrissage.", "alts": []}, {"en": "Have you ever sat in a real cockpit? There are so many instruments!", "fr": "Tu t'es déjà assise dans un vrai cockpit ? Il y a tellement d'instruments !", "alts": []}, {"en": "If the angle of the wing gets too steep, the wing stalls and loses lift.", "fr": "Si l'angle de l'aile devient trop important, l'aile décroche et perd sa portance.", "alts": []}]}, {"id": "l3-radio-basics", "title": "La radio et l'alphabet phonétique", "sub": "Parler avec la tour comme une vraie pilote", "icon": "bubble", "p": [{"en": "Pilots use the phonetic alphabet so letters are never confused on the radio.", "fr": "Les pilotes utilisent l'alphabet phonétique pour que les lettres ne soient jamais confondues à la radio.", "alts": []}, {"en": "My name is spelled Charlie, Alfa, Papa, Uniform, Charlie, India, November, Echo.", "fr": "Mon prénom s'épelle Charlie, Alfa, Papa, Uniform, Charlie, India, November, Echo.", "alts": []}, {"en": "Roger means I've received all of your last message.", "fr": "« Roger » veut dire : j'ai bien reçu tout ton dernier message.", "alts": []}, {"en": "Wilco means I have understood your message and I will comply.", "fr": "« Wilco » veut dire : j'ai compris ton message et je vais l'exécuter.", "alts": []}, {"en": "Say again, please. Your last message was broken and I didn't hear it.", "fr": "Répétez, s'il vous plaît. Votre dernier message était haché et je ne l'ai pas entendu.", "alts": ["Say again. Your last transmission was broken."]}, {"en": "Tower, Foxtrot Bravo Charlie Delta Echo, ready for departure, runway two seven.", "fr": "Tour, Foxtrot Bravo Charlie Delta Echo, prêts au départ, piste deux sept.", "alts": []}, {"en": "Foxtrot Delta Echo, wind calm, runway two seven, cleared for takeoff.", "fr": "Foxtrot Delta Echo, vent calme, piste deux sept, autorisé au décollage.", "alts": []}, {"en": "You always read back the runway and the clearance, so the controller can check.", "fr": "Tu collationnes toujours la piste et l'autorisation, pour que le contrôleur puisse vérifier.", "alts": []}, {"en": "Hold short of runway two seven means you must stop before the runway.", "fr": "« Maintenez avant la piste deux sept » veut dire que tu dois t'arrêter avant la piste.", "alts": []}, {"en": "In aviation English, we say niner instead of nine, so it sounds clearer.", "fr": "En anglais aéronautique, on dit « niner » au lieu de « nine », pour que ce soit plus clair.", "alts": []}, {"en": "Line up and wait means you enter the runway, but you don't take off yet.", "fr": "« Line up and wait » veut dire que tu t'alignes sur la piste, mais que tu ne décolles pas encore.", "alts": []}, {"en": "Keep your messages short and clear, because other pilots need the frequency too.", "fr": "Fais des messages courts et clairs, parce que les autres pilotes ont aussi besoin de la fréquence.", "alts": []}]}, {"id": "l3-team-strategy", "title": "Stratégie et défaite", "sub": "La tactique d'équipe et rebondir après un match perdu", "icon": "ball", "p": [{"en": "Our setter should send more balls to the middle, because their block is slow.", "fr": "Notre passeuse devrait jouer plus au centre, parce que leur contre est lent.", "alts": []}, {"en": "If we serve short, their passers will have to move forward quickly.", "fr": "Si on sert court, leurs réceptionneuses vont devoir avancer très vite.", "alts": []}, {"en": "We need to talk more on the court so nobody goes for the same ball.", "fr": "On doit plus se parler sur le terrain pour ne pas être deux sur le même ballon.", "alts": []}, {"en": "The coach called a timeout because they had scored five points in a row.", "fr": "La coach a demandé un temps mort parce qu'elles avaient marqué cinq points d'affilée.", "alts": []}, {"en": "We lost, but we've learned a lot from this match.", "fr": "On a perdu, mais on a beaucoup appris de ce match.", "alts": ["We lost, but this match taught us a lot."]}, {"en": "It's okay to be disappointed, but we can't let one loss break our confidence.", "fr": "C'est normal d'être déçues, mais on ne doit pas laisser une défaite casser notre confiance.", "alts": []}, {"en": "Let's watch the video of the match and work out what went wrong.", "fr": "Regardons la vidéo du match et essayons de comprendre ce qui n'a pas marché.", "alts": ["Let's watch the match video and figure out what went wrong."]}, {"en": "They were the stronger team today, and they really deserved to win.", "fr": "C'était la meilleure équipe aujourd'hui, et elles méritaient vraiment de gagner.", "alts": []}, {"en": "Don't blame yourself for that missed serve. We win and lose as a team.", "fr": "Ne t'en veux pas pour ce service raté : on gagne et on perd en équipe.", "alts": []}, {"en": "Next time, we'll focus on our serve receive and stay calm under pressure.", "fr": "La prochaine fois, on se concentrera sur la réception et on restera calmes sous la pression.", "alts": []}, {"en": "I'm sure we'll bounce back and play much better next weekend.", "fr": "Je suis sûre qu'on va rebondir et beaucoup mieux jouer le week-end prochain.", "alts": []}, {"en": "Our libero has been amazing all season. She never gives up on a ball.", "fr": "Notre libéro a été incroyable toute la saison. Elle ne lâche jamais un ballon.", "alts": []}]}, {"id": "l3-dance-show", "title": "Préparer un spectacle de danse", "sub": "Répétitions, trac et entrée en scène", "icon": "star", "p": [{"en": "We've been rehearsing this piece for weeks, and it's finally coming together.", "fr": "On répète cette chorégraphie depuis des semaines, et ça commence enfin à prendre forme.", "alts": []}, {"en": "The dress rehearsal is on Friday, so we have to bring our costumes.", "fr": "La générale est vendredi, donc on doit apporter nos costumes.", "alts": []}, {"en": "I always get butterflies before I go on stage, but they disappear once the music starts.", "fr": "J'ai toujours le trac avant d'entrer en scène, mais il disparaît dès que la musique commence.", "alts": []}, {"en": "If you forget a step, just keep going and nobody will notice.", "fr": "Si tu oublies un pas, continue, et personne ne s'en rendra compte.", "alts": []}, {"en": "Take a deep breath, count to four, and remember why you love dancing.", "fr": "Respire profondément, compte jusqu'à quatre et rappelle-toi pourquoi tu aimes danser.", "alts": []}, {"en": "We need to stay in sync during the floor work in the second part.", "fr": "On doit rester synchronisées pendant le travail au sol, dans la deuxième partie.", "alts": []}, {"en": "Don't forget to warm up properly, otherwise you could hurt yourself.", "fr": "N'oublie pas de bien t'échauffer, sinon tu pourrais te blesser.", "alts": []}, {"en": "Our teacher told us to use the whole stage and to look at the audience.", "fr": "Notre prof nous a dit d'utiliser toute la scène et de regarder le public.", "alts": []}, {"en": "Wait in the wings until you hear your cue, then walk on calmly.", "fr": "Attends en coulisses jusqu'à ton signal, puis entre calmement en scène.", "alts": []}, {"en": "Can you film the show for us? I'd love to watch it afterwards.", "fr": "Tu peux filmer le spectacle pour nous ? J'adorerais le regarder après.", "alts": []}, {"en": "Being nervous is normal. It just means the show really matters to you.", "fr": "C'est normal d'être stressée. Ça veut juste dire que le spectacle compte vraiment pour toi.", "alts": []}, {"en": "We did it! The audience gave us a standing ovation at the end!", "fr": "On l'a fait ! Le public s'est levé pour nous applaudir à la fin !", "alts": []}]}, {"id": "l3-school-projects", "title": "Projets et exposés", "sub": "Travailler en groupe et présenter à l'oral", "icon": "school", "p": [{"en": "We have to give a ten-minute presentation about renewable energy next Thursday.", "fr": "On doit faire un exposé de dix minutes sur les énergies renouvelables jeudi prochain.", "alts": []}, {"en": "Who's going to be in charge of the slides, and who's doing the research?", "fr": "Qui s'occupe des diapos, et qui fait les recherches ?", "alts": []}, {"en": "Let's split the work so that everyone has a fair part to do.", "fr": "Répartissons le travail pour que chacun ait une part équitable.", "alts": ["Let's divide the work fairly between us."]}, {"en": "I've found some great sources, but we should check that they're reliable.", "fr": "J'ai trouvé de super sources, mais on devrait vérifier qu'elles sont fiables.", "alts": []}, {"en": "Could you send me your part by Sunday evening so I can put it together?", "fr": "Tu pourrais m'envoyer ta partie avant dimanche soir pour que je rassemble tout ?", "alts": []}, {"en": "Today I'm going to talk about how airports manage hundreds of flights every day.", "fr": "Aujourd'hui, je vais vous parler de la façon dont les aéroports gèrent des centaines de vols chaque jour.", "alts": []}, {"en": "First, I'll explain the problem, and then I'll suggest a few solutions.", "fr": "D'abord, je vais expliquer le problème, puis je proposerai quelques solutions.", "alts": []}, {"en": "As you can see on this slide, the numbers have doubled since last year.", "fr": "Comme vous pouvez le voir sur cette diapo, les chiffres ont doublé depuis l'an dernier.", "alts": []}, {"en": "Sorry, I've lost my train of thought. Let me look at my notes.", "fr": "Pardon, j'ai perdu le fil. Je regarde mes notes.", "alts": []}, {"en": "Does anyone have any questions? Feel free to ask me anything.", "fr": "Est-ce que quelqu'un a des questions ? N'hésitez pas.", "alts": []}, {"en": "We haven't finished the conclusion yet, so let's meet in the library tomorrow.", "fr": "On n'a pas encore fini la conclusion, alors retrouvons-nous au CDI demain.", "alts": []}, {"en": "Thank you for listening. I hope you've learned something new today.", "fr": "Merci de m'avoir écoutée. J'espère que vous avez appris quelque chose de nouveau aujourd'hui.", "alts": []}]}, {"id": "l3-dreams-careers", "title": "Rêves et métiers", "sub": "Parler de ton avenir : pilote, danseuse, coach", "icon": "sun", "p": [{"en": "When I'm older, I'd really like to become an airline pilot.", "fr": "Plus tard, j'aimerais vraiment devenir pilote de ligne.", "alts": ["I'd love to be an airline pilot when I grow up."]}, {"en": "To become a pilot, you need good English and a lot of training.", "fr": "Pour devenir pilote, il faut un bon niveau d'anglais et beaucoup de formation.", "alts": []}, {"en": "Professional dancers have to train every day and get plenty of rest.", "fr": "Les danseurs professionnels doivent s'entraîner tous les jours et bien se reposer.", "alts": []}, {"en": "I think being a coach would be rewarding because you help people improve.", "fr": "Je pense qu'être coach serait gratifiant, parce qu'on aide les gens à progresser.", "alts": []}, {"en": "If I work hard at school, I'll have more choices later on.", "fr": "Si je travaille bien à l'école, j'aurai plus de choix plus tard.", "alts": []}, {"en": "My dream is to fly long-haul flights and see the whole world.", "fr": "Mon rêve, c'est de faire des vols long-courriers et de voir le monde entier.", "alts": []}, {"en": "I haven't decided yet, but I'm interested in aviation and dance.", "fr": "Je n'ai pas encore décidé, mais l'aviation et la danse m'intéressent.", "alts": []}, {"en": "What would you like to do after school? Have you got any ideas?", "fr": "Qu'est-ce que tu aimerais faire après le lycée ? Tu as des idées ?", "alts": []}, {"en": "You don't have to choose just one passion. You can keep both in your life.", "fr": "Tu n'es pas obligée de choisir une seule passion. Tu peux garder les deux dans ta vie.", "alts": []}, {"en": "A good coach listens to players and helps them believe in themselves.", "fr": "Une bonne coach écoute les joueuses et les aide à croire en elles.", "alts": []}, {"en": "There are lots of jobs in aviation, like air traffic controller or engineer.", "fr": "Il y a plein de métiers dans l'aviation, comme contrôleur aérien ou ingénieur.", "alts": []}, {"en": "I'm going to find out more about summer programs for young pilots.", "fr": "Je vais me renseigner sur les stages d'été pour les jeunes pilotes.", "alts": []}]}], "vocab": [{"id": "l3-aircraft", "title": "L'avion et le cockpit", "w": [{"vis": "⬆️", "en": "lift", "fr": "la portance", "ex": "The wings produce lift as the plane speeds up on the runway.", "exfr": "Les ailes produisent de la portance quand l'avion accélère sur la piste."}, {"vis": "🚀", "en": "thrust", "fr": "la poussée", "ex": "A more powerful engine gives the plane more thrust for takeoff.", "exfr": "Un moteur plus puissant donne plus de poussée à l'avion au décollage."}, {"vis": "🌬️", "en": "drag", "fr": "la traînée", "ex": "Pilots raise the landing gear after takeoff to reduce drag.", "exfr": "Les pilotes rentrent le train d'atterrissage après le décollage pour réduire la traînée."}, {"vis": "✈️", "en": "a wing", "fr": "une aile", "ex": "On many planes, the fuel is stored inside the wings.", "exfr": "Sur beaucoup d'avions, le carburant est stocké dans les ailes."}, {"vis": "🌀", "en": "the propeller", "fr": "l'hélice", "ex": "Never walk near the propeller, even when the engine is off.", "exfr": "Ne passe jamais près de l'hélice, même quand le moteur est coupé."}, {"vis": "🕹️", "en": "the yoke", "fr": "le manche", "ex": "The instructor showed us how to hold the yoke gently, not too tightly.", "exfr": "L'instructeur nous a montré comment tenir le manche en douceur, sans le serrer."}, {"vis": "↔️", "en": "the rudder", "fr": "la gouverne de direction", "ex": "The rudder moves the nose of the plane to the left or right.", "exfr": "La gouverne de direction déplace le nez de l'avion vers la gauche ou la droite."}, {"vis": "🪶", "en": "the flaps", "fr": "les volets", "ex": "We've lowered the flaps, so we can approach the runway more slowly.", "exfr": "On a sorti les volets, donc on peut approcher de la piste plus lentement."}, {"vis": "🛬", "en": "the landing gear", "fr": "le train d'atterrissage", "ex": "Always check that the landing gear is down before you land.", "exfr": "Vérifie toujours que le train d'atterrissage est sorti avant d'atterrir."}, {"vis": "🏔️", "en": "the altimeter", "fr": "l'altimètre", "ex": "The altimeter tells you how high the plane is flying.", "exfr": "L'altimètre t'indique à quelle altitude vole l'avion."}, {"vis": "📋", "en": "a checklist", "fr": "une check-list", "ex": "Have you gone through the checklist before starting the engine?", "exfr": "Tu as fait la check-list avant de démarrer le moteur ?"}, {"vis": "📉", "en": "to stall", "fr": "décrocher", "ex": "If the wing stalls, the pilot lowers the nose to get the airflow back.", "exfr": "Si l'aile décroche, le pilote baisse le nez pour retrouver un bon écoulement de l'air."}]}, {"id": "l3-radio-airport", "title": "La radio et l'aéroport", "w": [{"vis": "📻", "en": "roger", "fr": "bien reçu", "ex": "When the controller gives you the weather, you can simply answer roger.", "exfr": "Quand le contrôleur te donne la météo, tu peux simplement répondre « roger »."}, {"vis": "✅", "en": "wilco", "fr": "compris, j'exécute", "ex": "The pilot said wilco after the controller asked her to report on final.", "exfr": "La pilote a dit « wilco » après que le contrôleur lui a demandé de rappeler en finale."}, {"vis": "🔁", "en": "say again", "fr": "répétez", "ex": "The radio was noisy, so the pilot asked the tower to say again.", "exfr": "La radio grésillait, alors le pilote a demandé à la tour de répéter."}, {"vis": "🆔", "en": "a call sign", "fr": "un indicatif d'appel", "ex": "Our call sign today is Foxtrot Golf Hotel India Juliett.", "exfr": "Notre indicatif aujourd'hui, c'est Foxtrot Golf Hotel India Juliett."}, {"vis": "🗼", "en": "the control tower", "fr": "la tour de contrôle", "ex": "From the control tower, you can see the whole airfield.", "exfr": "Depuis la tour de contrôle, on voit tout l'aérodrome."}, {"vis": "🛣️", "en": "the runway", "fr": "la piste", "ex": "Runway numbers show the direction of the runway on a compass.", "exfr": "Les numéros de piste indiquent la direction de la piste sur une boussole."}, {"vis": "🚕", "en": "to taxi", "fr": "rouler au sol", "ex": "After landing, we taxied slowly back to the club's hangar.", "exfr": "Après l'atterrissage, on est revenus au hangar du club en roulant lentement."}, {"vis": "🔂", "en": "to read back", "fr": "collationner (répéter un message)", "ex": "You must read back every runway instruction to the controller.", "exfr": "Tu dois collationner chaque instruction concernant la piste au contrôleur."}, {"vis": "↩️", "en": "to go around", "fr": "remettre les gaz", "ex": "The runway wasn't clear, so the pilot decided to go around.", "exfr": "La piste n'était pas dégagée, alors le pilote a décidé de remettre les gaz."}, {"vis": "🎧", "en": "a headset", "fr": "un casque", "ex": "Put on your headset so you can hear the instructor and the radio.", "exfr": "Mets ton casque pour entendre l'instructeur et la radio."}, {"vis": "🔤", "en": "the phonetic alphabet", "fr": "l'alphabet phonétique", "ex": "I've learned the whole phonetic alphabet, from Alfa to Zulu!", "exfr": "J'ai appris tout l'alphabet phonétique, d'Alfa à Zulu !"}, {"vis": "🌦️", "en": "the weather briefing", "fr": "le briefing météo", "ex": "We always check the weather briefing before we decide to fly.", "exfr": "On vérifie toujours le briefing météo avant de décider de voler."}]}, {"id": "l3-volleyball-tactics", "title": "La tactique au volley", "w": [{"vis": "🙌", "en": "a setter", "fr": "une passeuse", "ex": "A good setter decides where the attack will come from.", "exfr": "Une bonne passeuse décide d'où viendra l'attaque."}, {"vis": "👕", "en": "a libero", "fr": "une libéro", "ex": "The libero wears a different shirt and specialises in defence.", "exfr": "La libéro porte un maillot différent et elle est spécialiste de la défense."}, {"vis": "🧱", "en": "the block", "fr": "le contre", "ex": "Their block was so high that we had to play more tips.", "exfr": "Leur contre était si haut qu'on a dû jouer plus de feintes."}, {"vis": "🤲", "en": "a dig", "fr": "une défense (en manchette)", "ex": "Her amazing dig saved the point, and the crowd went wild.", "exfr": "Sa défense incroyable a sauvé le point, et le public est devenu fou."}, {"vis": "📥", "en": "serve receive", "fr": "la réception de service", "ex": "We've worked a lot on serve receive this week.", "exfr": "On a beaucoup travaillé la réception de service cette semaine."}, {"vis": "🔄", "en": "a rotation", "fr": "une rotation", "ex": "Every time we win back the serve, we move one position clockwise.", "exfr": "Chaque fois qu'on récupère le service, on tourne d'une position dans le sens des aiguilles d'une montre."}, {"vis": "⏱️", "en": "a timeout", "fr": "un temps mort", "ex": "Each team can call two timeouts per set.", "exfr": "Chaque équipe peut demander deux temps morts par set."}, {"vis": "👆", "en": "a tip", "fr": "une feinte", "ex": "Instead of spiking, she played a clever tip over the block.", "exfr": "Au lieu de smasher, elle a joué une feinte astucieuse par-dessus le contre."}, {"vis": "🗒️", "en": "a game plan", "fr": "une stratégie de match", "ex": "Our coach explained the game plan before the warm-up.", "exfr": "Notre coach a expliqué la stratégie de match avant l'échauffement."}, {"vis": "💪", "en": "to bounce back", "fr": "se reprendre, rebondir", "ex": "We lost the first set, but we bounced back in the second.", "exfr": "On a perdu le premier set, mais on s'est reprises dans le deuxième."}, {"vis": "😔", "en": "to let someone down", "fr": "décevoir quelqu'un", "ex": "I felt I'd let the team down, but my teammates cheered me up.", "exfr": "J'avais l'impression d'avoir déçu l'équipe, mais mes coéquipières m'ont remonté le moral."}, {"vis": "🔥", "en": "a winning streak", "fr": "une série de victoires", "ex": "We've been on a winning streak since the start of the season.", "exfr": "On enchaîne les victoires depuis le début de la saison."}]}, {"id": "l3-dance-stage", "title": "La danse et la scène", "w": [{"vis": "🗓️", "en": "a rehearsal", "fr": "une répétition", "ex": "We've got an extra rehearsal on Saturday morning before the show.", "exfr": "On a une répétition en plus samedi matin avant le spectacle."}, {"vis": "👗", "en": "the dress rehearsal", "fr": "la générale", "ex": "At the dress rehearsal, we wore our costumes for the first time.", "exfr": "À la générale, on a porté nos costumes pour la première fois."}, {"vis": "😰", "en": "stage fright", "fr": "le trac", "ex": "Almost every performer gets stage fright, even the most famous ones.", "exfr": "Presque tous les artistes ont le trac, même les plus célèbres."}, {"vis": "🎭", "en": "the wings", "fr": "les coulisses", "ex": "We waited in the wings, holding hands and smiling at each other.", "exfr": "On attendait en coulisses, en se tenant la main et en se souriant."}, {"vis": "🔔", "en": "a cue", "fr": "un signal (pour entrer ou bouger)", "ex": "The change in the music is your cue to run onto the stage.", "exfr": "Le changement de musique, c'est ton signal pour entrer en courant sur scène."}, {"vis": "🤸", "en": "to warm up", "fr": "s'échauffer", "ex": "We always warm up for twenty minutes before we start dancing.", "exfr": "On s'échauffe toujours vingt minutes avant de commencer à danser."}, {"vis": "🧘", "en": "floor work", "fr": "le travail au sol", "ex": "Floor work is a big part of contemporary dance.", "exfr": "Le travail au sol occupe une grande place en danse contemporaine."}, {"vis": "👯", "en": "in sync", "fr": "synchronisé(e)s", "ex": "When we're all in sync, the choreography looks really powerful.", "exfr": "Quand on est toutes synchronisées, la chorégraphie a beaucoup de force."}, {"vis": "▶️", "en": "to run through", "fr": "faire un filage, tout reprendre", "ex": "Let's run through the whole piece one more time from the start.", "exfr": "On reprend toute la chorégraphie encore une fois depuis le début."}, {"vis": "😬", "en": "to mess up", "fr": "se planter, rater", "ex": "I messed up the turn, but I kept smiling and carried on.", "exfr": "Je me suis plantée sur la pirouette, mais j'ai continué en souriant."}, {"vis": "👏", "en": "a standing ovation", "fr": "une ovation debout", "ex": "At the end, the audience gave the dancers a standing ovation.", "exfr": "À la fin, le public s'est levé pour ovationner les danseurs."}, {"vis": "🔦", "en": "the spotlight", "fr": "le projecteur", "ex": "When the spotlight came on, I forgot all about my nerves.", "exfr": "Quand le projecteur s'est allumé, j'ai complètement oublié mon stress."}]}, {"id": "l3-music-talk", "title": "Parler de musique", "w": [{"vis": "🎶", "en": "catchy", "fr": "entraînant, accrocheur", "ex": "This chorus is so catchy that I've been humming it all day.", "exfr": "Ce refrain est tellement entraînant que je le fredonne depuis ce matin."}, {"vis": "🥁", "en": "the beat", "fr": "le rythme", "ex": "The beat is perfect for our hip-hop routine.", "exfr": "Le rythme est parfait pour notre chorégraphie hip-hop."}, {"vis": "📝", "en": "the lyrics", "fr": "les paroles", "ex": "I love songs where the lyrics tell a real story.", "exfr": "J'adore les chansons dont les paroles racontent une vraie histoire."}, {"vis": "📱", "en": "a playlist", "fr": "une playlist", "ex": "I've made a playlist to listen to before every match.", "exfr": "J'ai fait une playlist à écouter avant chaque match."}, {"vis": "🎤", "en": "a live performance", "fr": "une prestation en live", "ex": "Her live performances are even better than her recordings.", "exfr": "Ses prestations en live sont encore meilleures que ses enregistrements."}, {"vis": "👎", "en": "overrated", "fr": "surcoté", "ex": "In my opinion, that song is a bit overrated, but it's still fun.", "exfr": "À mon avis, cette chanson est un peu surcotée, mais elle reste sympa."}, {"vis": "💎", "en": "underrated", "fr": "sous-estimé", "ex": "This band is really underrated, and more people should listen to them.", "exfr": "Ce groupe est vraiment sous-estimé, et plus de gens devraient l'écouter."}, {"vis": "💜", "en": "to be into something", "fr": "être fan de quelque chose", "ex": "I've been into K-pop since a friend showed me a dance video.", "exfr": "Je suis à fond dans la K-pop depuis qu'une amie m'a montré une vidéo de danse."}, {"vis": "🔊", "en": "to turn up", "fr": "monter (le son)", "ex": "Turn up the music, I love this song!", "exfr": "Monte le son, j'adore cette chanson !"}, {"vis": "🎙️", "en": "to sing along", "fr": "chanter en même temps", "ex": "The whole crowd sang along during the last song.", "exfr": "Tout le public a chanté avec l'artiste pendant la dernière chanson."}, {"vis": "🎸", "en": "a cover", "fr": "une reprise", "ex": "Have you heard the acoustic cover of that song? It's beautiful.", "exfr": "Tu as entendu la reprise acoustique de cette chanson ? Elle est magnifique."}, {"vis": "🎆", "en": "the encore", "fr": "le rappel", "ex": "The band came back on stage for an encore, and everybody cheered.", "exfr": "Le groupe est revenu sur scène pour un rappel, et tout le monde a applaudi."}]}, {"id": "l3-phrasal-everyday", "title": "Les phrasal verbs du quotidien", "w": [{"vis": "🏳️", "en": "to give up", "fr": "abandonner", "ex": "Don't give up now, you're almost there!", "exfr": "N'abandonne pas maintenant, tu y es presque !"}, {"vis": "🤩", "en": "to look forward to", "fr": "avoir hâte de", "ex": "I'm really looking forward to the summer dance workshop.", "exfr": "J'ai vraiment hâte d'être au stage de danse d'été."}, {"vis": "🔍", "en": "to find out", "fr": "découvrir, apprendre", "ex": "I've just found out that our match has been moved to Sunday.", "exfr": "Je viens d'apprendre que notre match a été déplacé à dimanche."}, {"vis": "🧩", "en": "to figure out", "fr": "comprendre, trouver la solution", "ex": "Can you help me figure out this maths exercise?", "exfr": "Tu peux m'aider à comprendre cet exercice de maths ?"}, {"vis": "🛋️", "en": "to hang out", "fr": "traîner, passer du temps ensemble", "ex": "We usually hang out at the park after practice.", "exfr": "D'habitude, on traîne au parc après l'entraînement."}, {"vis": "🏃", "en": "to catch up", "fr": "rattraper son retard", "ex": "I missed two classes, so I need to catch up this weekend.", "exfr": "J'ai raté deux cours, donc je dois rattraper mon retard ce week-end."}, {"vis": "⏳", "en": "to put off", "fr": "repousser, remettre à plus tard", "ex": "Stop putting off your project and start it today!", "exfr": "Arrête de repousser ton projet et commence-le aujourd'hui !"}, {"vis": "💡", "en": "to come up with", "fr": "trouver (une idée)", "ex": "Maya came up with a brilliant idea for our video.", "exfr": "Maya a eu une idée géniale pour notre vidéo."}, {"vis": "⌛", "en": "to run out of", "fr": "manquer de, ne plus avoir de", "ex": "We ran out of time before the end of the presentation.", "exfr": "On a manqué de temps avant la fin de l'exposé."}, {"vis": "🤝", "en": "to get along with", "fr": "bien s'entendre avec", "ex": "I get along really well with everyone in my team.", "exfr": "Je m'entends vraiment bien avec tout le monde dans mon équipe."}, {"vis": "😊", "en": "to cheer up", "fr": "remonter le moral", "ex": "Your message really cheered me up after the match.", "exfr": "Ton message m'a vraiment remonté le moral après le match."}, {"vis": "✍️", "en": "to sign up for", "fr": "s'inscrire à", "ex": "I've signed up for a discovery flight at the aviation club.", "exfr": "Je me suis inscrite à un vol de découverte à l'aéroclub."}]}, {"id": "l3-school-work", "title": "Projets et exposés", "w": [{"vis": "📊", "en": "a presentation", "fr": "un exposé, une présentation", "ex": "My presentation about the history of flight went really well.", "exfr": "Mon exposé sur l'histoire de l'aviation s'est très bien passé."}, {"vis": "🖼️", "en": "a slide", "fr": "une diapo", "ex": "Don't put too much text on each slide.", "exfr": "Ne mets pas trop de texte sur chaque diapo."}, {"vis": "📅", "en": "a deadline", "fr": "une date limite", "ex": "The deadline for the project is next Friday, so let's hurry.", "exfr": "La date limite du projet, c'est vendredi prochain, alors dépêchons-nous."}, {"vis": "📚", "en": "a source", "fr": "une source", "ex": "Always check your sources before you use them in a project.", "exfr": "Vérifie toujours tes sources avant de les utiliser dans un projet."}, {"vis": "📤", "en": "to hand in", "fr": "rendre (un devoir)", "ex": "Have you handed in your history essay yet?", "exfr": "Tu as déjà rendu ta dissertation d'histoire ?"}, {"vis": "👉", "en": "to point out", "fr": "faire remarquer, souligner", "ex": "Our teacher pointed out a few mistakes in our conclusion.", "exfr": "Notre prof a souligné quelques erreurs dans notre conclusion."}, {"vis": "🧾", "en": "to sum up", "fr": "résumer, pour résumer", "ex": "To sum up, renewable energy is the key to a cleaner future.", "exfr": "Pour résumer, les énergies renouvelables sont la clé d'un avenir plus propre."}, {"vis": "👥", "en": "teamwork", "fr": "le travail d'équipe", "ex": "This project taught us a lot about teamwork.", "exfr": "Ce projet nous a beaucoup appris sur le travail d'équipe."}, {"vis": "✏️", "en": "a draft", "fr": "un brouillon", "ex": "I've written a first draft, but it still needs some work.", "exfr": "J'ai écrit un premier brouillon, mais il faut encore le retravailler."}, {"vis": "👀", "en": "to go over", "fr": "relire, revoir", "ex": "Let's go over our notes one last time before class.", "exfr": "Revoyons nos notes une dernière fois avant le cours."}, {"vis": "📄", "en": "a handout", "fr": "un document distribué", "ex": "I printed a handout with the main points for everyone.", "exfr": "J'ai imprimé un document avec les points principaux pour tout le monde."}, {"vis": "🗣️", "en": "to speak in public", "fr": "parler en public", "ex": "Speaking in public gets easier every time you do it.", "exfr": "Parler en public devient plus facile à chaque fois."}]}, {"id": "l3-careers", "title": "Métiers et avenir", "w": [{"vis": "🧑‍✈️", "en": "an airline pilot", "fr": "un pilote de ligne", "ex": "An airline pilot needs to stay calm in every situation.", "exfr": "Un pilote de ligne doit rester calme dans toutes les situations."}, {"vis": "🛩️", "en": "a flight instructor", "fr": "un instructeur de vol", "ex": "A flight instructor teaches students how to fly safely.", "exfr": "Un instructeur de vol apprend aux élèves à piloter en sécurité."}, {"vis": "📡", "en": "an air traffic controller", "fr": "un contrôleur aérien", "ex": "Air traffic controllers keep planes at a safe distance from each other.", "exfr": "Les contrôleurs aériens maintiennent les avions à une distance de sécurité les uns des autres."}, {"vis": "💃", "en": "a professional dancer", "fr": "une danseuse professionnelle", "ex": "She's been a professional dancer for ten years, and now she teaches too.", "exfr": "Elle est danseuse professionnelle depuis dix ans, et maintenant elle enseigne aussi."}, {"vis": "🩰", "en": "a choreographer", "fr": "un chorégraphe, une chorégraphe", "ex": "The choreographer created a new piece for our end-of-year show.", "exfr": "La chorégraphe a créé une nouvelle pièce pour notre spectacle de fin d'année."}, {"vis": "📣", "en": "a coach", "fr": "un entraîneur, une coach", "ex": "A good coach knows how to motivate every player.", "exfr": "Une bonne coach sait motiver chaque joueuse."}, {"vis": "📜", "en": "a pilot's licence", "fr": "une licence de pilote", "ex": "You can start training for a pilot's licence before you turn eighteen.", "exfr": "Tu peux commencer à te former pour une licence de pilote avant tes dix-huit ans."}, {"vis": "🛠️", "en": "a skill", "fr": "une compétence", "ex": "Speaking English is a key skill for working in aviation.", "exfr": "Parler anglais est une compétence essentielle pour travailler dans l'aviation."}, {"vis": "📨", "en": "to apply for", "fr": "postuler à, faire une demande pour", "ex": "Next year, I'm going to apply for a summer program abroad.", "exfr": "L'année prochaine, je vais postuler à un programme d'été à l'étranger."}, {"vis": "🎯", "en": "to set a goal", "fr": "se fixer un objectif", "ex": "I've set a goal to speak English fluently before I finish high school.", "exfr": "Je me suis fixé l'objectif de parler anglais couramment avant la fin du lycée."}, {"vis": "🪜", "en": "to work your way up", "fr": "gravir les échelons", "ex": "Many captains start on small planes and work their way up.", "exfr": "Beaucoup de commandants de bord commencent sur de petits avions et gravissent les échelons."}, {"vis": "🌟", "en": "a role model", "fr": "un modèle", "ex": "Female pilots can be great role models for young girls.", "exfr": "Les femmes pilotes peuvent être de super modèles pour les jeunes filles."}]}], "grammar": [{"id": "l3-present-perfect", "title": "Le present perfect : tes expériences", "expl": ["Le present perfect se forme avec have ou has, puis le participe passé (played, seen, flown). Tu l'utilises pour parler de tes expériences sans dire quand elles sont arrivées : I've seen a real cockpit.", "Avec ever (déjà, dans une question) et never (jamais), tu parles de toute ta vie jusqu'à maintenant : Have you ever been on stage? I've never flown a plane. Attention aux participes irréguliers : been, seen, flown, done.", "Already (déjà), just (venir de) et yet (encore, déjà dans une question) sont tes meilleurs amis : I've just finished. Have you finished yet? I haven't finished yet."], "examples": [{"en": "Have you ever flown in a small plane?", "fr": "Tu as déjà volé dans un petit avion ?"}, {"en": "I've never danced on such a big stage before.", "fr": "Je n'ai jamais dansé sur une aussi grande scène."}, {"en": "We've just won our third match in a row!", "fr": "On vient de gagner notre troisième match d'affilée !"}], "items": [{"q": "Have you ever ___ a real flight simulator?", "a": "tried", "opts": ["tried", "try", "tries", "trying"], "fr": "Tu as déjà essayé un vrai simulateur de vol ?"}, {"q": "I've never ___ in front of so many people.", "a": "danced", "opts": ["danced", "dance", "dancing", "dances"], "fr": "Je n'ai jamais dansé devant autant de monde."}, {"q": "She ___ already learned the whole phonetic alphabet.", "a": "has", "opts": ["has", "have", "is", "does"], "fr": "Elle a déjà appris tout l'alphabet phonétique."}, {"q": "We haven't finished our presentation ___.", "a": "yet", "opts": ["yet", "already", "ever", "just"], "fr": "On n'a pas encore fini notre exposé."}, {"q": "Have you ever ___ to a big pop concert?", "a": "been", "opts": ["been", "went", "going", "goes"], "fr": "Tu es déjà allée à un grand concert de pop ?"}, {"q": "Maya's team has ___ lost a match at home this season.", "a": "never", "opts": ["never", "ever", "yet", "ago"], "fr
