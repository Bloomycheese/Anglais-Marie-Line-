up plus élevée que d'habitude ce mois-ci."}, {"vis": "😠", "en": "complaint", "fr": "une réclamation, une plainte", "ex": "I'd like to make a complaint about the delivery.", "exfr": "J'aimerais faire une réclamation au sujet de la livraison."}, {"vis": "🚫", "en": "out of order", "fr": "en panne, hors service", "ex": "The elevator is out of order, so we'll take the stairs.", "exfr": "L'ascenseur est en panne, alors nous prendrons l'escalier."}, {"vis": "🕯️", "en": "power outage", "fr": "une coupure de courant", "ex": "After the ice storm, we had a power outage for two days.", "exfr": "Après la tempête de verglas, nous avons eu une coupure de courant pendant deux jours."}]}, {"id": "l3-opinion-words", "title": "Opinions et actualités", "w": [{"vis": "💭", "en": "opinion", "fr": "un avis, une opinion", "ex": "What's your opinion of the new café on Main Street?", "exfr": "Que pensez-vous du nouveau café de la rue principale ?"}, {"vis": "👍", "en": "agree", "fr": "être d'accord", "ex": "I agree with Emma. The garden looks better this year.", "exfr": "Je suis d'accord avec Emma. Le jardin est plus beau cette année."}, {"vis": "👎", "en": "disagree", "fr": "ne pas être d'accord", "ex": "I'm sorry, but I disagree with you on that point.", "exfr": "Je suis désolée, mais je ne suis pas d'accord avec vous sur ce point."}, {"vis": "🤔", "en": "reason", "fr": "une raison", "ex": "The main reason I like this town is the people.", "exfr": "La principale raison pour laquelle j'aime cette ville, ce sont les gens."}, {"vis": "👀", "en": "point of view", "fr": "un point de vue", "ex": "I understand your point of view, but I see it differently.", "exfr": "Je comprends votre point de vue, mais je vois les choses autrement."}, {"vis": "⚖️", "en": "on the other hand", "fr": "d'un autre côté, en revanche", "ex": "The city is exciting. On the other hand, it's very noisy.", "exfr": "La ville est animée. En revanche, elle est très bruyante."}, {"vis": "📰", "en": "headline", "fr": "un gros titre", "ex": "Did you see the headline in this morning's paper?", "exfr": "Vous avez vu le gros titre dans le journal de ce matin ?"}, {"vis": "🗞️", "en": "article", "fr": "un article", "ex": "There's an article about the new bridge in the local paper.", "exfr": "Il y a un article sur le nouveau pont dans le journal local."}, {"vis": "🌦️", "en": "weather forecast", "fr": "la météo, les prévisions", "ex": "According to the weather forecast, it will snow tonight.", "exfr": "D'après la météo, il va neiger cette nuit."}, {"vis": "📻", "en": "local news", "fr": "les informations locales", "ex": "I listen to the local news on the radio every morning.", "exfr": "J'écoute les informations locales à la radio tous les matins."}, {"vis": "💬", "en": "discussion", "fr": "une discussion", "ex": "We had a long discussion about the new road at dinner.", "exfr": "Nous avons eu une longue discussion sur la nouvelle route pendant le dîner."}, {"vis": "🌍", "en": "current events", "fr": "l'actualité", "ex": "James likes to talk about current events over a cup of tea.", "exfr": "James aime parler de l'actualité autour d'une tasse de thé."}]}], "grammar": [{"id": "l3-present-perfect", "title": "Le present perfect : vos expériences", "expl": ["Le present perfect se forme avec have ou has, suivi du participe passé : I have visited, she has seen. On l'utilise pour parler d'une expérience de la vie, sans dire quand elle a eu lieu.", "Avec ever (déjà, dans une question) et never (jamais), c'est le temps idéal : « Have you ever tried maple syrup? ». Apprenez par cœur les participes irréguliers les plus courants : been, seen, eaten, done, met, read."], "examples": [{"en": "I have never seen a moose.", "fr": "Je n'ai jamais vu d'élan."}, {"en": "Have you ever tried maple syrup?", "fr": "Avez-vous déjà goûté le sirop d'érable ?"}, {"en": "She has visited Boston twice.", "fr": "Elle est allée deux fois à Boston."}], "items": [{"q": "I have never ___ a real moose in the forest.", "a": "seen", "opts": ["saw", "seen", "see", "seeing"], "fr": "Je n'ai jamais vu de vrai élan dans la forêt."}, {"q": "Have you ever ___ to New York City?", "a": "been", "opts": ["be", "been", "was", "being"], "fr": "Êtes-vous déjà allée à New York ?"}, {"q": "My granddaughter ___ already finished her homework.", "a": "has", "opts": ["have", "has", "is", "does"], "fr": "Ma petite-fille a déjà fini ses devoirs."}, {"q": "We ___ eaten at that restaurant three times.", "a": "have", "opts": ["has", "have", "are", "did"], "fr": "Nous avons mangé trois fois dans ce restaurant."}, {"q": "___ you ever tried cheddar cheese from Vermont?", "a": "Have", "opts": ["Have", "Did", "Are", "Has"], "fr": "Avez-vous déjà goûté le cheddar du Vermont ?"}, {"q": "She has ___ a lot of books about American history.", "a": "read", "opts": ["read", "reads", "reading", "readed"], "fr": "Elle a lu beaucoup de livres sur l'histoire américaine."}, {"q": "I have ___ been skiing, but I would like to try one day.", "a": "never", "opts": ["ever", "never", "already", "yet"], "fr": "Je n'ai jamais fait de ski, mais j'aimerais essayer un jour."}, {"q": "Has Emma ___ her new neighbor yet?", "a": "met", "opts": ["meet", "met", "meets", "meeting"], "fr": "Emma a-t-elle déjà rencontré sa nouvelle voisine ?"}]}, {"id": "l3-perfect-or-past", "title": "Present perfect ou prétérit ?", "expl": ["Le prétérit (I visited) s'emploie quand le moment est précis et terminé : yesterday, last year, two days ago. Le present perfect (I have visited) s'emploie quand le moment n'est pas précisé, ou quand la période continue encore.", "Une astuce : avec ago, yesterday ou last, prenez le prétérit. Avec ever, never, already, yet ou just, prenez le present perfect.", "Pour dire « depuis », l'anglais utilise le present perfect, jamais le présent. For indique une durée (for ten years), since indique un point de départ (since Monday) : I have lived here since June."], "examples": [{"en": "I visited Quebec last summer.", "fr": "Je suis allée au Québec l'été dernier."}, {"en": "They have lived in this house for twenty years.", "fr": "Ils habitent dans cette maison depuis vingt ans."}, {"en": "We have known Emma since March.", "fr": "Nous connaissons Emma depuis mars."}], "items": [{"q": "We ___ to Boston two years ago.", "a": "went", "opts": ["have gone", "went", "go", "have been"], "fr": "Nous sommes allés à Boston il y a deux ans."}, {"q": "I ___ here since Monday, and I love it.", "a": "have been", "opts": ["was", "am", "have been", "had"], "fr": "Je suis ici depuis lundi, et je m'y plais beaucoup."}, {"q": "Grace has worked at the clinic ___ ten years.", "a": "for", "opts": ["since", "for", "during", "ago"], "fr": "Grace travaille à la clinique depuis dix ans."}, {"q": "James has lived in Vermont ___ last spring.", "a": "since", "opts": ["for", "since", "from", "ago"], "fr": "James habite dans le Vermont depuis le printemps dernier."}, {"q": "Yesterday I ___ a lovely walk along the river.", "a": "took", "opts": ["have taken", "took", "take", "taken"], "fr": "Hier, j'ai fait une belle promenade le long de la rivière."}, {"q": "Have you ___ finished your coffee? We can go now.", "a": "already", "opts": ["already", "ago", "since", "last"], "fr": "Vous avez déjà fini votre café ? Nous pouvons y aller."}, {"q": "When Emma was young, she ___ in Maine.", "a": "lived", "opts": ["has lived", "lived", "lives", "is living"], "fr": "Quand Emma était jeune, elle habitait dans le Maine."}, {"q": "My son-in-law ___ just called from the airport.", "a": "has", "opts": ["has", "have", "did", "does"], "fr": "Mon gendre vient d'appeler de l'aéroport."}]}, {"id": "l3-first-conditional", "title": "Le premier conditionnel : « si... »", "expl": ["Pour parler d'une situation probable dans le futur, on utilise if + présent, puis will + verbe : If it rains, we will stay home. C'est exactement comme en français : « s'il pleut, nous resterons à la maison ».", "Le piège : après if, jamais de will. On ne dit pas « if it will rain ». On peut aussi inverser les deux parties : We will stay home if it rains. À l'oral, will devient souvent 'll : I'll, we'll, you'll."], "examples": [{"en": "If it snows, we'll stay by the fire.", "fr": "S'il neige, nous resterons au coin du feu."}, {"en": "If you call me, I'll come and help.", "fr": "Si vous m'appelez, je viendrai vous aider."}], "items": [{"q": "If it ___ tomorrow, we will cancel the picnic.", "a": "rains", "opts": ["will rain", "rains", "rained", "raining"], "fr": "S'il pleut demain, nous annulerons le pique-nique."}, {"q": "If you come to Vermont in October, you ___ love the colors.", "a": "will", "opts": ["will", "do", "are", "did"], "fr": "Si vous venez dans le Vermont en octobre, vous allez adorer les couleurs."}, {"q": "I'll call you if the plane ___ late.", "a": "is", "opts": ["will be", "is", "was", "be"], "fr": "Je vous appellerai si l'avion a du retard."}, {"q": "If we leave now, we ___ get stuck in traffic.", "a": "won't", "opts": ["won't", "don't", "didn't", "aren't"], "fr": "Si nous partons maintenant, nous ne serons pas coincés dans les embouteillages."}, {"q": "If the children ___ their vegetables, they can have dessert.", "a": "eat", "opts": ["eat", "eats", "will eat", "ate"], "fr": "Si les enfants mangent leurs légumes, ils auront droit au dessert."}, {"q": "She ___ be very happy if you visit her.", "a": "will", "opts": ["will", "is", "does", "has"], "fr": "Elle sera très contente si vous lui rendez visite."}, {"q": "If you ___ hurry, you will miss the bus.", "a": "don't", "opts": ["don't", "won't", "doesn't", "aren't"], "fr": "Si vous ne vous dépêchez pas, vous allez rater le bus."}, {"q": "If I ___ some time on Sunday, I'll bake an apple pie.", "a": "have", "opts": ["have", "will have", "had", "having"], "fr": "Si j'ai le temps dimanche, je ferai une tarte aux pommes."}]}, {"id": "l3-polite-requests", "title": "Demander poliment", "expl": ["Pour une demande polie, could est plus doux que can : « Could you help me? ». Pour demander une permission, on dit May I ou Could I. Au guichet, au téléphone ou avec un inconnu, ces formules sont indispensables.", "Encore plus poli : Would you mind suivi du verbe en -ing, qui veut dire « cela vous ennuierait de ». Pour une demande très formelle : I would be grateful if you could (je vous serais reconnaissante de), ou I was wondering if you could (je me demandais si vous pourriez)."], "examples": [{"en": "Could you tell me where the post office is?", "fr": "Pourriez-vous me dire où se trouve la poste ?"}, {"en": "Would you mind speaking a little more slowly?", "fr": "Cela vous ennuierait de parler un peu plus lentement ?"}, {"en": "I would be grateful if you could call me back.", "fr": "Je vous serais reconnaissante de bien vouloir me rappeler."}], "items": [{"q": "___ you tell me what time the pharmacy opens?", "a": "Could", "opts": ["Could", "Should", "May", "Must"], "fr": "Pourriez-vous me dire à quelle heure ouvre la pharmacie ?"}, {"q": "Would you mind ___ the door for me?", "a": "opening", "opts": ["open", "opening", "to open", "opened"], "fr": "Cela vous ennuierait de m'ouvrir la porte ?"}, {"q": "I would be grateful if you ___ send me the bill again.", "a": "could", "opts": ["can", "could", "will", "should"], "fr": "Je vous serais reconnaissante de bien vouloir me renvoyer la facture."}, {"q": "___ I use your phone for a moment, please?", "a": "May", "opts": ["May", "Would", "Should", "Do"], "fr": "Puis-je utiliser votre téléphone un instant, s'il vous plaît ?"}, {"q": "Would you ___ to join us for dinner on Friday?", "a": "like", "opts": ["like", "mind", "want to", "love to"], "fr": "Voulez-vous vous joindre à nous pour dîner vendredi ?"}, {"q": "Could you speak a little more ___, please?", "a": "slowly", "opts": ["slow", "slowly", "slowest", "slowness"], "fr": "Pourriez-vous parler un peu plus lentement, s'il vous plaît ?"}, {"q": "Do you mind ___ I sit here?", "a": "if", "opts": ["if", "that", "when", "what"], "fr": "Ça vous dérange si je m'assois ici ?"}, {"q": "I was ___ if you could help me with this form.", "a": "wondering", "opts": ["wondering", "wonder", "wondered", "wonders"], "fr": "Je me demandais si vous pourriez m'aider avec ce formulaire."}]}, {"id": "l3-phrasal-verbs-grammar", "title": "Les verbes à particule", "expl": ["En anglais, beaucoup de verbes changent de sens avec une petite particule : look (regarder), look for (chercher), look after (s'occuper de). On les appelle phrasal verbs. Ils sont partout dans la conversation : apprenez-les comme des mots entiers.", "Une astuce : notez chacun avec un exemple concret, par exemple « I pick up my granddaughter at school ». Avec un pronom, la particule se place souvent après lui : turn it off, pick her up."], "examples": [{"en": "Could you turn off the radio?", "fr": "Pourriez-vous éteindre la radio ?"}, {"en": "I'm looking for my glasses.", "fr": "Je cherche mes lunettes."}, {"en": "We'll pick you up at six.", "fr": "Nous viendrons vous chercher à six heures."}], "items": [{"q": "I'm looking ___ my keys. Have you seen them?", "a": "for", "opts": ["for", "after", "at", "up"], "fr": "Je cherche mes clés. Vous les avez vues ?"}, {"q": "Could you look ___ the cat while we're away?", "a": "after", "opts": ["for", "after", "up", "out"], "fr": "Pourriez-vous vous occuper du chat pendant notre absence ?"}, {"q": "Please turn ___ the television. Nobody is watching it.", "a": "off", "opts": ["on", "off", "up", "in"], "fr": "Éteignez la télévision, s'il vous plaît. Personne ne la regarde."}, {"q": "Don't give ___! Your English is getting better every day.", "a": "up", "opts": ["up", "in", "out", "off"], "fr": "N'abandonnez pas ! Votre anglais s'améliore de jour en jour."}, {"q": "I'll call the airline to find ___ when the flight leaves.", "a": "out", "opts": ["out", "up", "off", "over"], "fr": "Je vais appeler la compagnie pour savoir quand le vol part."}, {"q": "Our car broke ___ on the highway, so we called a tow truck.", "a": "down", "opts": ["down", "up", "out", "off"], "fr": "Notre voiture est tombée en panne sur l'autoroute, alors nous avons appelé une dépanneuse."}, {"q": "I'm really looking forward ___ seeing the grandchildren.", "a": "to", "opts": ["to", "for", "at", "of"], "fr": "J'ai vraiment hâte de voir les petits-enfants."}, {"q": "Please fill ___ this form and give it back to the nurse.", "a": "out", "opts": ["out", "up", "on", "off"], "fr": "Veuillez remplir ce formulaire et le rendre à l'infirmière."}]}, {"id": "l3-past-story", "title": "Raconter une histoire au passé", "expl": ["Pour raconter, on mélange deux temps. Le past continuous (was ou were + verbe en -ing) décrit le décor, l'action en cours : I was walking. Le prétérit raconte l'événement soudain : I saw a deer. Ensemble : I was walking when I saw a deer.", "Quelques petits mots aident à raconter : first (d'abord), then (ensuite), suddenly (soudain), while (pendant que), in the end (finalement). While est souvent suivi du past continuous, when du prétérit."], "examples": [{"en": "I was cooking when the phone rang.", "fr": "J'étais en train de cuisiner quand le téléphone a sonné."}, {"en": "While we were waiting, it started to snow.", "fr": "Pendant que nous attendions, il s'est mis à neiger."}], "items": [{"q": "I ___ reading in the garden when it started to rain.", "a": "was", "opts": ["was", "were", "am", "did"], "fr": "J'étais en train de lire dans le jardin quand il s'est mis à pleuvoir."}, {"q": "We were having dinner when someone ___ at the door.", "a": "knocked", "opts": ["knocked", "has knocked", "knocks", "knock"], "fr": "Nous étions en train de dîner quand quelqu'un a frappé à la porte."}, {"q": "While Emma ___ her garden, Biscuit ran into the street.", "a": "was watering", "opts": ["was watering", "were watering", "waters", "is watering"], "fr": "Pendant qu'Emma arrosait son jardin, Biscuit s'est sauvé dans la rue."}, {"q": "The children ___ playing outside when the storm began.", "a": "were", "opts": ["was", "were", "are", "have"], "fr": "Les enfants jouaient dehors quand l'orage a commencé."}, {"q": "My son-in-law was driving to the store when he ___ a moose on the road.", "a": "saw", "opts": ["saw", "was seeing", "sees", "has seen"], "fr": "Mon gendre était en route pour le magasin quand il a vu un élan sur la route."}, {"q": "___, the lights went out and everyone screamed.", "a": "Suddenly", "opts": ["Suddenly", "While", "Since", "During"], "fr": "Soudain, les lumières se sont éteintes et tout le monde a crié."}, {"q": "First we visited the museum, and ___ we had lunch by the lake.", "a": "then", "opts": ["then", "while", "when", "since"], "fr": "D'abord, nous avons visité le musée, puis nous avons déjeuné au bord du lac."}, {"q": "What ___ you doing when I called you last night?", "a": "were", "opts": ["were", "did", "was", "are"], "fr": "Qu'est-ce que vous faisiez quand je vous ai appelé hier soir ?"}]}]}, "4": {"themes": [{"id": "l4-diplomacy", "title": "L'art de la diplomatie", "sub": "Adoucir, suggérer, refuser avec tact", "icon": "bubble", "p": [{"en": "I was wondering if you might be able to give me a ride to the station tomorrow.", "fr": "Je me demandais si vous pourriez me conduire à la gare demain.", "alts": ["I was wondering if you could give me a ride to the station tomorrow.", "I was wondering if you might be able to give me a lift to the station tomorrow."]}, {"en": "To be honest, I'm not sure that's such a good idea.", "fr": "Pour être honnête, je ne suis pas sûre que ce soit une si bonne idée.", "alts": ["I'm not sure that's such a good idea, to be honest."]}, {"en": "Would you mind if I opened the window a little? It's rather warm in here.", "fr": "Cela vous dérangerait-il que j'ouvre un peu la fenêtre ? Il fait plutôt chaud ici.", "alts": ["Would you mind if I opened the window a bit? It's rather warm in here."]}, {"en": "It might be better to leave a little earlier, just in case there's traffic.", "fr": "Il vaudrait peut-être mieux partir un peu plus tôt, au cas où il y aurait des embouteillages.", "alts": ["It might be better to leave a bit earlier, just in case there's traffic."]}, {"en": "That's very kind of you, but I'm afraid I'll have to say no this time.", "fr": "C'est très gentil à vous, mais je crains de devoir refuser cette fois-ci.", "alts": ["That's very kind of you, but I'm afraid I'll have to decline this time."]}, {"en": "Perhaps we could look at it from a slightly different angle?", "fr": "Peut-être pourrions-nous voir les choses sous un angle un peu différent ?", "alts": ["Maybe we could look at it from a slightly different angle?"]}, {"en": "I hope you don't mind me saying so, but the soup is a little salty.", "fr": "J'espère que vous ne m'en voudrez pas de vous le dire, mais la soupe est un peu salée.", "alts": []}, {"en": "It's not exactly what I had in mind, but I'm willing to give it a try.", "fr": "Ce n'est pas tout à fait ce que j'avais en tête, mais je veux bien essayer.", "alts": ["It's not quite what I had in mind, but I'm willing to give it a try."]}, {"en": "Would it be possible to move dinner to Saturday instead?", "fr": "Serait-il possible de déplacer le dîner à samedi plutôt ?", "alts": ["Could we move dinner to Saturday instead?"]}, {"en": "I don't want to intrude, so please tell me if it's a bad time.", "fr": "Je ne veux pas déranger, alors dites-moi franchement si ce n'est pas le bon moment.", "alts": ["I don't want to intrude, so just tell me if it's a bad time."]}, {"en": "You may well be right, but I'd like to think it over first.", "fr": "Vous avez peut-être raison, mais j'aimerais d'abord y réfléchir.", "alts": ["You might well be right, but I'd like to think about it first."]}, {"en": "If it's not too much trouble, could you speak a little more slowly?", "fr": "Si cela ne vous ennuie pas trop, pourriez-vous parler un peu plus lentement ?", "alts": ["If it isn't too much trouble, could you speak a bit more slowly?"]}]}, {"id": "l4-agreeing", "title": "D'accord ou pas d'accord", "sub": "Approuver, nuancer, contredire poliment", "icon": "smile", "p": [{"en": "I couldn't agree more, that's exactly how I feel.", "fr": "Je suis entièrement d'accord, c'est exactement ce que je ressens.", "alts": ["I totally agree, that's exactly how I feel."]}, {"en": "I see what you mean, but I'm not entirely convinced.", "fr": "Je vois ce que vous voulez dire, mais je ne suis pas tout à fait convaincue.", "alts": ["I see your point, but I'm not entirely convinced."]}, {"en": "That's a fair point, although I think there's more to it than that.", "fr": "C'est un argument valable, même si je pense que c'est un peu plus compliqué que ça.", "alts": []}, {"en": "I'm afraid I have to disagree with you on that one.", "fr": "Je crains de ne pas être d'accord avec vous sur ce point.", "alts": ["I'm afraid I disagree with you on that one."]}, {"en": "You have a point there, I hadn't thought of it that way.", "fr": "Vous n'avez pas tort, je n'avais pas vu les choses sous cet angle.", "alts": ["You've got a point there, I hadn't thought of it that way."]}, {"en": "Up to a point, yes, but it really depends on the situation.", "fr": "Jusqu'à un certain point, oui, mais tout dépend vraiment de la situation.", "alts": ["To some extent, yes, but it really depends on the situation."]}, {"en": "Let's agree to disagree and have another cup of coffee.", "fr": "Disons que nous ne sommes pas d'accord, et reprenons une tasse de café.", "alts": []}, {"en": "I'm with you on the first part, but not on the second.", "fr": "Je suis d'accord avec vous sur la première partie, mais pas sur la seconde.", "alts": ["I agree with you on the first part, but not on the second."]}, {"en": "Don't get me wrong, I love New York, but I could never live there.", "fr": "Comprenez-moi bien, j'adore New York, mais je ne pourrais jamais y vivre.", "alts": []}, {"en": "That's one way of looking at it, but have you considered the cost?", "fr": "C'est une façon de voir les choses, mais avez-vous pensé au coût ?", "alts": ["That's one way to look at it, but have you thought about the cost?"]}, {"en": "Funnily enough, I was just about to say the same thing.", "fr": "C'est drôle, j'allais justement dire la même chose.", "alts": ["Funny enough, I was just about to say the same thing."]}, {"en": "I used to think so too, but I've changed my mind over the years.", "fr": "Je le pensais aussi autrefois, mais j'ai changé d'avis avec les années.", "alts": []}]}, {"id": "l4-hosting", "title": "Recevoir et être reçue", "sub": "Accueillir, remercier, faire honneur", "icon": "house", "p": [{"en": "Make yourselves at home, and help yourselves to anything in the fridge.", "fr": "Faites comme chez vous, et servez-vous dans le frigo sans hésiter.", "alts": []}, {"en": "Is there anything I can bring, a dessert or a bottle of wine perhaps?", "fr": "Est-ce que je peux apporter quelque chose, un dessert ou une bouteille de vin peut-être ?", "alts": ["Can I bring anything, maybe a dessert or a bottle of wine?"]}, {"en": "Please don't go to any trouble on my account.", "fr": "Surtout, ne vous donnez pas de mal pour moi.", "alts": ["Please don't go to too much trouble for me."]}, {"en": "Everything was delicious. You'll have to give me the recipe for that pie.", "fr": "Tout était délicieux, il faudra absolument me donner la recette de cette tarte.", "alts": []}, {"en": "Would you like me to give you a hand with the dishes?", "fr": "Voulez-vous que je vous aide à faire la vaisselle ?", "alts": ["Can I give you a hand with the dishes?", "Would you like some help with the dishes?"]}, {"en": "Don't be silly, you're our guest. Just sit back and relax.", "fr": "Mais voyons, vous êtes notre invitée. Installez-vous et détendez-vous.", "alts": []}, {"en": "I hope we're not keeping you up. It's getting rather late.", "fr": "J'espère que nous ne vous empêchons pas d'aller vous coucher, il se fait tard.", "alts": []}, {"en": "Thank you for having me. I've had a wonderful evening.", "fr": "Merci de m'avoir reçue, j'ai passé une merveilleuse soirée.", "alts": ["Thanks for having me. I've had a lovely evening."]}, {"en": "Are there any foods you don't eat, or anything you're allergic to?", "fr": "Y a-t-il des aliments que vous ne mangez pas, ou auxquels vous êtes allergique ?", "alts": []}, {"en": "In France, guests usually bring flowers, but never chrysanthemums.", "fr": "En France, les invités apportent souvent des fleurs, mais jamais de chrysanthèmes.", "alts": []}, {"en": "You really shouldn't have! These flowers are absolutely beautiful.", "fr": "Il ne fallait pas ! Ces fleurs sont vraiment magnifiques.", "alts": []}, {"en": "Next time you're in France, you must come and stay with me.", "fr": "La prochaine fois que vous viendrez en France, il faut absolument que vous veniez chez moi.", "alts": ["Next time you're in France, you have to come and stay with me."]}]}, {"id": "l4-misunderstandings", "title": "Dissiper un malentendu", "sub": "Clarifier, s'excuser, en rire", "icon": "sign", "p": [{"en": "Sorry, I think I may have misunderstood. Did you say Tuesday or Thursday?", "fr": "Pardon, je crois que j'ai mal compris. Vous avez dit mardi ou jeudi ?", "alts": []}, {"en": "That's not quite what I meant. Let me put it another way.", "fr": "Ce n'est pas exactement ce que je voulais dire. Je vais le formuler autrement.", "alts": ["That's not exactly what I meant. Let me put it another way."]}, {"en": "I think we got our wires crossed about the time of the appointment.", "fr": "Je crois qu'il y a eu un malentendu sur l'heure du rendez-vous.", "alts": []}, {"en": "I didn't mean to offend anyone. In French, that word sounds much softer.", "fr": "Je ne voulais vexer personne. En français, ce mot paraît beaucoup plus doux.", "alts": []}, {"en": "Could you spell that for me? I'd hate to get the name wrong.", "fr": "Pourriez-vous me l'épeler ? Je m'en voudrais de me tromper de nom.", "alts": []}, {"en": "Oh, I see! I thought you were joking, but you were being serious.", "fr": "Ah, je comprends ! Je croyais que vous plaisantiez, mais vous étiez sérieux.", "alts": []}, {"en": "I'm so sorry, I must have mixed you up with someone else.", "fr": "Je suis vraiment désolée, j'ai dû vous confondre avec quelqu'un d'autre.", "alts": []}, {"en": "When I said the meal was interesting, I meant it as a compliment!", "fr": "Quand j'ai dit que le repas était intéressant, c'était un compliment !", "alts": []}, {"en": "No harm done. These things happen when you speak two languages.", "fr": "Il n'y a pas de mal. Ce sont des choses qui arrivent quand on parle deux langues.", "alts": []}, {"en": "Just to make sure I've got this right, we're meeting at the café at ten thirty?", "fr": "Juste pour être sûre d'avoir bien compris, on se retrouve au café à dix heures et demie ?", "alts": []}, {"en": "I asked for a little milk, and the waiter brought me a whole glass of it!", "fr": "J'ai demandé un peu de lait, et le serveur m'en a apporté un grand verre !", "alts": []}, {"en": "I'm glad we cleared that up. I was starting to feel a bit lost.", "fr": "Je suis contente que nous ayons éclairci ce point. Je commençais à me sentir un peu perdue.", "alts": ["I'm glad we sorted that out. I was starting to feel a bit lost."]}]}, {"id": "l4-france-usa", "title": "La France et l'Amérique", "sub": "Comparer, s'étonner, voyager", "icon": "case", "p": [{"en": "What struck me most when I first came here was how friendly strangers are.", "fr": "Ce qui m'a le plus frappée à mon arrivée, c'est à quel point les inconnus sont aimables.", "alts": []}, {"en": "In France, we tend to take our time over lunch, whereas here people often eat at their desks.", "fr": "En France, on a tendance à prendre son temps pour déjeuner, alors qu'ici les gens mangent souvent à leur bureau.", "alts": []}, {"en": "I still haven't gotten used to adding the tip at the end of the meal.", "fr": "Je ne me suis toujours pas habituée à ajouter le pourboire à la fin du repas.", "alts": ["I'm still not used to adding the tip at the end of the meal."]}, {"en": "Distances are so much greater here. Nobody thinks twice about driving three hours for dinner.", "fr": "Les distances sont tellement plus grandes ici. Personne n'hésite à faire trois heures de route pour un dîner.", "alts": []}, {"en": "If I lived here all year round, I think I'd miss the bakeries most of all.", "fr": "Si je vivais ici toute l'année, je crois que ce sont les boulangeries qui me manqueraient le plus.", "alts": ["If I lived here all year round, I think I would miss the bakeries most of all."]}, {"en": "Americans are much more relaxed about using first names, even with people they've just met.", "fr": "Les Américains utilisent beaucoup plus facilement le prénom, même avec des gens qu'ils viennent de rencontrer.", "alts": []}, {"en": "On the other hand, the customer service here is second to none.", "fr": "En revanche, le service client ici est incomparable.", "alts": []}, {"en": "The jet lag hits me much harder on the way back to France.", "fr": "Le décalage horaire me fatigue beaucoup plus au retour en France.", "alts": ["Jet lag hits me much harder on the way back to France."]}, {"en": "Vermont reminds me a little of the French countryside, only with more maple trees.", "fr": "Le Vermont me rappelle un peu la campagne française, mais avec plus d'érables.", "alts": []}, {"en": "Every country has its quirks, and that's what makes traveling so fascinating.", "fr": "Chaque pays a ses petites manies, et c'est ce qui rend les voyages si passionnants.", "alts": ["Each country has its quirks, and that's what makes traveling so fascinating."]}, {"en": "My grandchildren laugh at me because I still convert everything into euros.", "fr": "Mes petits-enfants se moquent de moi parce que je convertis encore tout en euros.", "alts": []}, {"en": "Had I known how cold the winters were, I would have packed a warmer coat.", "fr": "Si j'avais su à quel point les hivers étaient froids, j'aurais emporté un manteau plus chaud.", "alts": ["If I had known how cold the winters were, I would have packed a warmer coat.", "If I'd known how cold the winters were, I'd have packed a warmer coat."]}]}, {"id": "l4-food-culture", "title": "Cuisine et art de vivre", "sub": "Goûts, traditions, opinions nuancées", "icon": "cup", "p": [{"en": "I'm not a huge fan of peanut butter, but I must admit these cookies are delicious.", "fr": "Je ne suis pas une grande amatrice de beurre de cacahuète, mais je dois avouer que ces biscuits sont délicieux.", "alts": []}, {"en": "For me, a meal without bread and cheese doesn't quite feel like a meal.", "fr": "Pour moi, un repas sans pain ni fromage n'est pas tout à fait un vrai repas.", "alts": []}, {"en": "It's an acquired taste, but once you get used to it, you can't do without it.", "fr": "C'est un goût qui s'acquiert, mais une fois qu'on s'y est habitué, on ne peut plus s'en passer.", "alts": []}, {"en": "Portions here are so generous that I usually take half of it home.", "fr": "Les portions sont si généreuses ici que j'en emporte généralement la moitié à la maison.", "alts": []}, {"en": "I find American breakfasts rather heavy, though the pancakes are hard to resist.", "fr": "Je trouve les petits-déjeuners américains plutôt copieux, même s'il est difficile de résister aux pancakes.", "alts": ["I find American breakfasts quite heavy, although the pancakes are hard to resist."]}, {"en": "What I love about farmers markets is that you can chat with the people who grow the food.", "fr": "Ce que j'aime dans les marchés fermiers, c'est qu'on peut discuter avec ceux qui cultivent les produits.", "alts": []}, {"en": "Cooking for the whole family is my way of showing them how much I love them.", "fr": "Cuisiner pour toute la famille, c'est ma façon de leur montrer combien je les aime.", "alts": []}, {"en": "I'd rather have a small piece of really good cheese than a big block of the ordinary kind.", "fr": "Je préfère un petit morceau de très bon fromage à un gros bloc de fromage ordinaire.", "alts": ["I would rather have a small piece of really good cheese than a big block of the ordinary kind."]}, {"en": "Thanksgiving dinner was a real eye-opener. I'd never seen so much food on one table!", "fr": "Le repas de Thanksgiving a été une vraie découverte. Je n'avais jamais vu autant de nourriture sur une seule table !", "alts": []}, {"en": "To be fair, the cheese made in Vermont can hold its own against many French cheeses.", "fr": "Pour être honnête, le fromage du Vermont n'a rien à envier à beaucoup de fromages français.", "alts": []}, {"en": "I'll try anything once, but I draw the line at fried insects.", "fr": "Je suis prête à tout goûter une fois, mais les insectes frits, très peu pour moi.", "alts": []}, {"en": "If I'd known you were vegetarian, I would have made a mushroom tart instead.", "fr": "Si j'avais su que vous étiez végétarien, j'aurais plutôt fait une tarte aux champignons.", "alts": ["If I had known you were vegetarian, I would have made a mushroom tart instead."]}]}, {"id": "l4-stories", "title": "Raconter et regretter", "sub": "Souvenirs, anecdotes, souhaits et regrets", "icon": "book", "p": [{"en": "It was such a long time ago, but I remember it as if it were yesterday.", "fr": "C'était il y a si longtemps, mais je m'en souviens comme si c'était hier.", "alts": ["It was so long ago, but I remember it as if it were yesterday."]}, {"en": "At first, everything seemed to be going smoothly, but then the car broke down.", "fr": "Au début, tout semblait bien se passer, mais ensuite la voiture est tombée en panne.", "alts": []}, {"en": "Just as we were about to leave, the phone rang, and it was my sister.", "fr": "Au moment où nous allions partir, le téléphone a sonné, et c'était ma sœur.", "alts": []}, {"en": "To cut a long story short, we missed the train and had to spend the night in Lyon.", "fr": "Pour faire court, nous avons raté le train et avons dû passer la nuit à Lyon.", "alts": ["Long story short, we missed the train and had to spend the night in Lyon."]}, {"en": "I wish I had learned English when I was younger.", "fr": "Je regrette de ne pas avoir appris l'anglais quand j'étais plus jeune.", "alts": ["I wish I'd learned English when I was younger."]}, {"en": "If only I had taken more photos of my grandparents' house.", "fr": "Si seulement j'avais pris plus de photos de la maison de mes grands-parents.", "alts": ["If only I'd taken more photos of my grandparents' house."]}, {"en": "Despite the rain, it turned out to be one of the best days of the whole trip.", "fr": "Malgré la pluie, ça a fini par être l'une des plus belles journées de tout le voyage.", "alts": []}, {"en": "Looking back, I wouldn't change a thing, even the difficult moments.", "fr": "Avec le recul, je ne changerais rien, même les moments difficiles.", "alts": []}, {"en": "My friend told me she had never laughed so much in her life.", "fr": "Mon amie m'a dit qu'elle n'avait jamais autant ri de sa vie.", "alts": []}, {"en": "Eventually, a kind farmer stopped and offered to tow us to the nearest village.", "fr": "Finalement, un fermier aimable s'est arrêté et a proposé de nous remorquer jusqu'au village le plus proche.", "alts": ["In the end, a kind farmer stopped and offered to tow us to the nearest village."]}, {"en": "I wish I could spend more time with my grandchildren, but they live so far away.", "fr": "J'aimerais pouvoir passer plus de temps avec mes petits-enfants, mais ils habitent si loin.", "alts": []}, {"en": "Believe it or not, that's how I learned to bake a real apple pie.", "fr": "Croyez-le ou non, c'est comme ça que j'ai appris à faire une vraie tarte aux pommes.", "alts": []}]}, {"id": "l4-ageing-tech", "title": "Bien vieillir à l'ère numérique", "sub": "Santé, rythme de vie, technologie", "icon": "phone", "p": [{"en": "If you ask me, the secret to aging well is staying curious.", "fr": "À mon avis, le secret pour bien vieillir, c'est de rester curieuse.", "alts": ["The secret to aging well, if you ask me, is staying curious."]}, : "takeout", "fr": "des plats à emporter", "ex": "We were too tired to cook, so we ordered takeout.", "exfr": "Nous étions trop fatigués pour cuisiner, alors nous avons commandé des plats à emporter."}, {"vis": "😄", "en": "small talk", "fr": "la conversation de politesse", "ex": "Americans are very good at small talk, even in the line at the supermarket.", "exfr": "Les Américains sont très doués pour bavarder de tout et de rien, même dans la file d'attente du supermarché."}, {"vis": "🧾", "en": "the check", "fr": "l'addition", "ex": "Excuse me, could we have the check, please?", "exfr": "Excusez-moi, pourriez-vous nous apporter l'addition, s'il vous plaît ?"}]}], "grammar": [{"id": "l4-second-conditional", "title": "Le conditionnel irréel : if + prétérit", "expl": ["Pour imaginer une situation qui n'est pas réelle aujourd'hui, l'anglais utilise if suivi du prétérit, puis would avec le verbe. C'est l'équivalent de notre « si j'avais..., je ferais... ».", "Attention : jamais de would juste après if. Avec le verbe be, on dit souvent were à toutes les personnes, surtout pour donner un conseil : « If I were you » (à votre place).", "Astuce : à l'oral, would se contracte en 'd. « I'd travel more » est plus naturel que « I would travel more »."], "examples": [{"en": "If I lived closer, I would visit you every week.", "fr": "Si j'habitais plus près, je viendrais vous voir chaque semaine."}, {"en": "If I were you, I'd take a warmer coat.", "fr": "À votre place, je prendrais un manteau plus chaud."}], "items": [{"q": "If I ___ more time, I would learn to play the piano.", "a": "had", "opts": ["have", "had", "would have", "having"], "fr": "Si j'avais plus de temps, j'apprendrais à jouer du piano."}, {"q": "If I were you, I ___ call her right away.", "a": "would", "opts": ["will", "would", "did", "am"], "fr": "À votre place, je l'appellerais tout de suite."}, {"q": "If we lived in Vermont, we ___ go skiing every weekend.", "a": "could", "opts": ["can", "could", "will", "are"], "fr": "Si nous habitions dans le Vermont, nous pourrions skier tous les week-ends."}, {"q": "What would you do if you ___ the lottery?", "a": "won", "opts": ["win", "won", "would win", "winning"], "fr": "Que feriez-vous si vous gagniez à la loterie ?"}, {"q": "If she ___ English better, she would chat with the neighbors more.", "a": "spoke", "opts": ["speaks", "spoke", "would speak", "spoken"], "fr": "Si elle parlait mieux anglais, elle discuterait davantage avec les voisins."}, {"q": "I ___ that house if it weren't so far from the town center.", "a": "would buy", "opts": ["will buy", "would buy", "bought", "buy"], "fr": "J'achèterais cette maison si elle n'était pas si loin du centre-ville."}, {"q": "If it ___ so cold, we could eat outside.", "a": "weren't", "opts": ["isn't", "weren't", "won't be", "wouldn't be"], "fr": "S'il ne faisait pas si froid, nous pourrions manger dehors."}, {"q": "If you could live anywhere in the world, where ___ you choose?", "a": "would", "opts": ["will", "would", "do", "did"], "fr": "Si vous pouviez vivre n'importe où dans le monde, où choisiriez-vous ?"}]}, {"id": "l4-third-conditional", "title": "Le conditionnel passé : refaire l'histoire", "expl": ["Pour parler d'un passé qui ne s'est pas produit, on utilise if + had + participe passé, puis would have + participe passé. C'est notre « si j'avais su, je serais venue ».", "À l'oral, tout se contracte : « If I'd known, I'd have come ». Ne confondez pas : le premier 'd veut dire had, le second veut dire would.", "On peut remplacer would par could ou might pour exprimer une simple possibilité : « We might have missed the train »."], "examples": [{"en": "If I had known you were coming, I would have baked a cake.", "fr": "Si j'avais su que vous veniez, j'aurais fait un gâteau."}, {"en": "If we hadn't taken that road, we would never have found this village.", "fr": "Si nous n'avions pas pris cette route, nous n'aurions jamais trouvé ce village."}], "items": [{"q": "If I had left earlier, I __ il en faut un : « She told me that... ». À l'oral, le mot that disparaît souvent.", "Pour une question rapportée, on reprend l'ordre normal sujet puis verbe, sans do ni point d'interrogation : « He asked me where I lived »."], "examples": [{"en": "Emma said she was tired.", "fr": "Emma a dit qu'elle était fatiguée."}, {"en": "James told me he would call back later.", "fr": "James m'a dit qu'il rappellerait plus tard."}, {"en": "Grace asked me where I had bought my scarf.", "fr": "Grace m'a demandé où j'avais acheté mon foulard."}], "items": [{"q": "Emma ___ me that her dog was sick.", "a": "told", "opts": ["said", "told", "asked", "spoke"], "fr": "Emma m'a dit que son chien était malade."}, {"q": "James said that he ___ tired after his long walk.", "a": "was", "opts": ["is", "was", "be", "been"], "fr": "James a dit qu'il était fatigué après sa longue promenade."}, {"q": "She told me she ___ call me back the next day.", "a": "would", "opts": ["will", "would", "can", "shall"], "fr": "Elle m'a dit qu'elle me rappellerait le lendemain."}, {"q": "He asked me where I ___.", "a": "lived", "opts": ["live", "lived", "do live", "did I live"], "fr": "Il m'a demandé où j'habitais."}, {"q": "Grace asked us ___ we wanted to join the book club.", "a": "if", "opts": ["that", "if", "what", "do"], "fr": "Grace nous a demandé si nous voulions rejoindre le club de lecture."}, {"q": "My daughter said she ___ already booked the tickets.", "a": "had", "opts": ["has", "had", "have", "was"], "fr": "Ma fille a dit qu'elle avait déjà réservé les billets."}, {"q": "The doctor told me ___ drink more water.", "a": "to", "opts": ["to", "that", "for", "should"], "fr": "Le médecin m'a dit de boire plus d'eau."}, {"q": "James ___ that York was the most beautiful city in England.", "a": "said", "opts": ["told", "said", "asked", "talked"], "fr": "James a dit que York était la plus belle ville d'Angleterre."}]}, {"id": "l4-wishes-regrets", "title": "Souhaits et regrets : I wish, if only", "expl": ["Pou "}, {"q": "She wishes she ___ said that to her sister.", "a": "hadn't", "opts": ["didn't", "hadn't", "wouldn't", "doesn't"], "fr": "Elle regrette d'avoir dit cela à sa sœur."}, {"q": "I wish I ___ more time to read.", "a": "had", "opts": ["have", "had", "having", "will have"], "fr": "J'aimerais avoir plus de temps pour lire."}]}, {"id": "l4-softening", "title": "Adoucir ses propos", "expl": ["En anglais, on évite d'être trop direct. Pour adoucir une demande, on utilise would, could ou might : « Could you possibly... ? », « Would you mind... ? ». Après would you mind, le verbe prend -ing.", "Pour un désaccord ou une critique, on ajoute de petits mots : a bit, slightly, not really, I'm afraid. « It's a bit expensive » passe beaucoup mieux que « It's expensive ».", "Autre astuce très anglaise : dire le contraire à la forme négative. « It's not very warm » est plus poli que « It's cold »."], "examples": [{"en": "Would you mind closing the door?", "fr": "Cela vous dérangerait-il de fermer la porte ?"}, {"en": "I'm afraid I can't make it on Friday.", "fr": "Je crains de ne pas pouvoir venir vendredi."}, {"en": "The music is a bit loud, isn't it?", "fr": "La musique est un peu forte, vous ne trouvez pas ?"}], "items": [{"q": "Would you mind ___ me the salt?", "a": "passing", "opts": ["pass", "to pass", "passing", "passed"], "fr": "Cela vous dérangerait-il de me passer le sel ?"}, {"q": "I'm ___ I can't come to the party on Saturday.", "a": "afraid", "opts": ["afraid", "scared", "sorry for", "fear"], "fr": "Je crains de ne pas pouvoir venir à la fête samedi."}, {"q": "The soup is ___ salty, but it's still very good.", "a": "slightly", "opts": ["slightly", "very", "totally", "extremely"], "fr": "La soupe est légèrement salée, mais elle est quand même très bonne."}, {"q": "___ you possibly help me carry these bags?", "a": "Could", "opts": ["Could", "Must", "Should", "Shall"], "fr": "Pourriez-vous m'aider à porter ces sacs, si possible ?"}, {"q": "It ___ be a good idea to book a table in advance.", "a": "might", "opts": ["might", "must", "has to", "will"], "fr": "Ce serait peut-être une bonne idée de réserver une table à l'avance."}, {"q": "I don't ___ agree with you on that point.", "a": "really", "opts": ["really", "never", "ever", "at all"], "fr": "Je ne suis pas vraiment d'accord avec vous sur ce point."}, {"q": "Instead of saying it's ugly, you could say it's not very ___.", "a": "pretty", "opts": ["pretty", "ugly", "beautifully", "bad"], "fr": "Au lieu de dire que c'est laid, vous pourriez dire que ce n'est pas très joli."}, {"q": "I was ___ if you could lend me your ladder this weekend.", "a": "wondering", "opts": ["wondering", "wanting", "asking", "thinking"], "fr": "Je me demandais si vous pourriez me prêter votre échelle ce week-end."}]}, {"id": "l4-linking-words", "title": "Les mots de liaison", "expl": ["Pour raconter une histoire avec fluidité, on relie les idées. Pour opposer deux faits : although (bien que, même si) est suivi d'une phrase, despite (malgré) est suivi d'un nom ou d'un verbe en -ing.", "Pour le temps : as soon as (dès que), meanwhile (pendant ce temps), eventually (finalement). Attention, eventually est un faux ami : il ne veut pas dire « éventuellement ».", "However (cependant) se place souvent en début de phrase, suivi d'une virgule. Whereas (alors que) compare deux personnes ou deux choses."], "examples": [{"en": "Although it was late, we kept talking.", "fr": "Même s'il était tard, nous avons continué à bavarder."}, {"en": "Despite the rain, we enjoyed the picnic.", "fr": "Malgré la pluie, nous avons apprécié le pique-nique."}], "items": [{"q": "___ it was snowing, the bus arrived on time.", "a": "Although", "opts": ["Although", "Despite", "However", "Because of"], "fr": "Même s'il neigeait, le bus est arrivé à l'heure."}, {"q": "___ the traffic, we got to the airport early.", "a": "Despite", "opts": ["Although", "Despite", "Whereas", "Even though"], "fr": "Malgré la circulation, nous sommes arrivés tôt à const G1=[{"id": "l1-to-be", "title": "Le verbe être : am, is, are", "expl": ["Le verbe be veut dire « être ». Il a trois formes au présent : I am (je suis), he, she ou it is (il, elle est), et you, we, they are (vous êtes, nous sommes, ils sont).", "À l'oral, on raccourcit presque toujours : I'm, she's, we're, they're. Pour dire non, on ajoute simplement not : I'm not tired."], "examples": [{"en": "I am French.", "fr": "Je suis française."}, {"en": "She is my daughter.", "fr": "C'est ma fille."}, {"en": "We are on vacation.", "fr": "Nous sommes en vacances."}], "items": [{"q": "I ___ happy to see you.", "a": "am", "opts": ["am", "is", "are", "be"], "fr": "Je suis contente de vous voir."}, {"q": "My daughter ___ a teacher.", "a": "is", "opts": ["is", "am", "are", "be"], "fr": "Ma fille est enseignante."}, {"q": "We ___ in Vermont.", "a": "are", "opts": ["are", "is", "am", "be"], "fr": "Nous sommes dans le Vermont."}, {"q": "The coffee ___ hot.", "a": "is", "opts": ["is", "are", "am", "be"], "fr": "Le café est chaud."}, {"q": "You ___ very kind.", "a": "are", "opts": ["are", "is", "am", "be"], "fr": "Vous êtes très gentil."}, {"q": "The children ___ at school.", "a": "are", "opts": ["are", "is", "am", "be"], "fr": "Les enfants sont à l'école."}, {"q": "It ___ cold today.", "a": "is", "opts": ["is", "are", "am", "be"], "fr": "Il fait froid aujourd'hui."}, {"q": "I'm ___ tired.", "a": "not", "opts": ["not", "no", "don't", "isn't"], "fr": "Je ne suis pas fatiguée."}]}, {"id": "l1-to-have", "title": "Le verbe avoir : have, has", "expl": ["Le verbe have veut dire « avoir ». On dit I have, you have, we have, they have.", "Avec he, she ou it, have devient has : she has two children. C'est la seule forme différente, facile à retenir !"], "examples": [{"en": "I have three grandchildren.", "fr": "J'ai trois petits-enfants."}, {"en": "He has a big dog.", "fr": "Il a un gros chien."}], "items": [{"q": "I ___ a sister.", "a": "have", "opts": ["have", "has", "having", "am"], "fr": anks! Sit with us.", "fr": "Très bien, merci ! Asseyez-vous avec nous.", "ok": true, "next": "n7", "react": ["james", "Thank you, I will.", "Merci, avec plaisir."]}, {"en": "I'm seventy.", "fr": "J'ai soixante-dix ans.", "ok": false, "tip": "James demande comment vous allez, pas votre âge. Répondez « I'm fine, thank you »."}]}}, "n7": {"say": [["grace", "Tea for James, of course!", "Un thé pour James, bien sûr !"], ["james", "Of course! Thank you, Grace.", "Bien sûr ! Merci, Grace."], ["emma", "This is nice. Friends and coffee.", "Que c'est agréable. Des amis et un café."]], "end": true}}, "quiz": [{"q": "Qui a deux enfants ?", "opts": ["Emma", "Grace", "James"], "a": 1}, {"q": "Quel âge ont les enfants de Grace ?", "opts": ["Sept et dix ans", "Six et huit ans", "Deux et cinq ans"], "a": 0}, {"q": "Que boit James ?", "opts": ["Du café", "Du jus d'orange", "Du thé"], "a": 2}]}, {"id": "s1-postoffice", "level": 1, "title": "Où est la poste ?", "setting": "street", "cast": ["james", "grace"], "intro": "Vous vous promenez dans la rue principale. James vous arrête : il cherche la poste.", "start": "n1", "nodes": {"n1": {"say": [["james", "Excuse me! Oh, hello, Marie Line.", "Excusez-moi ! Oh, bonjour, Marie Line."], ["james", "Where is the post office, please?", "Où est la poste, s'il vous plaît ?"]], "ask": {"prompt": "Répondez à James.", "options": [{"en": "I don't know. Sorry, James.", "fr": "Je ne sais pas. Désolée, James.", "ok": true, "next": "n2", "react": ["james", "Never mind. Let's ask someone.", "Ce n'est pas grave. Demandons à quelqu'un."]}, {"en": "Hello, James! It's near the bank, I think.", "fr": "Bonjour, James ! C'est près de la banque, je crois.", "ok": true, "next": "n2b", "react": ["james", "Near the bank? Thank you!", "Près de la banque ? Merci !"]}, {"en": "I am the post office.", "fr": "Je suis la poste.", "ok": false, "tip": "Cela veut dire « Je suis la poste ». Si vous ne savez pas, dites « I don't know »."}]}}, "n2": {"say": [["grace", "Hi, James! Hi, Marie Line!", "Bonjour, James ! Bonjour, Marie Line !"], ["james", "Grace! Where is the post office?", "Grace ! Où est la poste ?"], ["grace", "It's next to the bank. Go straight on.", "Elle est à côté de la banque. Allez tout droit."]], "next": "n3"}, "n2b": {"say": [["grace", "Hi, you two!", "Bonjour, vous deux !"], ["james", "Grace, is the post office near the bank?", "Grace, la poste est près de la banque ?"], ["grace", "Yes! It's next to the bank. Go straight on.", "Oui ! Elle est à côté de la banque. Allez tout droit."]], "next": "n3"}, "n3": {"say": [["grace", "Do you need stamps too, Marie Line?", "Vous avez besoin de timbres, vous aussi, Marie Line ?"]], "ask": {"prompt": "Répondez à Grace.", "options": [{"en": "Yes, I do. I have a letter.", "fr": "Oui. J'ai une lettre.", "ok": true, "next": "n4", "react": ["grace", "Great! Go together.", "Super ! Allez-y ensemble."]}, {"en": "No, but I can walk with James.", "fr": "Non, mais je peux accompagner James.", "ok": true, "next": "n4", "react": ["james", "How kind! Thank you.", "Comme c'est gentil ! Merci."]}, {"en": "Yes, I am stamps.", "fr": "Oui, je suis des timbres.", "ok": false, "tip": "« I am stamps » veut dire « Je suis des timbres ». Dites « Yes, I do » ou « Yes, I need stamps »."}]}}, "n4": {"say": [["grace", "Bye! I'm late for work.", "Au revoir ! Je suis en retard pour le travail."], ["james", "Bye, Grace! Thank you.", "Au revoir, Grace ! Merci."], ["james", "Shall we go, Marie Line?", "On y va, Marie Line ?"]], "ask": {"prompt": "Répondez à James.", "options": [{"en": "Yes, let's go!", "fr": "Oui, allons-y !", "ok": true, "next": "n5", "react": ["james", "Splendid.", "Parfait."]}, {"en": "Yes. It's a nice day for a walk.", "fr": "Oui. Il fait beau pour marcher.", "ok": true, "next": "n5", "react": ["james", "It is. Lovely and sunny.", "C'est vrai. Il fait beau et il y a du soleil."]}, {"en": "Good morning, Grace.", "fr": "Bonjour, Grace.", "ok": false, "tip": "Grace est partie, et James vous propose d'y aller. Dites « Yes, let's go! »."}]}}, "n5": {"say": [["james", "Look, a big red building.", "Regardez, un grand bâtiment rouge."], ["james", "Is it the bank?", "C'est la banque ?"]], "ask": {"prompt": "Répondez à James.", "options": [{"en": "Yes, it is. And there's the post office!", "fr": "Oui. Et voilà la poste !", "ok": true, "next": "n6", "react": ["james", "Wonderful! Well done, Marie Line.", "Formidable ! Bravo, Marie Line."]}, {"en": "I think so. The post office is next to it.", "fr": "Je crois. La poste est juste à côté.", "ok": true, "next": "n6", "react": ["james", "Yes, I see it now!", "Oui, je la vois maintenant !"]}, {"en": "Yes, it are.", "fr": "Oui, c'est ça.", "ok": false, "tip": "On dit « it is » (ou « it's »), jamais « it are »."}]}}, "n6": {"say": [["james", "Here we are. Thank you, Marie Line.", "Nous y voilà. Merci, Marie Line."], ["james", "Tea after this? My treat.", "Un thé après ? C'est moi qui invite."]], "ask": {"prompt": "Répondez à James.", "options": [{"en": "Yes, please! That's very kind.", "fr": "Oui, avec plaisir ! C'est très gentil.", "ok": true, "next": "n7", "react": ["james", "Wonderful. I know a nice café.", "Formidable. Je connais un joli café."]}, {"en": "Thank you, but not today.", "fr": "Merci, mais pas aujourd'hui.", "ok": true, "next": "n7b", "react": ["james", "No problem. Another day, then.", "Pas de problème. Un autre jour, alors."]}, {"en": "I'm tea.", "fr": "Je suis du thé.", "ok": false, "tip": "« I'm tea » veut dire « Je suis du thé ». Pour accepter : « Yes, please ». Pour refuser : « No, thank you »."}]}}, "n7": {"say": [["james", "First, my letters. Then tea!", "D'abord, mes lettres. Ensuite, le thé !"]], "end": true}, "n7b": {"say": [["james", "Thank you for your help, Marie Line. Goodbye!", "Merci pour votre aide, Marie Line. Au revoir !"]], "end": true}}, "quiz": [{"q": "Où est la poste ?", "opts": ["À côté de la banque", "À côté du café", "En face de l'église"], "a": 0}, {"q": "Pourquoi Grace part-elle vite ?", "opts": ["Elle va chez le médecin", "Elle est en retard pour le travail", "Elle cherche ses enfants"], "a": 1}, {"q": "De quelle couleur est le grand bâtiment ?", "opts": ["Bleu", "Rouge", "Blanc"], "a": 1}]}, {"id": "s1-goodmorning", "level": 1, "title": "Bonjour en visio", "setting": "videocall", "cast": ["emma", "james", "grace"], "intro": "Emma organise un petit appel vidéo du matin. James et Grace sont aussi en ligne.", "start": "n1", "nodes": {"n1": {"say": [["emma", "Good morning, everyone!", "Bonjour à tous !"], ["james", "Good morning, Emma.", "Bonjour, Emma."], ["grace", "Morning! Hi, Marie Line!", "Bonjour ! Coucou, Marie Line !"]], "ask": {"prompt": "Dites bonjour à tout le monde.", "options": [{"en": "Good morning, everyone!", "fr": "Bonjour à tous !", "ok": true, "next": "n2", "react": ["emma", "Good morning, Marie Line!", "Bonjour, Marie Line !"]}, {"en": "Hello! I can see you all.", "fr": "Bonjour ! Je vous vois tous.", "ok": true, "next": "n2", "react": ["james", "And we can see you. Splendid!", "Et nous, nous vous voyons. Parfait !"]}, {"en": "Good evening!", "fr": "Bonsoir !", "ok": false, "tip": "C'est le matin : on dit « Good morning ». « Good evening » se dit le soir."}], "open": {"model": ["Good morning, everyone! How nice to see you.", "Bonjour à tous ! Ça fait plaisir de vous voir."], "next": "n2", "react": ["emma", "It's nice to see you too!", "Ça nous fait plaisir aussi !"]}}}, "n2": {"say": [["grace", "Can you hear me?", "Vous m'entendez ?"]], "ask": {"prompt": "Répondez à Grace.", "options": [{"en": "Yes, I can hear you.", "fr": "Oui, je vous entends.", "ok": true, "next": "n3", "react": ["grace", "Great!", "Super !"]}, {"en": "Yes, very well, thank you.", "fr": "Oui, très bien, merci.", "ok": true, "next": "n3", "react": ["grace", "Good! My internet is slow today.", "Tant mieux ! Mon internet est lent aujourd'hui."]}, {"en": "No, I can hear you.", "fr": "Non, je vous entends.", "ok": false, "tip": "« No » et « I can hear you » se contredisent. Dites « Yes, I can hear you »."}]}}, "n3": {"say": [["emma", "How are you today, Marie Line?", "Comment allez-vous aujourd'hui, Marie Line ?"]], "ask": {"prompt": "Dites comment vous allez.", "options": [{"en": "I'm very well, thank you.", "fr": "Je vais très bien, merci.", "ok": true, "next": "n4", "react": ["emma", "I'm happy to hear that.", "Je suis contente de l'entendre."]}, {"en": "A little tired, but OK.", "fr": "Un peu fatiguée, mais ça va.", "ok": true, "next": "n4t", "react": ["grace", "Oh! Have a big coffee!", "Oh ! Prenez un grand café !"]}, {"en": "I'm Tuesday.", "fr": "Je suis mardi.", "ok": false, "tip": "« I'm Tuesday » veut dire « Je suis mardi ». Dites par exemple « I'm fine, thank you »."}]}}, "n4t": {"say": [["emma", "Me too. Coffee helps!", "Moi aussi. Le café, ça aide !"]], "next": "n4"}, "n4": {"say": [["james", "It's sunny here today.", "Il fait beau ici aujourd'hui."], ["grace", "And for you, Marie Line?", "Et chez vous, Marie Line ?"]], "ask": {"prompt": "Dites quel temps il fait chez vous.", "options": [{"en": "It's sunny here too.", "fr": "Il fait beau ici aussi.", "ok": true, "next": "n5", "react": ["james", "Lovely! A day for a walk.", "Merveilleux ! Un temps à se promener."]}, {"en": "It's cold and cloudy here.", "fr": "Il fait froid et nuageux ici.", "ok": true, "next": "n5", "react": ["grace", "Oh no! Wear a warm coat.", "Oh non ! Mettez un manteau chaud."]}, {"en": "It's raining here.", "fr": "Il pleut ici.", "ok": true, "next": "n5", "react": ["emma", "Oh dear. Stay inside with a book!", "Oh là là. Restez à l'intérieur avec un livre !"]}, {"en": "I'm sunny.", "fr": "Je suis ensoleillée.", "ok": false, "tip": "Pour la météo, on dit « It's sunny », pas « I'm sunny »."}]}}, "n5": {"say": [["emma", "Look! Biscuit says good morning!", "Regardez ! Biscuit dit bonjour !"], ["grace", "Hi, Biscuit! So cute!", "Coucou, Biscuit ! Trop mignon !"], ["james", "Good morning, Biscuit.", "Bonjour, Biscuit."]], "ask": {"prompt": "Saluez Biscuit.", "options": [{"en": "Hello, Biscuit! Good boy!", "fr": "Bonjour, Biscuit ! Gentil chien !", "ok": true, "next": "n6", "react": ["emma", "He's wagging his tail!", "Il remue la queue !"]}, {"en": "Good morning, Biscuit! You're beautiful.", "fr": "Bonjour, Biscuit ! Tu es beau.", "ok": true, "next": "n6", "react": ["emma", "Thank you! He's very happy.", "Merci ! Il est très content."]}, {"en": "Good morning, Grace.", "fr": "Bonjour, Grace.", "ok": false, "tip": "Grace vous a déjà dit bonjour. Ici, il s'agit de saluer le chien, Biscuit !"}]}}, "n6": {"say": [["grace", "Sorry, I have to go. Work!", "Désolée, je dois y aller. Le travail !"], ["james", "Have a good day, Grace.", "Bonne journée, Grace."]], "ask": {"prompt": "Dites au revoir à Grace.", "options": [{"en": "Bye, Grace! Have a good day.", "fr": "Au revoir, Grace ! Bonne journée.", "ok": true, "next": "n7", "react": ["grace", "Thanks! You too!", "Merci ! Vous aussi !"]}, {"en": "See you soon, Grace!", "fr": "À bientôt, Grace !", "ok": true, "next": "n7", "react": ["grace", "See you on Saturday!", "À samedi !"]}, {"en": "Hello, Grace!", "fr": "Bonjour, Grace !", "ok": false, "tip": "Grace s'en va : on dit « Bye » ou « See you soon », pas « Hello »."}]}}, "n7": {"say": [["emma", "Same time tomorrow, everyone?", "Même heure demain, tout le monde ?"], ["james", "Yes, please. Nine o'clock.", "Oui, volontiers. Neuf heures."], ["emma", "Bye, Marie Line! Have a nice day!", "Au revoir, Marie Line ! Bonne journée !"]], "end": true}}, "quiz": [{"q": "Quel temps fait-il chez James ?", "opts": ["Il pleut", "Il fait beau", "Il neige"], "a": 1}, {"q": "Qui doit partir travailler ?", "opts": ["Emma", "James", "Grace"], "a": 2}, {"q": "À quelle heure est l'appel de demain ?", "opts": ["Huit heures", "Neuf heures", "Dix heures"], "a": 1}]}, {"id": "s2-bookclub", "level": 2, "title": "Le club de lecture", "setting": "cafe", "cast": ["grace", "emma", "james"], "intro": "C'est samedi matin. Grace vous a invitée à son club de lecture, au café du village. Emma et James sont déjà là.", "start": "n1", "nodes": {"n1": {"say": [["grace", "Marie Line! You made it! Come and sit with us.", "Marie Line ! Vous êtes venue ! Venez vous asseoir avec nous."], ["emma", "We saved you a seat by the window.", "Nous vous avons gardé une place près de la fenêtre."], ["james", "And I ordered a pot of tea for the table.", "Et j'ai commandé une théière pour toute la table."]], "ask": {"prompt": "Remerciez-les.", "options": [{"en": "Thank you, that's very kind of you.", "fr": "Merci, c'est très gentil de votre part.", "ok": true, "next": "n2", "react": ["grace", "Our pleasure! We're so glad you came.", "Avec plaisir ! Nous sommes ravis que vous soyez venue."]}, {"en": "Thanks! What a lovely café.", "fr": "Merci ! Quel joli café.", "ok": true, "next": "n2", "react": ["emma", "Isn't it? Grace knows all the best places.", "N'est-ce pas ? Grace connaît tous les bons endroits."]}, {"en": "Yes, I made it yesterday.", "fr": "Oui, je l'ai fabriqué hier.", "ok": false, "tip": "« You made it! » veut dire « Vous avez réussi à venir ! ». Ici, on remercie simplement pour l'accueil."}], "open": {"model": ["Thank you so much, it's nice to see you all.", "Merci beaucoup, ça me fait plaisir de vous voir tous."], "next": "n2", "react": ["grace", "It's lovely to see you too!", "Ça nous fait plaisir aussi !"]}}}, "n2": {"say": [["grace", "This month we read a short novel about a lighthouse keeper and his granddaughter.", "Ce mois-ci, nous avons lu un court roman sur un gardien de phare et sa petite-fille."], ["grace", "Did you have time to read it, Marie Line?", "Vous avez eu le temps de le lire, Marie Line ?"]], "ask": {"prompt": "Dites à Grace si vous l'avez lu.", "options": [{"en": "Yes, I read it last week. I liked it.", "fr": "Oui, je l'ai lu la semaine dernière. Il m'a plu.", "ok": true, "next": "n3", "react": ["grace", "Wonderful! I'm so happy you enjoyed it.", "Formidable ! Je suis si contente qu'il vous ait plu."]}, {"en": "I read half of it. It was a bit difficult.", "fr": "J'en ai lu la moitié. C'était un peu difficile.", "ok": true, "next": "n3h", "react": ["james", "Half is very good in a new language!", "La moitié, c'est très bien dans une nouvelle langue !"]}, {"en": "Yes, I readed it on Monday.", "fr": "Oui, je l'ai lu lundi.", "ok": false, "tip": "« Read » est irrégulier : au passé, il s'écrit toujours « read » (prononcé « rèd »). On dit « I read it »."}], "open": {"model": ["Yes, I read it in the garden. It was really good.", "Oui, je l'ai lu dans le jardin. Il était vraiment bien."], "next": "n3", "react": ["grace", "Oh, good! I can't wait to hear what you think.", "Oh, très bien ! J'ai hâte de savoir ce que vous en pensez."]}}}, "n3h": {"say": [["emma", "Don't worry. I didn't finish it either!", "Ne vous inquiétez pas. Moi non plus, je ne l'ai pas fini !"], ["grace", "Emma! You were a librarian!", "Emma ! Vous étiez bibliothécaire !"]], "next": "n3"}, "n3": {"say": [["james", "I thought the old lighthouse keeper was wonderful.", "J'ai trouvé le vieux gardien de phare merveilleux."], ["emma", "Me too. But the ending was very sad.", "Moi aussi. Mais la fin était très triste."], ["grace", "Which character did you like best, Marie Line?", "Quel personnage avez-vous préféré, Marie Line ?"]], "ask": {"prompt": "Dites quel personnage vous avez préféré.", "options": [{"en": "I liked the lighthouse keeper. He was very kind.", "fr": "J'ai aimé le gardien de phare. Il était très gentil.", "ok": true, "next": "n4", "react": ["james", "Exactly! A gentle old man, just like me.", "Exactement ! Un vieux monsieur très doux, comme moi."]}, {"en": "I liked his granddaughter. She was very brave.", "fr": "J'ai aimé sa petite-fille. Elle était très courageuse.", "ok": true, "next": "n4", "react": ["emma", "Oh yes, she was braver than everyone!", "Oh oui, elle était plus courageuse que tout le monde !"]}, {"en": "I like the coffee best.", "fr": "Je préfère le café.", "ok": false, "tip": "Grace parle des personnages du livre. Répondez avec « I liked... » et un personnage."}], "open": {"model": ["I liked the granddaughter best. She was funny and brave.", "J'ai préféré la petite-fille. Elle était drôle et courageuse."], "next": "n4", "react": ["grace", "Good choice! Lots of us felt the same.", "Bon choix ! Beaucoup d'entre nous pensent pareil."]}}}, "n4": {"say": [["emma", "Was the book easier or harder than you expected?", "Le livre était-il plus facile ou plus difficile que prévu ?"]], "ask": {"prompt": "Répondez à Emma.", "options": [{"en": "It was easier than I thought.", "fr": "Il était plus facile que je ne le pensais.", "ok": true, "next": "n5", "react": ["emma", "That's great progress, Marie Line!", "C'est un beau progrès, Marie Line !"]}, {"en": "It was harder, but I used a dictionary.", "fr": "Il était plus difficile, mais j'ai utilisé un dictionnaire.", "ok": true, "next": "n5", "react": ["james", "Very wise. I always read with a dictionary.", "Très sage. Je lis toujours avec un dictionnaire."]}, {"en": "It was more easy that I thought.", "fr": "Il était plus facile que je ne le pensais.", "ok": false, "tip": "Pour les adjectifs courts, on ajoute « -er » : « easier ». Et on dit « than », pas « that »."}]}}, "n5": {"say": [["grace", "Now, we need a book for next month.", "Maintenant, il nous faut un livre pour le mois prochain."], ["james", "I'd like a history book, of course.", "J'aimerais un livre d'histoire, bien sûr."], ["emma", "Oh, James! Something lighter, please.", "Oh, James ! Quelque chose de plus léger, s'il vous plaît."]], "ask": {"prompt": "Proposez un type de livre.", "options": [{"en": "What about a detective story?", "fr": "Et si on lisait un roman policier ?", "ok": true, "next": "n6", "react": ["grace", "Ooh, yes! I love a good mystery.", "Oh oui ! J'adore les bons romans policiers."]}, {"en": "Could we read a book about cooking?", "fr": "Pourrions-nous lire un livre de cuisine ?", "ok": true, "next": "n6c", "react": ["emma", "Yes! And we could bake the recipes!", "Oui ! Et nous pourrions faire les recettes !"]}, {"en": "I'm going to the bathroom.", "fr": "Je vais aux toilettes.", "ok": false, "tip": "On vous demande une idée de livre. Proposez avec « What about...? » ou « Could we read...? »."}], "open": {"model": ["Maybe a funny book this time? The last one was sad.", "Peut-être un livre drôle cette fois ? Le dernier était triste."], "next": "n6", "react": ["grace", "Good idea. Let's put it on the list!", "Bonne idée. Ajoutons-la à la liste !"]}}}, "n6c": {"say": [["james", "A cookbook club! I'm going to bring scones.", "Un club de cuisine ! Je vais apporter des scones."]], "next": "n6"}, "n6": {"say": [["grace", "Right! We can vote next Saturday.", "Bon ! Nous pourrons voter samedi prochain."], ["grace", "Are you going to come again, Marie Line?", "Vous allez revenir, Marie Line ?"]], "ask": {"prompt": "Répondez à Grace.", "options": [{"en": "Yes, I'm going to come every Saturday!", "fr": "Oui, je vais venir tous les samedis !", "ok": true, "next": "n7", "react": ["grace", "Brilliant! You're one of us now.", "Génial ! Vous faites partie de la bande maintenant."]}, {"en": "Yes, if my daughter can drive me.", "fr": "Oui, si ma fille peut m'emmener.", "ok": true, "next": "n7", "react": ["emma", "I can drive you. It's no problem at all.", "Je peux vous emmener. Ce n'est pas du tout un problème."]}, {"en": "Yes, I come yesterday.", "fr": "Oui, je viens hier.", "ok": false, "tip": "« Yesterday » parle du passé. Pour l'avenir, dites « I'm going to come »."}], "open": {"model": ["Of course! I had a really lovely time.", "Bien sûr ! J'ai passé un très bon moment."], "next": "n7", "react": ["grace", "So did we! See you next week.", "Nous aussi ! À la semaine prochaine."]}}}, "n7": {"say": [["james", "Splendid. More tea, anyone?", "Parfait. Encore un peu de thé, quelqu'un ?"], ["emma", "See you next Saturday, Marie Line!", "À samedi prochain, Marie Line !"]], "end": true}}, "quiz": [{"q": "De quoi parle le roman du mois ?", "opts": ["D'un gardien de phare et de sa petite-fille", "D'un pêcheur et de son fils", "D'une bibliothécaire"], "a": 0}, {"q": "Comment Emma a-t-elle trouvé la fin du livre ?", "opts": ["Drôle", "Très triste", "Trop longue"], "a": 1}, {"q": "Quel genre de livre James aimerait-il lire ?", "opts": ["Un roman policier", "Un livre de cuisine", "Un livre d'histoire"], "a": 2}]}, {"id": "s2-market", "level": 2, "title": "Au marché fermier", "setting": "market", "cast": ["emma", "grace"], "intro": "Samedi matin, Emma vous emmène au marché fermier. Il y a des fruits, des légumes, du fromage et beaucoup de monde.", "start": "n1", "nodes": {"n1": {"say": [["emma", "Isn't it busy today? Everybody loves this market.", "Il y a du monde aujourd'hui, hein ? Tout le monde adore ce marché."], ["emma", "What are you going to buy, Marie Line?", "Qu'est-ce que vous allez acheter, Marie Line ?"]], "ask": {"prompt": "Dites à Emma ce que vous allez acheter.", "options": [{"en": "I'm going to buy some apples and cheese.", "fr": "Je vais acheter des pommes et du fromage.", "ok": true, "next": "n2", "react": ["emma", "Good plan. The apples here are amazing.", "Bon programme. Les pommes ici sont incroyables."]}, {"en": "I'd like some vegetables for a soup.", "fr": "J'aimerais des légumes pour faire une soupe.", "ok": true, "next": "n2v", "react": ["emma", "Lovely! Soup is perfect in October.", "Très bien ! La soupe, c'est parfait en octobre."]}, {"en": "I bought a car.", "fr": "J'ai acheté une voiture.", "ok": false, "tip": "Emma demande ce que vous allez acheter au marché. Utilisez « I'm going to buy... »."}], "open": {"model": ["I'm going to buy some fruit for my grandchildren.", "Je vais acheter des fruits pour mes petits-enfants."], "next": "n2", "react": ["emma", "What a nice idea!", "Quelle bonne idée !"]}}}, "n2v": {"say": [["emma", "Then we need carrots, leeks and potatoes.", "Alors il nous faut des carottes, des poireaux et des pommes de terre." , "level": 2, "title": "À la clinique", "setting": "clinic", "cast": ["grace", "james"], "intro": "Vous avez attrapé un rhume et vous allez à la clinique du village. Grace y travaille comme infirmière. James est dans la salle d'attente.", "start": "n1", "nodes": {"n1": {"say": [["james", "Marie Line! Hello! Are you all right?", "Marie Line ! Bonjour ! Vous allez bien ?"], ["james", "I'm only here for my flu shot.", "Moi, je suis juste là pour mon vaccin contre la grippe."]], "ask": {"prompt": "Répondez à James.", "options": [{"en": "Hello, James. I have a bad cold.", "fr": "Bonjour, James. J'ai un gros rhume.", "ok": true, "next": "n2", "react": ["james", "Oh dear. You poor thing.", "Oh là là. Ma pauvre."]}, {"en": "Not really. I caught a cold on Sunday.", "fr": "Pas vraiment. J'ai attrapé un rhume dimanche.", "ok": true, "next": "n2", "react": ["james", "Oh no! The weather was terrible this weekend.", "Oh non ! Il a fait un temps affreux ce week-end."]}, {"en": "I am very cold, thank you.", "fr": "J'ai très froid, merci.", "ok": false, "tip": "« I am cold » veut dire « J'ai froid ». Pour un rhume, on dit « I have a cold »."}], "open": {"model": ["Hi, James. Not great. I have a cold.", "Bonjour, James. Pas terrible. J'ai un rhume."], "next": "n2", "react": ["james", "Oh dear. I hope you feel better soon.", "Oh là là. J'espère que vous irez vite mieux."]}}}, "n2": {"say": [["grace", "Marie Line? Come in, please!", "Marie Line ? Entrez, je vous en prie !"], ["grace", "So, what's the matter today?", "Alors, qu'est-ce qui ne va pas aujourd'hui ?"]], "ask": {"prompt": "Expliquez à Grace ce qui ne va pas.", "options": [{"en": "I have a sore throat and a runny nose.", "fr": "J'ai mal à la gorge et le nez qui coule.", "ok": true, "next": "n3", "react": ["grace", "Okay. Lots of people have colds this week.", "D'accord. Beaucoup de gens sont enrhumés cette semaine."]}, {"en": "I'm coughing a lot and I feel tired.", "fr": "Je tousse beaucoup et je me sens fatiguée.", "ok": true, "next": "n3", "react": ["grace", "Poor you. Let's have a look.", "Ma pauvre. Voyons ça."]}, {"en": "I'm going to the market.", "fr": "Je vais au marché.", "ok": false, "tip": "Grace est l'infirmière : décrivez ce qui ne va pas, par exemple « I have a sore throat »."}], "open": {"model": ["I have a cold. My head hurts and I'm sneezing a lot.", "J'ai un rhume. J'ai mal à la tête et j'éternue beaucoup."], "next": "n3", "react": ["grace", "Okay, thanks for explaining. Let's check.", "D'accord, merci pour ces explications. On va vérifier."]}}}, "n3": {"say": [["grace", "When did it start?", "Quand est-ce que ça a commencé ?"]], "ask": {"prompt": "Dites à Grace quand ça a commencé.", "options": [{"en": "It started three days ago.", "fr": "Ça a commencé il y a trois jours.", "ok": true, "next": "n4", "react": ["grace", "Three days. Okay, that's normal for a cold.", "Trois jours. D'accord, c'est normal pour un rhume."]}, {"en": "On Sunday, after a long walk in the rain.", "fr": "Dimanche, après une longue promenade sous la pluie.", "ok": true, "next": "n4", "react": ["grace", "Ah, the rain! It was freezing on Sunday.", "Ah, la pluie ! Il faisait un froid glacial dimanche."]}, {"en": "It starts tomorrow.", "fr": "Ça commence demain.", "ok": false, "tip": "Grace demande quand ça a commencé : il faut le passé, par exemple « It started on Sunday »."}]}}, "n4": {"say": [["grace", "Let me check your temperature.", "Je vais prendre votre température."], ["grace", "Good news! You don't have a fever.", "Bonne nouvelle ! Vous n'avez pas de fièvre."]], "ask": {"prompt": "Réagissez à la nouvelle.", "options": [{"en": "Oh, good! I was a bit worried.", "fr": "Ah, tant mieux ! J'étais un peu inquiète.", "ok": true, "next": "n5", "react": ["grace", "No need to worry. It's just a cold.", "Pas besoin de vous inquiéter. C'est juste un rhume."]}, {"en": "That's a relief. What can I do?", "fr": "Quel soulagement. Qu'est-ce que je peux faire ?", "ok": true, "next": "n5", "react": ["grace", "Good question! I'm going to give you some advice.", "Bonne question ! Je vais vous donner quelques conseils."]}, {"en": "Yes, I have a fever.", "fr": "Oui, j'ai de la fièvre.", "ok": false, "tip": "Grace vient de dire que vous n'avez PAS de fièvre. Montrez plutôt votre soulagement : « Oh, good! »."}]}}, "n5": {"say": [["grace", "Drink lots of water and hot tea with honey.", "Buvez beaucoup d'eau et du thé chaud avec du miel."], ["grace", "And rest. You could stay home for two days.", "Et reposez-vous. Vous pourriez rester chez vous deux jours."]], "ask": {"prompt": "Posez une question à Grace.", "options": [{"en": "Can I still visit my grandchildren?", "fr": "Est-ce que je peux quand même voir mes petits-enfants ?", "ok": true, "next": "n6g", "react": ["grace", "Better to wait two days. Then you can hug them!", "Mieux vaut attendre deux jours. Ensuite, vous pourrez les embrasser !"]}, {"en": "Could I take something for my throat?", "fr": "Est-ce que je pourrais prendre quelque chose pour la gorge ?", "ok": true, "next": "n6", "react": ["grace", "Yes, honey lozenges are very good.", "Oui, les pastilles au miel sont très efficaces."]}, {"en": "Can I run a marathon tomorrow?", "fr": "Est-ce que je peux courir un marathon demain ?", "ok": false, "tip": "Grace vous conseille de vous reposer ! Posez plutôt une question utile, par exemple sur vos petits-enfants ou votre gorge."}], "open": {"model": ["Could I go to the book club on Saturday?", "Est-ce que je pourrais aller au club de lecture samedi ?"], "next": "n6", "react": ["grace", "Let's see how you feel. Call me on Friday!", "On verra comment vous vous sentez. Appelez-moi vendredi !"]}}}, "n6g": {"say": [["grace", "Your grandchildren can call you on video!", "Vos petits-enfants peuvent vous appeler en vidéo !"]], "next": "n6"}, "n6": {"say": [["james", "All done? How did it go?", "C'est fini ? Comment ça s'est passé ?"], ["grace", "She's going to be fine, James. It's only a cold.", "Elle va vite se remettre, James. Ce "Entrez, James ! Le café est prêt."], ["james", "Thank you, Emma. Hello, Marie Line!", "Merci, Emma. Bonjour, Marie Line !"], ["james", "I have a little plan for next weekend.", "J'ai un petit projet pour le week-end prochain."]], "ask": {"prompt": "Demandez à James quel est son projet.", "options": [{"en": "Oh? What are you going to do?", "fr": "Ah bon ? Qu'est-ce que vous allez faire ?", "ok": true, "next": "n2", "react": ["james", "We're going to do it together, I hope!", "Nous allons le faire ensemble, j'espère !"]}, {"en": "Hello, James! Tell us about your plan.", "fr": "Bonjour, James ! Parlez-nous de votre projet.", "ok": true, "next": "n2", "react": ["emma", "Yes, tell us! I love plans.", "Oui, racontez ! J'adore les projets."]}, {"en": "I did it last weekend.", "fr": "Je l'ai fait le week-end dernier.", "ok": false, "tip": "James parle du week-end prochain. Demandez plutôt : « What are you going to do? »."}]}}, "n2": {"say": [["james", "Let's go for a walk on Saturday.", "Allons nous promener samedi."], ["james", "The leaves are beautiful in October.", "Les feuilles sont magnifiques en octobre."], ["emma", "Oh, what a lovely idea!", "Oh, quelle charmante idée !"]], "ask": {"prompt": "Dites si l'idée vous plaît.", "options": [{"en": "I'd love to! I really like walking.", "fr": "Avec grand plaisir ! J'aime beaucoup marcher.", "ok": true, "next": "n3", "react": ["james", "Splendid! Then there are three of us.", "Splendide ! Alors nous serons trois."]}, {"en": "Good idea! Can Biscuit come too?", "fr": "Bonne idée ! Biscuit peut venir aussi ?", "ok": true, "next": "n3b", "react": ["emma", "Of course! He loves walks more than anything.", "Bien sûr ! Il adore les balades plus que tout."]}, {"en": "No, I'd love to.", "fr": "Non, avec plaisir.", "ok": false, "tip": "« No » et « I'd love to » se contredisent. Dites « Yes, I'd love to! »."}], "open": {"model": ["What a great idea! I'd like to see the autumn colors.", "Quelle bonne idée ! J'aimerais voir les couleurs de l'automne."], "next": "n3", "react": ["james", "Then you're coming with us!", "Alors vous venez avec nous !"]}}}, "n3b": {"say": [["james", "Biscuit is always welcome. He walks faster than me!", "Biscuit est toujours le bienvenu. Il marche plus vite que moi !"]], "next": "n3"}, "n3": {"say": [["emma", "Where could we go?", "Où pourrions-nous aller ?"], ["james", "There's the lake trail or the hill trail.", "Il y a le sentier du lac ou le sentier de la colline."], ["james", "The lake trail is shorter and flatter.", "Le sentier du lac est plus court et plus plat."]], "ask": {"prompt": "Dites quel sentier vous préférez.", "options": [{"en": "I prefer the lake trail. It's easier.", "fr": "Je préfère le sentier du lac. Il est plus facile.", "ok": true, "next": "n4", "react": ["emma", "Good choice. And there's a café by the lake!", "Bon choix. Et il y a un café au bord du lac !"]}, {"en": "Let's take the hill trail. The view is better.", "fr": "Prenons le sentier de la colline. La vue est plus belle.", "ok": true, "next": "n4h", "react": ["james", "Brave woman! The view is wonderful up there.", "Quelle courageuse ! La vue est magnifique là-haut."]}, {"en": "The lake trail is more short.", "fr": "Le sentier du lac est plus court.", "ok": false, "tip": "« Short » est un adjectif court : on dit « shorter », pas « more short »."}], "open": {"model": ["The lake trail, I think. I'd like to see the water.", "Le sentier du lac, je pense. J'aimerais voir l'eau."], "next": "n4", "react": ["emma", "Lovely. The lake is so pretty in the fall.", "Très bien. Le lac est si joli en automne."]}}}, "n4h": {"say": [["emma", "Then we're going to need good shoes!", "Alors il va nous falloir de bonnes chaussures !"]], "next": "n4"}, "n4": {"say": [["james", "What time shall we meet?", "À quelle heure nous retrouvons-nous ?"], ["emma", "Not too early, please!", "Pas trop tôt, s'il vous plaît !"]], "ask": {"prompt": "Proposez une heure.", "options": [{"en": "Could we meet at ten o'clock?", "fr"
