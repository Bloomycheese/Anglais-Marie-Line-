: "Pourrions-nous nous retrouver à dix heures ?", "ok": true, "next": "n5", "react": ["james", "Ten o'clock is perfect.", "Dix heures, c'est parfait."]}, {"en": "What about nine thirty, at Emma's house?", "fr": "Que diriez-vous de neuf heures et demie, chez Emma ?", "ok": true, "next": "n5", "react": ["emma", "Perfect. I can make coffee before we go.", "Parfait. Je peux faire du café avant le départ."]}, {"en": "We met at ten yesterday.", "fr": "Nous nous sommes retrouvés à dix heures hier.", "ok": false, "tip": "On parle de samedi prochain, pas d'hier. Proposez : « Could we meet at ten o'clock? »."}]}}, "n5": {"say": [["emma", "But the weather could be bad on Saturday.", "Mais il pourrait faire mauvais samedi."], ["james", "Then we could go on Sunday instead.", "Alors nous pourrions y aller dimanche à la place."]], "ask": {"prompt": "Réagissez à l'idée de James.", "options": [{"en": "Good idea. Sunday is fine for me too.", "fr": "Bonne idée. Dimanche me va aussi.", "ok": true, "next": "n6", "react": ["james", "Excellent. We have a plan A and a plan B.", "Excellent. Nous avons un plan A et un plan B."]}, {"en": "Or we could go to the museum instead.", "fr": "Ou nous pourrions aller au musée à la place.", "ok": true, "next": "n6", "react": ["james", "A museum! Now you're speaking my language.", "Un musée ! Là, vous parlez ma langue."]}, {"en": "It rained, so we go.", "fr": "Il a plu, donc nous allons.", "ok": false, "tip": "James propose un plan de secours. Répondez par exemple « Good idea, Sunday is fine for me »."}], "open": {"model": ["That's fine with me. I'm free on Sunday too.", "Ça me va. Je suis libre dimanche aussi."], "next": "n6", "react": ["emma", "Great, so we have a plan!", "Super, nous avons un plan !"]}}}, "n6": {"say": [["emma", "I'm going to bake some muffins for the walk.", "Je vais faire des muffins pour la balade."], ["james", "And I'm going to bring a flask of tea, naturally.", "Et moi, je vais apporter un thermos de thé, naturellement."], ["emma", "What are you going to bring, Marie Line?", "Et vous, qu'allez-vous apporter, Marie Line ?"]], "ask": {"prompt": "Dites ce que vous allez apporter.", "options": [{"en": "I'm going to bring some fruit and cheese.", "fr": "Je vais apporter des fruits et du fromage.", "ok": true, "next": "n7", "react": ["emma", "Perfect! A real picnic.", "Parfait ! Un vrai pique-nique."]}, {"en": "I'm going to bring my camera for photos.", "fr": "Je vais apporter mon appareil photo.", "ok": true, "next": "n7", "react": ["james", "Wonderful. You can take photos of the autumn leaves.", "Merveilleux. Vous pourrez photographier les feuilles d'automne."]}, {"en": "I brought a sandwich.", "fr": "J'ai apporté un sandwich.", "ok": false, "tip": "Il faut parler de l'avenir : « I'm going to bring... »."}], "open": {"model": ["I'm going to bring some French cookies.", "Je vais apporter des biscuits français."], "next": "n7", "react": ["emma", "Yum! I can't wait for Saturday.", "Miam ! J'ai hâte d'être samedi."]}}}, "n7": {"say": [["james", "Splendid. It's going to be a wonderful day.", "Splendide. Ça va être une journée merveilleuse."], ["emma", "More coffee, anyone?", "Encore un peu de café, quelqu'un ?"]], "end": true}}, "quiz": [{"q": "Pourquoi James propose-t-il une balade en octobre ?", "opts": ["Les feuilles sont magnifiques", "Il fait très chaud", "Le lac est gelé"], "a": 0}, {"q": "Comment est le sentier du lac ?", "opts": ["Plus long et plus raide", "Plus court et plus plat", "Fermé le samedi"], "a": 1}, {"q": "Qu'est-ce qu'Emma va préparer pour la balade ?", "opts": ["Des sandwichs", "Une tarte aux pommes", "Des muffins"], "a": 2}]}, {"id": "s3-thanksgiving", "level": 3, "title": "Les préparatifs de Thanksgiving", "setting": "kitchen", "cast": ["emma", "james", "grace"], "intro": "C'est le matin de Thanksgiving. Emma vous a demandé de venir l'aider en cuisine. James et Grace sont déjà là, et la maison sent bon la dinde.", "start": "n1", "nodes": {"n1": {"say": [["emma", "Marie Line, thank you so much for coming over early! Have you ever celebrated Thanksgiving before?", "Marie Line, merci beaucoup d'être venue si tôt ! Vous avez déjà fêté Thanksgiving ?"], ["james", "I hadn't until I moved here. Now I'm completely hooked on the pumpkin pie.", "Moi non plus, avant de m'installer ici. Maintenant, je suis complètement accro à la tarte à la citrouille."]], "ask": {"prompt": "Dites à Emma si vous avez déjà fêté Thanksgiving.", "options": [{"en": "Yes, I've celebrated it twice with my daughter's family here in Vermont.", "fr": "Oui, je l'ai fêté deux fois avec la famille de ma fille, ici dans le Vermont.", "ok": true, "next": "n2", "react": ["emma", "Wonderful! So you already know how much food we make. Far too much!", "Formidable ! Alors vous savez déjà quelle quantité de nourriture on prépare. Beaucoup trop !"]}, {"en": "No, never. This is going to be my very first real Thanksgiving.", "fr": "Non, jamais. Ce sera mon tout premier vrai Thanksgiving.", "ok": true, "next": "n2", "react": ["grace", "Your first one? Then we'll make sure it's a day to remember!", "Votre premier ? Alors on va faire en sorte que ce soit une journée inoubliable !"]}, {"en": "I have celebrated it tomorrow with my family.", "fr": "Je l'ai fêté demain avec ma famille.", "ok": false, "tip": "« Tomorrow » (demain) ne va pas avec le present perfect, qui sert à parler d'expériences passées. Dites par exemple « I've celebrated it once »."}], "open": {"model": ["Yes, I've celebrated it once with my family, and I loved it.", "Oui, je l'ai fêté une fois avec ma famille, et j'ai adoré."], "next": "n2", "react": ["emma", "How lovely. Well, today you're part of our little family too.", "C'est adorable. Eh bien, aujourd'hui, vous faites aussi partie de notre petite famille."]}}}, "n2": {"say": [["emma", "Right, let's get organized. The turkey has been in the oven since eight o'clock this morning.", "Bon, organisons-nous. La dinde est au four depuis huit heures ce matin."], ["grace", "And I've already peeled all the potatoes, so I'm officially on a break!", "Et moi, j'ai déjà épluché toutes les pommes de terre, donc je suis officiellement en pause !"], ["james", "Grace, you've been on a break since you walked through the door.", "Grace, tu es en pause depuis que tu as passé la porte."], ["emma", "Marie Line, would you rather help me with the pie or with the stuffing?", "Marie Line, vous préférez m'aider pour la tarte ou pour la farce ?"]], "ask": {"prompt": "Dites à Emma ce que vous préférez faire, et pourquoi.", "options": [{"en": "I'd rather help with the pie, because I really love baking.", "fr": "Je préfère vous aider pour la tarte, parce que j'adore faire de la pâtisserie.", "ok": true, "next": "n3", "react": ["emma", "Perfect! I'll get out the pumpkin and the spices.", "Parfait ! Je sors la citrouille et les épices."]}, {"en": "I'll help with the stuffing. I'm better at chopping than at baking.", "fr": "Je vais aider pour la farce. Je suis plus douée pour couper que pour la pâtisserie.", "ok": true, "next": "n4", "react": ["james", "Excellent, you can rescue me from these onions.", "Excellent, vous allez pouvoir me sauver de ces oignons."]}, {"en": "Yes, I would rather, thank you.", "fr": "Oui, je préférerais, merci.", "ok": false, "tip": "Emma vous propose un choix entre deux choses : il faut dire laquelle vous préférez, la tarte (pie) ou la farce (stuffing)."}], "open": {"model": ["I'd love to help with the pie, if you show me your recipe.", "J'aimerais beaucoup aider pour la tarte, si vous me montrez votre recette."], "next": "n5", "react": ["emma", "Great, there's plenty to do, so let's get started.", "Super, il y a beaucoup à faire, alors commençons."]}}}, "n3": {"say": [["emma", "Here's my mother's recipe. If we put the pie in before noon, it will be ready for dinner.", "Voici la recette de ma mère. Si on met la tarte au four avant midi, elle sera prête pour le dîner."], ["grace", "Emma's pie is famous in this town. People have tried to steal the recipe!", "La tarte d'Emma est célèbre dans le village. Des gens ont essayé de voler la recette !"]], "next": "n5"}, "n4": {"say": [["james", "Mind your eyes, these onions are rather strong. I've cried twice already.", "Attention à vos yeux, ces oignons sont plutôt forts. J'ai déjà pleuré deux fois."], ["grace", "Don't let him fool you, Marie Line. He cries at every film too.", "Ne vous laissez pas avoir, Marie Line. Il pleure aussi devant tous les films."]], "next": "n5"}, "n5": {"say": [["grace", "Oh no. Emma, I think we've run out of cranberry sauce!", "Oh non. Emma, je crois qu'on n'a plus de sauce aux canneberges !"], ["emma", "Oh dear, and the store closes at three o'clock today.", "Oh là là, et le magasin ferme à quinze heures aujourd'hui."]], "ask": {"prompt": "Proposez une solution à ce problème.", "options": [{"en": "If you have fresh cranberries, I can make some sauce myself.", "fr": "Si vous avez des canneberges fraîches, je peux faire la sauce moi-même.", "ok": true, "next": "n6", "react": ["emma", "Could you? That would save the day!", "Vraiment ? Vous nous sauveriez la mise !"]}, {"en": "Why don't we ask one of your neighbors if they have a jar?", "fr": "Pourquoi ne pas demander à un de vos voisins s'il a un pot ?", "ok": true, "next": "n7", "react": ["grace", "Good thinking! I'll pop next door and ask Linda.", "Bonne idée ! Je fais un saut chez Linda à côté pour lui demander."]}, {"en": "I have run out of the store yesterday.", "fr": "Je suis tombée en panne du magasin hier.", "ok": false, "tip": "Cette phrase n'a pas de sens. « Run out of » veut dire « ne plus avoir de ». Proposez plutôt une solution, par exemple « If you have..., I can... »."}], "open": {"model": ["Don't worry, if you have fresh cranberries, I can make the sauce.", "Ne vous inquiétez pas, si vous avez des canneberges fraîches, je peux faire la sauce."], "next": "n6", "react": ["emma", "That's a great idea, thank you, Marie Line.", "C'est une excellente idée, merci, Marie Line."]}}}, "n6": {"say": [["emma", "There's a bag of fresh cranberries in the freezer. You've saved Thanksgiving, Marie Line!", "Il y a un sachet de canneberges fraîches au congélateur. Vous avez sauvé Thanksgiving, Marie Line !"], ["james", "In England, we'd just put the kettle on and hope for the best.", "En Angleterre, on aurait simplement mis la bouilloire en route en espérant que tout s'arrange."]], "next": "n8"}, "n7": {"say": [["grace", "Linda had two jars! She says happy Thanksgiving, and she'd like a slice of pie.", "Linda avait deux pots ! Elle vous souhaite un joyeux Thanksgiving, et elle voudrait une part de tarte."], ["emma", "Two jars for one slice of pie? That sounds like a fair deal to me.", "Deux pots pour une part de tarte ? Ça me paraît un échange honnête."]], "next": "n8"}, "n8": {"say": [["james", "Now, I've learned that the tradition here is to say what you're thankful for.", "Alors, j'ai appris que la tradition ici, c'est de dire pour quoi on est reconnaissant."], ["james", "Marie Line, would you like to start us off?", "Marie Line, voulez-vous commencer ?"]], "ask": {"prompt": "Dites pour quoi vous êtes reconnaissante cette année.", "options": [{"en": "I'm thankful for my family and for all my new friends here.", "fr": "Je suis reconnaissante pour ma famille et pour tous mes nouveaux amis ici.", "ok": true, "next": "n9", "react": ["emma", "Oh, that's so sweet. We're thankful for you too.", "Oh, c'est trop gentil. Nous aussi, nous sommes reconnaissants de vous avoir."]}, {"en": "I'm thankful that my English has improved so much this year.", "fr": "Je suis reconnaissante d'avoir fait autant de progrès en anglais cette année.", "ok": true, "next": "n9", "react": ["grace", "It really has! You've come such a long way.", "C'est vrai ! Vous avez fait un sacré chemin."]}, {"en": "Thank you for the turkey is in the oven.", "fr": "Merci pour la dinde est au four.", "ok": false, "tip": "Cette phrase est incorrecte. Commencez par « I'm thankful for... » puis dites ce qui vous rend reconnaissante."}], "open": {"model": ["I'm thankful for my family, my friends and this lovely kitchen full of laughter.", "Je suis reconnaissante pour ma famille, mes amis et cette jolie cuisine pleine de rires."], "next": "n9", "react": ["james", "Beautifully said. I couldn't have put it better myself.", "Magnifiquement dit. Je n'aurais pas su mieux le dire."]}}}, "n9": {"say": [["emma", "And I'm thankful for good neighbors, and for a turkey that hasn't burnt. Yet!", "Et moi, je suis reconnaissante pour mes bons voisins, et pour une dinde qui n'a pas brûlé. Pour l'instant !"], ["grace", "Let's eat soon, before James finishes all the stuffing.", "Mangeons vite, avant que James ne finisse toute la farce."], ["james", "I've only had a tiny taste. Or three.", "Je n'ai goûté qu'une toute petite bouchée. Ou trois."]], "end": true}}, "quiz": [{"q": "Depuis quand la dinde est-elle au four ?", "opts": ["Depuis la veille au soir", "Depuis huit heures du matin", "Depuis midi"], "a": 1}, {"q": "Qu'est-ce que Grace a déjà fait ?", "opts": ["Elle a épluché les pommes de terre", "Elle a fait la tarte", "Elle a acheté la dinde"], "a": 0}, {"q": "Qu'est-ce qui manque dans la cuisine d'Emma ?", "opts": ["Le sucre", "Les oignons", "La sauce aux canneberges"], "a": 2}]}, {"id": "s3-travels", "level": 3, "title": "Souvenirs de voyage", "setting": "livingroom", "cast": ["james", "emma"], "intro": "James vous a invitée à prendre le thé chez lui avec Emma. Il adore les histoires de voyage et veut entendre les vôtres.", "start": "n1", "nodes": {"n1": {"say": [["james", "Come in, Marie Line, the kettle has just boiled. Emma tells me you've travelled quite a bit.", "Entrez, Marie Line, l'eau vient de bouillir. Emma me dit que vous avez pas mal voyagé."], ["emma", "I told him you've probably been to more places than I have.", "Je lui ai dit que vous étiez sans doute allée dans plus d'endroits que moi."]], "ask": {"prompt": "Répondez à James : avez-vous beaucoup voyagé ?", "options": [{"en": "I've been to a few countries, but not as many as I'd like.", "fr": "Je suis allée dans quelques pays, mais pas autant que je le voudrais.", "ok": true, "next": "n2", "react": ["james", "Ah, the eternal traveller's complaint. I know it well.", "Ah, l'éternelle plainte du voyageur. Je la connais bien."]}, {"en": "Not really, but I've visited Vermont many times to see my family.", "fr": "Pas vraiment, mais je suis venue de nombreuses fois dans le Vermont pour voir ma famille.", "ok": true, "next": "n2", "react": ["emma", "And we're very glad you keep coming back!", "Et nous sommes très contents que vous reveniez sans cesse !"]}, {"en": "I have went to Spain last year.", "fr": "Je suis allée en Espagne l'année dernière.", "ok": false, "tip": "Erreur de grammaire : avec « last year », on emploie le prétérit. On dit « I went to Spain last year »."}], "open": {"model": ["I've travelled a little, and of course I've come to Vermont many times.", "J'ai un peu voyagé, et bien sûr, je suis venue de nombreuses fois dans le Vermont."], "next": "n2", "react": ["james", "Splendid. Every journey has a story, doesn't it?", "Magnifique. Chaque voyage a son histoire, n'est-ce pas ?"]}}}, "n2": {"say": [["james", "Tell me about a trip you really enjoyed. Where did you go, and what did you do?", "Racontez-moi un voyage que vous avez vraiment aimé. Où êtes-vous allée, et qu'avez-vous fait ?"]], "ask": {"prompt": "Racontez brièvement un voyage que vous avez aimé.", "options": [{"en": "A few years ago, I went to Italy with friends. We visited Rome and ate wonderful pasta.", "fr": "Il y a quelques années, je suis allée en Italie avec des amis. Nous avons visité Rome et mangé de délicieuses pâtes.", "ok": true, "next": "n3", "react": ["james", "Rome! I went there as a young teacher and I've always wanted to go back.", "Rome ! J'y suis allé quand j'étais jeune professeur et j'ai toujours eu envie d'y retourner."]}, {"en": "Last summer, I took the train along the coast and stopped in small villages.", "fr": "L'été dernier, j'ai pris le train le long de la côte et je me suis arrêtée dans de petits villages.", "ok": true, "next": "n3", "react": ["emma", "That sounds so relaxing. I love long train journeys.", "Ça a l'air tellement reposant. J'adore les longs voyages en train."]}, {"en": "I am going to Italy since ten years.", "fr": "Je vais en Italie depuis dix ans.", "ok": false, "tip": "Vous racontez un souvenir : il faut le prétérit, par exemple « I went to Italy ». Ni le présent continu, ni « since » ici."}], "open": {"model": ["Two years ago, I spent a week by the sea, and I walked on the beach every morning.", "Il y a deux ans, j'ai passé une semaine au bord de la mer, et je marchais sur la plage tous les matins."], "next": "n3", "react": ["james", "What a lovely memory. Thank you for sharing that.", "Quel joli souvenir. Merci de nous l'avoir raconté."]}}}, "n3": {"say": [["emma", "Did anything go wrong on that trip? Something always goes wrong when I travel!", "Est-ce que quelque chose s'est mal passé pendant ce voyage ? Moi, il y a toujours un problème quand je voyage !"], ["james", "Emma once missed a flight because she was buying cheese.", "Emma a raté un avion un jour parce qu'elle achetait du fromage."], ["emma", "It was very good cheese, James.", "C'était un très bon fromage, James."]], "ask": {"prompt": "Dites s'il y a eu un problème pendant votre voyage.", "options": [{"en": "Yes, the airline lost my suitcase, but it turned up two days later.", "fr": "Oui, la compagnie a perdu ma valise, mais elle a refait surface deux jours plus tard.", "ok": true, "next": "n4", "react": ["james", "Ah, the classic lost suitcase. At least it turned up in the end!", "Ah, le grand classique de la valise perdue. Au moins, elle a fini par réapparaître !"]}, {"en": "No, everything went smoothly. I was very lucky.", "fr": "Non, tout s'est bien passé. J'ai eu beaucoup de chance.", "ok": true, "next": "n4", "react": ["emma", "Lucky you! You'll have to teach me your secret.", "Quelle chance ! Il faudra me donner votre secret."]}, {"en": "Yes, I have lost my suitcase two days later tomorrow.", "fr": "Oui, j'ai perdu ma valise deux jours plus tard demain.", "ok": false, "tip": "Phrase confuse : « two days later » et « tomorrow » ne vont pas ensemble, et pour un récit on utilise le prétérit (« I lost »)."}], "open": {"model": ["Well, it rained almost every day, but we had a wonderful time anyway.", "Eh bien, il a plu presque tous les jours, mais on s'est quand même merveilleusement bien amusés."], "next": "n4", "react": ["emma", "Ha! That happens to the best of us.", "Ha ! Ça arrive aux meilleurs d'entre nous."]}}}, "n4": {"say": [["emma", "Now James, tell Marie Line about your trip to Scotland. It's my favourite story.", "Allez James, raconte à Marie Line ton voyage en Écosse. C'est mon histoire préférée."], ["james", "Oh, very well. Forty years ago, I went walking in the Highlands with my brother. On the second day, a thick fog came down and we got completely lost.", "Oh, d'accord. Il y a quarante ans, je suis parti marcher dans les Highlands avec mon frère. Le deuxième jour, un épais brouillard est tombé et nous nous sommes complètement perdus."], ["james", "We wandered for hours until we found a little farmhouse. The farmer's wife gave us hot soup and let us sleep in the barn.", "Nous avons erré pendant des heures avant de trouver une petite ferme. La femme du fermier nous a donné une soupe chaude et nous a laissés dormir dans la grange."]], "ask": {"prompt": "Réagissez à l'histoire de James et posez-lui une question.", "options": [{"en": "How frightening! Were you scared when the fog came down?", "fr": "Quelle frayeur ! Vous avez eu peur quand le brouillard est tombé ?", "ok": true, "next": "n5", "react": ["james", "Terrified! But I pretended not to be, for my little brother's sake.", "Terrifié ! Mais j'ai fait semblant de ne pas l'être, pour mon petit frère."]}, {"en": "What a story! Have you ever been back to that farm?", "fr": "Quelle histoire ! Vous êtes déjà retourné dans cette ferme ?", "ok": true, "next": "n6", "react": ["james", "I have, actually. Twenty years later.", "Oui, figurez-vous. Vingt ans plus tard."]}, {"en": "Yes, I would like some soup, please.", "fr": "Oui, je voudrais bien de la soupe, s'il vous plaît.", "ok": false, "tip": "James raconte une histoire, il ne vous propose pas de soupe ! Réagissez à son récit ou posez-lui une question."}], "open": {"model": ["That's an amazing story! What happened the next morning?", "Quelle histoire incroyable ! Que s'est-il passé le lendemain matin ?"], "next": "n5", "react": ["james", "I'm so glad you enjoyed it. And there's a funny ending, too.", "Je suis ravi qu'elle vous plaise. Et il y a une fin amusante, en plus."]}}}, "n5": {"say": [["james", "The next morning, the fog had gone and we could see for miles. Our hotel was only a mile away!", "Le lendemain matin, le brouillard avait disparu et on voyait à des kilomètres. Notre hôtel n'était qu'à un peu plus d'un kilomètre !"], ["emma", "That's the part that makes me laugh every single time.", "C'est le passage qui me fait rire à chaque fois."]], "next": "n7"}, "n6": {"say": [["james", "I went back with my wife, and the farmer's wife remembered us. She said we were the only guests who had ever arrived in the fog.", "J'y suis retourné avec ma femme, et la fermière se souvenait de nous. Elle a dit que nous étions les seuls invités jamais arrivés dans le brouillard."], ["emma", "And she made exactly the same soup!", "Et elle a fait exactement la même soupe !"]], "next": "n7"}, "n7": {"say": [["emma", "Marie Line, where would you like to travel next, if you get the chance?", "Marie Line, où aimeriez-vous aller lors de votre prochain voyage, si vous en avez l'occasion ?"]], "ask": {"prompt": "Dites où vous aimeriez voyager et pourquoi (avec « if »).", "options": [{"en": "If I have the chance, I'll visit Montreal, because it's close and people speak French there.", "fr": "Si j'en ai l'occasion, j'irai à Montréal, parce que c'est tout près et qu'on y parle français.", "ok": true, "next": "n8", "react": ["emma", "Oh, great idea! We could all drive up there together.", "Oh, bonne idée ! On pourrait tous y aller ensemble en voiture."]}, {"en": "I'd love to see Scotland now, after hearing James's story!", "fr": "J'aimerais beaucoup voir l'Écosse maintenant, après avoir entendu l'histoire de James !", "ok": true, "next": "n8", "react": ["james", "Splendid choice. Just bring a good map, and perhaps a compass.", "Excellent choix. Prenez simplement une bonne carte, et peut-être une boussole."]}, {"en": "If I will have the chance, I visit Montreal.", "fr": "Si j'aurai l'occasion, je visite Montréal.", "ok": false, "tip": "Après « if », on n'utilise pas « will ». On dit : « If I have the chance, I'll visit... »."}], "open": {"model": ["If I have the chance, I'll visit the big national parks in the West.", "Si j'en ai l'occasion, je visiterai les grands parcs nationaux de l'Ouest."], "next": "n8", "react": ["emma", "That sounds wonderful. I really hope you get to do it!", "Ça a l'air merveilleux. J'espère vraiment que vous pourrez le faire !"]}}}, "n8": {"say": [["james", "Well, this has been a delightful afternoon. More tea, anyone?", "Eh bien, quel après-midi charmant. Encore un peu de thé, quelqu'un ?"], ["emma", "Always, James. Always.", "Toujours, James. Toujours."]], "end": true}}, "quiz": [{"q": "Pourquoi Emma a-t-elle raté un avion un jour ?", "opts": ["Elle dormait", "Elle achetait du fromage", "Elle avait perdu son passeport"], "a": 1}, {"q": "Avec qui James marchait-il en Écosse il y a quarante ans ?", "opts": ["Avec son frère", "Avec sa femme", "Avec son fils"], "a": 0}, {"q": "Où James et son compagnon ont-ils dormi cette nuit-là ?", "opts": ["Dans un hôtel", "Sous une tente", "Dans une grange"], "a": 2}]}, {"id": "s3-clinic", "level": 3, "title": "Un rendez-vous mélangé", "setting": "clinic", "cast": ["grace", "james"], "intro": "Vous arrivez à la clinique pour votre rendez-vous de dix heures et demie. Grace travaille à l'accueil ce matin, et James attend dans la salle d'attente.", "start": "n1", "nodes": {"n1": {"say": [["james", "Good morning, Marie Line! Fancy seeing you here. I'm just waiting for my flu jab.", "Bonjour, Marie Line ! Quelle surprise de vous voir ici. J'attends mon vaccin contre la grippe."], ["grace", "Hi Marie Line! Lovely to see you. Have you come in for an appointment?", "Bonjour Marie Line ! Contente de vous voir. Vous venez pour un rendez-vous ?"]], "ask": {"prompt": "Expliquez à Grace pourquoi vous êtes là.", "options": [{"en": "Yes, I have an appointment at ten thirty for my flu shot.", "fr": "Oui, j'ai rendez-vous à dix heures et demie pour mon vaccin contre la grippe.", "ok": true, "next": "n2", "react": ["grace", "Great, let me just check the system for you.", "Très bien, je vérifie dans l'ordinateur."]}, {"en": "Yes, I booked a check-up last week, for ten thirty this morning.", "fr": "Oui, j'ai pris rendez-vous la semaine dernière pour un bilan, à dix heures et demie ce matin.", "ok": true, "next": "n2", "react": ["grace", "Perfect, let me have a quick look.", "Parfait, je regarde ça tout de suite."]}, {"en": "I'm sick of the clinic, thank you.", "fr": "J'en ai assez de la clinique, merci.", "ok": false, "tip": "« I'm sick of » veut dire « j'en ai assez de ». Expliquez simplement que vous avez un rendez-vous : « I have an appointment at... »."}], "open": {"model": ["Good morning, Grace. I have an appointment at ten thirty, but I'm a little early.", "Bonjour Grace. J'ai rendez-vous à dix heures et demie, mais je suis un peu en avance."], "next": "n2", "react": ["grace", "No worries at all, let me check.", "Pas de souci, je vérifie."]}}}, "n2": {"say": [["grace", "Hmm, that's strange. I can't find your name at ten thirty. There's a Marie Lane booked at eleven thirty instead.", "Hum, c'est bizarre. Je ne trouve pas votre nom à dix heures et demie. Il y a une Marie Lane inscrite à onze heures et demie."], ["james", "Marie Lane, Marie Line. An easy mistake to make, I suppose.", "Marie Lane, Marie Line. Une erreur facile à faire, j'imagine."], ["grace", "I'm so sorry. It looks like someone mixed things up when they wrote it down.", "Je suis vraiment désolée. On dirait que quelqu'un s'est trompé en le notant."]], "ask": {"prompt": "Réagissez poliment et demandez ce qu'on peut faire.", "options": [{"en": "Oh, I see. Would it be possible to see someone this morning anyway?", "fr": "Ah, je vois. Serait-il quand même possible de voir quelqu'un ce matin ?", "ok": true, "next": "n3", "react": ["grace", "Let me find out. I'll do my very best.", "Je me renseigne. Je vais faire de mon mieux."]}, {"en": "That's all right, these things happen. Could you tell me what my options are?", "fr": "Ce n'est pas grave, ça arrive. Pourriez-vous me dire quelles sont les possibilités ?", "ok": true, "next": "n3", "react": ["grace", "Of course. Thanks for being so understanding. Give me one moment.", "Bien sûr. Merci d'être aussi compréhensive. Un petit instant."]}, {"en": "This is a disaster! I want to speak to the president!", "fr": "C'est une catastrophe ! Je veux parler au président !", "ok": false, "tip": "C'est trop agressif et exagéré. Restez polie : « Would it be possible to... ? » est bien plus naturel."}], "open": {"model": ["I see, that's a shame. Is there any way I could be seen today?", "Je vois, c'est dommage. Y a-t-il un moyen d'être reçue aujourd'hui ?"], "next": "n3", "react": ["grace", "I completely understand. Let's sort it out together.", "Je comprends tout à fait. On va régler ça ensemble."]}}}, "n3": {"say": [["grace", "Okay, here's the situation. The doctor is fully booked until eleven thirty, but if you can wait an hour, she'll see you then.", "Bon, voilà la situation. Le médecin est complet jusqu'à onze heures et demie, mais si vous pouvez attendre une heure, elle vous recevra à ce moment-là."], ["grace", "Or, if you prefer, I can book you in for tomorrow morning at nine.", "Ou, si vous préférez, je peux vous inscrire pour demain matin à neuf heures."]], "ask": {"prompt": "Choisissez une solution et expliquez pourquoi.", "options": [{"en": "I'll wait, if that's okay. I don't have any other plans this morning.", "fr": "Je vais attendre, si ça ne pose pas de problème. Je n'ai rien d'autre de prévu ce matin.", "ok": true, "next": "n4", "react": ["grace", "Lovely. Grab a seat, and there's free coffee by the window.", "Très bien. Installez-vous, il y a du café gratuit près de la fenêtre."]}, {"en": "Tomorrow at nine would suit me better, thank you.", "fr": "Demain à neuf heures m'arrangerait mieux, merci.", "ok": true, "next": "n5", "react": ["grace", "Done! You're down for nine o'clock tomorrow, and spelled correctly this time.", "C'est fait ! Vous êtes inscrite pour demain à neuf heures, et avec la bonne orthographe cette fois."]}, {"en": "I'll wait tomorrow at eleven thirty yesterday.", "fr": "J'attendrai demain à onze heures et demie hier.", "ok": false, "tip": "Phrase incohérente : on ne peut pas mélanger « tomorrow » (demain) et « yesterday » (hier). Choisissez l'une des deux propositions de Grace."}], "open": {"model": ["If I wait an hour, will the doctor definitely see me?", "Si j'attends une heure, est-ce que le médecin me recevra à coup sûr ?"], "next": "n4", "react": ["grace", "Yes, I'll make sure of it, I promise.", "Oui, je m'en occupe, c'est promis."]}}}, "n4": {"say": [["james", "Wonderful, you can keep me company. I've been here for forty minutes, and I've read every magazine twice.", "Formidable, vous allez me tenir compagnie. Je suis là depuis quarante minutes, et j'ai lu chaque magazine deux fois."], ["james", "Have you ever noticed that waiting rooms only have magazines from three years ago?", "Vous avez déjà remarqué que dans les salles d'attente, les magazines datent toujours d'il y a trois ans ?"]], "ask": {"prompt": "Faites la conversation avec James dans la salle d'attente.", "options": [{"en": "Yes! Last time, I read all about a royal wedding that happened years ago.", "fr": "Oui ! La dernière fois, j'ai tout lu sur un mariage royal qui avait eu lieu des années plus tôt.", "ok": true, "next": "n6", "react": ["james", "Ha! Very up to date. Shall we start a campaign for newer magazines?", "Ha ! Très à jour. On lance une pétition pour des magazines plus récents ?"]}, {"en": "That's why I always bring my own book, just in case.", "fr": "C'est pour ça que j'apporte toujours mon propre livre, au cas où.", "ok": true, "next": "n6", "react": ["james", "Very wise. I should have thought of that myself.", "Très sage. J'aurais dû y penser moi-même."]}, {"en": "Yes, I have noticed it next week.", "fr": "Oui, je l'ai remarqué la semaine prochaine.", "ok": false, "tip": "« Next week » (la semaine prochaine) ne va pas avec le present perfect. Dites simplement « Yes, I have! » ou « Yes, I've noticed that too »."}], "open": {"model": ["Yes, I've noticed that too. It must be the same everywhere in the world!", "Oui, je l'ai remarqué aussi. Ça doit être pareil partout dans le monde !"], "next": "n6", "react": ["james", "Ha! I'm glad it's not just me.", "Ha ! Je suis content de ne pas être le seul."]}}}, "n5": {"say": [["james", "Tomorrow at nine? Then you're free this morning. Would you like to have a cup of tea with me after my jab?", "Demain à neuf heures ? Alors vous êtes libre ce matin. Voulez-vous prendre une tasse de thé avec moi après mon vaccin ?"]], "ask": {"prompt": "Répondez à l'invitation de James.", "options": [{"en": "I'd love to, thank you. Shall we go to the café on Main Street?", "fr": "Avec plaisir, merci. On va au café de la rue principale ?", "ok": true, "next": "n6", "react": ["james", "Perfect. They make a proper pot of tea there.", "Parfait. Ils y font un vrai bon thé."]}, {"en": "That's very kind, but I have to pick up my grandchildren from school.", "fr": "C'est très gentil, mais je dois aller chercher mes petits-enfants à l'école.", "ok": true, "next": "n6", "react": ["james", "Another time, then. Family comes first.", "Une autre fois, alors. La famille passe avant tout."]}, {"en": "Yes, I have drunk a tea yesterday.", "fr": "Oui, j'ai bu un thé hier.", "ok": false, "tip": "James vous invite, il faut accepter ou refuser poliment. Et avec « yesterday », on dit « I drank », pas « I have drunk »."}], "open": {"model": ["That sounds lovely. I'd be happy to join you.", "Ça a l'air très agréable. Je me joindrai à vous avec plaisir."], "next": "n6", "react": ["james", "Splendid! I won't be long, I hope.", "Magnifique ! Je n'en ai pas pour longtemps, j'espère."]}}}, "n6": {"say": [["grace", "James Whitfield? I'm ready for you now. Come on through.", "James Whitfield ? Je suis prête pour vous. Suivez-moi."], ["james", "At last. Wish me luck, Marie Line. I'm terribly brave about needles.", "Enfin. Souhaitez-moi bonne chance, Marie Line. Je suis terriblement courageux face aux piqûres."], ["grace", "He said that last year, and then he asked me for a lollipop. Marie Line, if a mix-up like this ever happens again, just call me directly.", "Il a dit la même chose l'année dernière, et ensuite il m'a demandé une sucette. Marie Line, si ce genre d'erreur se reproduit, appelez-moi directement."]], "ask": {"prompt": "Remerciez Grace pour son aide.", "options": [{"en": "Thank you so much, Grace. You've been really helpful this morning.", "fr": "Merci beaucoup, Grace. Vous m'avez vraiment bien aidée ce matin.", "ok": true, "next": "n7", "react": ["grace", "Anytime! That's what I'm here for.", "Quand vous voulez ! C'est mon travail."]}, {"en": "Thanks, Grace. I'll make sure they spell my name right next time!", "fr": "Merci, Grace. La prochaine fois, je vérifierai qu'ils écrivent bien mon nom !", "ok": true, "next": "n7", "react": ["grace", "Ha! I'll write it on a big sign for the front desk.", "Ha ! Je vais l'écrire en grand sur un panneau à l'accueil."]}, {"en": "You're welcome, Grace.", "fr": "Je vous en prie, Grace.", "ok": false, "tip": "« You're welcome » sert à répondre à un merci. Ici, c'est vous qui remerciez : « Thank you so much »."}], "open": {"model": ["Thank you, Grace. I really appreciate your help this morning.", "Merci, Grace. J'apprécie vraiment votre aide ce matin."], "next": "n7", "react": ["grace", "My pleasure, Marie Line. Take care!", "Avec plaisir, Marie Line. Prenez soin de vous !"]}}}, "n7": {"say": [["grace", "See you soon, Marie Line, and enjoy the rest of your day!", "À bientôt, Marie Line, et bonne fin de journée !"]], "end": true}}, "quiz": [{"q": "Sous quel nom le rendez-vous a-t-il été noté par erreur ?", "opts": ["Mary Lee", "Marie Lane", "Marie Lin"], "a": 1}, {"q": "Pourquoi James est-il à la clinique ?", "opts": ["Pour son vaccin contre la grippe", "Pour une prise de sang", "Pour accompagner Emma"], "a": 0}, {"q": "Selon Grace, qu'est-ce que James a demandé l'année dernière après sa piqûre ?", "opts": ["Un café", "Un magazine", "Une sucette"], "a": 2}]}, {"id": "s3-bookclub", "level": 3, "title": "Débat au club de lecture", "setting": "cafe", "cast": ["grace", "emma"], "intro": "C'est samedi, au café du village. Ce mois-ci, le club de lecture de Grace a lu « Les Quatre Filles du docteur March » (Little Women). Emma est assise à côté de vous.", "start": "n1", "nodes": {"n1": {"say": [["grace", "Right, everyone, welcome back! This month we read Little Women. Marie Line, did you manage to finish it?", "Bon, tout le monde, bon retour parmi nous ! Ce mois-ci, nous avons lu Les Quatre Filles du docteur March. Marie Line, vous avez réussi à le finir ?"], ["emma", "I've read it four times now, and I still cried at the end.", "Je l'ai lu quatre fois maintenant, et j'ai encore pleuré à la fin."]], "ask": {"prompt": "Dites à Grace si vous avez terminé le livre.", "options": [{"en": "Yes, I finished it last night. I couldn't put it down!", "fr": "Oui, je l'ai fini hier soir. Je ne pouvais plus le lâcher !", "ok": true, "next": "n2", "react": ["grace", "Oh, that's the best feeling, isn't it?", "Oh, c'est la meilleure sensation qui soit, non ?"]}, {"en": "Not quite. I've read about two thirds of it so far.", "fr": "Pas tout à fait. J'en ai lu à peu près les deux tiers pour l'instant.", "ok": true, "next": "n2", "react": ["emma", "That's okay. We'll try very hard not to spoil the ending.", "Ce n'est pas grave. On va faire très attention à ne pas dévoiler la fin."]}, {"en": "Yes, I have finished it tomorrow.", "fr": "Oui, je l'ai fini demain.", "ok": false, "tip": "« Tomorrow » (demain) ne peut pas aller avec « I have finished ». Dites « I finished it last night » ou « I've finished it »."}], "open": {"model": ["Yes, I finished it on Thursday. I'd read it in French many years ago.", "Oui, je l'ai fini jeudi. Je l'avais lu en français il y a bien longtemps."], "next": "n2", "react": ["grace", "Brilliant! Let's dive in, then.", "Génial ! Alors, plongeons dedans."]}}}, "n2": {"say": [["grace", "So, what did you think of it overall? Be honest, we don't bite.", "Alors, qu'en avez-vous pensé dans l'ensemble ? Soyez franche, on ne mord pas."], ["emma", "Well, Grace bites a little when someone doesn't like her favourite book.", "Enfin, Grace mord un peu quand quelqu'un n'aime pas son livre préféré."]], "ask": {"prompt": "Donnez votre avis sur le livre, avec une raison.", "options": [{"en": "I really enjoyed it, because the four sisters feel so real and so different.", "fr": "Je l'ai vraiment aimé, parce que les quatre sœurs semblent si vraies et si différentes.", "ok": true, "next": "n3", "react": ["grace", "Yes! Each one has her own personality.", "Oui ! Chacune a sa propre personnalité."]}, {"en": "I liked it, but to be honest, I found the beginning a bit slow.", "fr": "Je l'ai aimé, mais pour être honnête, j'ai trouvé le début un peu lent.", "ok": true, "next": "n4", "react": ["emma", "That's fair. It does take a while to get going.", "C'est juste. Il faut un moment pour que ça démarre."]}, {"en": "I think it's a book.", "fr": "Je pense que c'est un livre.", "ok": false, "tip": "C'est trop vague ! Donnez un vrai avis avec une raison : « I enjoyed it because... »."}], "open": {"model": ["I thought it was charming, and it reminded me of my own family.", "Je l'ai trouvé charmant, et il m'a rappelé ma propre famille."], "next": "n3", "react": ["grace", "I love that. Thanks for sharing.", "J'adore. Merci de nous le dire."]}}}, "n3": {"say": [["grace", "The characters are what make it a classic, I reckon.", "Pour moi, ce sont les personnages qui en font un classique."], ["emma", "And Louisa May Alcott based them on her own sisters, you know.", "Et Louisa May Alcott s'est inspirée de ses propres sœurs, vous savez."]], "next": "n5"}, "n4": {"say": [["grace", "You're not the first person to say that. The first few chapters are mostly about Christmas presents!", "Vous n'êtes pas la première à le dire. Les premiers chapitres parlent surtout de cadeaux de Noël !"], ["emma", "But once you get into it, it's very hard to stop.", "Mais une fois qu'on est dedans, c'est très difficile de s'arrêter."]], "next": "n5"}, "n5": {"say": [["emma", "Which sister did you like best? I've always had a soft spot for Jo, because she wants to be a writer.", "Quelle sœur avez-vous préférée ? J'ai toujours eu un faible pour Jo, parce qu'elle veut devenir écrivain."], ["grace", "I'm a Beth person myself. She's so kind and gentle.", "Moi, je suis plutôt Beth. Elle est si gentille et si douce."]], "ask": {"prompt": "Dites quel personnage vous préférez et pourquoi.", "options": [{"en": "I prefer Jo too. She's brave, and she always says what she thinks.", "fr": "Je préfère Jo moi aussi. Elle est courageuse, et elle dit toujours ce qu'elle pense.", "ok": true, "next": "n6", "react": ["emma", "Exactly! She was quite modern for her time.", "Exactement ! Elle était plutôt moderne pour son époque."]}, {"en": "I liked Marmee, the mother. She's wise and always so patient.", "fr": "J'ai aimé Marmee, la mère. Elle est sage et toujours si patiente.", "ok": true, "next": "n6", "react": ["grace", "Ooh, nobody ever picks Marmee. Great choice!", "Oh, personne ne choisit jamais Marmee. Excellent choix !"]}, {"en": "I like the sister of the book.", "fr": "J'aime la sœur du livre.", "ok": false, "tip": "Soyez précise : donnez le nom d'un personnage (Jo, Beth, Amy, Meg...) et une raison, avec « because »."}], "open": {"model": ["I liked Amy, because she changes so much during the story.", "J'ai aimé Amy, parce qu'elle change beaucoup au fil de l'histoire."], "next": "n6", "react": ["emma", "That's a really interesting choice. I think Amy is often misunderstood.", "C'est un choix vraiment intéressant. Je trouve qu'Amy est souvent mal comprise."]}}}, "n6": {"say": [["grace", "Now, a bigger question. Who are your favourite authors? Have you read anything good lately?", "Maintenant, une question plus large. Quels sont vos auteurs préférés ? Vous avez lu quelque chose de bien récemment ?"], ["emma", "I've just started a mystery set in Maine. I've been up until midnight every night this week!", "Je viens de commencer un roman policier qui se passe dans le Maine. Je me suis couchée à minuit tous les soirs cette semaine !"]], "ask": {"prompt": "Parlez de vos auteurs préférés ou d'un livre lu récemment.", "options": [{"en": "I've always loved Agatha Christie. I've read almost all of her mysteries.", "fr": "J'ai toujours adoré Agatha Christie. J'ai lu presque tous ses romans policiers.", "ok": true, "next": "n7", "react": ["emma", "Then you and I need to swap books, Marie Line!", "Alors vous et moi, il faut qu'on échange nos livres, Marie Line !"]}, {"en": "I love Victor Hugo. I've read Les Misérables three times.", "fr": "J'adore Victor Hugo. J'ai lu Les Misérables trois fois.", "ok": true, "next": "n7", "react": ["grace", "Three times! That's a lot of pages. I'm impressed.", "Trois fois ! Ça fait beaucoup de pages. Je suis impressionnée."]}, {"en": "My favourite author is the café.", "fr": "Mon auteur préféré, c'est le café.", "ok": false, "tip": "Un café n'est pas un auteur ! Citez un écrivain que vous aimez, par exemple « I've always loved... »."}], "open": {"model": ["I enjoy historical novels, and lately I've been reading some poetry too.", "J'aime les romans historiques, et ces derniers temps, je lis aussi un peu de poésie."], "next": "n7", "react": ["grace", "Fantastic. You've given me some ideas for future months.", "Fantastique. Vous m'avez donné des idées pour les prochains mois."]}}}, "n7": {"say": [["grace", "Speaking of which, we need to choose next month's book. Any suggestions, Marie Line?", "À propos, il faut choisir le livre du mois prochain. Des suggestions, Marie Line ?"]], "ask": {"prompt": "Proposez un livre pour le mois prochain, en donnant une raison.", "options": [{"en": "How about an Agatha Christie? If we choose a mystery, everyone will enjoy it.", "fr": "Et si on lisait un Agatha Christie ? Si on choisit un roman policier, tout le monde aimera.", "ok": true, "next": "n8", "react": ["emma", "Oh yes, I'd vote for that!", "Oh oui, je vote pour !"]}, {"en": "What about The Little Prince? It's short, so everyone will finish it.", "fr": "Pourquoi pas Le Petit Prince ? Il est court, donc tout le monde le finira.", "ok": true, "next": "n8", "react": ["grace", "Love it! And you can tell us about the original French version.", "J'adore ! Et vous pourrez nous parler de la version originale en français."]}, {"en": "I suggest we read last month.", "fr": "Je propose qu'on lise le mois dernier.", "ok": false, "tip": "Cette phrase ne veut rien dire. Proposez un titre précis : « How about... ? » ou « What about... ? »."}], "open": {"model": ["Why don't we read a French classic in English translation?", "Pourquoi ne pas lire un classique français traduit en anglais ?"], "next": "n8", "react": ["grace", "What a great idea. Let's put it to the vote.", "Quelle bonne idée. Mettons-la aux voix."]}}}, "n8": {"say": [["grace", "Brilliant. I'll send everyone an email tonight. Same time next Saturday?", "Génial. J'envoie un e-mail à tout le monde ce soir. Même heure samedi prochain ?"], ["emma", "I'll bring a lemon cake this time. Biscuit ate the last one.", "J'apporterai un gâteau au citron cette fois. Biscuit a mangé le dernier."], ["grace", "Your dog has excellent taste, Emma.", "Ton chien a très bon goût, Emma."]], "end": true}}, "quiz": [{"q": "Combien de fois Emma a-t-elle lu ce livre ?", "opts": ["Deux fois", "Quatre fois", "Dix fois"], "a": 1}, {"q": "Quelle sœur Grace préfère-t-elle ?", "opts": ["Jo", "Amy", "Beth"], "a": 2}, {"q": "Qu'est-il arrivé au dernier gâteau d'Emma ?", "opts": ["Biscuit l'a mangé", "Il a brûlé", "Grace l'a oublié au café"], "a": 0}]}, {"id": "s4-france-usa", "level": 4, "title": "France ou États-Unis ?", "setting": "livingroom", "cast": ["emma", "james", "grace"], "intro": "Soirée chez Emma, autour d'un café. La conversation glisse vers un sujet délicat : vaut-il mieux vivre en France ou aux États-Unis ? Chacun a son avis.", "start": "n1", "nodes": {"n1": {"say": [["emma", "So, Marie Line, now that you've spent quite a bit of time here, I'm dying to know: what has struck you most about life in the States?", "Alors, Marie Line, maintenant que vous avez passé pas mal de temps ici, je meurs d'envie de savoir : qu'est-ce qui vous a le plus frappée dans la vie aux États-Unis ?"], ["james", "Careful, Emma, that's exactly the kind of question that starts revolutions.", "Attention, Emma, c'est exactement le genre de question qui déclenche des révolutions."], ["grace", "Oh, let her answer, James! I want the honest truth.", "Oh, laisse-la répondre, James ! Je veux la vérité, toute la vérité."]], "ask": {"prompt": "Dites ce qui vous a le plus frappée aux États-Unis.", "options": [{"en": "To be honest, what strikes me most is how friendly and open people are, even with complete strangers.", "fr": "Pour être honnête, ce qui me frappe le plus, c'est à quel point les gens sont aimables et ouverts, même avec de parfaits inconnus.", "ok": true, "next": "n2", "react": ["grace", "That's so nice to hear. Although I've heard some Europeans find it a bit much at first!", "Ça fait plaisir à entendre. Même si j'ai entendu dire que certains Européens trouvent ça un peu excessif au début !"]}, {"en": "Everything is so much bigger here: the cars, the roads, and especially the portions in restaurants!", "fr": "Tout est tellement plus grand ici : les voitures, les routes, et surtout les portions au restaurant !", "ok": true, "next": "n2", "react": ["james", "I nearly fainted the first time I ordered a large coffee here. It arrived in a bucket.", "J'ai failli m'évanouir la première fois que j'ai commandé un grand café ici. On me l'a servi dans un seau."]}, {"en": "I have struck many Americans since I arrived.", "fr": "J'ai frappé beaucoup d'Américains depuis mon arrivée.", "ok": false, "tip": "Attention ! « I have struck many Americans » veut dire « j'ai frappé beaucoup d'Américains ». Pour dire ce qui vous a marquée : « What strikes me most is... »."}], "open": {"model": ["What has struck me most is how much space there is here, and how people are always ready to help.", "Ce qui m'a le plus frappée, c'est tout l'espace qu'il y a ici, et le fait que les gens soient toujours prêts à aider."], "next": "n2", "react": ["emma", "That's a really thoughtful answer. I'd never looked at it quite that way.", "C'est une réponse vraiment réfléchie. Je n'avais jamais vu les choses sous cet angle."]}}}, "n2": {"say": [["james", "Well, I'll stick my neck out and say that the French have got food completely sorted. No offence, Emma.", "Eh bien, je vais prendre un risque et dire que les Français ont tout compris en matière de cuisine. Sans vouloir te vexer, Emma."], ["emma", "None taken, but I'd just like to point out that we invented the chocolate chip cookie.", "Je ne suis pas vexée, mais je voudrais juste rappeler que c'est nous qui avons inventé le cookie aux pépites de chocolat."], ["grace", "And Australians invented the pavlova, so really, we're all winners here.", "Et les Australiens ont inventé la pavlova, donc au fond, on a tous gagné."]], "ask": {"prompt": "Donnez votre avis sur la cuisine, en nuançant.", "options": [{"en": "I'd say French food is wonderful, but I've had some amazing meals here too, especially barbecue.", "fr": "Je dirais que la cuisine française est merveilleuse, mais j'ai aussi fait de très bons repas ici, surtout les barbecues.", "ok": true, "next": "n3", "react": ["emma", "Thank you! Finally someone stands up for American cooking.", "Merci ! Enfin quelqu'un qui défend la cuisine américaine."]}, {"en": "James has a point, but I have to admit I've completely fallen in love with maple syrup.", "fr": "James n'a pas tort, mais je dois avouer que je suis complètement tombée amoureuse du sirop d'érable.", "ok": true, "next": "n3", "react": ["james", "Ah, Vermont has claimed another victim. It happens to the best of us.", "Ah, le Vermont a fait une nouvelle victime. Ça arrive aux meilleurs d'entre nous."]}, {"en": "I agree with you, and I disagree completely.", "fr": "Je suis d'accord avec vous, et je ne suis pas du tout d'accord.", "ok": false, "tip": "C'est contradictoire ! Pour nuancer poliment, dites plutôt « I see your point, but... » ou « James has a point, but... »."}], "open": {"model": ["I see where James is coming from, but I think you can find good food anywhere if you know where to look.", "Je comprends le point de vue de James, mais je pense qu'on trouve de la bonne cuisine partout, si on sait où chercher."], "next": "n3", "react": ["grace", "Spoken like a true diplomat. I love it.", "Voilà une réponse de vraie diplomate. J'adore."]}}}, "n3": {"say": [["grace", "Okay, here's a juicy one. If you could bring one thing from France to Vermont, what would it be?", "Bon, en voici une croustillante. Si vous pouviez apporter une seule chose de France dans le Vermont, ce serait quoi ?"], ["emma", "I know mine. I'd bring a proper French bakery and put it right next to my house.", "Moi, je sais. J'apporterais une vraie boulangerie française et je la mettrais juste à côté de chez moi."], ["james", "Emma, if you lived next to a bakery, Biscuit would end up the size of a sofa.", "Emma, si tu vivais à côté d'une boulangerie, Biscuit finirait gros comme un canapé."]], "ask": {"prompt": "Dites ce que vous apporteriez de France (avec « If I could... »).", "options": [{"en": "If I could bring one thing, it would be our long lunches. Nobody here seems to take the time to eat.", "fr": "Si je pouvais apporter une seule chose, ce serait nos longs déjeuners. Personne ici ne semble prendre le temps de manger.", "ok": true, "next": "n4", "react": ["grace", "Guilty as charged! I usually eat a sandwich standing up at the clinic.", "Coupable ! D'habitude, je mange un sandwich debout à la clinique."]}, {"en": "I'd bring the open-air markets, with all the local cheeses and fresh vegetables.", "fr": "J'apporterais les marchés en plein air, avec tous les fromages locaux et les légumes frais.", "ok": true, "next": "n5", "react": ["emma", "We do have farmers markets here, but I know it's not quite the same thing.", "On a bien des marchés fermiers ici, mais je sais que ce n'est pas tout à fait pareil."]}, {"en": "If I can bring one thing, I would brought the markets.", "fr": "Si je peux apporter une chose, j'apportais les marchés.", "ok": false, "tip": "Pour une situation imaginaire : « If I could bring..., I would bring... ». Après « would », le verbe reste à la forme de base (bring, pas brought)."}], "open": {"model": ["If I could bring one thing, I'd bring the little cafés where you can sit for hours with a single coffee.", "Si je pouvais apporter une seule chose, j'apporterais les petits cafés où l'on peut rester des heures devant un seul café."], "next": "n4", "react": ["james", "Oh, now you're speaking my language. That would be absolute heaven.", "Ah, là vous parlez ma langue. Ce serait le paradis."]}}}, "n4": {"say": [["emma", "That's the thing, isn't it? Over here, we're always in such a rush. Time is money, as they say.", "C'est bien ça le problème, non ? Ici, on est toujours tellement pressés. Le temps, c'est de l'argent, comme on dit."], ["james", "Whereas in France, time is lunch.", "Alors qu'en France, le temps, c'est le déjeuner."], ["grace", "James, that's a terrible joke. And completely accurate.", "James, c'est une blague affreuse. Et parfaitement exacte."]], "next": "n6"}, "n5": {"say": [["james", "Mind you, Vermont cheese is rather good these days. I've had cheddar here that would make a Yorkshireman weep with joy.", "Remarquez, le fromage du Vermont est plutôt bon de nos jours. J'ai goûté ici un cheddar qui ferait pleurer de joie un homme du Yorkshire."], ["emma", "James, you weep at most things.", "James, tu pleures pour un rien."]], "next": "n6"}, "n6": {"say": [["james", "Now, let me turn the tables. Marie Line, is there anything American you'd miss if you went back to France tomorrow?", "Bon, inversons les rôles. Marie Line, y a-t-il quelque chose d'américain qui vous manquerait si vous rentriez en France demain ?"]], "ask": {"prompt": "Répondez à James, en nuançant votre réponse.", "options": [{"en": "I'd miss the people most of all, and the way everyone says good morning in the street.", "fr": "Ce sont surtout les gens qui me manqueraient, et la façon dont tout le monde dit bonjour dans la rue.", "ok": true, "next": "n7", "react": ["emma", "Oh, stop, you'll make me cry. And then James will start too.", "Oh, arrêtez, vous allez me faire pleurer. Et ensuite James va s'y mettre aussi."]}, {"en": "Honestly, I'd miss the huge breakfasts. Pancakes on a Sunday morning are hard to beat.", "fr": "Franchement, les énormes petits-déjeuners me manqueraient. Des pancakes le dimanche matin, c'est difficile à battre.", "ok": true, "next": "n7", "react": ["grace", "Now that's a sensible answer. Pancakes are serious business.", "Voilà une réponse raisonnable. Les pancakes, c'est du sérieux."]}, {"en": "I would miss the bus, because it's always late.", "fr": "Je raterais le bus, parce qu'il est toujours en retard.", "ok": false, "tip": "« Miss the bus » veut dire « rater le bus ». Ici, « miss » signifie « regretter, manquer » : dites ce qui vous manquerait des États-Unis."}], "open": {"model": ["I'd miss my family here more than anything, and probably the autumn colours too.", "C'est ma famille ici qui me manquerait plus que tout, et sans doute aussi les couleurs de l'automne."], "next": "n7", "react": ["james", "Of course. Some things simply can't be packed in a suitcase.", "Bien sûr. Certaines choses ne rentrent tout simplement pas dans une valise."]}}}, "n7": {"say": [["grace", "So, final verdict, Marie Line. Which is better, France or the United States? No pressure!", "Alors, verdict final, Marie Line. Qu'est-ce qui est le mieux, la France ou les États-Unis ? Aucune pression !"], ["emma", "We'll all respect your answer. Mostly.", "Nous respecterons tous votre réponse. Enfin, presque."]], "ask": {"prompt": "Concluez le débat de façon diplomatique.", "options": [{"en": "I think each country has its own strengths, and I'm lucky enough to enjoy the best of both worlds.", "fr": "Je pense que chaque pays a ses atouts, et j'ai la chance de profiter du meilleur des deux mondes.", "ok": true, "next": "n8", "react": ["james", "Diplomatic and wise. You'd have made an excellent ambassador.", "Diplomate et sage. Vous auriez fait une excellente ambassadrice."]}, {"en": "My heart is in France, but Vermont has definitely stolen a piece of it.", "fr": "Mon cœur est en France, mais le Vermont en a clairement volé un morceau.", "ok": true, "next": "n8", "react": ["emma", "Oh, that's beautiful. I'll gladly keep that piece safe for you.", "Oh, c'est magnifique. Je garderai précieusement ce morceau pour vous."]}, {"en": "France is better, and Americans are all terrible.", "fr": "La France est mieux, et les Américains sont tous horribles.", "ok": false, "tip": "C'est blessant et pas du tout diplomatique ! Nuancez : « Each country has its own strengths... »."}], "open": {"model": ["Honestly, it's six of one and half a dozen of the other: I love both for different reasons.", "Franchement, c'est blanc bonnet et bonnet blanc : j'aime les deux pour des raisons différentes."], "next": "n8", "react": ["grace", "Ha! You can't argue with that. Well played!", "Ha ! Difficile de vous contredire. Bien joué !"]}}}, "n8": {"say": [["james", "Well, I think we can safely say that Marie Line has won this debate hands down.", "Eh bien, je crois qu'on peut dire sans hésiter que Marie Line a gagné ce débat haut la main."], ["grace", "Agreed. Now, who's up for pancakes?", "D'accord. Maintenant, qui veut des pancakes ?"], ["emma", "I'll put more coffee on. And James, you're not allowed to complain about the size of the cups.", "Je refais du café. Et James, tu n'as pas le droit de te plaindre de la taille des tasses."]], "end": true}}, "quiz": [{"q": "Selon Emma, quelle invention américaine faut-il rappeler ?", "opts": ["Le hamburger", "Le sirop d'érable", "Le cookie aux pépites de chocolat"], "a": 2}, {"q": "Qu'est-ce qu'Emma aimerait avoir juste à côté de chez elle ?", "opts": ["Une boulangerie française", "Un marché en plein air", "Un petit café"], "a": 0}, {"q": "D'après James, que deviendrait Biscuit à côté d'une boulangerie ?", "opts": ["Un chien très paresseux", "Gros comme un canapé", "Le chien du boulanger"], "a": 1}]}, {"id": "s4-garden-party", "level": 4, "title": "Malentendu au jardin", "setting": "garden", "cast": ["emma", "james", "grace"], "intro": "Emma organise une petite fête dans son jardin. Mais quelque chose la contrarie, et il va falloir beaucoup de tact pour arranger les choses.", "start": "n1", "nodes": {"n1": {"say": [["emma", "Marie Line, I'm so glad you came! Help yourself to lemonade, and please, admire my dahlias. Somebody has to.", "Marie Line, je suis si contente que vous soyez venue ! Servez-vous de la limonade, et s'il vous plaît, admirez mes dahlias. Il faut bien que quelqu'un le fasse."], ["grace", "Uh oh. That sounded a little pointed. What's going on, Emma?", "Aïe. C'était un peu piquant, ça. Qu'est-ce qui se passe, Emma ?"]], "ask": {"prompt": "Saluez Emma et complimentez son jardin.", "options": [{"en": "Thank you for having me, Emma. Your garden looks absolutely stunning this year.", "fr": "Merci de m'avoir invitée, Emma. Votre jardin est absolument magnifique cette année.", "ok": true, "next": "n2", "react": ["emma", "Thank you, Marie Line. At least somebody appreciates it.", "Merci, Marie Line. Au moins, quelqu'un l'apprécie."]}, {"en": "What a lovely party! Honestly, those dahlias are the most beautiful I've ever seen.", "fr": "Quelle belle fête ! Franchement, ces dahlias sont les plus beaux que j'aie jamais vus.", "ok": true, "next": "n2", "react": ["emma", "Oh, you're very kind. That really makes my day.", "Oh, vous êtes très gentille. Ça me fait vraiment plaisir."]}, {"en": "Your garden is fine, I suppose, if you like flowers.", "fr": "Votre jardin est correct, j'imagine, si on aime les fleurs.", "ok": false, "tip": "C'est un compliment bien tiède, alors qu'Emma semble déjà vexée. Soyez chaleureuse : « Your garden looks absolutely stunning »."}], "open": {"model": ["Thank you for inviting me, Emma. Everything looks wonderful, especially the flowers.", "Merci de m'avoir invitée, Emma. Tout est magnifique, surtout les fleurs."], "next": "n2", "react": ["emma", "That's very sweet of you. Thank you.", "C'est très gentil à vous. Merci."]}}}, "n2": {"say": [["emma", "Well, since you ask, James came by yesterday and told me my garden was looking rather wild. Wild! After all my hard work.", "Eh bien, puisque vous me le demandez, James est passé hier et m'a dit que mon jardin avait l'air plutôt sauvage. Sauvage ! Après tout le mal que je me suis donné."], ["grace", "Oh dear. Knowing James, I'm not sure he meant it the way it came across.", "Oh là là. Connaissant James, je ne suis pas sûre qu'il l'ait dit dans ce sens-là."]], "ask": {"prompt": "Réagissez avec tact, sans prendre parti.", "options": [{"en": "I'm sure he didn't mean to upset you. Perhaps it was just an unfortunate choice of words.", "fr": "Je suis sûre qu'il ne voulait pas vous blesser. C'était peut-être juste un mot malheureux.", "ok": true, "next": "n3", "react": ["emma", "Maybe you're right. But it still stung a little.", "Vous avez peut-être raison. Mais ça m'a quand même un peu piquée."]}, {"en": "Did he say anything else? Maybe we're only hearing half of the story.", "fr": "Est-ce qu'il a dit autre chose ? On n'a peut-être que la moitié de l'histoire.", "ok": true, "next": "n3", "react": ["grace", "Good point. Let's not jump to conclusions just yet.", "Bonne remarque. Ne tirons pas de conclusions trop vite."]}, {"en": "You're right, James is always rude. Let's not talk to him today.", "fr": "Vous avez raison, James est toujours impoli. Ne lui parlons pas aujourd'hui.", "ok": false, "tip": "Vous jetez de l'huile sur le feu ! Restez diplomate et n'accusez pas James sans savoir ce qu'il voulait dire."}], "open": {"model": ["That doesn't sound like James at all. I think there may be a misunderstanding somewhere.", "Ça ne ressemble pas du tout à James. Je pense qu'il y a peut-être un malentendu quelque part."], "next": "n3", "react": ["grace", "I was thinking exactly the same thing.", "Je pensais exactement la même chose."]}}}, "n3": {"say": [["james", "Good afternoon, everyone! Emma, I've brought you a book on English cottage gardens, since yours reminds me so much of them.", "Bonjour à tous ! Emma, je t'ai apporté un livre sur les jardins de cottage anglais, puisque le tien me les rappelle tellement."], ["emma", "Oh. Hello, James.", "Oh. Bonjour, James."], ["grace", "Marie Line, why don't you ask James what he meant yesterday? You're the neutral party here.", "Marie Line, pourquoi ne demandez-vous pas à James ce qu'il voulait dire hier ? Vous êtes la personne neutre ici."]], "ask": {"prompt": "Demandez poliment à James ce qu'il voulait dire.", "options": [{"en": "James, Emma mentioned that you said her garden looked wild. What exactly did you mean by that?", "fr": "James, Emma m'a dit que, selon vous, son jardin avait l'air sauvage. Que vouliez-vous dire exactement ?", "ok": true, "next": "n4", "react": ["james", "Wild? Well, yes, wonderfully wild! Like the meadows back home.", "Sauvage ? Eh bien oui, merveilleusement sauvage ! Comme les prairies de chez moi."]}, {"en": "James, I think there might have been a small misunderstanding about something you said yesterday.", "fr": "James, je crois qu'il y a peut-être eu un petit malentendu à propos de quelque chose que vous avez dit hier.", "ok": true, "next": "n4", "react": ["james", "Oh dear. Have I put my foot in it again?", "Oh là là. J'ai encore mis les pieds dans le plat ?"]}, {"en": "James, why were you so rude to Emma yesterday?", "fr": "James, pourquoi avez-vous été si impoli avec Emma hier ?", "ok": false, "tip": "C'est une accusation directe. Pour rester diplomate, posez une question ouverte : « What exactly did you mean? »."}], "open": {"model": ["James, could I ask you something? Emma was a little confused by what you said about her garden.", "James, puis-je vous demander quelque chose ? Emma a été un peu troublée par ce que vous avez dit de son jardin."], "next": "n4", "react": ["james", "Oh no. Please, tell me what I said.", "Oh non. Dites-moi, je vous en prie, ce que j'ai dit."]}}}, "n4": {"say": [["james", "In England, calling a garden wild is the highest compliment. It means it's natural and full of life, not neat and boring.", "En Angleterre, dire qu'un jardin est sauvage, c'est le plus beau des compliments. Ça veut dire qu'il est naturel et plein de vie, pas tiré au cordeau et ennuyeux."], ["james", "I'd never have said it if I'd known it sounded like a criticism. Emma, I'm terribly sorry.", "Je ne l'aurais jamais dit si j'avais su que ça sonnait comme une critique. Emma, je suis vraiment désolé."], ["emma", "Oh, James. If you'd explained that yesterday, I wouldn't have spent the whole night trimming the hedges!", "Oh, James. Si tu m'avais expliqué ça hier, je n'aurais pas passé toute la nuit à tailler les haies !"]], "ask": {"prompt": "Aidez-les à se réconcilier.", "options": [{"en": "So it was a compliment all along! It seems you two just speak slightly different kinds of English.", "fr": "Donc c'était un compliment depuis le début ! On dirait que vous deux, vous parlez simplement deux anglais un peu différents.", "ok": true, "next": "n5", "react": ["grace", "Two nations divided by a common language, as they say!", "Deux nations séparées par une langue commune, comme on dit !"]}, {"en": "You both had good intentions. Why don't we raise a glass to the wildest garden in Vermont?", "fr": "Vous aviez tous les deux de bonnes intentions. Et si on levait notre verre au jardin le plus sauvage du Vermont ?", "ok": true, "next": "n5", "react": ["emma", "Ha! Now that I'll drink to.", "Ha ! Ça, je veux bien trinquer à ça."]}, {"en": "Well, Emma, you should have trimmed the hedges anyway.", "fr": "Eh bien, Emma, vous auriez dû tailler les haies de toute façon.", "ok": false, "tip": "Ce n'est pas le moment de critiquer Emma ! Le but est d'apaiser la situation et de les rapprocher."}], "open": {"model": ["It sounds like it was just a misunderstanding. I'm so glad you've cleared the air.", "On dirait que ce n'était qu'un malentendu. Je suis vraiment contente que vous ayez dissipé le malaise."], "next": "n5", "react": ["james", "So am I. Thank you for playing peacemaker.", "Moi aussi. Merci d'avoir joué les médiatrices."]}}}, "n5": {"say": [["grace", "Honestly, this reminds me of when I first moved here and told everyone I'd bring a plate to a party.", "Franchement, ça me rappelle quand je suis arrivée ici et que j'ai dit à tout le monde que j'apporterais une assiette à une fête."], ["emma", "Wait, what does that mean in Australia?", "Attends, qu'est-ce que ça veut dire en Australie ?"], ["grace", "It means bring some food to share! They thought I meant an empty plate, so they'd set one aside for me. I turned up with a giant pavlova!", "Ça veut dire apporter quelque chose à manger à partager ! Ils ont cru que je parlais d'une assiette vide, alors ils m'en avaient mis une de côté. Je suis arrivée avec une pavlova géante !"]], "ask": {"prompt": "Réagissez à l'anecdote de Grace.", "options": [{"en": "That's hilarious! French and English have plenty of false friends that cause the same kind of confusion.", "fr": "C'est hilarant ! Le français et l'anglais ont plein de faux amis qui créent le même genre de confusion.", "ok": true, "next": "n6", "react": ["james", "Ah yes, false friends. I've fallen into that trap more than once.", "Ah oui, les faux amis. Je suis tombé dans ce piège plus d'une fois."]}, {"en": "That reminds me: French speakers often say eventually when they actually mean possibly.", "fr": "Ça me rappelle que les francophones disent souvent « eventually » alors qu'ils veulent dire « éventuellement », c'est-à-dire peut-être.", "ok": true, "next": "n7", "react": ["emma", "Really? That must cause all sorts of confusion!", "Vraiment ? Ça doit créer toutes sortes de confusions !"]}, {"en": "Yes, I have brought a plate yesterday.", "fr": "Oui, j'ai apporté une assiette hier.", "ok": false, "tip": "Avec « yesterday », il faut le prétérit (« I brought »). Et Grace raconte une anecdote : réagissez plutôt à son histoire."}], "open": {"model": ["That's so funny! Little language mix-ups can lead to such awkward moments.", "C'est trop drôle ! Les petites confusions de langue peuvent créer des moments tellement gênants."], "next": "n6", "react": ["grace", "Don't they just! But they always make the best stories.", "Ça, c'est sûr ! Mais ça donne toujours les meilleures histoires."]}}}, "n6": {"say": [["james", "My favourite is the French word sensible, which actually means sensitive. I once told a French lady she was very sensible, and she looked rather hurt.", "Mon préféré, c'est le mot français « sensible », qui veut dire « sensitive » en anglais. J'ai dit un jour à une Française qu'elle était très « sensible », au sens anglais de raisonnable, et elle a eu l'air plutôt blessée."], ["grace", "James, you really do have a gift for compliments that go wrong!", "James, tu as vraiment un don pour les compliments qui tournent mal !"]], "next": "n8"}, "n7": {"say": [["emma", "So if I say I'll eventually finish the hedges, a French person might think I'll never do it at all?", "Donc si je dis que je finirai « eventually » les haies, un Français pourrait croire que je ne le ferai peut-être jamais ?"], ["james", "Which, in your case, Emma, would now be perfectly acceptable.", "Ce qui, dans ton cas, Emma, serait désormais parfaitement acceptable."]], "next": "n8"}, "n8": {"say": [["emma", "Marie Line, thank you for being such a good diplomat today. I'd never have sorted this out without you.", "Marie Line, merci d'avoir été une si bonne diplomate aujourd'hui. Je n'aurais jamais réglé ça sans vous."]], "ask": {"prompt": "Répondez à Emma avec modestie.", "options": [{"en": "Not at all. I just happened to ask the right question at the right time.", "fr": "Pas du tout. J'ai simplement posé la bonne question au bon moment.", "ok": true, "next": "n9", "react": ["emma", "That's exactly what a good diplomat would say.", "C'est exactement ce que dirait une bonne diplomate."]}, {"en": "It was nothing, really. I'm just glad you two are friends again.", "fr": "Ce n'était rien, vraiment. Je suis juste contente que vous soyez à nouveau amis.", "ok": true, "next": "n9", "react": ["james", "We never stopped being friends. I simply stopped being clear!", "Nous n'avons jamais cessé d'être amis. J'ai simplement cessé d'être clair !"]}, {"en": "Yes, I know, I was perfect.", "fr": "Oui, je sais, j'ai été parfaite.", "ok": false, "tip": "Un peu prétentieux ! Avec modestie, on répond plutôt « Not at all » ou « It was nothing, really »."}], "open": {"model": ["Oh, it was nothing. You two would have worked it out on your own sooner or later.", "Oh, ce n'était rien. Vous auriez trouvé une solution tous les deux, tôt ou tard."], "next": "n9", "react": ["emma", "Maybe, but you made it so much easier. Thank you.", "Peut-être, mais vous avez rendu les choses tellement plus simples. Merci."]}}}, "n9": {"say": [["grace", "Right, enough drama for one afternoon. Who wants a slice of pavlova? I brought a full plate this time!", "Bon, assez d'émotions pour un après-midi. Qui veut une part de pavlova ? Cette fois, j'ai apporté une assiette bien pleine !"], ["james", "And I promise to keep my gardening opinions to myself for the rest of the day.", "Et je promets de garder mes avis sur le jardinage pour moi pendant le reste de la journée."], ["emma", "Oh no, James. Please, do tell me more about how wild my garden is!", "Oh non, James. Je t'en prie, dis-m'en plus sur mon jardin si sauvage !"]], "end": true}}, "quiz": [{"q": "Qu'est-ce que James a dit du jardin d'Emma ?", "opts": ["Qu'il était trop petit", "Qu'il avait l'air plutôt sauvage", "Qu'il manquait de fleurs"], "a": 1}, {"q": "Qu'est-ce qu'Emma a fait pendant toute la nuit ?", "opts": ["Elle a taillé les haies", "Elle a préparé un gâteau", "Elle a lu un livre de jardinage"], "a": 0}, {"q": "En Australie, que veut dire « bring a plate » ?", "opts": ["Apporter une assiette vide", "Faire la vaisselle", "Apporter quelque chose à manger à partager"], "a": 2}]}, {"id": "s4-memories", "level": 4, "title": "Souvenirs et regrets autour d'un thé", "setting": "livingroom", "cast": ["james", "emma"], "intro": "Un après-midi pluvieux chez James. Emma et vous êtes invitées à prendre le thé. James a ressorti de vieilles photos, et la conversation devient plus personnelle.", "start": "n1", "nodes": {"n1": {"say": [["james", "There we are, a proper pot of Earl Grey. You'll have to forgive the chipped cups; they belonged to my mother.", "Et voilà, une vraie théière d'Earl Grey. Il faudra me pardonner les tasses ébréchées : elles appartenaient à ma mère."], ["emma", "Oh, I love them. They have so much more character than mine.", "Oh, je les adore. Elles ont tellement plus de caractère que les miennes."], ["james", "I was going through old photographs this morning, Marie Line, and it got me thinking about the paths we choose in life.", "J'ai trié de vieilles photos ce matin, Marie Line, et ça m'a fait réfléchir aux chemins que l'on choisit dans la vie."]], "ask": {"prompt": "Répondez à James et encouragez-le à continuer.", "options": [{"en": "Old photographs always bring back so many memories. What did you find?", "fr": "Les vieilles photos font toujours remonter tant de souvenirs. Qu'avez-vous trouvé ?", "ok": true, "next": "n2", "react": ["james", "Oh, all sorts of things. Mostly some very regrettable haircuts.", "Oh, toutes sortes de choses. Surtout des coupes de cheveux très regrettables."]}, {"en": "That sounds like a lovely way to spend a rainy morning. Please, tell us more.", "fr": "Ça me semble une belle façon de passer une matinée pluvieuse. Racontez-nous, je vous en prie.", "ok": true, "next": "n2", "react": ["emma", "Yes, James, don't leave us in suspense!", "Oui, James, ne nous laisse pas sur notre faim !"]}, {"en": "I don't like old things, they're boring.", "fr": "Je n'aime pas les vieilles choses, c'est ennuyeux.", "ok": false, "tip": "C'est un peu sec, surtout devant les tasses de sa mère ! Montrez de l'intérêt pour ce qu'il raconte."}], "open": {"model": ["How lovely. Looking at old photos always makes me feel a little nostalgic.", "Comme c'est joli. Regarder de vieilles photos me rend toujours un peu nostalgique."], "next": "n2", "react": ["james", "Nostalgic is exactly the right word. Thank you.", "Nostalgique, c'est exactement le mot. Merci."]}}}, "n2": {"say": [["james", "I found a photo of myself at twenty-two, just before I started teaching. I'd been offered a job in Canada, you see, but I turned it down.", "J'ai trouvé une photo de moi à vingt-deux ans, juste avant de commencer à enseigner. On m'avait proposé un poste au Canada, voyez-vous, mais je l'ai refusé."], ["james", "If I'd taken it, I would never have met my wife, and I certainly wouldn't be sitting here with you two today.", "Si je l'avais accepté, je n'aurais jamais rencontré ma femme, et je ne serais certainement pas assis ici avec vous deux aujourd'hui."], ["emma", "Funny how life works out, isn't it? One decision, and everything changes.", "C'est drôle comme la vie s'arrange, non ? Une seule décision, et tout change."]], "ask": {"prompt": "Réagissez à l'histoire de James.", "options": [{"en": "That's fascinating. Do you ever wish you had gone to Canada after all?", "fr": "C'est fascinant. Vous arrive-t-il de regretter de ne pas être parti au Canada ?", "ok": true, "next": "n3", "react": ["james", "Now and then, but only for about five minutes at a time.", "De temps en temps, mais seulement cinq minutes à chaque fois."]}, {"en": "It sounds as though you made the right choice in the end.", "fr": "On dirait que vous avez fait le bon choix, finalement.", "ok": true, "next": "n3", "react": ["james", "I believe I did, though of course I'll never know for certain.", "Je le crois, même si bien sûr, je ne le saurai jamais avec certitude."]}, {"en": "If you would have taken it, you will meet your wife.", "fr": "Si vous l'auriez accepté, vous rencontrerez votre femme.", "ok": false, "tip": "Le « third conditional » se construit ainsi : « If you had taken it, you would have... ». Jamais de « would » juste après « if »."}], "open": {"model": ["Life is full of surprises. If you hadn't stayed, everything would have been different.", "La vie est pleine de surprises. Si vous n'étiez pas resté, tout aurait été différent."], "next": "n3", "react": ["emma", "That's so true. It's a little dizzying to think about, isn't it?", "C'est tellement vrai. Ça donne un peu le vertige quand on y pense, non ?"]}}}, "n3": {"say": [["emma", "What about you, Marie Line? Was there a moment in your life when things could have turned out completely differently?", "Et vous, Marie Line ? Y a-t-il eu un moment dans votre vie où les choses auraient pu tourner complètement autrement ?"]], "ask": {"prompt": "Parlez d'un tournant de votre vie (avec « If I hadn't... »).", "options": [{"en": "If my daughter hadn't moved to Vermont, I would never have discovered this beautiful part of the world.", "fr": "Si ma fille ne s'était pas installée dans le Vermont, je n'aurais jamais découvert ce beau coin du monde.", "ok": true, "next": "n4", "react": ["emma", "And we would never have met you! Thank goodness she did.", "Et nous ne vous aurions jamais rencontrée ! Heureusement qu'elle l'a fait."]}, {"en": "If I hadn't decided to learn English, I wouldn't be having this conversation with you today.", "fr": "Si je n'avais pas décidé d'apprendre l'anglais, je ne serais pas en train de discuter avec vous aujourd'hui.", "ok": true, "next": "n4", "react": ["james", "Then we're both extremely grateful for that decision.", "Alors nous vous sommes tous les deux extrêmement reconnaissants de cette décision."]}, {"en": "If I didn't moved, I will not discover Vermont.", "fr": "Si je n'ai pas déménagé, je ne découvrirai pas le Vermont.", "ok": false, "tip": "Pour imaginer un passé différent : « If I hadn't..., I would never have... ». Ici, les temps ne correspondent pas."}], "open": {"model": ["If I had made different choices when I was young, my life would have been very different, but I'm happy with the way it turned out.", "Si j'avais fait d'autres choix quand j'étais jeune, ma vie aurait été très différente, mais je suis heureuse de la façon dont elle a tourné."], "next": "n4", "react": ["james", "That's a wonderfully wise way of looking at it.", "C'est une façon merveilleusement sage de voir les choses."]}}}, "n4": {"say": [["james", "And regrets? I firmly believe it's never too late, but I do have one or two.", "Et les regrets ? Je suis convaincu qu'il n'est jamais trop tard, mais j'en ai bien un ou deux."], ["james", "I wish I had learned to play the piano. My mother tried to teach me, but I was far too busy climbing trees.", "J'aurais aimé apprendre le piano. Ma mère a essayé de m'apprendre, mais j'étais bien trop occupé à grimper aux arbres."], ["emma", "As for me, I wish I'd travelled more when I was younger. I kept thinking there would be time later.", "Moi, j'aurais aimé voyager davantage quand j'étais plus jeune. Je me disais toujours qu'il y aurait du temps plus tard."]], "ask": {"prompt": "Exprimez un regret avec « I wish I had... ».", "options": [{"en": "I wish I had started learning English much earlier. It would have made my visits so much easier.", "fr": "J'aurais aimé commencer l'anglais bien plus tôt. Ça m'aurait tellement facilité mes séjours.", "ok": true, "next": "n5", "react": ["emma", "Well, you're doing beautifully now. Better late than never!", "En tout cas, vous vous débrouillez à merveille maintenant. Mieux vaut tard que jamais !"]}, {"en": "I wish I had kept a diary when I was younger. I've forgotten so many little things.", "fr": "J'aurais aimé tenir un journal quand j'étais plus jeune. J'ai oublié tant de petites choses.", "ok": true, "next": "n6", "react": ["james", "A diary! What a good idea. I'd love to read mine now, if only I'd ever written one.", "Un journal ! Quelle bonne idée. J'adorerais relire le mien aujourd'hui, si seulement j'en avais tenu un."]}, {"en": "I wish I learn the piano tomorrow.", "fr": "Je souhaite que j'apprends le piano demain.", "ok": false, "tip": "Pour un regret sur le passé : « I wish I had learned... ». Pour un souhait sur le présent : « I wish I could... ». « Tomorrow » ne convient pas ici."}], "open": {"model": ["I wish I had spent more time with my grandparents when I was a child.", "J'aurais aimé passer plus de temps avec mes grands-parents quand j'étais enfant.
