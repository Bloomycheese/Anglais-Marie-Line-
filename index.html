"], "next": "n5", "react": ["emma", "That's a feeling so many of us share. Thank you for telling us.", "C'est un sentiment que beaucoup d'entre nous partagent. Merci de nous l'avoir confié."]}}}, "n5": {"say": [["james", "You know, they say the best time to plant a tree was twenty years ago, and the second best time is now.", "Vous savez, on dit que le meilleur moment pour planter un arbre, c'était il y a vingt ans, et que le deuxième meilleur moment, c'est maintenant."], ["emma", "Which is exactly why I've signed James up for piano lessons. He starts on Tuesday.", "C'est exactement pour ça que j'ai inscrit James à des cours de piano. Il commence mardi."], ["james", "You've done what?", "Tu as fait quoi ?"]], "next": "n7"}, "n6": {"say": [["emma", "It's not too late to start one, you know. You could write about your visits to Vermont.", "Il n'est pas trop tard pour en commencer un, vous savez. Vous pourriez écrire sur vos séjours dans le Vermont."], ["james", "In which case, I would very much like to be mentioned, preferably as charming and witty.", "Auquel cas, j'aimerais beaucoup y figurer, de préférence sous les traits d'un homme charmant et plein d'esprit."]], "next": "n7"}, "n7": {"say": [["emma", "Let's play a little game. If you could go back and give your younger self one piece of advice, what would it be?", "Faisons un petit jeu. Si vous pouviez remonter le temps et donner un seul conseil à votre « moi » plus jeune, ce serait lequel ?"], ["james", "Mine is simple: stop worrying so much, James, because most of it never happens.", "Le mien est simple : arrête de t'inquiéter autant, James, parce que la plupart de ces choses n'arrivent jamais."]], "ask": {"prompt": "Donnez un conseil à votre « moi » plus jeune (avec « If I could... »).", "options": [{"en": "If I could talk to my younger self, I'd tell her to be braver and to say yes more often.", "fr": "Si je pouvais parler à la jeune femme que j'étais, je lui dirais d'être plus courageuse et de dire oui plus souvent.", "ok": true, "next": "n8", "react": ["james", "Splendid advice. I may well borrow that.", "Excellent conseil. Je vais peut-être vous l'emprunter."]}, {"en": "I'd tell her to enjoy every moment, because the years go by much faster than you think.", "fr": "Je lui dirais de profiter de chaque instant, parce que les années passent bien plus vite qu'on ne le croit.", "ok": true, "next": "n8", "react": ["emma", "Oh, that's so true. It feels like only yesterday I was twenty.", "Oh, c'est tellement vrai. J'ai l'impression d'avoir eu vingt ans hier."]}, {"en": "If I can talk to my younger self, I told her to relax.", "fr": "Si je peux parler à mon moi plus jeune, je lui ai dit de se détendre.", "ok": false, "tip": "Pour une situation imaginaire : « If I could talk..., I would tell her... ». Les deux parties doivent aller ensemble."}], "open": {"model": ["If I could go back, I would tell myself not to take life quite so seriously.", "Si je pouvais revenir en arrière, je me dirais de ne pas prendre la vie autant au sérieux."], "next": "n8", "react": ["james", "Wise words indeed. I'll drink to that, with tea, naturally.", "Sages paroles, vraiment. Je lève ma tasse à cela, de thé, naturellement."]}}}, "n8": {"say": [["james", "Well, this has turned into a rather philosophical afternoon. My tea's gone cold, which is a small tragedy of its own.", "Eh bien, cet après-midi est devenu plutôt philosophique. Mon thé a refroidi, ce qui est une petite tragédie en soi."], ["emma", "I'll make a fresh pot. We've still got plenty of memories left to share.", "Je refais du thé. Il nous reste encore plein de souvenirs à partager."], ["james", "Marie Line, would you join us again next week? I'd love to hear more of your stories.", "Marie Line, voulez-vous revenir la semaine prochaine ? J'aimerais beaucoup entendre d'autres de vos histoires."]], "ask": {"prompt": "Acceptez l'invitation de James.", "options": [{"en": "I'd be delighted. Next time, I'll bring some old photographs of my own.", "fr": "Avec grand plaisir. La prochaine fois, j'apporterai quelques-unes de mes vieilles photos.", "ok": true, "next": "n9", "react": ["james", "Wonderful. I'll hide the ones with my dreadful haircuts.", "Merveilleux. Je cacherai celles avec mes affreuses coupes de cheveux."]}, {"en": "I'd love to, as long as you promise to play us a little piano piece one day!", "fr": "Avec plaisir, à condition que vous promettiez de nous jouer un petit morceau de piano un jour !", "ok": true, "next": "n9", "react": ["emma", "Ha! Now that's what I call motivation, James.", "Ha ! Voilà ce que j'appelle de la motivation, James."]}, {"en": "No, thank you, I wish I had gone.", "fr": "Non merci, j'aurais aimé y être allée.", "ok": false, "tip": "Ce « I wish » n'a pas de sens ici. James vous invite : acceptez simplement, par exemple « I'd be delighted »."}], "open": {"model": ["That would be lovely. Thank you both for such a special afternoon.", "Ce serait très agréable. Merci à vous deux pour cet après-midi si particulier."], "next": "n9", "react": ["james", "The pleasure was entirely ours, my dear.", "Tout le plaisir était pour nous, ma chère."]}}}, "n9": {"say": [["james", "Then it's settled. Same time next week, same chipped cups.", "Alors c'est entendu. Même heure la semaine prochaine, mêmes tasses ébréchées."], ["emma", "And maybe, just maybe, a little piano music.", "Et peut-être, qui sait, un peu de piano."]], "end": true}}, "quiz": [{"q": "À qui appartenaient les tasses de James ?", "opts": ["À sa grand-mère", "À sa mère", "À sa femme"], "a": 1}, {"q": "Où James aurait-il pu partir travailler à vingt-deux ans ?", "opts": ["Au Canada", "En Australie", "À Londres"], "a": 0}, {"q": "Quel est le regret d'Emma ?", "opts": ["Ne pas avoir appris le piano", "Ne pas avoir tenu de journal", "Ne pas avoir assez voyagé"], "a": 2}]}, {"id": "s4-surprise", "level": 4, "title": "Une fête surprise pour Emma", "setting": "videocall", "cast": ["grace", "james"], "intro": "Appel vidéo secret, un soir, avec Grace et James. L'anniversaire d'Emma approche, et vous préparez tous les trois une fête surprise. Surtout, pas un mot à Emma !", "start": "n1", "nodes": {"n1": {"say": [["grace", "Can everyone hear me? James, I think you've frozen. Oh no, wait, that's just your face.", "Tout le monde m'entend ? James, je crois que ton image est figée. Ah non, pardon, c'est juste ta tête."], ["james", "Very amusing, Grace. Good evening, Marie Line. I trust Emma has no idea we're having this little meeting?", "Très drôle, Grace. Bonsoir, Marie Line. J'imagine qu'Emma ne se doute pas de notre petite réunion ?"]], "ask": {"prompt": "Rassurez James : Emma ne se doute de rien.", "options": [{"en": "Don't worry, she has no idea. She told me she was going to bed early tonight.", "fr": "Ne vous inquiétez pas, elle ne se doute de rien. Elle m'a dit qu'elle se coucherait tôt ce soir.", "ok": true, "next": "n2", "react": ["grace", "Perfect. Our secret is safe, then.", "Parfait. Notre secret est bien gardé, alors."]}, {"en": "Not a clue. She said she'd be busy baking for the church sale all evening.", "fr": "Pas la moindre idée. Elle a dit qu'elle passerait la soirée à faire des gâteaux pour la vente de la paroisse.", "ok": true, "next": "n2", "react": ["james", "Excellent. Nothing distracts Emma quite like a cake in the oven.", "Excellent. Rien ne distrait autant Emma qu'un gâteau au four."]}, {"en": "Yes, I told Emma everything this morning.", "fr": "Oui, j'ai tout raconté à Emma ce matin.", "ok": false, "tip": "Oups ! Ce serait vendre la mèche. C'est une fête surprise : rassurez James en disant qu'Emma ne sait rien."}], "open": {"model": ["Don't worry, I haven't said a word, and she doesn't suspect a thing.", "Ne vous inquiétez pas, je n'ai rien dit, et elle ne se doute de rien."], "next": "n2", "react": ["grace", "Brilliant. Let's keep it that way!", "Génial. Continuons comme ça !"]}}}, "n2": {"say": [["grace", "Right, so Emma turns sixty-three on Saturday the twelfth. I was thinking we could have the party at the café, straight after book club.", "Bon, alors Emma va avoir soixante-trois ans le samedi douze. Je me disais qu'on pourrait faire la fête au café, juste après le club de lecture."], ["james", "Or we could hold it in my garden, if the weather is kind. Although in Vermont at this time of year, that's rather a big if.", "Ou bien on pourrait la faire dans mon jardin, si le temps le permet. Mais dans le Vermont à cette période de l'année, c'est un grand « si »."]], "ask": {"prompt": "Donnez votre avis sur le lieu de la fête, en nuançant.", "options": [{"en": "To be honest, the café seems safer. If it rains, we won't have to worry about anything.", "fr": "Pour être honnête, le café me semble plus sûr. S'il pleut, on n'aura à s'inquiéter de rien.", "ok": true, "next": "n3", "react": ["grace", "My thoughts exactly. And they make a fantastic carrot cake.", "C'est exactement ce que je pense. Et ils font un gâteau aux carottes fantastique."]}, {"en": "James's garden would be lovely, but perhaps we could put up a tent, just in case.", "fr": "Le jardin de James serait charmant, mais on pourrait peut-être monter une tente, au cas où.", "ok": true, "next": "n4", "react": ["james", "A tent! Now why didn't I think of that? You're a genius, Marie Line.", "Une tente ! Comment n'y ai-je pas pensé ? Vous êtes un génie, Marie Line."]}, {"en": "If it would rain, we will be wet.", "fr": "S'il pleuvrait, nous serons mouillés.", "ok": false, "tip": "Avec « if », pas de « would » : « If it rains, we'll get wet ». Et surtout, donnez votre avis sur le lieu."}], "open": {"model": ["I think the café would be ideal, because Emma loves it and it's nice and warm inside.", "Je pense que le café serait idéal, parce qu'Emma l'adore et qu'il y fait bien chaud."], "next": "n3", "react": ["grace", "Good thinking. That's settled, then: the café it is!", "Bien vu. C'est décidé, alors : ce sera le café !"]}}}, "n3": {"say": [["grace", "Okay, café it is. I'll have a quiet word with the owner and ask if we can use the back room.", "Bon, va pour le café. Je vais en toucher un mot discrètement au patron et demander si on peut avoir l'arrière-salle."], ["james", "And we must make absolutely sure Emma doesn't find out. Grace, you're hopeless at keeping secrets.", "Et il faut absolument qu'Emma ne l'apprenne pas. Grace, tu es incapable de garder un secret."], ["grace", "That was one time! How was I supposed to know your son's engagement was a secret?", "C'est arrivé une seule fois ! Comment j'étais censée savoir que les fiançailles de ton fils étaient un secret ?"]], "next": "n5"}, "n4": {"say": [["james", "I'll speak to my son. He has a big white tent from his wedding, gathering dust in his garage.", "Je vais en parler à mon fils. Il a une grande tente blanche de son mariage qui prend la poussière dans son garage."], ["grace", "Perfect. And if it's sunny, we'll just roll up the sides. Easy as pie.", "Parfait. Et s'il fait beau, on n'aura qu'à relever les côtés. Simple comme bonjour."]], "next": "n5"}, "n5": {"say": [["grace", "Now, the tricky part: how do we get Emma there without her suspecting anything? Marie Line, any bright ideas?", "Maintenant, le plus délicat : comment l'amener là-bas sans qu'elle se doute de quoi que ce soit ? Marie Line, une idée lumineuse ?"]], "ask": {"prompt": "Proposez une ruse pour amener Emma à la fête.", "options": [{"en": "I could invite her for a quiet cup of tea, and then casually lead her to the party.", "fr": "Je pourrais l'inviter à prendre tranquillement un thé, puis l'emmener l'air de rien jusqu'à la fête.", "ok": true, "next": "n6", "react": ["james", "Cunning! She'd never suspect you, Marie Line. You have such an innocent face.", "Rusé ! Elle ne se méfierait jamais de vous, Marie Line. Vous avez un visage si innocent."]}, {"en": "What if I asked her to help me choose a present for my daughter, and we stopped there on the way?", "fr": "Et si je lui demandais de m'aider à choisir un cadeau pour ma fille, et qu'on s'arrêtait là-bas en chemin ?", "ok": true, "next": "n6", "react": ["grace", "Ha! Sneaky but brilliant. She can never say no to a shopping trip.", "Ha ! Sournois mais génial. Elle ne peut jamais refuser une séance de shopping."]}, {"en": "We could simply tell Emma about the surprise party.", "fr": "On pourrait tout simplement parler de la fête surprise à Emma.", "ok": false, "tip": "Ce ne serait plus une surprise ! Proposez plutôt une ruse pour l'emmener sans qu'elle se doute de rien."}], "open": {"model": ["I'll tell her I've found a lovely new tea shop, and I'll bring her there at the right time.", "Je lui dirai que j'ai trouvé un nouveau salon de thé charmant, et je l'y emmènerai au bon moment."], "next": "n6", "react": ["james", "Ingenious. I knew we could count on you.", "Ingénieux. Je savais qu'on pouvait compter sur vous."]}}}, "n6": {"say": [["james", "Now, presents. Emma once told me she had always wanted a proper rose bush, an old English variety.", "Passons aux cadeaux. Emma m'a dit un jour qu'elle avait toujours rêvé d'un vrai rosier, une vieille variété anglaise."], ["grace", "And last month she said her gardening gloves were falling apart. I've seen them, and they really are.", "Et le mois dernier, elle a dit que ses gants de jardinage tombaient en morceaux. Je les ai vus, et c'est vrai."]], "ask": {"prompt": "Proposez une idée de cadeau ou rapportez ce qu'Emma vous a dit (discours indirect).", "options": [{"en": "Emma told me she'd love a new cookbook, because she's tried every recipe in hers.", "fr": "Emma m'a dit qu'elle adorerait un nouveau livre de cuisine, parce qu'elle a essayé toutes les recettes du sien.", "ok": true, "next": "n7", "react": ["grace", "Ooh, that's a great idea. We could all write a little message inside.", "Oh, excellente idée. On pourrait tous écrire un petit mot à l'intérieur."]}, {"en": "Why don't we put everything together in one big garden basket: the rose bush, the gloves and some seeds?", "fr": "Et si on mettait tout ensemble dans un grand panier de jardinage : le rosier, les gants et quelques graines ?", "ok": true, "next": "n7", "react": ["james", "Splendid. A joint present it is, then.", "Magnifique. Ce sera donc un cadeau commun."]}, {"en": "Emma said me that she want a rose.", "fr": "Emma m'a dit qu'elle veut une rose.", "ok": false, "tip": "Au discours indirect, on dit « Emma told me (that) she wanted... ». On ne dit pas « said me », et le verbe recule dans le passé (want devient wanted)."}], "open": {"model": ["She mentioned that she wanted to try painting, so maybe we could give her some watercolours.", "Elle m'a dit qu'elle aimerait essayer la peinture, alors on pourrait peut-être lui offrir des aquarelles."], "next": "n7", "react": ["grace", "Lovely idea. I'll add it to the list.", "Jolie idée. Je l'ajoute à la liste."]}}}, "n7": {"say": [["grace", "Right, what about the cake? Emma normally bakes for everyone, so for once somebody else has to do it.", "Bon, et le gâteau ? D'habitude, c'est Emma qui fait les gâteaux pour tout le monde, alors pour une fois, il faut que quelqu'un d'autre s'en charge."], ["james", "Don't look at me. The last cake I made could have been used as a doorstop.", "Ne me regardez pas. Le dernier gâteau que j'ai fait aurait pu servir de cale-porte."]], "ask": {"prompt": "Proposez votre aide pour le gâteau.", "options": [{"en": "I'd be happy to make a French apple tart, if you think she'd like that.", "fr": "Je ferais volontiers une tarte aux pommes à la française, si vous pensez que ça lui plairait.", "ok": true, "next": "n8", "react": ["grace", "Are you kidding? She'll love it. You've saved the day again!", "Vous plaisantez ? Elle va adorer. Vous nous sauvez encore la mise !"]}, {"en": "I'm not much of a baker, but I could order one from the bakery on Main Street.", "fr": "Je ne suis pas très douée en pâtisserie, mais je pourrais en commander un à la boulangerie de la rue principale.", "ok": true, "next": "n8", "react": ["james", "Very sensible. No doorstops required.", "Très raisonnable. Pas besoin de cale-porte."]}, {"en": "I have baked the cake when I will arrive.", "fr": "J'ai fait le gâteau quand j'arriverai.", "ok": false, "tip": "Les temps se mélangent. Pour proposer votre aide : « I'd be happy to make... » ou « I could order... »."}], "open": {"model": ["Leave the cake to me. I'll make something special, and it will be a surprise for you too.", "Laissez-moi m'occuper du gâteau. Je ferai quelque chose de spécial, et ce sera une surprise pour vous aussi."], "next": "n8", "react": ["grace", "Ooh, how mysterious! I love it.", "Oh, que de mystère ! J'adore."]}}}, "n8": {"say": [["grace", "Okay, let me sum up so nobody gets confused: Saturday the twelfth, the venue is sorted, Marie Line brings Emma, presents and cake are covered.", "Bon, je résume pour que personne ne s'embrouille : samedi douze, le lieu est réglé, Marie Line amène Emma, les cadeaux et le gâteau sont prévus."], ["james", "And above all, nobody lets the cat out of the bag. Especially you, Grace.", "Et surtout, personne ne vend la mèche. Toi en particulier, Grace."], ["grace", "My lips are sealed! Good night, you two, and remember: not a word to Emma!", "Motus et bouche cousue ! Bonne nuit à tous les deux, et n'oubliez pas : pas un mot à Emma !"]], "end": true}}, "quiz": [{"q": "Quel âge Emma va-t-elle avoir ?", "opts": ["Soixante-deux ans", "Soixante-trois ans", "Soixante-dix ans"], "a": 1}, {"q": "Pourquoi James hésite-t-il à faire la fête dans son jardin ?", "opts": ["Son jardin est trop petit", "Il n'aime pas les fêtes", "Le temps est incertain à cette période"], "a": 2}, {"q": "Qu'est-ce qui ne va pas avec les gants de jardinage d'Emma ?", "opts": ["Ils tombent en morceaux", "Ils sont trop petits", "Elle les a perdus"], "a": 0}]}];

const KEY='mlAnglais.v3';const DAY=864e5;
const DEF={v:3,onboarded:false,level:2,xp:0,streak:0,best:0,last:'',days:{},m:{},scenes:{},cert:{},exams:{},settings:{voice:'',rate:1,size:1,trans:'auto',sfx:true,goal:50,autoplay:true}};
let S=JSON.parse(JSON.stringify(DEF));
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r);S={...S,...o,settings:{...S.settings,...(o.settings||{})}};return}
    const old=localStorage.getItem('mlAnglais.v2')||localStorage.getItem('mlAnglais.v1');
    if(old){const o=JSON.parse(old);S.xp=o.xp||0;S.streak=o.streak||0;S.best=o.streak||0;S.last=o.last||'';
      Object.entries(o.str||{}).forEach(([k,v])=>{const nk=k.startsWith('v:')?'w:'+k.slice(2):'p:'+k;if(ITEMS[nk])S.m[nk]={s:v,due:Date.now(),n:1,ok:v}});
      if(o.settings){S.settings.voice=o.settings.voice||'';S.settings.size=o.settings.size||1}}
  }catch(e){}
}
load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toLocaleDateString('en-CA');
const INTERVAL=[0,1,2,4,8,16,35];
const mem=it=>S.m[it.k];
const strength=it=>(S.m[it.k]||{}).s||0;
const seen=it=>!!S.m[it.k];
const isDue=it=>{const m=S.m[it.k];return m&&m.due<=Date.now()};
function rate(it,good){
  const m=S.m[it.k]||{s:0,due:0,n:0,ok:0};m.n++;
  if(good){m.ok++;m.s=Math.min(6,m.s+1);m.due=Date.now()+INTERVAL[m.s]*DAY-3600e3}
  else{m.s=Math.max(0,m.s-2);m.due=Date.now()+10*60e3}

}

const NUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','20':'twenty','30':'thirty','50':'fifty','100':'one hundred'};
const CONTR={"i'm":"i am","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","wouldn't":"would not","couldn't":"could not","shouldn't":"should not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","hadn't":"had not","it's":"it is","that's":"that is","what's":"what is","there's":"there is","here's":"here is","who's":"who is","let's":"let us","i'll":"i will","you'll":"you will","we'll":"we will","they'll":"they will","she'll":"she will","he'll":"he will","i'd":"i would","you'd":"you would","we'd":"we would","i've":"i have","you've":"you have","we've":"we have","they've":"they have","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","ok":"okay","mr":"mister","mrs":"missus"};
function toks(s){
  return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:"()«»…]/g,' ').split(/\s+/).filter(Boolean)
    .flatMap(w=>(CONTR[w]||NUMW[w]||w).split(' ')).map(w=>w.replace(/'s$/,'').replace(/'/g,''));
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function checkTyped(ans,accepted){
  const a=toks(ans).join(' ');if(!a)return {ok:false};
  let bestD=1e9,bestT='';
  accepted.forEach(t=>{const b=toks(t).join(' ');const d=lev(a,b);if(d<bestD){bestD=d;bestT=t}});
  const L=toks(bestT).join(' ').length;
  if(bestD===0)return {ok:true,exact:true};
  if(bestD<=Math.max(1,Math.floor(L/14)))return {ok:true,typo:true,target:bestT};
  return {ok:false,target:accepted[0]};
}
function similarity(said,target){
  const a=toks(said),b=toks(target);if(!b.length||!a.length)return 0;
  const bag={};a.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;
  b.forEach(w=>{if(bag[w]){hit++;bag[w]--}else if(w.length>3&&Object.keys(bag).some(x=>bag[x]>0&&lev(x,w)<=1)){hit+=.8}});
  return hit/Math.max(b.length,a.length*0.85);
}
const best=(alts,target)=>alts.reduce((m,a)=>{const s=similarity(a,target);return s>m.s?{s,a}:m},{s:0,a:alts[0]||''});

const MALE=/\b(daniel|tom|evan|nathan|guy|ryan|oliver|alex|fred|arthur|aaron|reed|rocko|eddy|ralph|brian|andrew|christopher|eric|roger|william|george|thomas|gordon|lee|james|male|man)\b/i;

function vScore(v){let s=0;const n=v.name||'';
  if(/natural|neural/i.test(n))s+=100; if(/premium/i.test(n))s+=95; if(/enhanced|améliorée|amélioré/i.test(n))s+=80;
  if(/online|network/i.test(n))s+=30; if(/google/i.test(n))s+=45;
  if(/compact/i.test(n))s-=40; if(/espeak|festival|pico/i.test(n))s-=200;
  if(/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical)\b/i.test(n))s-=1000;
  if(/^(fred|junior|ralph|kathy|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i.test(n))s-=30;
  if(v.localService===false)s+=5; return s}
const langOf=v=>(v.lang||'').replace('_','-').toLowerCase();
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang||''));
  if(!vs.length)return;
  VOICES=vs.map(v=>({v,s:vScore(v)+(langOf(v)==='en-us'?6:0)})).sort((a,b)=>b.s-a.s);
  VOICE=(VOICES.find(x=>x.v.name===S.settings.voice)||VOICES[0]).v;
  const used=new Set();
  ['james','emma','grace'].forEach(id=>{
    const p=AV[id];const want=p.lang.toLowerCase();const gre=p.g==='m'?MALE:FEMALE;
    const cands=VOICES.filter(x=>!used.has(x.v.name));
    const pickV=cands.find(x=>langOf(x.v)===want&&gre.test(x.v.name))||cands.find(x=>langOf(x.v)===want)||cands.find(x=>gre.test(x.v.name))||cands[0]||VOICES[0];
    p.voice=pickV.v;used.add(pickV.v.name);

  });

function slowChunks(text){
  const out=[];text.split(/(?<=[,.;:!?])\s+/).forEach(cl=>{const w=cl.split(/\s+/).filter(Boolean);const n=w.length<=4?1:w.length<=8?2:3;for(let i=0;i<w.length;i+=n)out.push(w.slice(i,i+n).join(' '))});
  return out.length?out:[text];
}
function levelRate(){const n=(route==='scene'&&P)?P.sc.level:S.level;return [0,.82,.9,.96,1][n]||.9}
/* speak(text,{slow,who,onstart,onend}) : robuste sur Android (attente après cancel, découpage lent, chien de garde) */
function speak(text,o={}){
  const tok=++speakToken;
  if(!('speechSynthesis' in window)){toast('Cette tablette ne peut pas lire le texte à voix haute.');setTimeout(()=>o.onend&&o.onend(),600);return}
  try{speechSynthesis.cancel()}catch(e){}
  const parts=o.slow?slowChunks(text):[text];const prof=o.who?AV[o.who]:null;let i=0;
  const step=()=>{
    if(tok!==speakToken)return;
    if(i>=parts.length){o.onend&&o.onend();return}
    const t=parts[i++];let done=false,wd;
    const fin=()=>{if(done)return;done=true;clearTimeout(wd);if(tok!==speakToken)return;setTimeout(step,o.slow?380:20)};
    try{
      const u=new SpeechSynthesisUtterance(t);
      const v=prof?prof.voice:VOICE;if(v){u.voice=v;u.lang=v.lang}else u.lang=prof?prof.lang:'en-US';
      const base=(Number(S.settings.rate)||1)*(prof?prof.rate:1)*levelRate();
      u.rate=Math.max(.5,Math.min(1.4,o.slow?base*.82:base));u.pitch=prof?(prof.pitchUse||prof.pitch):1;
      u.onstart=()=>{o.onstart&&o.onstart(t)};u.onend=fin;u.onerror=fin;
      wd=setTimeout(fin,2600+t.length*120/u.rate);
      try{speechSynthesis.resume()}catch(e){}
      speechSynthesis.speak(u);
    }catch(e){wd=setTimeout(fin,600)}
  };
  setTimeout(step,120);
}

   Microphone (reconnaissance vocale) avec diagnostic
   ========================================================= */
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
const isSamsungBrowser=/SamsungBrowser/i.test(navigator.userAgent);
let micDenied=false,micBusy=false,recog=null;
function micState(){
  if(!SRClass)return isSamsungBrowser?'samsung':'unsupported';
  if(/^(file|content):/.test(location.protocol))return 'file';
  if(window.isSecureContext===false)return 'insecure';
  if(micDenied)return 'denied';
  return 'ok';
}
const MIC_MSG={
 samsung:'Le navigateur Samsung Internet ne sait pas écouter la voix. Ouvrez l\'application avec Google Chrome pour utiliser le micro.',
 unsupported:'Ce navigateur ne sait pas écouter la voix. Utilisez Google Chrome.',
 file:'L\'application est ouverte comme un simple fichier : le micro ne peut pas fonctionner ainsi. Ouvrez-la depuis son adresse Internet (https://…) puis installez-la.',
 insecure:'Le micro ne fonctionne que sur une adresse sécurisée (https://).',
 denied:'Le micro est bloqué. Dans Chrome, touchez le cadenas à côté de l\'adresse, puis Autorisations, puis Micro : Autoriser.',
 ok:'Le micro est prêt.'
};
const micOK=()=>micState()==='ok';
/* listen(onFinal, {onInterim}) : affiche le texte en direct, s'arrête seul après un silence */
function listen(onFinal,opt={}){
  const st=micState();if(st!=='ok'){toast(MIC_MSG[st],6000);return}
  if(micBusy){try{recog.stop()}catch(e){}return}
  hush();
  setTimeout(()=>{
    try{
      recog=new SRClass();recog.lang='en-US';recog.interimResults=true;recog.continuous=false;recog.maxAlternatives=5;
      let finals=[],interim='',gotFinal=false,errored=false;
      recog.onresult=e=>{
        interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
          if(r.isFinal){gotFinal=true;const alts=[];for(let j=0;j<r.length;j++)alts.push(r[j].transcript.trim());finals.push(alts)}
          else interim+=r[0].transcript}
        const live=finals.map(a=>a[0]).join(' ')+' '+interim;opt.onInterim&&opt.onInterim(live.trim());
      };
      recog.onerror=e=>{errored=true;
        if(e.error==='not-allowed'||e.error==='service-not-allowed'){micDenied=true;toast(MIC_MSG.denied,7000)}
        else if(e.error==='no-speech')toast('Je n\'ai rien entendu. Touchez le micro, attendez le signal, puis parlez.');
        else if(e.error==='network')toast('L\'écoute de la voix a besoin d\'Internet. Vérifiez le Wi-Fi.');
        else if(e.error==='audio-capture')toast('Le micro de la tablette n\'est pas disponible. Fermez les autres applications qui l\'utilisent.');
      };
      recog.onend=()=>{
        micBusy=false;document.querySelectorAll('.mic').forEach(m=>m.classList.remove('on'));opt.onEnd&&opt.onEnd();
        let alts=[];
        if(finals.length){const first=finals.map(a=>a[0]).join(' ');alts=[first];if(finals.length===1)alts=finals[0]}
        else if(interim.trim())alts=[interim.trim()];
        if(alts.length)onFinal(alts);else if(!errored)toast('Je n\'ai rien entendu. Réessayez en parlant un peu plus fort.');
      };
      recog.start();micBusy=true;document.querySelectorAll('.mic').forEach(m=>m.classList.add('on'));opt.onStart&&opt.onStart();
    }catch(e){micBusy=false;toast('Le micro n\'a pas pu démarrer. Réessayez dans un instant.')}
  },250);
}

/* =========================================================

   ========================================================= */
const TYPES={
 p:{1:['en2fr','fr2en','listen','build','speak'],2:['fr2en','listen','listenfr','build','type','dictation','speak'],3:['listenfr','build','type','dictation','speak','type'],4:['listenfr','type','dictation','speak','build','type']},
 w:{1:['pic2word','listen2pic','word2pic','sayword'],2:['pic2word','listen2pic','typeword','sayword','word2pic'],3:['typeword','listen2pic','sayword','wordfr'],4:['typeword','wordfr','sayword','listen2pic']},
 g:{1:['fill'],2:['fill'],3:['fill','filltype'],4:['fill','filltype']}
};
const words=s=>s.replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean);
const weakFirst=list=>shuffle(list).sort((a,b)=>(seen(a)?strength(a):-1)-(seen(b)?strength(b):-1));
function exFor(it,n,exam){
  let t=shuffle(TYPES[it.kind][it.lv]);
  if(it.kind==='p'&&words(it.en).length>11)t=t.filter(x=>x!=='build');
  if(exam)t=t.filter(x=>!['speak','sayword'].includes(x));
  t=[...new Set(t)];
  return t.slice(0,n).map(x=>mkQ(x,it));
}
const intro=it=>({type:it.kind==='w'?'wintro':'intro',it});
function startLesson(spec){
  let q=[],label='',back='home';
  const [kind,id]=spec.split(':');
  if(kind==='daily'){
    label='Séance du jour';const n=S.level;
    const due=dueList().slice(0,6);
    const newP=weakFirst(byLv(n).filter(i=>i.kind==='p'&&!seen(i))).slice(0,2);
    const newW=weakFirst(byLv(n).filter(i=>i.kind==='w'&&!seen(i))).slice(0,3);
    const g=weakFirst(byLv(n).filter(i=>i.kind==='g')).slice(0,2);
    let pool=[...due,...newP,...newW];if(pool.length<5)pool=pool.concat(weakFirst(byLv(n).filter(i=>i.kind!=='g')).slice(0,6-pool.length));
    q=[...[...newP,...newW].map(intro),...shuffle([...pool.flatMap(i=>exFor(i,!seen(i)||strength(i)<2?2:1)),...g.flatMap(i=>exFor(i,1))])];
    const ws=newW.length>=3?newW:pool.filter(i=>i.kind==='w');if(ws.length>=3)q.push(mkPairs(ws.slice(0,4)));
  }else if(kind==='t'){const t=DB.themes.find(x=>x.id===id);label=t.title;back='theme:'+id;
    const ch=weakFirst(pItems(t)).slice(0,5);q=[...ch.filter(i=>!seen(i)).map(intro),...shuffle(ch.flatMap(i=>exFor(i,2)))];}
  else if(kind==='v'){const v=DB.vocab.find(x=>x.id===id);label=v.title;back='vset:'+id;
    const ch=weakFirst(wItems(v)).slice(0,5);q=[...ch.filter(i=>!seen(i)).map(intro),...shuffle(ch.flatMap(i=>exFor(i,2))),mkPairs(ch.slice(0,4))];}
  else if(kind==='g2'){const v=DB.vocab.find(x=>x.id===id);label='Jeu des paires · '+v.title;back='vset:'+id;
    const a=shuffle(wItems(v));q=[mkPairs(a.slice(0,4)),mkPairs(a.slice(4,8)),mkPairs(a.slice(8,12).length>=3?a.slice(8,12):a.slice(0,4))];}
  else if(kind==='gr'){const g=DB.grammar.find(x=>x.id===id);label=g.title;back='gram:'+id;q=gItems(g).map(i=>mkQ(pick(TYPES.g[i.lv]),i));}
  else if(kind==='review'){label='Révision';back='review';
    let pool=dueList();if(pool.length<6)pool=pool.concat(ALL.filter(i=>seen(i)&&!pool.includes(i)).sort((a,b)=>strength(a)-strength(b)));
    if(pool.length<4)pool=pool.concat(weakFirst(byLv(S.level)).slice(0,6));
    pool=pool.slice(0,10);q=shuffle(pool.flatMap(i=>exFor(i,1)));const ws=pool.filter(i=>i.kind==='w');if(ws.length>=3)q.push(mkPairs(ws.slice(0,4)));}
  else if(kind==='exam'){const n=+id;label='Examen du niveau '+n;back='learn';
    const l=byLv(n);const ps=shuffle(l.filter(i=>i.kind==='p')).slice(0,8),ws=shuffle(l.filter(i=>i.kind==='w')).slice(0,7),gs=shuffle(l.filter(i=>i.kind==='g')).slice(0,5);
    q=shuffle([...ps,...ws,...gs].flatMap(i=>exFor(i,1,true)));}
  L={spec,label,back,q,i:0,ok:0,tot:0,sel:null,checked:false,res:null,built:[],exam:kind==='exam',lv:kind==='exam'?+id:null,typed:''};
  go('lesson');

function mkQ(type,it){

  const p=$('#panel');if(!p)return;const sc=P.sc;
  if(P.phase==='intro'){p.innerHTML=`<div class="askp"><span class="ptitle">Prête ?</span><p class="hint">${sc.cast.map(c=>AV[c].name).join(', ')} vont vous parler. Montez le son de la tablette.</p><button class="btn block" data-scenego>${svg('play')}Commencer la conversation</button></div>`;return}
  if(P.phase==='playing'){p.innerHTML='';return}
  if(P.phase==='ask'){
    const n=sc.nodes[P.nodeId];const a=n.ask;const mic=micOK();
    p.innerHTML=`<div class="askp">
      <span class="ptitle">À vous : ${fr(a.prompt)}</span>
      <div class="askrow">
        ${mic?`<button class="mic" data-smic aria-label="Répondre en parlant">${svg('mic')}</button><span class="hint" style="flex:1;min-width:160px">Touchez le micro et répondez en anglais.</span>`:''}
        <button class="btn small ghost" data-replay>${svg('speaker')}Réécouter</button>
        <button class="btn small ghost" data-replay="slow">Lentement</button>
      </div>
      <div class="heard" id="live" ${P.heard?'':'hidden'}>${P.heard?`Vous : « ${esc(P.heard)} »`:''}</div>
      ${P.typing||!mic?`<div class="row" style="flex-wrap:nowrap"><input class="ans" id="sans" type="text" lang="en" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Écrivez votre réponse en anglais"><button class="btn" data-ssend>Envoyer</button></div>`:`<button class="btn small ghost" data-stype>${svg('pen')}Écrire ma réponse</button>`}
      ${P.tip?`<div class="notice badn"><b>Pas tout à fait.</b> ${fr(P.tip)}</div>`:''}
      ${P.msg?`<div class="notice">${fr(P.msg)}</div>`:''}
      ${P.showOpts?`<span class="hint">Idées de réponse (touchez pour choisir) :</span><div class="opts">${a.options.map((o,i)=>`<button class="opt ${P.wrong.has(i)?'wrong':''}" data-sopt="${i}" ${P.wrong.has(i)?'disabled':''}><b>${esc(o.en)}</b>${P.trans!=='off'?`<br><span class="frtxt" style="font-size:.9rem">${fr(o.fr)}</span>`:''}</button>`).join('')}</div>`:`<button class="btn ghost" data-showopts>Je ne sais pas quoi dire : voir des idées</button>`}
    </div>`;
    return;
  }
  if(P.phase==='end'){
    p.innerHTML=`<div class="askp"><span class="ptitle">Conversation terminée, bravo !</span><p class="hint">Vous avez bien répondu du premier coup ${P.first} fois sur ${P.asks}.</p><button class="btn block" data-quizgo>Trois questions de compréhension</button><button class="btn ghost block" data-scene="${sc.id}">Recommencer la conversation</button></div>`;return}
  if(P.phase==='quiz'){
    const Q=P.quiz;const q=sc.quiz[Q.i];
    p.innerHTML=`<div class="askp"><span class="ptitle">Question ${Q.i+1} sur ${sc.quiz.length}</span><div class="big" style="font-size:1.2rem;font-weight:700">${fr(q.q)}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${Q.ans!==null?(i===q.a?'good':(i===Q.ans?'wrong':'')):''}" data-quiz="${i}" ${Q.ans!==null?'disabled':''}>${fr(o)}</button>`).join('')}</div>${Q.ans!==null?`<button class="btn block" data-quiznext>${Q.i+1<sc.quiz.length?'Question suivante':'Voir mon résultat'}</button>`:''}</div>`;return}
  if(P.phase==='result'){
    const pct=Math.round(((P.first/Math.max(1,P.asks))*0.6+(P.quiz.ok/sc.quiz.length)*0.4)*100);
    p.innerHTML=`<div class="donebox"><div class="airmail"></div><div class="in"><h2>Bien joué, Marie Line !</h2><div class="score"><div><b>${P.first}/${P.asks}</b><span>réponses du premier coup</span></div><div><b>${P.quiz.ok}/${sc.quiz.length}</b><span>compréhension</span></div><div><b>+${P.xp}</b><span>points</span></div></div><p class="hint">Score de la conversation : ${pct}%.</p><button class="btn block" data-scene="${sc.id}">Recommencer</button><button class="btn ghost block" data-go="talk">Autres conversations</button></div></div>`;
  }
}
function playLines(lines,done){
  let i=0;
  const step=()=>{
    if(route!=='scene'||!P)return;
    if(i>=lines.length){P.typingWho=null;drawTranscript();done();return}
    const [who,en,frt]=lines[i++];
    P.log.push({who,en,fr:frt,i:P.log.length});P.lastLine={who,en};P.typingWho=null;drawTranscript();scrollEnd();
    let moved=false;const go2=()=>{if(moved)return;moved=true;clearTimeout(guard);setTimeout(step,500)};
    const guard=setTimeout(()=>{stopTalk(who);go2()},4000+en.length*140);
    avSay(who,en,go2);
  };
  step();
}
function playNode(){
  const n=P.sc.nodes[P.nodeId];P.phase='playing';P.wrong=new Set();P.tip='';P.msg='';P.heard='';P.tries=0;P.showOpts=P.sc.level<=2;drawPanel();
  playLines(n.say,()=>{
    if(n.ask){P.phase='ask';P.asks++;drawPanel();scrollEnd()}
    else if(n.end){P.phase='end';drawPanel();scrollEnd()}
    else{P.nodeId=n.next;playNode()}
  });
}
function sceneAnswer(text,spoken){
  const n=P.sc.nodes[P.nodeId];const a=n.ask;text=(text||'').trim();if(!text)return;
  P.heard=text;P.tip='';P.msg='';
  let bi=-1,bs=0;a.options.forEach((o,i)=>{if(P.wrong.has(i))return;const s=similarity(text,o.en);if(s>bs){bs=s;bi=i}});
  const wc=toks(text).length;
  if(bi>=0&&bs>=.55){chooseOpt(bi,text);return}
  if(a.open&&wc>=(P.sc.level<=2?2:3)){openAnswer(text);return}
  P.tries++;P.showOpts=true;P.msg=P.tries>1?'Choisissez une des idées ci-dessous, puis dites-la à voix haute.':'Je n\'ai pas bien compris votre réponse. Essayez encore, ou regardez les idées de réponse.';
  chime(false);drawPanel();scrollEnd();
}
function chooseOpt(i,said){
  const n=P.sc.nodes[P.nodeId];const o=n.ask.options[i];
  if(!o.ok){P.wrong.add(i);P.tip=o.tip||'';P.tries++;chime(false);drawPanel();scrollEnd();return}
  chime(true);if(P.tries===0)P.first++;
  P.log.push({who:'me',en:said||o.en,fr:said?'':o.fr});P.phase='playing';drawTranscript();drawPanel();
  const go2=()=>playLines([o.react],()=>{P.nodeId=o.next;playNode()});
  if(!said)speak(o.en,{onend:()=>setTimeout(go2,350)});else setTimeout(go2,400);
}
function openAnswer(said){
  const n=P.sc.nodes[P.nodeId];const op=n.ask.open;chime(true);if(P.tries===0)P.first++;
  P.log.push({who:'me',en:said,fr:''});P.phase='playing';drawTranscript();drawPanel();
  setTimeout(()=>playLines([op.react],()=>{P.log.push({who:'model',en:op.model[0],fr:op.model[1]});drawTranscript();P.nodeId=op.next;setTimeout(playNode,600)}),400);
}
function finishScene(){
  const sc=P.sc;const pct=Math.round(((P.first/Math.max(1,P.asks))*0.6+(P.quiz.ok/sc.quiz.length)*0.4)*100);
  P.xp=15+P.first*3+P.quiz.ok*4;addXP(P.xp);
  const prev=S.scenes[sc.id];S.scenes[sc.id]={score:Math.max(pct,prev?prev.score:0),date:Date.now(),n:(prev?prev.n:0)+1};save();
  P.phase='result';drawPanel();scrollEnd();
}

function exportData(){
  const data=JSON.stringify({app:'mlAnglais',v:3,date:new Date().toISOString(),S});
  try{const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anglais-marie-line-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copie enregistrée dans « Téléchargements ».')}
  catch(e){showCode()}
}
function showCode(){const z=$('#codezone');if(!z)return;const code=btoa(unescape(encodeURIComponent(JSON.stringify({app:'mlAnglais',v:3,S}))));
  z.innerHTML=`<p class="hint">Code de sauvegarde (copiez-le dans un e-mail ou une note) :</p><textarea class="code" id="codeout" readonly>${code}</textarea><p class="hint">Pour restaurer, collez un code ici puis touchez « Restaurer ce code » :</p><textarea class="code" id="codein"></textarea><button class="btn small" data-restorecode>Restaurer ce code</button>`}
function restore(obj){
  if(!obj||obj.app!=='mlAnglais'||!obj.S){toast('Cette copie n\'est pas reconnue.');return}
  S={...JSON.parse(JSON.stringify(DEF)),...obj.S,settings:{...DEF.settings,...(obj.S.settings||{})}};save();applySize();renderStats();toast('Progression restaurée.');go('home');
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-unhide]');if(!b)return;const d=b.dataset;
  if(AC&&AC.state==='suspended')AC.resume();
  if(d.unhide!==undefined&&route==='scene'){const l=P.log[+d.unhide];if(l){l.unhide=true;drawTranscript()}return}
  if(d.say!==undefined){if(route==='scene'&&P&&P.phase==='playing'){toast('Attendez la fin de la phrase, puis réécoutez.');return}if(d.who&&d.anim)avSay(d.who,d.say,null,!!d.slow);else speak(d.say,{slow:!!d.slow,who:d.who});return}
  if(d.go){go(d.go);return}
  if(d.back){const [r,a]=d.back.split(':');go(r,a);return}
  if(d.setlevel){S.level=+d.setlevel;S.onboarded=true;save();renderStats();go('home');return}
  if(d.setlevel2){S.level=+d.setlevel2;save();renderStats();renderSettings();return}
  if(d.viewlevel){viewLv=+d.viewlevel;go('learn');return}
  if(d.theme){go('theme',d.theme);return}
  if(d.vset){go('vset',d.vset);return}
  if(d.gram){go('gram',d.gram);return}
  if(d.start){startLesson(d.start);return}
  if(d.listen){startListen(d.listen);return}
  if(d.install!==undefined){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}return}
  if(route==='listenmode'){
    if(d.stoplisten!==undefined){H.playing=false;go('vset',H.v.id);return}
    if(d.ltoggle!==undefined){H.playing=!H.playing;if(H.playing)stepListen();else{hush();renderListen()}return}
    if(d.lnext!==undefined||d.lprev!==undefined){H.i=(H.i+(d.lnext!==undefined?1:H.list.length-1))%H.list.length;hush();if(H.playing)stepListen();else{renderListen();speak(H.list[H.i].en)}return}
  }
  if(route==='lesson'){
    const q=L.q[L.i];
    if(d.quit!==undefined){const [r,a]=L.back.split(':');go(r,a);return}
    if(d.opt!==undefined&&!L.checked){L.sel=+d.opt;if(d.speakopt)speak(d.speakopt);renderLesson();return}
    if(d.build!==undefined&&!L.checked){const ti=+d.build;if(!L.built.includes(ti)){L.built.push(ti);speak(q.tiles[ti]);renderLesson()}return}
    if(d.unbuild!==undefined&&!L.checked){L.built.splice(+d.unbuild,1);renderLesson();return}
    if(d.check!==undefined){check();return}
    if(d.skip!==undefined){const a=$('#ans');L.typed=a?a.value:'';grade(false);return}
    if(d.mic!==undefined){listen(onSpoken,{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
    if(d.reveal!==undefined){q.stage=1;speak(q.it.en);renderLesson();return}
    if(d.self!==undefined){grade(d.self==='1');return}
    if(d.pl!==undefined){pairTap('l',+d.pl);return}
    if(d.pr!==undefined){pairTap('r',+d.pr);return}
    if(d.pairsdone!==undefined){L.tot++;if(q.miss<=1)L.ok++;q.set.forEach(x=>rate(x,q.miss<=1));next();return}
    if(d.next!==undefined){next();return}
  }
  if(d.scene){startScene(d.scene);return}
  if(route==='scene'){
    if(d.leavescene!==undefined){go('talk');return}
    if(d.scenego!==undefined){playNode();return}
    if(d.hidetext!==undefined){P.hideText=!P.hideText;b.setAttribute('aria-pressed',P.hideText);b.innerHTML=svg('eye')+(P.hideText?'Afficher le texte':'Écouter sans lire');P.log.forEach(l=>l.unhide=false);drawTranscript();return}
    if(d.revealTr!==undefined){const l=P.log[+d.revealTr];if(l){l.revealed=true;drawTranscript()}return}
    if(d.replay!==undefined){if(P.phase==='playing')return;if(P.lastLine)avSay(P.lastLine.who,P.lastLine.en,null,d.replay==='slow');return}
    if(d.smic!==undefined){listen(alts=>{const n=P.sc.nodes[P.nodeId];let bestA=alts[0];let bs=-1;alts.forEach(a=>n.ask.options.forEach(o=>{const s=similarity(a,o.en);if(s>bs){bs=s;bestA=a}}));sceneAnswer(bestA,true)},{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
    if(d.stype!==undefined){P.typing=true;drawPanel();setTimeout(()=>$('#sans')&&$('#sans').focus(),50);return}
    if(d.ssend!==undefined){sceneAnswer($('#sans').value,false);return}
    if(d.showopts!==undefined){P.showOpts=true;drawPanel();return}
    if(d.sopt!==undefined){chooseOpt(+d.sopt,null);return}
    if(d.quizgo!==undefined){P.phase='quiz';P.quiz={i:0,ok:0,ans:null};drawPanel();scrollEnd();return}
    if(d.quiz!==undefined){const q=P.sc.quiz[P.quiz.i];P.quiz.ans=+d.quiz;if(+d.quiz===q.a){P.quiz.ok++;chime(true)}else chime(false);drawPanel();return}
    if(d.quiznext!==undefined){P.quiz.i++;P.quiz.ans=null;if(P.quiz.i>=P.sc.quiz.length)finishScene();else drawPanel();return}
  }
  if(d.mictest!==undefined){listen(alts=>{const l=$('#live');l.hidden=false;l.textContent='J\'ai entendu : « '+alts[0]+' »';toast('Le micro fonctionne !')},{onInterim:t=>{const l=$('#live');if(l){l.hidden=false;l.textContent='J\'entends : « '+t+' »'}}});return}
  if(d.trans){S.settings.trans=d.trans;save();renderSettings();return}
  if(d.goal){S.settings.goal=+d.goal;save();renderSettings();return}
  if(d.size){S.settings.size=+d.size;save();applySize();renderSettings();return}
  if(d.export!==undefined){exportData();return}
  if(d.showcode!==undefined){showCode();return}
  if(d.restorecode!==undefined){try{restore(JSON.parse(decodeURIComponent(escape(atob($('#codein').value.trim())))))}catch(err){toast('Ce code n\'est pas valide.')}return}
  if(d.reset!==undefined){$('#resetzone').innerHTML=`<span>Vraiment tout effacer ?</span><button class="btn small red" data-resetyes>Oui, effacer</button><button class="btn ghost small" data-resetno>Non</button>`;return}
  if(d.resetyes!==undefined){S=JSON.parse(JSON.stringify(DEF));S.onboarded=true;save();renderStats();toast('Progression effacée.');go('home');return}
  if(d.resetno!==undefined){renderSettings();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='voice'){S.settings.voice=t.value;const f=VOICES.find(x=>x.v.name===t.value);if(f)VOICE=f.v;save();speak('Hello Marie Line! Nice to meet you.')}
  if(t.id==='rate'){S.settings.rate=+t.value;save();speak('This is my speaking speed.')}
  if(t.id==='sfx'){S.settings.sfx=t.checked;save();if(t.checked)chime(true)}
  if(t.id==='importfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{restore(JSON.parse(r.result))}catch(err){toast('Ce fichier n\'est pas une copie valide.')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'&&route==='lesson'&&!L.checked){e.preventDefault();check()}
  else if(e.target.id==='sans'){e.preventDefault();sceneAnswer(e.target.value,false)}
});

$('#logo').innerHTML=LOGO_SVG;
applySize();renderStats();
route=S.onboarded?'home':'onboard';render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}
</script>
</body></html>
