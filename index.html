  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", Roboto, "Segoe UI", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --paper:#18213A; --ink:#EAF0FA; --muted:#A6B2C9; --line:#2D3A57;
    --blue:#8BAEFF; --blue-ink:#0E1524; --blue-soft:#22325A;
    --red:#F07D78; --sun:#F2C14E; --sun-soft:#3A3220;
    --ok:#62CF95; --ok-soft:#173A2A; --bad:#FF8E85; --bad-soft:#40201E;
    --stamp-edge:#33415F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --paper:#18213A; --ink:#EAF0FA; --muted:#A6B2C9; --line:#2D3A57;
  --blue:#8BAEFF; --blue-ink:#0E1524; --blue-soft:#22325A;
  --red:#F07D78; --sun:#F2C14E; --sun-soft:#3A3220;
  --ok:#62CF95; --ok-soft:#173A2A; --bad:#FF8E85; --bad-soft:#40201E;
  --stamp-edge:#33415F; color-scheme:dark;
}
html{font-size:calc(clamp(17px, 0.9vw + 11px, 20px) * var(--scale));-webkit-text-size-adjust:100%}

*{box-sizing:border-box}

.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sun-soft);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.tabrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 2px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;min-width:0}

main{padding-block:20px 120px}

h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:28px 0 12px}
.lead{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--red)}
.en{font-weight:700;font-size:1.2rem;line-height:1.3}
.frtxt{color:var(--muted)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;background:var(--blue);color:var(--blue-ink);text-align:center}

.say{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:6px 14px;border-radius:999px;border:2px solid var(--blue);background:var(--paper);color:var(--blue);font-weight:700;font-size:.9rem;cursor:pointer}

.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}

.daily{display:flex;flex-direction:column;gap:14px;border:7px solid;border-image:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--paper) 10px 16px,var(--blue) 16px 26px,var(--paper) 26px 32px) 7;background:var(--paper);padding:20px}

.cert{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}

.scenecard{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:14px}

.faces{display:flex;flex:none}

/* stamps */

/* lists */
.plist{display:flex;flex-direction:column;gap:10px}

.gexp p{margin:0 0 10px;max-width:65ch}

/* visuals */
.vis{display:inline-grid;place-items:center;line-height:1;flex:none}

.vis.xl.emo{font-size:6.5rem}.vis.xl.sw{width:7rem;height:7rem}.vis.xl.num{font-size:6rem}.vis.xl.txt{width:7rem;height:7rem;font-size:1.8rem;border-top-width:18px}

.lhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lhead .bar{height:14px}
.quit{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:6px 14px;font-weight:700;cursor:pointer}
.qtitle{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 14px}

.prompt.center{align-items:center;text-align:center}
.prompt .big{font-size:1.45rem;font-weight:700;line-height:1.3}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);border-radius:14px;padding:14px 16px;min-height:62px;text-align:left;font-size:1.06rem;cursor:pointer;line-height:1.3}

.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bigspeak{width:120px;height:120px;border-radius:50%;border:0;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;cursor:pointer;margin:6px auto}

.center{text-align:center}
.ans{width:100%;font-size:1.25rem;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:60px}
.ans.good{border-color:var(--ok);background:var(--ok-soft)} .ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;margin:4px auto}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,57,58,.55)}100%{box-shadow:0 0 0 24px rgba(194,57,58,0)}}
.heard{background:var(--bg);border-radius:12px;padding:10px 14px;min-height:46px}

.fb{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-bottom:12px}

/* avatars & scenes */

.tile-av{position:relative;border-radius:18px;overflow:hidden;background:var(--set1);aspect-ratio:200/220;max-width:100%;box-shadow:0 0 0 2px var(--line);transition:box-shadow .2s}

.set-clinic{--set1:linear-gradient(160deg,#E4F1F2,#A9CFD4)}
.set-livingroom{--set1:linear-gradient(160deg,#EADCD3,#B79B8C)}
.set-market{--set1:linear-gradient(160deg,#F5E3B5,#D2A35B)}

.av .mv{display:none}
.av[data-v="rest"] .mv-rest,.av:not([data-v]) .mv-rest,.av[data-v="A"] .mv-A,.av[data-v="O"] .mv-O,.av[data-v="E"] .mv-E,.av[data-v="M"] .mv-M{display:inline}

.transcript{display:flex;flex-direction:column;gap:12px}

.askp{background:var(--paper);border:2px solid var(--blue);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.askp .ptitle{font-weight:700;font-size:1.05rem}
.askrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.askrow .mic{width:78px;height:78px;margin:0}
.askrow .mic svg{width:36px;height:36px}
.notice{background:var(--sun-soft);border-radius:14px;padding:14px 16px;font-size:.95rem}
.notice.okn{background:var(--ok-soft)} .notice.badn{background:var(--bad-soft)}
.typing{color:var(--muted);font-style:italic}

/* progress */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:400}
.stat span{color:var(--muted);font-size:.85rem}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:520px}
.heat .wk{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--line))}.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--line))}.heat i.l3{background:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.badges{grid-template-columns:repeat(2,1fr)}}
.badge-c{border-radius:16px;padding:14px;text-align:center;border:2px dashed var(--line);color:var(--muted)}
.badge-c.got{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.badge-c b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem}

/* settings */
.set{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.set .t{font-weight:700;font-size:1.05rem}
select{font:inherit;font-size:1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:52px}
input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.switch input{width:28px;height:28px;accent-color:var(--blue);flex:none}
details{background:var(--bg);border-radius:12px;padding:12px 14px}
details summary{font-weight:700;cursor:pointer;min-height:32px}
details ol{margin:8px 0 0;padding-left:22px}
details li{margin-bottom:4px}
textarea.code{width:100%;min-height:90px;font-family:monospace;font-size:.8rem;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.legal{font-size:.8rem;color:var(--muted);margin-top:24px}
.install{display:flex;align-items:center;gap:14px;background:var(--blue-soft);border-radius:18px;padding:14px 16px;margin-bottom:16px}
.install .logo{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}

/* onboarding */
.welcome{display:grid;gap:16px;max-width:900px;margin:0 auto}
.lvchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.lvchoice button{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.lvchoice button:active{border-color:var(--blue)}
.lvchoice b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.lvchoice .ex{font-style:italic;color:var(--muted);font-size:.9rem}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){.opt,.tile,.btn,.wcard,.stamp-in,.lvtab{transition:background .15s,border-color .15s,transform .1s}.btn:active,.opt:active,.tile:active,.wcard:active{transform:scale(.97)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none;outline:4px solid var(--red)}}
@media (max-width:520px){.tab{font-size:12px}.brand h1{font-size:1.15rem}}

nice weekend?", "fr": "Vous avez passé un bon week-end ?", "alts": ["Did you have a good weekend?"], "pron": "Did you hav eu naïss wîk-ènnd ?"}, {"en": "What did you do on Sunday afternoon?", "fr": "Qu'est-ce que vous avez fait dimanche après-midi ?", "alts": [], "pron": "Ouatt did you dou onn seunn-déï af-teur-noun ?"}, {"en": "We saw a moose near the road!", "fr": "Nous avons vu un orignal près de la route !", "alts": ["We saw a moose by the road!"], "pron": "Wi so eu mouss nîr ze rôd !"}, {"en": "I bought some maple syrup at the farmers market.", "fr": "J'ai acheté du sirop d'érable au marché fermier.", "alts": [], "pron": "Aï bot seum méï-peul si-reup att ze far-meurz mar-kitt."}, {"en": "It was a long day, but I really enjoyed it.", "fr": "C'était une longue journée, mais ça m'a vraiment plu.", "alts": [], "pron": "Itt woz eu lonng déï, beutt aï ri-li inn-djoïd itt."}]}, {"id": "l2-plans", "title": "Faire des projets", "sub": "Inviter, proposer, s'organiser", "icon": "sun", "p": [{"en": "What are you going to do this weekend?", "fr": "Qu'est-ce que vous allez faire ce week-end ?", "alts": ["What are you doing this weekend?"], "pron": "Ouatt ar you gô-inng tou dou ziss wîk-ènnd ?"}, {"en": "I'm going to visit the farmers market on Saturday.", "fr": "Je vais aller au marché fermier samedi.", "alts": ["I'm going to go to the farmers market on Saturday."], "pron": "Aïm gô-inng tou vi-zitt ze far-meurz mar-kitt onn sa-teur-déï."}, {"en": "Would you like to come for coffee tomorrow?", "fr": "Voulez-vous venir prendre un café demain ?", "alts": ["Do you want to come for coffee tomorrow?"], "pron": "Woud you laïk tou keumm for ko-fi tou-mo-rô ?"}, {"en": "That sounds lovely. What time should I come?", "fr": "Avec plaisir. À quelle heure dois-je venir ?", "alts": ["That sounds great. What time should I come?"], "pron": "Zatt saoundz leuv-li. Ouatt taïm choud aï keumm ?"}, {"en": "Let's meet at the café at ten thirty.", "fr": "Retrouvons-nous au café à dix heures et demi épéter l'adresse, s'il vous plaît ?", "alts": ["Can you repeat the address, please?"], "pron": "Koud you ri-pît zi a-drèss, plîz ?"}, {"en": "I need to cancel my appointment for Wednesday.", "fr": "Je dois annuler mon rendez-vous de mercredi.", "alts": ["I have to cancel my appointment for Wednesday."], "pron": "Aï nîd tou kènn-seul maï a-poïnnt-mennt for ouènnz-déï."}, {"en": "Can we move it to the following week?", "fr": "Pouvons-nous le déplacer à la semaine suivante ?", "alts": ["Could we move it to the next week?"], "pron": "Kann wi mouv itt tou ze fo-lô-inng wîk ?"}, {"en": "How long will the appointment take?", "fr": "Combien de temps va durer le rendez-vous ?", "alts": ["How long does the appointment take?"], "pron": "Haou lonng wil zi a-poïnnt-mennt téïk ?"}, {"en": "Should I bring anything with me?", "fr": "Dois-je apporter quelque chose ?", "alts": ["Do I need to bring anything?"], "pron": "Choud aï brinng è-ni-sinng wiz mi ?"}, {"en": "Thank you for your help. Have a nice day!", "fr": "Merci pour votre aide. Bonne journée !", "alts": ["Thanks for your help. Have a good day!"], "pron": "Sènk you for yor hèlp. Hav eu naïss déï !"}]}, {"id": "l2-cooking", "title": "En cuisine en famille", "sub": "Préparer un repas ensemble", "icon": "house", "p": [{"en": "What are you cooking? It smells wonderful!", "fr": "Qu'est-ce que tu prépares ? Ça sent très bon !", "alts": ["What are you making? It smells wonderful!"], "pron": "Ouatt ar you kou-kinng ? Itt smèlz ouann-deur-foul !"}, {"en": "Can I help you in the kitchen?", "fr": "Je peux t'aider en cuisine ?", "alts": ["Can I help in the kitchen?", "Do you need help in the kitchen?"], "pron": "Kann aï hèlp you inn ze ki-tchenn ?"}, {"en": "Could you pass me the salt and pepper?", "fr": "Tu peux me passer le sel et le poivre ?", "alts": ["Can you pass me the salt and pepper?"], "pron": "Koud you pass mi ze solt ènd pè-peur ?"}, {"en": "I'm peeling the potatoes for the soup.", "fr": "J'épluche les pommes de terre pour l erie."}]}, {"id": "l2-past-did", "title": "Questions et négations au passé : did", "expl": ["Pour poser une question au passé, on place did devant le sujet, et le verbe reprend sa forme de base : Did you sleep well? (et non Did you slept).", "Pour dire non, on utilise didn't (did not) suivi du verbe de base : I didn't see the film. Le petit truc à retenir : did porte déjà le passé, donc le verbe n'a plus besoin de changer."], "examples": [{"en": "Did you have a nice weekend?", "fr": "Vous avez passé un bon week-end ?"}, {"en": "I didn't sleep well last night.", "fr": "Je n'ai pas bien dormi cette nuit."}, {"en": "What did you buy at the market?", "fr": "Qu'avez-vous acheté au marché ?"}], "items": [{"q": "___ you sleep well last night?", "a": "Did", "opts": ["Do", "Did", "Does", "Were"], "fr": "Vous avez bien dormi cette nuit ?"}, {"q": "I didn't ___ the news this morning.", "a": "see", "opts": ["see", "saw", "seen", "seeing"], "fr": "Je n'ai pas vu les informations ce matin."}, {"q": "Did she ___ the train to Boston?", "a": "take", "opts": ["take", "took", "taken", "takes"], "fr": "A-t-elle pris le train pour Boston ?"}, {"q": "We ___ go out yesterday because of the rain.", "a": "didn't", "opts": ["don't", "didn't", "weren't", "doesn't"], "fr": "Nous ne sommes pas sortis hier à cause de la pluie."}, {"q": "What ___ you eat for lunch yesterday?", "a": "did", "opts": ["do", "did", "was", "does"], "fr": "Qu'avez-vous mangé au déjeuner hier ?"}, {"q": "He didn't ___ my question.", "a": "understand", "opts": ["understand", "understood", "understands", "understanding"], "fr": "Il n'a pas compris ma question."}, {"q": "Where did you ___ your glasses?", "a": "put", "opts": ["put", "puts", "putted", "putting"], "fr": "Où avez-vous mis vos lunettes ?"}, {"q": "Did the children ___ the cake?", "a": "like", "opts": ["like", "liked", "likes", "liking"], "fr": "Les enfants ont-ils aimé le gâteau ?"}]}, {"id": "l2-present-continuous", "title": "Le présent continu : ce qui se passe maintenant", "expl": ["Pour dire ce que l'on fait en ce moment, l'anglais utilise be suivi du verbe en -ing : I am cooking, she is reading. En français, on dit simplement « je cuisine » ou « je suis en train de cuisiner ».", "Le verbe be change selon la personne : I am, you are, he is, she is, we are, they are. À l'oral, on raccourcit presque toujours : I'm, she's, we're."], "examples": [{"en": "I'm peeling the potatoes.", "fr": "J'épluche les pommes de terre."}, {"en": "The children are playing in the snow.", "fr": "Les enfants jouent dans la neige."}, {"en": "Is it raining outside?", "fr": "Est-ce qu'il pleut dehors ?"}], "items": [{"q": "Look! It ___ snowing.", "a": "is", "opts": ["is", "are", "am", "be"], "fr": "Regardez ! Il neige."}, {"q": "The children are ___ in the garden.", "a": "playing", "opts": ["play", "playing", "played", "plays"], "fr": "Les enfants jouent dans le jardin."}, {"q": "I ___ making a cake for Sunday.", "a": "am", "opts": ["am", "is", "are", "be"], "fr": "Je prépare un gâteau pour dimanche."}, {"q": "What are you ___ at the moment?", "a": "reading", "opts": ["read", "reading", "reads", "readed"], "fr": "Qu'est-ce que vous lisez en ce moment ?"}, {"q": "We ___ waiting for the bus.", "a": "are", "opts": ["is", "am", "are", "be"], "fr": "Nous attendons le bus."}, {"q": "My son-in-law ___ cooking dinner right now.", "a": "is", "opts": ["is", "are", "am", "be"], "fr": "Mon gendre est en train de préparer le dîner."}, {"q": "She isn't ___ very well today.", "a": "feeling", "opts": ["feel", "feeling", "feels", "felt"], "fr": "Elle ne se sent pas très bien aujourd'hui."}, {"q": "___ you watching this program?", "a": "Are", "opts": ["Are", "Is", "Do", "Does"], "fr": "Vous regardez cette émission ?"}]}, {"id": "l2-going-to", "title": "Le futur proche : going to", "expl": ["Pour parler d'un projet ou d'une intention, on utilise be going to suivi du verbe : I'm going to visit my daughter. C'est exactement comme le français « je vais rendre visite à ma fille ».", "On l'utilise aussi quand on voit que quelque chose va arriver : Look at the clouds, it's going to rain. Le verbe après going to reste toujours à sa forme de base."], "examples": [{"en": "We're going to drive to Burlington.", "fr": "Nous allons aller à Burlington en voiture."}, {"en": "Are you going to stay for dinner?", "fr": "Vous allez rester dîner ?"}, {"en": "Look at the sky, it's going to snow.", "fr": "Regardez le ciel, il va neiger."}], "items": [{"q": "I'm going ___ visit the museum tomorrow.", "a": "to", "opts": ["to", "for", "at", "in"], "fr": "Je vais visiter le musée demain."}, {"q": "We are going to ___ a cake for her birthday.", "a": "make", "opts": ["make", "made", "making", "makes"], "fr": "Nous allons faire un gâteau pour son anniversaire."}, {"q": "Look at those clouds. It's going to ___.", "a": "rain", "opts": ["rain", "rains", "rained", "raining"], "fr": "Regardez ces nuages. Il va pleuvoir."}, {"q": "___ you going to come with us?", "a": "Are", "opts": ["Are", "Do", "Is", "Will"], "fr": "Vous allez venir avec nous ?"}, {"q": "She ___ going to call you this evening.", "a": "is", "opts": ["is", "are", "am", "does"], "fr": "Elle va vous appeler ce soir."}, {"q": "They aren't going to ___ this weekend.", "a": "travel", "opts": ["travel", "travels", "traveled", "traveling"], "fr": "Ils ne vont pas voyager ce week-end."}, {"q": "What are you going to ___ tomorrow?", "a": "do", "opts": ["do", "doing", "did", "does"], "fr": "Qu'est-ce que vous allez faire demain ?"}, {"q": "I'm ___ to buy some new boots.", "a": "going", "opts": ["going", "go", "goes", "gone"], "fr": "Je vais acheter de nouvelles bottes."}]}, {"id": "l2-comparatives", "title": "Comparer : plus... que", "expl": ["Pour les adjectifs courts, on ajoute -er, puis than : cold devient colder than (plus froid que). De même, big devient bigger, nice devient nicer et happy devient happier.", "Pour les adjectifs longs, on met more devant : more expensive than (plus cher que), more comfortable than. À retenir : deux exceptions très fréquentes, good devient better et bad devient worse."], "examples": [{"en": "Vermont is colder than Paris in winter.", "fr": "En hiver, il fait plus froid dans le Vermont qu'à Paris."}, {"en": "This coat is more expensive than that one.", "fr": "Ce manteau est plus cher que celui-là."}, {"en": "My English is better than last year!", "fr": "Mon anglais est meilleur que l'année dernière !"}], "items": [{"q": "Today is ___ than yesterday.", "a": "colder", "opts": ["colder", "coldest", "more cold", "cold"], "fr": "Aujourd'hui, il fait plus froid qu'hier."}, {"q": "This sweater is more ___ than the blue one.", "a": "expensive", "opts": ["expensive", "expensiver", "cheaper", "expensively"], "fr": "Ce pull est plus cher que le bleu."}, {"q": "Her cake is ___ than mine.", "a": "better", "opts": ["better", "gooder", "more good", "best"], "fr": "Son gâteau est meilleur que le mien."}, {"q": "The lake is bigger ___ the pond.", "a": "than", "opts": ["than", "that", "then", "as"], "fr": "Le lac est plus grand que l'étang."}, {"q": "The traffic is ___ today than on Sunday.", "a": "worse", "opts": ["worse", "badder", "worst", "more bad"], "fr": "La circulation est pire aujourd'hui que dimanche."}, {"q": "My grandson is ___ than his sister.", "a": "taller", "opts": ["taller", "tallest", "more tall", "tall"], "fr": "Mon petit-fils est plus grand que sa sœur."}, {"q": "This chair is ___ comfortable than the sofa.", "a": "more", "opts": ["more", "most", "very", "too"], "fr": "Cette chaise est plus confortable que le canapé."}, {"q": "Summer in Vermont is ___ than I thought.", "a": "nicer", "opts": ["nicer", "nicest", "more nice", "nice"], "fr": "L'été dans le Vermont est plus agréable que je ne le pensais."}]}, {"id": "l2-polite-requests", "title": "Demander poliment : can, could, would like", "expl": ["Can sert à demander quelque chose simplement : Can I have some water? Could est plus poli et très utilisé avec des inconnus : Could you help me, please?", "Pour dire ce que vous voulez, évitez I want, qui peut sembler un peu brusque. Préférez I would like, souvent raccourci en I'd like : I'd like a coffee, please. Après can et could, le verbe reste à sa forme de base ; après would like, on ajoute to : I'd like to book a table."], "examples": [{"en": "Could you speak more slowly, please?", "fr": "Pourriez-vous parler plus lentement, s'il vous plaît ?"}, {"en": "I'd like a table for two, please.", "fr": "Je voudrais une table pour deux, s'il vous plaît."}, {"en": "Can I try it on?", "fr": "Je peux l'essayer ?"}], "items": [{"q": "___ you help me with my suitcase, please?", "a": "Could", "opts": ["Could", "Are", "Do", "Would like"], "fr": "Pourriez-vous m'aider avec ma valise, s'il vous plaît ?"}, {"q": "I'd ___ a cup of tea, please.", "a": "like", "opts": ["like", "liked", "liking", "likes"], "fr": "Je voudrais une tasse de thé, s'il vous plaît."}, {"q": "Could you ___ that again, please?", "a": "say", "opts": ["say", "said", "saying", "says"], "fr": "Pourriez-vous répéter, s'il vous plaît ?"}, {"q": "Would you like ___ come for dinner?", "a": "to", "opts": ["to", "for", "at", "of"], "fr": "Voulez-vous venir dîner ?"}, {"q": "___ I have the check, please?", "a": "Can", "opts": ["Can", "Do", "Am", "Would"], "fr": "Je peux avoir l'addition, s'il vous plaît ?"}, {"q": "I would like ___ a table for Saturday.", "a": "to book", "opts": ["to book", "book", "booking", "booked"], "fr": "Je voudrais réserver une table pour samedi."}, {"q": "Could you ___ me the way to the library?", "a": "tell", "opts": ["tell", "told", "telling", "tells"], "fr": "Pourriez-vous m'indiquer le chemin de la bibliothèque ?"}, {"q": "Would you ___ some more coffee?", "a": "like", "opts": ["like", "liked", "likes", "liking"], "fr": "Vous voulez encore un peu de café ?"}]}]}, "3": {"themes": [{"id": "l3-experiences", "title": "Expériences et souvenirs", "sub": "Raconter ce que vous avez vécu", "icon": "smile", "p": [{"en": "Have you ever been to Montreal? It's only a few hours away.", "fr": "Êtes-vous déjà allé à Montréal ? Ce n'est qu'à quelques heures d'ici.", "alts": ["Have you ever visited Montreal? It's only a few hours away."]}, {"en": "I had never tried real maple syrup on pancakes before this trip.", "fr": "Je n'avais jamais goûté de vrai sirop d'érable sur des pancakes avant ce voyage.", "alts": ["I'd never tried real maple syrup on pancakes before this trip."]}, {"en": "I've visited Vermont several times, but never in the fall.", "fr": "Je suis venue plusieurs fois dans le Vermont, mais jamais en automne.", "alts": ["I have visited Vermont several times, but never in the fall.", "I've been to Vermont several times, but never in the fall."]}, {"en": "When I was a child, we spent every summer at the seaside.", "fr": "Quand j'étais enfant, nous passions tous les étés au bord de la mer.", "alts": ["When I was little, we spent every summer at the seaside.", "When I was a child, we spent every summer by the sea."]}, {"en": "I remember my first visit to Vermont very clearly.", "fr": "Je me souviens très bien de ma première visite dans le Vermont.", "alts": ["I clearly remember my first visit to Vermont."]}, {"en": "We used to go dancing every Saturday night when we were young.", "fr": "Nous allions danser tous les samedis soir quand nous étions jeunes.", "alts": ["When we were young, we used to go dancing every Saturday night."]}, {"en": "Something funny happened to me at the airport last year.", "fr": "Il m'est arrivé quelque chose de drôle à l'aéroport l'année dernière.", "alts": ["Last year, something funny happened to me at the airport."]}, {"en": "I was waiting for my suitcase when a dog ran across the hall.", "fr": "J'attendais ma valise quand un chien a traversé le hall en courant.", "alts": []}, {"en": "In the end, everyone laughed, and the owner apologized to me.", "fr": "Finalement, tout le monde a ri, et le propriétaire s'est excusé auprès de moi.", "alts": ["In the end, everybody laughed and the owner apologized to me."]}, {"en": "That's one of the best memories I have of my trips here.", "fr": "C'est l'un des meilleurs souvenirs que je garde de mes voyages ici.", "alts": []}, {"en": "Have you lived in this town for a long time?", "fr": "Vous habitez dans cette ville depuis longtemps ?", "alts": ["Have you been living in this town for a long time?"]}, {"en": "I haven't seen the ocean in Maine yet, but I'd love to.", "fr": "Je n'ai pas encore vu l'océan dans le Maine, mais j'aimerais beaucoup.", "alts": ["I haven't been to the ocean in Maine yet, but I'd love to."]}]}, {"id": "l3-home-problems", "title": "Un problème à la maison", "sub": "Panne, facture, réclamation polie", "icon": "sign", "p": [{"en": "The washing machine has stopped working, and there's water on the floor.", "fr": "La machine à laver ne marche plus, et il y a de l'eau par terre.", "alts": ["The washing machine stopped working, and there's water on the floor."]}, {"en": "I think the dishwasher is broken. It won't turn on at all.", "fr": "Je crois que le lave-vaisselle est en panne. Il ne s'allume plus du tout.", "alts": ["I think the dishwasher is broken. It doesn't turn on at all."]}, {"en": "Could you send someone to take a look at it this week?", "fr": "Pourriez-vous envoyer quelqu'un pour y jeter un coup d'œil cette semaine ?", "alts": ["Could you send someone to look at it this week?", "Would you be able to send someone to take a look at it this week?"]}, {"en": "I'm calling about my electricity bill. I think there's a mistake.", "fr": "J'appelle au sujet de ma facture d'électricité. Je crois qu'il y a une erreur.", "alts": ["I'm calling about my electric bill. I think there's a mistake."]}, {"en": "As far as I can see, we've been charged twice for the same month.", "fr": "Si je ne me trompe pas, on nous a facturé deux fois le même mois.", "alts": ["We've been charged twice for the same month, as far as I can see."]}, {"en": "I would be grateful if you could check it for me, please.", "fr": "Je vous serais reconnaissante de bien vouloir vérifier, s'il vous plaît.", "alts": ["I'd be grateful if you could check it for me, please."]}, {"en": "Would you mind explaining that again a little more slowly?", "fr": "Cela vous ennuierait de me réexpliquer ça un peu plus lentement ?", "alts": ["Could you explain that again a little more slowly?", "Would you mind explaining that again more slowly?"]}, {"en": "The heating keeps going off in the middle of the night.", "fr": "Le chauffage n'arrête pas de s'éteindre au milieu de la nuit.", "alts": ["The heat keeps going off in the middle of the night."]}, {"en": "Is it still under warranty, or will we have to pay for the repair?", "fr": "Est-il encore sous garantie, ou faudra-t-il payer la réparation ?", "alts": []}, {"en": "If the part doesn't arrive by Friday, could you let me know?", "fr": "Si la pièce n'arrive pas d'ici vendredi, pourriez-vous me prévenir ?", "alts": ["Could you let me know if the part doesn't arrive by Friday?"]}, {"en": "I bought this kettle last week, and it's already leaking.", "fr": "J'ai acheté cette bouilloire la semaine dernière, et elle fuit déjà.", "alts": ["I bought this kettle last week and it's already leaking."]}, {"en": "I'd like a refund or a replacement, please. Here is my receipt.", "fr": "J'aimerais un remboursement ou un échange, s'il vous plaît. Voici mon ticket de caisse.", "alts": ["I would like a refund or a replacement, please. Here's my receipt."]}]}, {"id": "l3-travel-trouble", "title": "Voyages et imprévus", "sub": "Retards, correspondances, bagages", "icon": "case", "p": [{"en": "Excuse me, our flight to Boston has been delayed. Do you know why?", "fr": "Excusez-moi, notre vol pour Boston a été retardé. Savez-vous pourquoi ?", "alts": ["Excuse me, our flight to Boston is delayed. Do you know why?"]}, {"en": "I'm afraid I'm going to miss my connecting flight to Burlington.", "fr": "J'ai bien peur de rater ma correspondance pour Burlington.", "alts": ["I'm worried I'm going to miss my connecting flight to Burlington."]}, {"en": "Could you put me on the next available flight, please?", "fr": "Pourriez-vous me mettre sur le prochain vol disponible, s'il vous plaît ?", "alts": ["Could you book me on the next available flight, please?", "Can you put me on the next available flight, please?"]}, {"en": "My suitcase hasn't arrived. Where can I report it, please?", "fr": "Ma valise n'est pas arrivée. Où puis-je le signaler, s'il vous plaît ?", "alts": ["My suitcase didn't arrive. Where can I report it, please?", "My bag hasn't arrived. Where can I report it, please?"]}, {"en": "It's a large dark blue suitcase with a red ribbon on the handle.", "fr": "C'est une grande valise bleu foncé avec un ruban rouge sur la poignée.", "alts": []}, {"en": "If the flight is canceled, will the airline pay for a hotel?", "fr": "Si le vol est annulé, est-ce que la compagnie paiera l'hôtel ?", "alts": ["If the flight is cancelled, will the airline pay for a hotel?"]}, {"en": "I've already checked in online, but I need to drop off my bag.", "fr": "J'ai déjà fait l'enregistrement en ligne, mais je dois déposer mon bagage.", "alts": ["I already checked in online, but I need to drop off my bag."]}, {"en": "Do you have an aisle seat? I like to stretch my legs.", "fr": "Auriez-vous une place côté couloir ? J'aime pouvoir me dégourdir les jambes.", "alts": ["Is there an aisle seat available? I like to stretch my legs."]}, {"en": "My son-in-law is picking me up, so I need to tell him I'm late.", "fr": "Mon gendre vient me chercher, alors je dois le prévenir de mon retard.", "alts": ["My son-in-law is picking me up, so I have to tell him I'm late."]}, {"en": "Has the gate changed? The screen says something different now.", "fr": "La porte d'embarquement a changé ? L'écran indique autre chose maintenant.", "alts": ["Did the gate change? The screen says something different now."]}, {"en": "We were stuck on the plane for two hours before takeoff.", "fr": "Nous sommes restés coincés dans l'avion pendant deux heures avant le décollage.", "alts": []}, {"en": "Thank you for your patience. You've been very helpful.", "fr": "Merci pour votre patience. Vous m'avez beaucoup aidée.", "alts": ["Thank you for your patience, you've been very helpful."]}]}, {"id": "l3-health", "title": "Santé et bien-être", "sub": "Chez le médecin, à la pharmacie", "icon": "cross", "p": [{"en": "I'd like to make an appointment with the doctor, please. It's not urgent.", "fr": "J'aimerais prendre rendez-vous avec le médecin, s'il vous plaît. Ce n'est pas urgent.", "alts": ["I would like to make an appointment with the doctor, please. It's not urgent."]}, {"en": "I've had a sore throat and a cough since Monday morning.", "fr": "J'ai mal à la gorge et je tousse depuis lundi matin.", "alts": ["I've had a cough and a sore throat since Monday morning."]}, {"en": "It hurts when I walk up the stairs, especially in the morning.", "fr": "J'ai mal quand je monte l'escalier, surtout le matin.", "alts": ["It hurts when I go up the stairs, especially in the morning."]}, {"en": "I've been feeling very tired for about two weeks now.", "fr": "Je me sens très fatiguée depuis environ deux semaines.", "alts": ["I've felt very tired for about two weeks now."]}, {"en": "Should I take this medicine before or after meals?", "fr": "Dois-je prendre ce médicament avant ou après les repas ?", "alts": ["Do I take this medicine before or after meals?", "Should I take this medication before or after meals?"]}, {"en": "Are there any side effects that I should know about?", "fr": "Y a-t-il des effets secondaires que je devrais connaître ?", "alts": ["Are there any side effects I should know about?", "Are there any side effects I need to know about?"]}, {"en": "I'm visiting from France. Will my travel insurance cover this?", "fr": "Je suis de passage, je viens de France. Mon assurance voyage couvrira-t-elle cela ?", "alts": ["I'm visiting from France. Does my travel insurance cover this?"]}, {"en": "If the pain doesn't go away, I'll come back next week.", "fr": "Si la douleur ne passe pas, je reviendrai la semaine prochaine.", "alts": ["If the pain doesn't go away, I will come back next week."]}, {"en": "I try to walk for half an hour every day to stay in shape.", "fr": "J'essaie de marcher une demi-heure par jour pour garder la forme.", "alts": ["I try to walk for thirty minutes every day to stay in shape."]}, {"en": "Sleeping well makes a big difference to how I feel.", "fr": "Quand je dors bien, je me sens beaucoup mieux.", "alts": ["Sleeping well makes a big difference in how I feel."]}, {"en": "Could you write that down for me? My English isn't perfect yet.", "fr": "Pourriez-vous me l'écrire ? Mon anglais n'est pas encore parfait.", "alts": ["Could you write it down for me? My English isn't perfect yet."]}, {"en": "How are you feeling today? I heard you weren't well.", "fr": "Comment vous sentez-vous aujourd'hui ? J'ai entendu dire que vous n'alliez pas bien.", "alts": ["How are you feeling today? I heard you were sick."]}]}, {"id": "l3-arrangements", "title": "Rendez-vous et changements", "sub": "Proposer, confirmer, reporter", "icon": "phone", "p": [{"en": "Would Thursday afternoon suit you, or is Friday better?", "fr": "Jeudi après-midi vous conviendrait-il, ou préférez-vous vendredi ?", "alts": ["Would Thursday afternoon work for you, or is Friday better?"]}, {"en": "I'm afraid I can't make it on Saturday after all.", "fr": "Je suis désolée, finalement je ne pourrai pas venir samedi.", "alts": ["I'm sorry, I can't make it on Saturday after all."]}, {"en": "Could we put off our lunch until next week, please?", "fr": "Pourrions-nous reporter notre déjeuner à la semaine prochaine, s'il vous plaît ?", "alts": ["Could we postpone our lunch until next week, please?", "Can we put off our lunch until next week, please?"]}, {"en": "Something has come up, so I need to change our plans.", "fr": "J'ai un empêchement, alors je dois changer nos projets.", "alts": ["Something came up, so I need to change our plans."]}, {"en": "Shall we meet at the café at half past ten instead?", "fr": "Et si on se retrouvait plutôt au café à dix heures et demie ?", "alts": ["Should we meet at the café at ten thirty instead?", "Shall we meet at the café at ten thirty instead?"]}, {"en": "I'm calling to confirm my appointment for tomorrow at two o'clock.", "fr": "J'appelle pour confirmer mon rendez-vous de demain à quatorze heures.", "alts": ["I'm calling to confirm my appointment tomorrow at two o'clock."]}, {"en": "Would it be possible to move it to the morning instead?", "fr": "Serait-il possible de le déplacer plutôt au matin ?", "alts": ["Is it possible to move it to the morning instead?"]}, {"en": "I'll call you back as soon as I know what time we're arriving.", "fr": "Je vous rappelle dès que je sais à quelle heure nous arrivons.", "alts": ["I'll call you back as soon as I know when we're arriving."]}, {"en": "If it rains, we'll go to the museum instead of the lake.", "fr": "S'il pleut, nous irons au musée au lieu d'aller au lac.", "alts": ["If it rains, we will go to the museum instead of the lake."]}, {"en": "Sorry, I didn't catch that. Could you repeat the address, please?", "fr": "Désolée, je n'ai pas bien compris. Pourriez-vous répéter l'adresse, s'il vous plaît ?", "alts": ["Sorry, I didn't get that. Could you repeat the address, please?"]}, {"en": "Let me check with my daughter and get back to you.", "fr": "Je vérifie avec ma fille et je vous redis.", "alts": ["Let me check with my daughter and I'll get back to you."]}, {"en": "That works perfectly for me. See you on Tuesday, then.", "fr": "Ça me convient parfaitement. À mardi, alors.", "alts": ["That's perfect for me. See you on Tuesday, then.", "That works for me. See you Tuesday, then."]}]}, {"id": "l3-opinions", "title": "Opinions et actualités", "sub": "Donner son avis, parler des nouvelles", "icon": "book", "p": [{"en": "In my opinion, the new library is a great idea for the town.", "fr": "À mon avis, la nouvelle bibliothèque est une excellente idée pour la ville.", "alts": ["I think the new library is a great idea for the town."]}, {"en": "I agree with you, because it gives young people somewhere to go.", "fr": "Je suis d'accord avec vous, parce que ça donne aux jeunes un endroit où aller.", "alts": ["I agree with you because it gives young people somewhere to go."]}, {"en": "I'm not so sure about that. It might be too expensive.", "fr": "Je n'en suis pas si sûre. Ça pourrait coûter trop cher.", "alts": ["I'm not sure about that. It might be too expensive."]}, {"en": "Did you see the news this morning about the storm in the south?", "fr": "Vous avez vu les informations ce matin sur la tempête dans le Sud ?", "alts": ["Did you hear the news this morning about the storm in the south?"]}, {"en": "I read an interesting article about farming in the local paper.", "fr": "J'ai lu un article intéressant sur l'agriculture dans le journal local.", "alts": ["I read an interesting article about farming in the local newspaper."]}, {"en": "What do you think about the plans for the new road?", "fr": "Que pensez-vous du projet de nouvelle route ?", "alts": ["What do you think of the plans for the new road?"]}, {"en": "It's a difficult question. There are good arguments on both sides.", "fr": "C'est une question difficile. Il y a de bons arguments des deux côtés.", "alts": []}, {"en": "I prefer the radio to the television, because the news is calmer.", "fr": "Je préfère la radio à la télévision, parce que les informations y sont plus calmes.", "alts": ["I prefer radio to television because the news is calmer."]}, {"en": "From what I've heard, the weather will improve by the weekend.", "fr": "D'après ce que j'ai entendu, le temps va s'améliorer d'ici le week-end.", "alts": ["From what I heard, the weather will get better by the weekend."]}, {"en": "I don't really follow politics, but I like to know what's happening.", "fr": "Je ne suis pas vraiment la politique, mais j'aime savoir ce qui se passe.", "alts": []}, {"en": "People in France talk about this subject a lot, too.", "fr": "En France aussi, on parle beaucoup de ce sujet.", "alts": ["In France, people talk about this subject a lot too."]}, {"en": "That's a good point. I hadn't thought of it that way.", "fr": "C'est juste. Je n'avais pas vu les choses sous cet angle.", "alts": ["Good point. I hadn't thought of it that way.", "That's a good point, I hadn't thought about it that way."]}]}, {"id": "l3-family", "title": "Petits-enfants et vie de famille", "sub": "Nouvelles, fierté, encouragements", "icon": "house", "p": [{"en": "My granddaughter has just learned to ride a bike without help.", "fr": "Ma petite-fille vient d'apprendre à faire du vélo toute seule.", "alts": ["My granddaughter just learned to ride a bike without help."]}, {"en": "How is school going? Have you made any new friends this year?", "fr": "Comment ça se passe à l'école ? Tu t'es fait de nouveaux amis cette année ?", "alts": ["How's school going? Have you made any new friends this year?"]}, {"en": "I'm so proud of you for working so hard this year.", "fr": "Je suis tellement fière de toi, tu as tellement travaillé cette année.", "alts": ["I'm really proud of you for working so hard this year."]}, {"en": "Would you like me to look after the children on Saturday evening?", "fr": "Voulez-vous que je garde les enfants samedi soir ?", "alts": ["Would you like me to babysit the kids on Saturday evening?", "Do you want me to look after the children on Saturday evening?"]}, {"en": "They've grown up so fast. I can hardly believe it.", "fr": "Ils ont tellement grandi. J'ai du mal à y croire.", "alts": ["They've grown so fast. I can hardly believe it."]}, {"en": "If you finish your homework, we'll bake a cake together.", "fr": "Si tu finis tes devoirs, on fera un gâteau ensemble.", "alts": ["If you finish your homework, we will bake a cake together."]}, {"en": "When I was your age, we didn't have cell phones or computers.", "fr": "Quand j'avais ton âge, on n'avait ni téléphone portable ni ordinateur.", "alts": ["When I was your age, we didn't have mobile phones or computers."]}, {"en": "Can you show me how to send photos on this phone?", "fr": "Tu peux me montrer comment envoyer des photos avec ce téléphone ?", "alts": ["Could you show me how to send photos on this phone?"]}, {"en": "We're having a family dinner on Sunday, and everyone is coming.", "fr": "Nous faisons un dîner de famille dimanche, et tout le monde vient.", "alts": ["We're having a family dinner on Sunday and everybody is coming."]}, {"en": "I miss them very much when I'm back home in France.", "fr": "Ils me manquent beaucoup quand je suis rentrée en France.", "alts": ["I miss them a lot when I'm back home in France."]}, {"en": "Let's have a video call on Sunday, so I can see everyone.", "fr": "Faisons un appel vidéo dimanche, comme ça je pourrai voir tout le monde.", "alts": ["Let's do a video call on Sunday so I can see everyone."]}, {"en": "Don't worry, everybody makes mistakes. You'll do better next time.", "fr": "Ne t'inquiète pas, tout le monde fait des erreurs. Tu feras mieux la prochaine fois.", "alts": ["Don't worry, everyone makes mistakes. You'll do better next time."]}]}, {"id": "l3-community", "title": "La vie au village", "sub": "Voisins, bénévolat, événements locaux", "icon": "sun", "p": [{"en": "Are you going to the town meeting on Tuesday evening?", "fr": "Vous allez à l'assemblée municipale mardi soir ?", "alts": ["Will you go to the town meeting on Tuesday evening?"]}, {"en": "The church is holding a pancake breakfast to raise money for the fire department.", "fr": "L'église organise un petit-déjeuner aux pancakes pour récolter des fonds pour les pompiers.", "alts": ["The church is having a pancake breakfast to raise money for the fire department."]}, {"en": "I'd be happy to help out at the library book sale.", "fr": "Je serais ravie de donner un coup de main à la vente de livres de la bibliothèque.", "alts": ["I would be happy to help at the library book sale."]}, {"en": "How long have you been volunteering at the food shelf?", "fr": "Depuis combien de temps êtes-vous bénévole à la banque alimentaire ?", "alts": ["How long have you volunteered at the food shelf?"]}, {"en": "The farmers market has moved to the town green for the summer.", "fr": "Le marché fermier s'est installé sur la place du village pour l'été.", "alts": []}, {"en": "Everyone here seems to know each other. It's very friendly.", "fr": "Ici, tout le monde a l'air de se connaître. C'est très convivial.", "alts": ["Everybody here seems to know each other. It's very friendly."]}, {"en": "Have you tried the new bakery next to the general store?", "fr": "Vous avez essayé la nouvelle boulangerie à côté de l'épicerie du village ?", "alts": []}, {"en": "The road was closed after the storm, but they've cleared it now.", "fr": "La route était fermée après la tempête, mais ils l'ont dégagée maintenant.", "alts": ["The road was closed after the storm, but it has been cleared now."]}, {"en": "If you need anything while you're away, just let me know.", "fr": "Si vous avez besoin de quoi que ce soit pendant votre absence, dites-le-moi.", "alts": ["If you need anything while you're away, let me know."]}, {"en": "Would you like me to water your plants while you're on vacation?", "fr": "Voulez-vous que j'arrose vos plantes pendant vos vacances ?", "alts": ["Do you want me to water your plants while you're on vacation?", "Shall I water your plants while you're on vacation?"]}, {"en": "We visited a sugarhouse last spring and watched them make maple syrup.", "fr": "Au printemps dernier, nous avons visité une cabane à sucre et regardé fabriquer le sirop d'érable.", "alts": ["Last spring we visited a sugarhouse and watched them make maple syrup."]}, {"en": "It's lovely to see so many people at the summer fair this year.", "fr": "C'est agréable de voir autant de monde à la fête d'été cette année.", "alts": ["It's nice to see so many people at the summer fair this year."]}]}], "vocab": [{"id": "l3-phrasal-verbs", "title": "Verbes à particule du quotidien", "w": [{"vis": "💡", "en": "turn on", "fr": "allumer", "ex": "Could you turn on the light, please? It's getting dark.", "exfr": "Pourriez-vous allumer la lumière, s'il vous plaît ? Il commence à faire sombre."}, {"vis": "📴", "en": "turn off", "fr": "éteindre", "ex": "Please turn off your phone during the concert.", "exfr": "Veuillez éteindre votre téléphone pendant le concert."}, {"vis": "🛬", "en": "pick up", "fr": "aller chercher quelqu'un", "ex": "My son-in-law will pick me up at the airport.", "exfr": "Mon gendre viendra me chercher à l'aéroport."}, {"vis": "👶", "en": "look after", "fr": "s'occuper de, garder", "ex": "I'm happy to look after the children tonight.", "exfr": "Je suis contente de garder les enfants ce soir."}, {"vis": "🤗", "en": "look forward to", "fr": "avoir hâte de", "ex": "I'm really looking forward to seeing you again.", "exfr": "J'ai vraiment hâte de vous revoir."}, {"vis": "🔍", "en": "find out", "fr": "découvrir, se renseigner", "ex": "I'll call the airline to find out what happened.", "exfr": "Je vais appeler la compagnie pour savoir ce qui s'est passé."}, {"vis": "🏳️", "en": "give up", "fr": "abandonner, renoncer", "ex": "Learning English is hard, but I'm not going to give up.", "exfr": "Apprendre l'anglais, c'est difficile, mais je ne vais pas abandonner."}, {"vis": "📅", "en": "put off", "fr": "reporter, remettre à plus tard", "ex": "We had to put off the picnic because of the rain.", "exfr": "Nous avons dû reporter le pique-nique à cause de la pluie."}, {"vis": "📝", "en": "fill out", "fr": "remplir (un formulaire)", "ex": "Please fill out this form before your appointment.", "exfr": "Veuillez remplir ce formulaire avant votre rendez-vous."}, {"vis": "🚗", "en": "break down", "fr": "tomber en panne", "ex": "Our car broke down on the way to Burlington.", "exfr": "Notre voiture est tombée en panne sur la route de Burlington."}, {"vis": "🤝", "en": "get along", "fr": "bien s'entendre", "ex": "My neighbors and I get along very well.", "exfr": "Je m'entends très bien avec mes voisins."}, {"vis": "▶️", "en": "go on", "fr": "continuer", "ex": "Sorry I interrupted you. Please go on with your story.", "exfr": "Pardon de vous avoir interrompu. Continuez votre histoire, je vous en prie."}]}, {"id": "l3-feelings", "title": "Sentiments et caractère", "w": [{"vis": "🏆", "en": "proud", "fr": "fier, fière", "ex": "Our neighbors must be very proud of their grandchildren.", "exfr": "Nos voisins doivent être très fiers de leurs petits-enfants."}, {"vis": "😟", "en": "worried", "fr": "inquiet, inquiète", "ex": "I was worried because you didn't answer the phone.", "exfr": "J'étais inquiète parce que vous ne répondiez pas au téléphone."}, {"vis": "😌", "en": "relieved", "fr": "soulagé, soulagée", "ex": "I was so relieved when my suitcase finally arrived.", "exfr": "J'ai été tellement soulagée quand ma valise est enfin arrivée."}, {"vis": "😞", "en": "disappointed", "fr": "déçu, déçue", "ex": "The children were disappointed when the fair was canceled.", "exfr": "Les enfants ont été déçus quand la fête a été annulée."}, {"vis": "🙏", "en": "grateful", "fr": "reconnaissant, reconnaissante", "ex": "I'm very grateful for all your help this week.", "exfr": "Je vous suis très reconnaissante pour toute votre aide cette semaine."}, {"vis": "😬", "en": "nervous", "fr": "nerveux, nerveuse", "ex": "Many people feel a little nervous before a long flight.", "exfr": "Beaucoup de gens sont un peu nerveux avant un long vol."}, {"vis": "⏳", "en": "patient", "fr": "patient, patiente", "ex": "Thank you for being so patient with my English.", "exfr": "Merci d'être si patient avec mon anglais."}, {"vis": "🎁", "en": "generous", "fr": "généreux, généreuse", "ex": "Our neighbor is very generous. She often brings us cookies.", "exfr": "Notre voisine est très généreuse. Elle nous apporte souvent des biscuits."}, {"vis": "🏡", "en": "homesick", "fr": "qui a le mal du pays", "ex": "Do you ever feel homesick when you're far from home?", "exfr": "Vous arrive-t-il d'avoir le mal du pays quand vous êtes loin de chez vous ?"}, {"vis": "😲", "en": "surprised", "fr": "surpris, surprise", "ex": "I was surprised by how cold it gets here in winter.", "exfr": "J'ai été surprise de voir à quel point il fait froid ici en hiver."}, {"vis": "😳", "en": "embarrassed", "fr": "gêné, gênée", "ex": "I felt embarrassed when I forgot his name.", "exfr": "J'étais gênée quand j'ai oublié son prénom."}, {"vis": "💪", "en": "confident", "fr": "sûr de soi, sûre de soi", "ex": "I feel more confident when I speak English now.", "exfr": "Je me sens plus sûre de moi quand je parle anglais maintenant."}]}, {"id": "l3-health-words", "title": "Santé et bien-être", "w": [{"vis": "🗓️", "en": "appointment", "fr": "un rendez-vous", "ex": "I have an appointment at the clinic on Wednesday morning.", "exfr": "J'ai rendez-vous à la clinique mercredi matin."}, {"vis": "📋", "en": "prescription", "fr": "une ordonnance", "ex": "The doctor gave me a prescription for some cream.", "exfr": "Le médecin m'a donné une ordonnance pour une crème."}, {"vis": "💊", "en": "pharmacy", "fr": "une pharmacie", "ex": "Is there a pharmacy open on Sunday in town?", "exfr": "Y a-t-il une pharmacie ouverte le dimanche en ville ?"}, {"vis": "🤕", "en": "headache", "fr": "un mal de tête", "ex": "I've had a headache since I woke up this morning.", "exfr": "J'ai mal à la tête depuis mon réveil ce matin."}, {"vis": "😷", "en": "cough", "fr": "une toux", "ex": "This cough has kept me awake for three nights.", "exfr": "Cette toux m'empêche de dormir depuis trois nuits."}, {"vis": "🤒", "en": "fever", "fr": "de la fièvre", "ex": "If the fever doesn't go down, call the clinic.", "exfr": "Si la fièvre ne baisse pas, appelez la clinique."}, {"vis": "🩸", "en": "blood pressure", "fr": "la tension artérielle", "ex": "The nurse will check your blood pressure first.", "exfr": "L'infirmière va d'abord prendre votre tension."}, {"vis": "⚠️", "en": "side effects", "fr": "des effets secondaires", "ex": "Have you noticed any side effects from the new medicine?", "exfr": "Avez-vous remarqué des effets secondaires avec le nouveau médicament ?"}, {"vis": "🚶", "en": "stay in shape", "fr": "garder la forme", "ex": "Walking every day helps me stay in shape.", "exfr": "Marcher tous les jours m'aide à garder la forme."}, {"vis": "💐", "en": "get better", "fr": "aller mieux, guérir", "ex": "I hope you get better soon. We miss you at the book club.", "exfr": "J'espère que vous irez vite mieux. Vous nous manquez au club de lecture."}, {"vis": "🤧", "en": "allergy", "fr": "une allergie", "ex": "Do you have an allergy to any kind of medicine?", "exfr": "Êtes-vous allergique à un médicament ?"}, {"vis": "🩺", "en": "check-up", "fr": "un bilan de santé", "ex": "It's a good idea to have a check-up once a year.", "exfr": "C'est une bonne idée de faire un bilan de santé une fois par an."}]}, {"id": "l3-travel-words", "title": "Voyages et imprévus", "w": [{"vis": "⏰", "en": "delayed", "fr": "retardé, retardée", "ex": "Our train was delayed because of the snow.", "exfr": "Notre train a été retardé à cause de la neige."}, {"vis": "❌", "en": "canceled", "fr": "annulé, annulée", "ex": "All the evening flights have been canceled tonight.", "exfr": "Tous les vols du soir ont été annulés ce soir."}, {"vis": "🛫", "en": "connecting flight", "fr": "un vol de correspondance", "ex": "I have a connecting flight in Boston at five o'clock.", "exfr": "J'ai une correspondance à Boston à dix-sept heures."}, {"vis": "🎫", "en": "boarding pass", "fr": "une carte d'embarquement", "ex": "Please have your boarding pass and passport ready.", "exfr": "Veuillez préparer votre carte d'embarquement et votre passeport."}, {"vis": "🚪", "en": "gate", "fr": "une porte d'embarquement", "ex": "Our flight now leaves from gate twelve.", "exf  "les frères et sœurs", "ex": "Do you have any siblings, or are you an only child?", "exfr": "Avez-vous des frères et sœurs, ou êtes-vous enfant unique ?"}, {"vis": "🧑", "en": "teenager", "fr": "un adolescent, une adolescente", "ex": "Teenagers today spend a lot of time on their phones.", "exfr": "Les adolescents d'aujourd'hui passent beaucoup de temps sur leur téléphone."}, {"vis": "🍼", "en": "babysit", "fr": "faire du baby-sitting, garder des enfants", "ex": "Grandparents often babysit when the parents go out.", "exfr": "Les grands-parents gardent souvent les enfants quand les parents sortent."}, {"vis": "🌱", "en": "grow up", "fr": "grandir", "ex": "Children grow up so quickly these days.", "exfr": "Les enfants grandissent si vite de nos jours."}, {"vis": "👨‍👦", "en": "take after", "fr": "tenir de, ressembler à", "ex": "Your granddaughter really takes after her mother.", "exfr": "Votre petite-fille ressemble vraiment à sa mère."}, {"vis": "✏️", "en": "homework", "fr": "les devoirs", "ex": "Can I help you with your homework after dinner?", "exfr": "Je peux t'aider à faire tes devoirs après le dîner ?"}, {"vis": "👨‍👩‍👧‍👦", "en": "family reunion", "fr": "une réunion de famille", "ex": "We're planning a big family reunion next summer.", "exfr": "Nous organisons une grande réunion de famille l'été prochain."}, {"vis": "🎂", "en": "birthday party", "fr": "une fête d'anniversaire", "ex": "The birthday party starts at three, so don't be late.", "exfr": "La fête d'anniversaire commence à quinze heures, alors ne soyez pas en retard."}, {"vis": "📖", "en": "bedtime story", "fr": "une histoire du soir", "ex": "The children always ask for a bedtime story.", "exfr": "Les enfants réclament toujours une histoire avant de dormir."}]}, {"id": "l3-town-words", "title": "La vie au village", "w": [{"vis": "🏛️", "en": "town hall", "fr": "la mairie", "ex": "You can get a parking permit at the town hall.", "exfr": "Vous pouvez obtenir un permis de stationnement à la mairie."}, {"vis": "🗳️", "en": "town meeting", "fr": "l'assemblée municipale", "ex": "In Vermont, people vote on the budget at town meeting.", "exfr": "Dans le Vermont, les habitants votent le budget à l'assemblée municipale."}, {"vis": "📚", "en": "library", "fr": "une bibliothèque", "ex": "The library has a large section of books in French.", "exfr": "La bibliothèque a un grand rayon de livres en français."}, {"vis": "🙋", "en": "volunteer", "fr": "un ou une bénévole, se porter volontaire", "ex": "They're looking for volunteers to help at the summer fair.", "exfr": "Ils cherchent des bénévoles pour aider à la fête d'été."}, {"vis": "🚒", "en": "fire station", "fr": "la caserne des pompiers", "ex": "The fire station is having an open house on Saturday.", "exfr": "La caserne des pompiers organise une journée portes ouvertes samedi."}, {"vis": "🏤", "en": "post office", "fr": "la poste", "ex": "I need to go to the post office to send a package.", "exfr": "Je dois aller à la poste pour envoyer un colis."}, {"vis": "🏪", "en": "general store", "fr": "l'épicerie du village", "ex": "The general store sells everything from bread to fishing gear.", "exfr": "L'épicerie du village vend de tout, du pain au matériel de pêche."}, {"vis": "🧺", "en": "farmers market", "fr": "le marché fermier", "ex": "We buy our vegetables at the farmers market on Saturday.", "exfr": "Nous achetons nos légumes au marché fermier le samedi."}, {"vis": "🥫", "en": "food shelf", "fr": "la banque alimentaire", "ex": "You can leave canned food for the food shelf at the church.", "exfr": "Vous pouvez déposer des conserves pour la banque alimentaire à l'église."}, {"vis": "🎟️", "en": "fundraiser", "fr": "une collecte de fonds", "ex": "The school is having a fundraiser to buy new books.", "exfr": "L'école organise une collecte de fonds pour acheter de nouveaux livres."}, {"vis": "🍁", "en": "sugarhouse", "fr": "une cabane à sucre", "ex": "In March, the sugarhouse smells wonderful when they boil the sap.", "exfr": "En mars, la cabane à
